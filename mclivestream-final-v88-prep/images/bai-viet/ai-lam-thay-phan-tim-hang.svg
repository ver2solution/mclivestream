<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0b5d4e"/>
  <rect x="0" y="0" width="1200" height="14" fill="#f2b705"/>
  <text x="60" y="110" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">AI làm thay phần tìm hàng</text>
  <text x="60" y="160" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#cfe8dd">Shop nhỏ làm sao để AI còn “thấy” sản phẩm của mình?</text>
  <text x="60" y="200" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#9fd0bd">McKinsey &amp; Company — Khảo sát tháng 6/2026, 11 thị trường</text>
  <rect x="60" y="240" width="340" height="220" rx="16" fill="#ffffff"/>
  <text x="90" y="310" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="bold" fill="#0b5d4e">53%</text>
  <text x="90" y="350" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#333333">người tiêu dùng đã dùng</text>
  <text x="90" y="382" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#333333">AI để mua sắm</text>
  <text x="90" y="420" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#666666">trong 3 tháng gần nhất</text>
  <rect x="430" y="240" width="340" height="220" rx="16" fill="#ffffff"/>
  <text x="460" y="310" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="bold" fill="#0b5d4e">+70%</text>
  <text x="460" y="350" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#333333">người dùng AI ở Mỹ chốt</text>
  <text x="460" y="382" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#333333">đơn bằng AI (10% → 17%)</text>
  <text x="460" y="420" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#666666">so với tháng 12/2025</text>
  <rect x="800" y="240" width="340" height="220" rx="16" fill="#ffffff"/>
  <text x="830" y="310" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="bold" fill="#0b5d4e">3,2 lần</text>
  <text x="830" y="350" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#333333">AI tìm kiếm ảnh hưởng</text>
  <text x="830" y="382" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#333333">hơn tìm kiếm truyền thống</text>
  <text x="830" y="420" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#666666">với người dùng AI</text>
  <text x="60" y="540" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#ffffff">Muốn được AI gợi ý, dữ liệu sản phẩm phải để máy đọc được.</text>
  <text x="60" y="590" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#f2b705">Ver2Solution</text>
  <text x="830" y="590" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#cfe8dd">Nguồn số liệu: McKinsey &amp; Company</text>
</svg>
