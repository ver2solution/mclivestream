plugins { id 'com.android.application' }
android {
    namespace 'com.ver2solution.mclivestream'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ver2solution.mclivestream'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    // Signing is NOT configured here on purpose: the release keystore and its
    // credentials belong to the Play Console account owner (see README-PLAY-STORE.md).
    // Add a signingConfigs block from environment variables only when building a release.
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.1'
}
