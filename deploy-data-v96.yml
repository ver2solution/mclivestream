name: Deploy data v96

on:
  push:
    paths:
      - '.github/workflows/deploy-data-v96.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-v96:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data v96 package
        run: |
          unzip -o mclivestream-data-v96-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '\"id\": \"th-' js/data.js)"
          echo "shops: $(grep -c '\"id\": \"sh-' js/data.js)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data v96: 31 mau / 56 shop"
            git push
          fi
