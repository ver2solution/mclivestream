name: deploy-v232
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v232:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v232 package
        run: |
          unzip -o v232.zip
          ls -l js/app.js sw.js
          sha256sum js/app.js sw.js
      - name: Verify package contents
        run: |
          set -e
          test "$(sha256sum js/app.js | cut -d' ' -f1)" = "ee2930073c0411a60121f2ef216ad5d9d91e69064377fdb6843b11f4313239f7"
          test "$(sha256sum sw.js | cut -d' ' -f1)" = "df3ee29b7294300e4c27f92c3136bd42c3f099e1c647631259bb28ce0b20615e"
          grep -Fq "v232 (S3-10b)" js/app.js
          grep -Fq "fetchMyShopProfile" js/app.js
          grep -Fq "v232-shell-1" sw.js
      - name: Commit v232 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v232 S3-10b ten header lay them ten shop; js/app.js + sw.js CACHE v232-shell-1"
            git push
          fi
