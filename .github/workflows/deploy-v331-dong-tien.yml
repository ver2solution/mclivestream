name: Deploy v331-dong-tien (8 bai Dong tien 17-18/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v331-dong-tien.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v331-dong-tien:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "403" || (echo "BASE DOI: data.js khong con 403 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "429" || (echo "BASE DOI: sitemap khong con 429 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip v331-dong-tien package
        run: |
          unzip -o mclivestream-v331-dong-tien-deploy.zip
          echo "--- verify v331-dong-tien (8 bai) ---"
          for slug in hoa-hong-mau-livestream-tet-bao-nhieu-phan-tram fed-tang-lai-suat-thang-12-thi-truong-dat-cuoc-100-phan-tram gia-vang-quy-3-ngan-hang-trung-uong-mua-321-tan chi-tieu-tet-2027-51-phan-tram-chi-nhieu-hon ban-le-my-thang-10-chinh-thuc-748-ty-usd gia-vang-thung-day-1-nam-3830-usd bitcoin-duoi-65000-usd-quy-etf-rut-von kiem-tien-an-tet-bang-livestream; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "437" || (echo "SAI TONG sitemap, phai 437"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "411" || (echo "SAI TONG data.js, phai 411"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v331-dong-tien-deploy.zip || rm -f mclivestream-v331-dong-tien-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v331-dong-tien: 8 bai Dong tien 17-18/11/2026 (4 bai 17/11 deploy muon + 4 bai 18/11; SEO V2)"
            git push
          fi
