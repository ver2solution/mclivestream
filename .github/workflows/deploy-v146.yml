name: Deploy v146 game-entry CSS (26 bai + sw.js)

on:
  push:
    paths:
      - '.github/workflows/deploy-v146.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v146:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v146 package
        run: |
          unzip -o mclivestream-v146-gameentry-deploy.zip
          echo "--- verify v146 ---"
          grep -F -q "v146-shell-1" sw.js || (echo "THIEU v146-shell-1 trong sw.js"; exit 1)
          grep -F -q ".game-entry{position:fixed" bai-viet/11-11-dong-nam-a-shopee-lazada-tiktok-shop.html || (echo "THIEU .game-entry trong bai kiem tra"; exit 1)
          echo "verify OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v146-gameentry-deploy.zip
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v146: them CSS .game-entry v116 con thieu cho 26 bai-viet + bump sw.js v146-shell-1"
            git push
          fi
