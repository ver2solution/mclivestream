name: Deploy v120

on:
  push:
    paths:
      - '.github/workflows/deploy-v120.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v120:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v120 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v120-deploy.zip
          echo "--- verify v120 payload ---"
          grep -m1 "v120-shell-1" sw.js
          grep -m1 "bottom:calc(50% + 62px)" index.html
          grep -m1 "width:96px;min-height:96px" index.html
          grep -m1 "width:96px;text-align:center" v20.css
          grep -m1 "flex-direction:column;align-items:center;gap:2px" v20.css
          echo "html files: $(find . -maxdepth 1 -name '*.html' | wc -l) root + $(ls bai-viet/*.html | wc -l) bai-viet"
          echo "js files (excluding data.js): $(ls js/*.js | grep -vc data.js)"
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum sw.js v20.css index.html
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v120-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v120: rut gon 2 popup noi (.online-popup v20.css + .game-entry 99 file HTML) thanh o vuong 96px, sw.js v120-shell-1"
            git push
          fi
