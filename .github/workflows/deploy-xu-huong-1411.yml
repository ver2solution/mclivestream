name: Deploy articles-xu-huong-2026-11-14 (4 bai Xu huong 14/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-xu-huong-1411.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-xu-huong-1411:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "239" || (echo "BASE DOI: data.js khong con 239 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "262" || (echo "BASE DOI: sitemap khong con 262 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip xu-huong-1411 package
        run: |
          unzip -o mclivestream-xu-huong-1411-deploy.zip
          echo "--- verify xu-huong-1411 (4 bai) ---"
          for slug in xu-huong-thuong-mai-dien-tu-2027-8-nghin-ty-usd tiktok-shop-2026-112-ty-usd-gmv xu-huong-ban-hang-online-2026-viet-nam-32-ty-usd ai-livestream-ban-hang-tro-ly-ai-dan-khach-vao-live; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "266" || (echo "SAI TONG sitemap, phai 266"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "243" || (echo "SAI TONG data.js, phai 243"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-xu-huong-1411-deploy.zip || rm -f mclivestream-xu-huong-1411-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-xu-huong-2026-11-14: 4 bai Xu huong 14/11/2026 (xu huong TMDT 2027 keyword #2 + TikTok Shop 2026 + xu huong ban hang online 2026 + AI livestream ban hang rotating #2)"
            git push
          fi
