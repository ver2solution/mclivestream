name: Deploy data 2026-11-21 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-21-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-21-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-21 lots package
        run: |
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "c2980767379026e97f172c75d3c6f0efced7d3d384a7ee4889340ce377995225" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-21-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "cdfa5e428918265869559c4d93e574f93cad8571d7055a36277a60cbc0db6774" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          for f in lot-278 lot-279 lot-280 lot-281 lot-282 lot-283 lot-284 lot-285 lot-286 lot-287 lot-288 lot-289; do ls -l images/lo/$f.jpg; done
          test "$(grep -c '"id": "th-' js/data.js)" = "238" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "304" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "290" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "417" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "369" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "563" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "564" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-278.jpg images/lo/lot-279.jpg images/lo/lot-280.jpg images/lo/lot-281.jpg images/lo/lot-282.jpg images/lo/lot-283.jpg images/lo/lot-284.jpg images/lo/lot-285.jpg images/lo/lot-286.jpg images/lo/lot-287.jpg images/lo/lot-288.jpg images/lo/lot-289.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-21 lots: 290 lo (13 lo moi lot-278..290: 8 thu mua g2 Duc Duong Lao Cai/Dien Bien/Lai Chau/Lang Son/Nghe An/Phu Tho/Quang Tri/Tuyen Quang + 4 YouTube g3 + 1 Facebook g3 HAI IDOL; 12 anh moi; CHUYEN 4 bai Black Friday 21/11 tu lots sang articles), 238 mau / 304 shop / 417 xuong / 369 kiot / 564 bai viet"
            git push
          fi
