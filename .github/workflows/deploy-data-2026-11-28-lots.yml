name: Deploy data 2026-11-28 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-28-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-28-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-28 lots package
        run: |
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "5a785736690597db63a58118ad6471520b94f6d19a22247252e08fb8279f30b9" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-28-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "b03b6a38120e76db09e0cd2d6b0b9a4846143bb221172143864f30a0370072c6" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          for f in lot-353 lot-354 lot-355 lot-356 lot-357 lot-358 lot-359 lot-360 lot-361 lot-362 lot-363; do ls -l images/lo/$f.jpg; done
          test "$(grep -c '"id": "th-' js/data.js)" = "268" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "337" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "363" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "452" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "390" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "886" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "887" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-353.jpg images/lo/lot-354.jpg images/lo/lot-355.jpg images/lo/lot-356.jpg images/lo/lot-357.jpg images/lo/lot-358.jpg images/lo/lot-359.jpg images/lo/lot-360.jpg images/lo/lot-361.jpg images/lo/lot-362.jpg images/lo/lot-363.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-28 lots: 363 lo (11 lo moi lot-353..363 cua 28/11, 11 YouTube g3 moi nhat; 11 anh moi), 268 mau / 337 shop / 452 xuong / 390 kiot / 887 bai viet"
            git push
          fi
