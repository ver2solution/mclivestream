name: Deploy data-2026-11-26-rebase (group-work data)
on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-26-rebase.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-data-2026-11-26-rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data package
        run: |
          unzip -o mclivestream-data-2026-11-26-rebase-deploy.zip
          test -f js/data.js || (echo "THIEU js/data.js"; exit 1)
          node --check js/data.js || (echo "data.js loi cu phap"; exit 1)
          grep -q '"id": "th-280"' js/data.js || (echo "THIEU th-280"; exit 1)
          grep -q '"id": "sh-330"' js/data.js || (echo "THIEU sh-330"; exit 1)
          grep -q '"id": "cl-36"' js/data.js || (echo "THIEU cl-36"; exit 1)
          grep -q '"id": "lg-39"' js/data.js || (echo "THIEU lg-39"; exit 1)
          grep -q '"id": "rt-38"' js/data.js || (echo "THIEU rt-38"; exit 1)
          test -f images/th-281.jpg || (echo "THIEU th-281.jpg"; exit 1)
          test -f images-shop/shop-md-beauty.jpg || (echo "THIEU shop-md-beauty.jpg"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-data-2026-11-26-rebase-deploy.zip
          git add js/data.js images/th-276.jpg images/th-277.jpg images/th-279.jpg images/th-281.jpg images-shop/shop-gimi-vina.png images-shop/shop-konox-viet-nam.png images-shop/shop-md-beauty.jpg images-shop/shop-dnl-healthcare-group.png images-shop/shop-tgtq.jpg
          git status --short
          if git diff --cached --quiet; then echo "No changes to commit"; else git commit -m "Deploy data group-work 26/11 (rebase from live 9f950f2): +47 items — 7 models th-276..284, 10 shops sh-321..330, 30 category items"; git push; fi
