name: Deploy v160 (SEO đợt 2)

on:
  push:
    paths:
      - '.github/workflows/deploy-v160.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v160:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip v160 package
        run: |
          unzip -o seo-goi2-deploy.zip
          echo "--- extracted bai-viet files ---"
          ls -l bai-viet/*.html

      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f seo-goi2-deploy.zip
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "v160: SEO đợt 2 — 11 bài đạt 100% (đủ trần 20/135 với bộ 100 hiện tại)"
            git push
          fi
