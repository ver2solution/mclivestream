name: Deploy data 2026-11-10 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-10-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-10-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-10 lots package
        run: |
          unzip -o mclivestream-data-2026-11-10-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          ls -l images/lo/lot-25.jpg images/lo/lot-26.jpg
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-25.jpg images/lo/lot-26.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-10 lots: 26 lo (2 lo moi lot-25/26 Tay Ninh, 2 anh moi), 77 mau / 116 shop"
            git push
          fi
