name: deploy-v241
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v241:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v241 package
        run: |
          unzip -o v241.zip
          ls -l js/app.js sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v241 (F-R2-03b)" js/app.js
          grep -Fq "CACHE = 'v241-shell-1'" sw.js
          node --check js/app.js
          node --check sw.js
      - name: Commit v241 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v241 F-R2-03b hien chuoi price lo khi thieu priceNum + bo hang Ngay dang trung o modal loai moi + sw.js v241-shell-1"
            git push
          fi
