name: Deploy data 2026-11-09 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-09-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-09-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-09 lots package
        run: |
          unzip -o mclivestream-data-2026-11-09-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          ls -l images/lo/lot-21.jpg images/lo/lot-22.jpg images/lo/lot-23.jpg images/lo/lot-24.jpg
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-21.jpg images/lo/lot-22.jpg images/lo/lot-23.jpg images/lo/lot-24.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-09 lots: 24 lo (4 lo moi lot-21..24, 4 anh moi), 57 mau / 96 shop"
            git push
          fi
