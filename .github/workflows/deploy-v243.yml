name: deploy-v243
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v243:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v243 package
        run: |
          unzip -o v243.zip
          ls -l tinh-lai.html sitemap.xml
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "S1-3 Profit Calculator v1" tinh-lai.html
          grep -Fq "tinh-lai.html" sitemap.xml
          test "$(grep -c '<url>' sitemap.xml)" = "288"
      - name: Commit v243 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add tinh-lai.html sitemap.xml
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v243 S1-3 Profit Calculator v1 (trang tinh-lai.html + sitemap 288 URL)"
            git push
          fi
