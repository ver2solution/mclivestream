name: deploy-v222
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v222:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v222 package
        run: |
          unzip -o v222.zip
          ls -l js/xu-chung.js js/app.js js/admin.js sw.js
          sha256sum js/xu-chung.js js/app.js js/admin.js sw.js
      - name: Verify package contents
        run: |
          set -e
          test "$(sha256sum js/xu-chung.js | cut -d' ' -f1)" = "422a9dae208b8cca292a6e42b86edfb0a2aac4826c41d834b5e8c50db5ec7c4d"
          test "$(sha256sum js/app.js | cut -d' ' -f1)" = "96d4b439e6e6178d569e3a289dd4ed17e5ca2984a6979a8ac90235b9e5b7c285"
          test "$(sha256sum js/admin.js | cut -d' ' -f1)" = "c5221ff4586dbf7a22368f6d6eefa9a964566f369a81fd2410b349541a939dda"
          test "$(sha256sum sw.js | cut -d' ' -f1)" = "e1dd890ef143b57027b617017c9d5c5748b53d67d5be00e7013c802dce2093da"
          grep -Fq "bridge_not_enabled" js/xu-chung.js
          grep -Fq "BRIDGE_NOT_ENABLED_TEXT" js/xu-chung.js
          grep -Fq "getSessionRobust(2000)" js/xu-chung.js
          grep -Fq "getSessionRobust(2000)" js/app.js
          grep -Fq "admReasonInput" js/admin.js
          grep -Fq "adm-reason-input" js/admin.js
          grep -Fq "v222-shell-1" sw.js
      - name: Commit v222 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/xu-chung.js js/app.js js/admin.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v222 S1-1: phan biet loi cau noi xu lien web chua bat (404 PGRST202/42703) + session robust 2s + window.prompt/admin.js sang inline 2 buoc; js/xu-chung.js + js/app.js + js/admin.js + sw.js CACHE v222-shell-1"
            git push
          fi
