name: Deploy articles-phan-tich-2026-11-24 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-phan-tich-2411.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-phan-tich-2411:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "651" || (echo "BASE DOI: data.js khong con 651 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "673" || (echo "BASE DOI: sitemap khong con 673 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip phan-tich-2411 package
        run: |
          unzip -o mclivestream-phan-tich-2411-deploy.zip
          echo "--- verify phan-tich-2411 (4 bai moi) ---"
          for slug in double-12-2026-phan-tich-lich-dem-nguoc-18-ngay-shop-nho thi-truong-phu-kien-trang-suc-2026-397-ty-usd-shop-nho-ban-gi phu-kien-trang-suc-mon-moi-tang-gia-tri-don-live lvmh-quy-3-2026-trang-suc-tang-6-phan-tram-thoi-trang-giam-5; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -qF "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -qF "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "677" || (echo "SAI TONG sitemap, phai 677"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "655" || (echo "SAI TONG data.js, phai 655 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-phan-tich-2411-deploy.zip || rm -f mclivestream-phan-tich-2411-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-phan-tich-2026-11-24: 4 bai moi (SEO V2)"
            git push
          fi
