name: Deploy v300-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v300-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v300-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v300-drafts package
        run: |
          unzip -o mclivestream-v300-drafts-deploy.zip
          echo "--- verify v300-drafts (1 bai) ---"
          test -f bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san.html || (echo "THIEU bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san.html"; exit 1)
          grep -q "bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san.html" js/data.js || (echo "THIEU douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san.html</loc>" sitemap.xml || (echo "THIEU douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v300-drafts-deploy.zip
          git add bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v300-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san"
            git push
          fi
