name: Deploy data 2026-11-22 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-22-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-22-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-22 lots package
        run: |
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "894812cb210612da0a086ca4450d10ca80e69cdb53d4c80ec75fe280d3b2a5b4" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-22-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "9e8388364dd1bc94be730562766fd22eef53f73a64f33fa6fa326c4537a47da5" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          for f in lot-291 lot-295 lot-296 lot-297; do ls -l images/lo/$f.jpg; done
          test "$(grep -c '"id": "th-' js/data.js)" = "238" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "304" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "297" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "422" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "375" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "608" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "609" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-291.jpg images/lo/lot-295.jpg images/lo/lot-296.jpg images/lo/lot-297.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-22 lots: 297 lo (7 lo moi lot-291..297: 1 Website g1 si ao thun nam Quang Ngai + 1 Facebook g3 sap quan ao cho Dak Lak + 1 Facebook g3 sieu thi Lan Lan Nha Trang + 1 Facebook g1 xa ~3.000 mon Dong Thap + 3 YouTube g3 hang bai Nhat; 4 anh moi; CHUYEN 4 bai Dang hot 22/11 tu lots sang articles), 238 mau / 304 shop / 422 xuong / 375 kiot / 609 bai viet"
            git push
          fi
