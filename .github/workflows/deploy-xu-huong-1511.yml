name: Deploy articles-xu-huong-2026-11-15 (4 bai Xu huong 15/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-xu-huong-1511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-xu-huong-1511:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "278" || (echo "BASE DOI: data.js khong con 278 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "304" || (echo "BASE DOI: sitemap khong con 304 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip xu-huong-1511 package
        run: |
          unzip -o mclivestream-xu-huong-1511-deploy.zip
          echo "--- verify xu-huong-1511 (4 bai) ---"
          for slug in xu-huong-mua-sam-online-tet-49-phan-tram-kham-pha-o-gian-mall tiktok-shop-affiliate-42-phan-tram-gmv-my-hoa-hong-1302 xu-huong-mua-sam-hang-da-qua-su-dung-47-phan-tram-mua-moi-thang thuong-mai-noi-dung-dong-nam-a-2026-779-ty-usd; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "308" || (echo "SAI TONG sitemap, phai 308"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "282" || (echo "SAI TONG data.js, phai 282"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-xu-huong-1511-deploy.zip || rm -f mclivestream-xu-huong-1511-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-xu-huong-2026-11-15: 4 bai Xu huong 15/11/2026 (xu huong mua sam online Tet keyword #3 + TikTok Shop Affiliate STT 55 + mua sam hang da qua su dung + thuong mai noi dung DNA 77,9 ty USD)"
            git push
          fi
