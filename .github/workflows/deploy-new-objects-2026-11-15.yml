name: Deploy new-objects 2026-11-15

on:
  push:
    paths:
      - '.github/workflows/deploy-new-objects-2026-11-15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-new-objects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip new-objects package
        run: |
          unzip -o mclivestream-new-objects-2026-11-15-deploy.zip
          ls -l js/data.js images-new/
          sha256sum js/data.js
          echo "models: $(grep -oE '\"id\": ?\"th-[0-9]+' js/data.js | wc -l)"
          echo "shops: $(grep -oE '\"id\": ?\"sh-[0-9]+' js/data.js | wc -l)"
          echo "lots: $(grep -oE '\"id\": ?\"lot-[0-9]+' js/data.js | wc -l)"
          echo "factories: $(grep -oE '\"id\": ?\"fac-[0-9]+' js/data.js | wc -l)"
          echo "kiots: $(grep -oE '\"id\": ?\"kiot-[0-9]+' js/data.js | wc -l)"
          echo "classesLive: $(grep -oE '\"id\": ?\"cl-[0-9]+' js/data.js | wc -l)"
          echo "classesMakeup: $(grep -oE '\"id\": ?\"cm-[0-9]+' js/data.js | wc -l)"
          echo "eventsMarketing: $(grep -oE '\"id\": ?\"em-[0-9]+' js/data.js | wc -l)"
          echo "logistics: $(grep -oE '\"id\": ?\"lg-[0-9]+' js/data.js | wc -l)"
          echo "rentals: $(grep -oE '\"id\": ?\"rt-[0-9]+' js/data.js | wc -l)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images-new/
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy new-objects 2026-11-15: +50 du lieu that moi (10/muc: cl/cm/em/lg 12..21, rt 13..22) — du dich 100 (20/muc), 236 mau / 287 shop / 112 lo / 280 xuong / 240 kiot"
            git push
          fi
