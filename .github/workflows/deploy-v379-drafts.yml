name: Deploy v379-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v379-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v379-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v379-drafts package
        run: |
          unzip -o mclivestream-v379-drafts-deploy.zip
          echo "--- verify v379-drafts (1 bai) ---"
          test -f bai-viet/xiaomi-mi-10-ultra-1400-ty-dong-1-ngay-mo-ban-ban-chay-nhat-live-loi-quan.html || (echo "THIEU bai-viet/xiaomi-mi-10-ultra-1400-ty-dong-1-ngay-mo-ban-ban-chay-nhat-live-loi-quan.html"; exit 1)
          grep -q "bai-viet/xiaomi-mi-10-ultra-1400-ty-dong-1-ngay-mo-ban-ban-chay-nhat-live-loi-quan.html" js/data.js || (echo "THIEU xiaomi-mi-10-ultra-1400-ty-dong-1-ngay-mo-ban-ban-chay-nhat-live-loi-quan trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/xiaomi-mi-10-ultra-1400-ty-dong-1-ngay-mo-ban-ban-chay-nhat-live-loi-quan.html</loc>" sitemap.xml || (echo "THIEU xiaomi-mi-10-ultra-1400-ty-dong-1-ngay-mo-ban-ban-chay-nhat-live-loi-quan trong sitemap"; exit 1)
          grep -q "v379-shell-1" sw.js || (echo "THIEU v379-shell-1 trong sw.js"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v379-drafts-deploy.zip
          git add bai-viet/xiaomi-mi-10-ultra-1400-ty-dong-1-ngay-mo-ban-ban-chay-nhat-live-loi-quan.html js/data.js sitemap.xml sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v379-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — xiaomi-mi-10-ultra-1400-ty-dong-1-ngay-mo-ban-ban-chay-nhat-live-loi-quan"
            git push
          fi
