name: Deploy v461-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v461-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v461-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v461-drafts package
        run: |
          unzip -o mclivestream-v461-drafts-deploy.zip
          echo "--- verify v461-drafts (4 bai) ---"
          test -f bai-viet/7-meo-livestream-ban-thoi-trang-tre-em-nguoi-gia-chot-don-nhanh.html || (echo "THIEU bai-viet/7-meo-livestream-ban-thoi-trang-tre-em-nguoi-gia-chot-don-nhanh.html"; exit 1)
          grep -q "bai-viet/7-meo-livestream-ban-thoi-trang-tre-em-nguoi-gia-chot-don-nhanh.html" js/data.js || (echo "THIEU 7-meo-livestream-ban-thoi-trang-tre-em-nguoi-gia-chot-don-nhanh trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/7-meo-livestream-ban-thoi-trang-tre-em-nguoi-gia-chot-don-nhanh.html</loc>" sitemap.xml || (echo "THIEU 7-meo-livestream-ban-thoi-trang-tre-em-nguoi-gia-chot-don-nhanh trong sitemap"; exit 1)
          test -f bai-viet/37800-ty-dong-nam-thoi-trang-tre-em-balabala-so-1-chau-a-ba-cu-79-tuoi-ban-188-ty-phien.html || (echo "THIEU bai-viet/37800-ty-dong-nam-thoi-trang-tre-em-balabala-so-1-chau-a-ba-cu-79-tuoi-ban-188-ty-phien.html"; exit 1)
          grep -q "bai-viet/37800-ty-dong-nam-thoi-trang-tre-em-balabala-so-1-chau-a-ba-cu-79-tuoi-ban-188-ty-phien.html" js/data.js || (echo "THIEU 37800-ty-dong-nam-thoi-trang-tre-em-balabala-so-1-chau-a-ba-cu-79-tuoi-ban-188-ty-phien trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/37800-ty-dong-nam-thoi-trang-tre-em-balabala-so-1-chau-a-ba-cu-79-tuoi-ban-188-ty-phien.html</loc>" sitemap.xml || (echo "THIEU 37800-ty-dong-nam-thoi-trang-tre-em-balabala-so-1-chau-a-ba-cu-79-tuoi-ban-188-ty-phien trong sitemap"; exit 1)
          test -f bai-viet/nam-nu-bac-si-350-ty-dong-quy-ban-collagen-bang-noi-lo.html || (echo "THIEU bai-viet/nam-nu-bac-si-350-ty-dong-quy-ban-collagen-bang-noi-lo.html"; exit 1)
          grep -q "bai-viet/nam-nu-bac-si-350-ty-dong-quy-ban-collagen-bang-noi-lo.html" js/data.js || (echo "THIEU nam-nu-bac-si-350-ty-dong-quy-ban-collagen-bang-noi-lo trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/nam-nu-bac-si-350-ty-dong-quy-ban-collagen-bang-noi-lo.html</loc>" sitemap.xml || (echo "THIEU nam-nu-bac-si-350-ty-dong-quy-ban-collagen-bang-noi-lo trong sitemap"; exit 1)
          test -f bai-viet/dong-vu-huy-73500-ty-dong-1-nam-livestream-ban-thuc-pham-chuc-nang-bang-cach-ke-chuyen.html || (echo "THIEU bai-viet/dong-vu-huy-73500-ty-dong-1-nam-livestream-ban-thuc-pham-chuc-nang-bang-cach-ke-chuyen.html"; exit 1)
          grep -q "bai-viet/dong-vu-huy-73500-ty-dong-1-nam-livestream-ban-thuc-pham-chuc-nang-bang-cach-ke-chuyen.html" js/data.js || (echo "THIEU dong-vu-huy-73500-ty-dong-1-nam-livestream-ban-thuc-pham-chuc-nang-bang-cach-ke-chuyen trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/dong-vu-huy-73500-ty-dong-1-nam-livestream-ban-thuc-pham-chuc-nang-bang-cach-ke-chuyen.html</loc>" sitemap.xml || (echo "THIEU dong-vu-huy-73500-ty-dong-1-nam-livestream-ban-thuc-pham-chuc-nang-bang-cach-ke-chuyen trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v461-drafts-deploy.zip
          git add bai-viet/7-meo-livestream-ban-thoi-trang-tre-em-nguoi-gia-chot-don-nhanh.html images/bai-viet/7-meo-livestream-ban-thoi-trang-tre-em-nguoi-gia-chot-don-nhanh.jpg bai-viet/37800-ty-dong-nam-thoi-trang-tre-em-balabala-so-1-chau-a-ba-cu-79-tuoi-ban-188-ty-phien.html images/bai-viet/37800-ty-dong-nam-thoi-trang-tre-em-balabala-so-1-chau-a-ba-cu-79-tuoi-ban-188-ty-phien.jpg bai-viet/nam-nu-bac-si-350-ty-dong-quy-ban-collagen-bang-noi-lo.html images/bai-viet/nam-nu-bac-si-350-ty-dong-quy-ban-collagen-bang-noi-lo.jpg bai-viet/dong-vu-huy-73500-ty-dong-1-nam-livestream-ban-thuc-pham-chuc-nang-bang-cach-ke-chuyen.html images/bai-viet/dong-vu-huy-73500-ty-dong-1-nam-livestream-ban-thuc-pham-chuc-nang-bang-cach-ke-chuyen.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v461-drafts: 4 bai viet tu ban thao (Muse Zalo/admin) — 7-meo-livestream-ban-thoi-trang-tre-em-nguoi-gia-chot-don-nhanh, 37800-ty-dong-nam-thoi-trang-tre-em-balabala-so-1-chau-a-ba-cu-79-tuoi-ban-188-ty-phien, nam-nu-bac-si-350-ty-dong-quy-ban-collagen-bang-noi-lo, dong-vu-huy-73500-ty-dong-1-nam-livestream-ban-thuc-pham-chuc-nang-bang-cach-ke-chuyen"
            git push
          fi
