name: Deploy data 2026-11-23 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-23-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-23-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-23 lots package
        run: |
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "f4dc1da495df852c8530bddad0756229cae0c59ea339d7b9ab756d36e0d88617" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-23-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "ac7cabc41641767c8bf4126637486d6cfd444225fa400b007f67c51b9dfc885a" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          for f in lot-299 lot-300 lot-301 lot-302 lot-303 lot-304 lot-305; do ls -l images/lo/$f.jpg; done
          test "$(grep -c '"id": "th-' js/data.js)" = "238" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "304" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "305" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "427" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "375" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "655" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "656" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-299.jpg images/lo/lot-300.jpg images/lo/lot-301.jpg images/lo/lot-302.jpg images/lo/lot-303.jpg images/lo/lot-304.jpg images/lo/lot-305.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-23 lots: 305 lo (8 lo moi lot-298..305: 1 Facebook g3 Luyen Do thanh ly toan bo cua hang 445 Le Lai Thanh Hoa 28/10 + 6 YouTube g3 do nghe/hang bai Nhat Bao An 09/11, ALy 10/11, Thanh Binh 12/11, Duc Nghia 12/11, THAI ANH 14/11, Trung Linh 19/11 + 1 Website g2 Thu mua vai Mien Tay Nam Hai 21/11; 7 anh moi), 238 mau / 304 shop / 427 xuong / 375 kiot / 656 bai viet"
            git push
          fi
