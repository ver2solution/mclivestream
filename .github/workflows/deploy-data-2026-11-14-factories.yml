name: Deploy data 2026-11-14 factories

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-14-factories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-14-factories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-14 factories package
        run: |
          unzip -o mclivestream-data-2026-11-14-factories-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "33f23c02dcd127ccc27aee1d0195b18f8e0a1bd948a36679192f2e02e144a064" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "219" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "250" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "36" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "240" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "200" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "260" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "261" || (echo "BAD articles parsed count"; exit 1)
          for f in images/xuong/fac-201.jpg images/xuong/fac-202.jpg images/xuong/fac-203.jpg images/xuong/fac-204.jpg images/xuong/fac-205.jpg images/xuong/fac-206.jpg images/xuong/fac-207.jpg images/xuong/fac-208.jpg images/xuong/fac-209.jpg images/xuong/fac-210.jpg images/xuong/fac-211.jpg images/xuong/fac-212.jpg images/xuong/fac-213.jpg images/xuong/fac-214.jpg images/xuong/fac-215.jpg images/xuong/fac-216.jpg images/xuong/fac-217.jpg images/xuong/fac-218.jpg images/xuong/fac-219.jpg images/xuong/fac-220.jpg images/xuong/fac-221.jpg images/xuong/fac-222.jpg images/xuong/fac-223.jpg images/xuong/fac-224.jpg images/xuong/fac-225.jpg; do test -f "$f" || (echo "MISSING $f"; exit 1); done
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/xuong/fac-201.jpg images/xuong/fac-202.jpg images/xuong/fac-203.jpg images/xuong/fac-204.jpg images/xuong/fac-205.jpg images/xuong/fac-206.jpg images/xuong/fac-207.jpg images/xuong/fac-208.jpg images/xuong/fac-209.jpg images/xuong/fac-210.jpg images/xuong/fac-211.jpg images/xuong/fac-212.jpg images/xuong/fac-213.jpg images/xuong/fac-214.jpg images/xuong/fac-215.jpg images/xuong/fac-216.jpg images/xuong/fac-217.jpg images/xuong/fac-218.jpg images/xuong/fac-219.jpg images/xuong/fac-220.jpg images/xuong/fac-221.jpg images/xuong/fac-222.jpg images/xuong/fac-223.jpg images/xuong/fac-224.jpg images/xuong/fac-225.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-14 factories: 240 xuong (40 moi fac-201..fac-240, 25 anh moi), 219 mau / 250 shop / 36 lo / 200 kiot / 261 bai viet"
            git push
          fi
