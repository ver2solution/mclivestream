name: deploy-v235
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v235:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v235 package
        run: |
          unzip -o v235.zip
          ls -l v20.css sw.js
      - name: Verify package contents
        run: |
          set -e
          test "$(grep -c 'v235' v20.css)" -eq 5
          grep -Fq 'min-height:44px' v20.css
          grep -Fq 'width:44px;height:44px' v20.css
          grep -Fq 'min-width:44px;min-height:44px' v20.css
          grep -Fq "CACHE = 'v235-shell-1'" sw.js
      - name: Commit v235 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add v20.css sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v235 nut bam mobile du 44px (P3 tap targets) + sw.js v235-shell-1"
            git push
          fi
