name: "Deploy v358-tin-moi-4x4 (Muc Tin moi trang chu 4 hang x 4 o)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v358-tin-moi-4x4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v358-tin-moi-4x4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v358 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v358-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF "v358-shell-1" sw.js; then echo "v358 DA DEPLOY ROI - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main bcff250) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "202063ecade64cbb8939cb2df3e67e51" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "495" || (echo "BASE DOI: sitemap khong con 495 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v358-deploy.zip
          echo "--- verify v358 (4 file) ---"
          for f in js/app.js sw.js v20.css tests/test-v38.mjs; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "slice(0,16)" js/app.js || (echo "SAI: js/app.js phai co slice(0,16) cho #homeNews"; exit 1)
          grep -qF "#lo-trinh .news-list{grid-template-columns:repeat(4,1fr)}" v20.css || (echo "SAI: v20.css phai co #lo-trinh .news-list 4 cot"; exit 1)
          grep -qF "v358-shell-1" sw.js || (echo "SAI: sw.js phai co CACHE v358-shell-1"; exit 1)
          node --check js/app.js || (echo "SAI: js/app.js loi cu phap"; exit 1)
          echo "verify OK: 4 file, slice(0,16) + grid 4 cot + CACHE v358-shell-1"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v358-deploy.zip
          git add js/app.js sw.js v20.css tests/test-v38.mjs
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v358: Muc Tin moi trang chu 2 cot x 6 bai -> 4 hang x 4 o = 16 tin moi nhat (lenh anh Tho 16:10 19/11) — js/app.js slice(0,16) + v20.css #lo-trinh .news-list 4 cot (tablet 2, mobile 1) + sw.js CACHE v358-shell-1 + test-v38 cap nhat ky vong 6->16"
            git push
          fi
