name: Deploy data 2026-11-13 kiot

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-13-kiot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-13-kiot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-13 kiot package
        run: |
          rm -f images/kiot/*.jpg
          unzip -o mclivestream-data-2026-11-13-kiot-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "kiot images: $(ls images/kiot/*.jpg | wc -l)"
          missing=0
          for f in $(grep -o 'images/kiot/kiot-[0-9]*\.jpg' js/data.js | sort -u); do
            [ -f "$f" ] || { echo "THIEU ANH: $f"; missing=$((missing+1)); }
          done
          echo "anh thieu: $missing"
          [ "$missing" -eq 0 ]
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/data.js images/kiot/
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-13 kiot (merge): 160 kiot (40 kiot moi, muc x4 KPI) + 200 xuong (giu nguyen tu deploy xuong 12:35), 219 mau / 250 shop / 36 lo / 218 bai"
            git push
          fi
