name: Deploy data 2026-11-26 backfill-fl-url

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-26-backfill-fl-url.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-26-backfill-fl-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-26 backfill-fl-url package
        run: |
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "31da2e11ff77e3c97585c4ad563f6c8bab315104572b4d2f2b21c26adc275a52" || (echo "LIVE data.js is not the post-dupfix version (dupfix must deploy first) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-26-backfill-fl-url.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "519411d595cfc77e34a288d18078f8aa2d3aa8bfb6dc662f466f2ebefedbeae6" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "freelanceJobs: $(grep -c '"id":"fl-' js/data.js)"
          echo "freelancePeople: $(grep -c '"id":"fp-' js/data.js)"
          echo "freelance url: $(grep -o '"url":"https://www.facebook.com/groups/[^"]*/posts/[0-9]*"' js/data.js | wc -l)"
          echo "freelance source: $(grep -c '"source":"' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "258" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "328" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "341" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "447" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "387" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "800" || (echo "BAD articles grep count"; exit 1)
          test "$(grep -c '"id":"fl-' js/data.js)" = "16" || (echo "BAD freelanceJobs count"; exit 1)
          test "$(grep -c '"id":"fp-' js/data.js)" = "2" || (echo "BAD freelancePeople count"; exit 1)
          test "$(grep -o '"url":"https://www.facebook.com/groups/[^"]*/posts/[0-9]*"' js/data.js | wc -l)" = "18" || (echo "BAD freelance url count (must be 18)"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "801" || (echo "BAD articles parsed count"; exit 1)
          node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));var D=window.V20_DATA;var items=D.freelanceJobs.concat(D.freelancePeople);if(items.length!==18)throw new Error('freelance total != 18');items.forEach(function(it){if(!/^https:\/\/www\.facebook\.com\/groups\/[^/]+\/posts\/\d+$/.test(it.url||''))throw new Error('BAD url '+it.id);if(!it.source)throw new Error('missing source '+it.id)});console.log('backfill guard PASS: 18/18 freelance items have url + source')"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-26 backfill-fl-url: them url + source (link bai goc Facebook + ten nhom) cho 18 tin freelance fl-001..016 + fp-001/002 (lay tu file chay an, KHONG them SDT/Zalo — E-189); articles 801 entries / 800 unique, 258 mau / 328 shop / 341 lo / 447 xuong / 387 kiot"
            git push
          fi
