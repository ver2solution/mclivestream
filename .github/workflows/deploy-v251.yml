name: deploy-v251
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v251:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v251 package
        run: |
          unzip -o v251-f-r2-06.zip
          ls -l gioi-thieu.html js/app.js sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "dang-nhap.html?next=gioi-thieu.html" gioi-thieu.html
          grep -Fq "v251 (F-R2-06)" js/app.js
          grep -Fq "CACHE = 'v251-shell-1'" sw.js
          node --check js/app.js
          node --check sw.js
      - name: Commit v251 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add gioi-thieu.html js/app.js sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v251 F-R2-06 nut header Gioi thieu ve Dang Nhap + sw.js v251-shell-1"
            git push
          fi
