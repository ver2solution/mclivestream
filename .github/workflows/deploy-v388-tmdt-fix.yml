name: Deploy v388-tmdt-fix (TMDT Q4 1 cau)

on:
  push:
    paths:
      - '.github/workflows/deploy-v388-tmdt-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v388-tmdt-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v388-tmdt-fix package
        run: |
          unzip -o mclivestream-v388-tmdt-fix-deploy.zip
          echo "--- verify v388-tmdt-fix (1 cau bai TMDT Q4) ---"
          test -f bai-viet/phan-tich-thi-truong-tmdt-quy-4-2026-165500-ty-dong.html || (echo "THIEU bai-viet/phan-tich-thi-truong-tmdt-quy-4-2026-165500-ty-dong.html"; exit 1)
          grep -q "Adobe dự báo riêng tháng 10/2026, doanh số online Mỹ sẽ đạt 95,8 tỷ USD" bai-viet/phan-tich-thi-truong-tmdt-quy-4-2026-165500-ty-dong.html || (echo "THIEU cau sua trong bai TMDT Q4"; exit 1)
          grep -q "bai-viet/phan-tich-thi-truong-tmdt-quy-4-2026-165500-ty-dong.html" js/data.js || (echo "THIEU phan-tich-thi-truong-tmdt-quy-4-2026-165500-ty-dong trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/phan-tich-thi-truong-tmdt-quy-4-2026-165500-ty-dong.html</loc>" sitemap.xml || (echo "THIEU phan-tich-thi-truong-tmdt-quy-4-2026-165500-ty-dong trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v388-tmdt-fix-deploy.zip
          git add bai-viet/phan-tich-thi-truong-tmdt-quy-4-2026-165500-ty-dong.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v388: sua cau du bao Adobe thang 10/2026 bai TMDT Q4 (phan-tich-thi-truong-tmdt-quy-4-2026-165500-ty-dong)"
            git push
          fi
