name: Deploy v369-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v369-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v369-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v369-drafts package
        run: |
          unzip -o mclivestream-v369-drafts-deploy.zip
          echo "--- verify v369-drafts (1 bai) ---"
          test -f bai-viet/quyen-leo-daily-75-ty-dong-13-gio-livestream-ky-luc-dong-nam-a.html || (echo "THIEU bai-viet/quyen-leo-daily-75-ty-dong-13-gio-livestream-ky-luc-dong-nam-a.html"; exit 1)
          grep -q "bai-viet/quyen-leo-daily-75-ty-dong-13-gio-livestream-ky-luc-dong-nam-a.html" js/data.js || (echo "THIEU quyen-leo-daily-75-ty-dong-13-gio-livestream-ky-luc-dong-nam-a trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/quyen-leo-daily-75-ty-dong-13-gio-livestream-ky-luc-dong-nam-a.html</loc>" sitemap.xml || (echo "THIEU quyen-leo-daily-75-ty-dong-13-gio-livestream-ky-luc-dong-nam-a trong sitemap"; exit 1)
          grep -q "v369-shell-1" sw.js || (echo "THIEU v369-shell-1 trong sw.js"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v369-drafts-deploy.zip
          git add bai-viet/quyen-leo-daily-75-ty-dong-13-gio-livestream-ky-luc-dong-nam-a.html js/data.js sitemap.xml sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v369-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — quyen-leo-daily-75-ty-dong-13-gio-livestream-ky-luc-dong-nam-a"
            git push
          fi
