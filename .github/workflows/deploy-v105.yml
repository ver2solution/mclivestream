name: Deploy v105

on:
  push:
    paths:
      - '.github/workflows/deploy-v105.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v105:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v105 deploy package
        run: |
          unzip -o mclivestream-v105-deploy.zip
          ls -l tin-tuc.html js/app.js sw.js
          sha256sum tin-tuc.html js/app.js sw.js
          grep -q "v105-shell-1" sw.js && echo "sw.js CACHE OK: v105-shell-1"
          grep -q "newsPinnedRow" tin-tuc.html && echo "tin-tuc pinned row OK"
          grep -q "newsNewRow" tin-tuc.html && echo "tin-tuc new row OK"
          grep -q "renderTopRows" js/app.js && echo "app.js renderTopRows OK"
          if grep -q "Lưu ý về số liệu" tin-tuc.html; then echo "FAIL: notice van con"; exit 1; else echo "tin-tuc notice deleted OK"; fi
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tin-tuc.html js/app.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v105: 2 hang tin tren muc loc (ghim + moi nhat), xoa ghi chu vang"
            git push
          fi
