name: "Deploy v384-dong-tien-2111 (4 bai)"

on:
  push:
    paths:
      - '.github/workflows/deploy-dong-tien-2111.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v384-dong-tien-2111:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "540" || (echo "BASE DOI: data.js khong con 540 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "567" || (echo "BASE DOI: sitemap khong con 567 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          for slug in vang-cham-3514-usd-tuan-toi-te-nhat-8-thang bitcoin-thung-60000-usd-thap-nhat-tu-thang-7 lam-phat-ky-vong-my-roi-ve-37-phan-tram doanh-thu-tiktok-shop-thang-12-shop-nho-don-song; do
            grep -q "bai-viet/$slug.html" js/data.js && (echo "DA DEPLOY ROI: $slug da co trong data.js - DUNG LAI"; exit 1) || true
          done
      - name: Unzip v384 dong-tien package
        run: |
          unzip -o mclivestream-v384-dong-tien-deploy.zip
          echo "--- verify v384 dong-tien (4 bai) ---"
          for slug in vang-cham-3514-usd-tuan-toi-te-nhat-8-thang bitcoin-thung-60000-usd-thap-nhat-tu-thang-7 lam-phat-ky-vong-my-roi-ve-37-phan-tram doanh-thu-tiktok-shop-thang-12-shop-nho-don-song; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "571" || (echo "SAI TONG sitemap, phai 571"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "544" || (echo "SAI TONG data.js, phai 544 bai-viet page"; exit 1)
          node --check js/data.js || (echo "node --check data.js FAILED"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v384-dong-tien-deploy.zip || rm -f mclivestream-v384-dong-tien-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-dong-tien-2026-11-21: 4 bai moi (SEO V2)"
            git push
          fi
