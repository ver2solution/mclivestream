name: Deploy v272 (rename-brand)

on:
  push:
    paths:
      - '.github/workflows/deploy-v272-rename-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v272-rename-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v272-rename-brand package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v272-rename-brand-deploy.zip
          echo "--- verify v272 (rename-brand) ---"
          for f in $(git diff --name-only -- '*.js' | grep -v 'js/data.js'); do node --check "$f" || (echo "SYNTAX FAIL $f"; exit 1); done
          grep -m1 "v272-shell-1" sw.js
          grep -m1 "v272 (rename-brand" js/app.js
          echo "remaining ver2solution (chi duoc phep giu: Ver2solutionAgency, ver2solution@gmail.com, nhan-zalo-ver2solution, ticker.js regex):"
          remaining=$(grep -ri "ver2solution" --include="*.html" --include="*.js" --include="*.css" . | grep -v "js/data.js" | grep -v "Ver2solutionAgency" | grep -v "ver2solution@gmail.com" | grep -v "nhan-zalo-ver2solution" | grep -v "js/ticker.js" | wc -l)
          echo "remaining: $remaining"
          if [ "$remaining" != "0" ]; then echo "RENAME INCOMPLETE"; exit 1; fi
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum js/app.js sw.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v272-rename-brand-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v272: doi ten thuong hieu sang vieclamlivestream.online (rename-brand), sw.js v272-shell-1"
            git push
          fi
