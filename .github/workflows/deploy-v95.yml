name: Deploy v95

on:
  push:
    paths:
      - '.github/workflows/deploy-v95.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v95:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v95 deploy package
        run: |
          unzip -o mclivestream-v95-deploy.zip
          ls -l js/comments.js sw.js
          sha256sum js/comments.js sw.js
          grep -q "v95-shell-1" sw.js && echo "sw.js CACHE OK: v95-shell-1"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/comments.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v95: don gian hoa binh luan khach vang lai, cache v95-shell-1"
            git push
          fi
