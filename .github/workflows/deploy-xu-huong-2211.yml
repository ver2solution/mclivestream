name: Deploy articles-xu-huong-2026-11-22 (4 bai Xu huong 22/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-xu-huong-2211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-xu-huong-2211:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "baec9acaebc1e8037b215fa5e8286208" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "594" || (echo "BASE DOI: data.js khong con 594 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "621" || (echo "BASE DOI: sitemap khong con 621 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip xu-huong-2211 package
        run: |
          test "$(stat -c %s mclivestream-xu-huong-2211-deploy.zip)" = "803476" || (echo "SAI KICH THUOC zip tai ve, phai 803476"; exit 1)
          unzip -o mclivestream-xu-huong-2211-deploy.zip
          echo "--- verify xu-huong-2211 (4 bai) ---"
          for slug in xu-huong-thi-truong-tet-dinh-mui-51-phan-tram-chi-nhieu-hon gen-z-mua-sam-le-2026-lan-dau-chiem-mot-nua-chi-tieu livestream-mua-sam-le-2026-tiktok-live-tang-gap-doi ngan-sach-mua-sam-le-2026-nguoi-my-cat-gan-600-usd; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "625" || (echo "SAI TONG sitemap, phai 625"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "598" || (echo "SAI TONG data.js, phai 598"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-xu-huong-2211-deploy.zip || rm -f mclivestream-xu-huong-2211-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-xu-huong-2026-11-22: 4 bai Xu huong 22/11/2026 (xu huong thi truong Tet Dinh Mui keyword #9 deep + Gen Z mua sam le Deloitte + livestream mua sam le TikTok LIVE x2 + ngan sach mua sam le BMO); SEO V2"
            git push
          fi
