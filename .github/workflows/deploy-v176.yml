name: deploy-v176
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip deploy package
        run: |
          unzip -o mclivestream-v176-dropdown-deploy.zip
          rm mclivestream-v176-dropdown-deploy.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v176: dropdown Tin tuc 10 chuyen muc + sua loi tai lanh" || echo "nothing to commit"
          git push
