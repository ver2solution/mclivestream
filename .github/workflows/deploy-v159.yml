name: Deploy v159 (SEO đợt 1 — 59 bai-viet)

on:
  push:
    paths:
      - '.github/workflows/deploy-v159.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v159:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip v159 package
        run: |
          unzip -o seo-goi1-deploy.zip
          echo "--- verify v159 (bai-viet) ---"
          test -f "bai-viet/luong-mau-livestream-2026.html" || (echo "THIEU file luong-mau"; exit 1)
          test -f "bai-viet/nhap-hang-trung-quoc-cuoi-nam-2026.html" || (echo "THIEU file nhap-hang"; exit 1)
          echo "bai-viet html count: $(ls bai-viet/*.html | wc -l)"
          title_line=$(grep -o '<title>[^<]*</title>' bai-viet/luong-mau-livestream-2026.html | head -1)
          echo "title luong-mau: $title_line"
          echo "$title_line" | grep -q "Lương mẫu livestream 2026: mặt bằng thu nhập theo từng cấp" || (echo "Title luong-mau chua dung"; exit 1)
          case "$title_line" in
            *"— Ver2Solution"*) echo "Title luong-mau van con hau to"; exit 1 ;;
          esac

      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          echo "changed bai-viet files: $(git diff --cached --name-only | grep -c '^bai-viet/' || true)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "v159: SEO đợt 1 — 46 title bỏ hậu tố + 13 bài đạt 100% (5 quick wins + 8 bài 1B)"
            git push
          fi
