name: Deploy v193-cong-nghe (4 bai Cong nghe 13/11/2026 + khoi phuc 4 Phan tich + 4 Thi truong)

on:
  push:
    paths:
      - '.github/workflows/deploy-v193-cong-nghe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v193-cong-nghe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v193-cong-nghe package
        run: |
          unzip -o mclivestream-v193-cong-nghe-deploy.zip
          echo "--- verify v193-cong-nghe (12 bai: 4 Cong nghe moi + 4 Phan tich khoi phuc + 4 Thi truong) ---"
          test "$(unzip -l mclivestream-v193-cong-nghe-deploy.zip | grep -c ' bai-viet/.*\.html$')" -eq 12 || (echo "SAI: goi v193 phai co dung 12 file bai-viet HTML"; exit 1)
          test "$(unzip -l mclivestream-v193-cong-nghe-deploy.zip | grep -c ' images/bai-viet/.*\.jpg$')" -eq 24 || (echo "SAI: goi v193 phai co dung 24 anh"; exit 1)
          if unzip -l mclivestream-v193-cong-nghe-deploy.zip | grep -q ' sw.js$'; then echo "SAI: goi v193 KHONG duoc chua sw.js"; exit 1; fi
          for slug in ai-livestream-ban-hang-tet-100000-goi-ai-30-phut livestream-ban-hang-bang-ai-77-ty-usd-re-bang-1-10-mc-that video-commerce-viet-nam-32-ty-usd-2026 quang-cao-tiktok-shop-12-12-gmv-max-dang-ky-den-25-11 double-12-2026-phan-tich-5-bai-hoc-tu-11-11-shop-nho mo-hinh-ban-hang-qua-koc-79-trieu-usd-30-ngay-my kinh-doanh-handmade-online-etsy-26-ty-usd-quy-3-2026 mo-hinh-kinh-doanh-doc-la-ao-chong-mo-hoi-700000-usd thi-truong-tet-2026-suc-mua-tang-51-phan-tram thi-truong-thuong-mai-dien-tu-viet-nam-32-ty-usd-2026 livestream-commerce-779-ty-usd-dong-nam-a-2026 thuong-mai-dien-tu-xuyen-bien-gioi-284-nghin-ty-ndt; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" -eq 219 || (echo "SAI: sitemap phai co 219 URL"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" -eq 196 || (echo "SAI: data.js phai co 196 bai"; exit 1)
          test "$(grep -n 'livestream-ban-hang-hieu-qua-1776-ty-ndt-double-11-chot-so' js/data.js | tail -1 | cut -d: -f1)" -gt "$(grep -n 'livestream-tiktok-ban-hang-12-12-voucher-80-phan-tram' js/data.js | tail -1 | cut -d: -f1)" || (echo "SAI: bai xoay vong #1 phai dung sau bai TikTok trong data.js"; exit 1)
          echo "verify OK: 12 bai + 24 anh + data.js (196 bai) + sitemap (219 URL)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v193-cong-nghe-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v193-cong-nghe: 4 bai Cong nghe 13/11/2026 (AI livestream Tet 100.000 goi 30 phut; livestream bang AI 77 ty USD; video commerce VN 32 ty USD; quang cao TikTok Shop 12.12) + khoi phuc 4 Phan tich bi v190 ghi de + 4 Thi truong; sw.js NOT touched"
            git push
          fi
