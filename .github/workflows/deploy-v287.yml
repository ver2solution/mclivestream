name: deploy-v287
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v287:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v287 package
        run: |
          unzip -o v287-stats2-p0.zip
          ls -l index.html danh-sach-lo.html danh-sach-mau.html danh-sach-xuong.html sw.js
          ls -l images/bai-viet/*.svg
      - name: Verify package contents
        run: |
          set -e
          grep -Fq 'id="trustModels">236<' index.html
          grep -Fq 'id="trustLots">109<' index.html
          grep -Fq 'đang có 17 lô' danh-sach-lo.html
          grep -Fq 'đang có 280 xưởng' danh-sach-xuong.html
          grep -Fq "v287-shell-1" sw.js
          ! grep -rq "Ver2Solution" images/bai-viet/*.svg
          grep -Fq "Vieclamlivestream" images/bai-viet/tuyen-mau-livestream.svg
          echo "OK: v287 fallback tinh + 10 SVG doi thuong hieu (15 file, CACHE v287-shell-1)"
      - name: Commit v287 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add index.html danh-sach-lo.html danh-sach-mau.html danh-sach-xuong.html sw.js images/bai-viet/ai-lam-thay-phan-tim-hang.svg images/bai-viet/eu-thu-phi-buu-kien-temu-shein.svg images/bai-viet/ho-so-mc-livestream-7-muc-bat-buoc.svg images/bai-viet/le-11-11-trung-quoc-ban-goi-ai-qua-livestream.svg images/bai-viet/luong-mc-livestream-theo-buoi.svg images/bai-viet/nguoi-tieu-dung-2026-vua-thoai-mai-vua-that.svg images/bai-viet/san-11st-mc-ai-live-sale-11-11.svg images/bai-viet/shopee-ai-cho-nguoi-ban.svg images/bai-viet/tiktok-shop-my-black-friday-2026.svg images/bai-viet/tuyen-mau-livestream.svg
          echo "So file staged:"
          git status --short | wc -l
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v287 fallback tinh + 10 SVG doi thuong hieu (15 file)"
            git push
          fi
