name: Deploy v422-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v422-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v422-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v422-drafts package
        run: |
          unzip -o mclivestream-v422-drafts-deploy.zip
          echo "--- verify v422-drafts (1 bai) ---"
          test -f bai-viet/meo-ban-thoi-trang-livestream-hoc-truong-dai-dich-70-ty-dong-2-gio-live.html || (echo "THIEU bai-viet/meo-ban-thoi-trang-livestream-hoc-truong-dai-dich-70-ty-dong-2-gio-live.html"; exit 1)
          grep -q "bai-viet/meo-ban-thoi-trang-livestream-hoc-truong-dai-dich-70-ty-dong-2-gio-live.html" js/data.js || (echo "THIEU meo-ban-thoi-trang-livestream-hoc-truong-dai-dich-70-ty-dong-2-gio-live trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/meo-ban-thoi-trang-livestream-hoc-truong-dai-dich-70-ty-dong-2-gio-live.html</loc>" sitemap.xml || (echo "THIEU meo-ban-thoi-trang-livestream-hoc-truong-dai-dich-70-ty-dong-2-gio-live trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v422-drafts-deploy.zip
          git add bai-viet/meo-ban-thoi-trang-livestream-hoc-truong-dai-dich-70-ty-dong-2-gio-live.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v422-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — meo-ban-thoi-trang-livestream-hoc-truong-dai-dich-70-ty-dong-2-gio-live"
            git push
          fi
