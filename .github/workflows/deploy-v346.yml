name: "Deploy v346 (anh bai local 2 bai gtimg + nut Thich/Chia se deu 46px)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v346.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v346:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v346 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v346-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF 'v346-shell-1' sw.js; then echo "v346 DA DEPLOY ROI (sw.js da co v346-shell-1) - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main 403ce70 — sau v345) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "6a0490edbde7860f9931845e8e8012a8" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "449" || (echo "BASE DOI: sitemap khong con 449 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v346-deploy.zip
          echo "--- verify v346 (9 file) ---"
          for f in bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba.html bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san.html images/bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba-hero.jpg images/bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba-hero-og.jpg images/bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san-hero.jpg images/bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san-hero-og.jpg js/data.js v20.css sw.js; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "v346-shell-1" sw.js || (echo "SAI: sw.js phai co v346-shell-1"; exit 1)
          if grep -qF "v345-shell-1" sw.js; then echo "SAI: sw.js khong duoc con v345-shell-1 lam CACHE hien tai"; exit 1; fi
          node --check js/data.js || (echo "SAI: js/data.js loi cu phap"; exit 1)
          node --check sw.js || (echo "SAI: sw.js loi cu phap"; exit 1)
          grep -qF "tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba-hero.jpg" bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba.html || (echo "SAI: bai Tran phai tro anh local"; exit 1)
          grep -qF "tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba-hero-og.jpg" bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba.html || (echo "SAI: bai Tran phai co og local"; exit 1)
          grep -qF "douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san-hero.jpg" bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san.html || (echo "SAI: bai Douyin phai tro anh local"; exit 1)
          grep -qF "tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba-hero.jpg" js/data.js || (echo "SAI: data.js phai tro anh local bai Tran"; exit 1)
          grep -qF "douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san-hero.jpg" js/data.js || (echo "SAI: data.js phai tro anh local bai Douyin"; exit 1)
          if grep -qF "inews.gtimg.com" bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba.html bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san.html js/data.js; then echo "SAI: khong duoc con ref gtimg"; exit 1; fi
          grep -qF ".share-row .v2s-points-row{margin-top:0}" v20.css || (echo "SAI: v20.css phai co fix margin hang share"; exit 1)
          grep -qF ".share-row .btn{min-height:0}" v20.css || (echo "SAI: v20.css phai co fix min-height nut Thich"; exit 1)
          echo "verify OK: 9 file, sw.js v346-shell-1, 2 bai anh local, nut share deu 46px"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v346-deploy.zip
          git add bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba.html bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san.html images/bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba-hero.jpg images/bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba-hero-og.jpg images/bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san-hero.jpg images/bai-viet/douyin-chot-so-double-11-2026-shop-tu-live-tang-200-kol-lui-san-hero-og.jpg js/data.js v20.css sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v346: anh dai dien 2 bai (Tran Tien Sinh + Douyin Double 11) hotlink gtimg -> anh local (hero + hero-og 1200x630) + nut Thich/Chia se deu 46px (bo margin-top:8px cua .v2s-points-row trong hang share); CACHE v346-shell-1 (rebase tu 403ce70)"
            git push
          fi
