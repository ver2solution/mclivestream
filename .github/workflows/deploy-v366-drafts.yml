name: Deploy v366-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v366-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v366-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v366-drafts package
        run: |
          unzip -o mclivestream-v366-drafts-deploy.zip
          echo "--- verify v366-drafts (1 bai) ---"
          test -f bai-viet/mythbusters-a-b-test-tien-boa-tang-36-phan-tram.html || (echo "THIEU bai-viet/mythbusters-a-b-test-tien-boa-tang-36-phan-tram.html"; exit 1)
          grep -q "bai-viet/mythbusters-a-b-test-tien-boa-tang-36-phan-tram.html" js/data.js || (echo "THIEU mythbusters-a-b-test-tien-boa-tang-36-phan-tram trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/mythbusters-a-b-test-tien-boa-tang-36-phan-tram.html</loc>" sitemap.xml || (echo "THIEU mythbusters-a-b-test-tien-boa-tang-36-phan-tram trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v366-drafts-deploy.zip
          git add bai-viet/mythbusters-a-b-test-tien-boa-tang-36-phan-tram.html images/bai-viet/mythbusters-a-b-test-tien-boa-tang-36-phan-tram-hero-og.jpg images/bai-viet/mythbusters-a-b-test-tien-boa-tang-36-phan-tram-hero.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v366-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — mythbusters-a-b-test-tien-boa-tang-36-phan-tram"
            git push
          fi
