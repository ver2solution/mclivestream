name: "Deploy thi-truong-2211 (4 bai Thi truong 22/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-thi-truong-2211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-thi-truong-2211:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "3530a84dfd3260b71018aff2a6f10d63" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "578" || (echo "BASE DOI: data.js khong con 578 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "605" || (echo "BASE DOI: sitemap khong con 605 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip thi-truong-2211 package
        run: |
          unzip -o mclivestream-thi-truong-2211-deploy.zip
          echo "--- verify thi-truong-2211 (4 bai) ---"
          for slug in jd-com-quy-3-2026-doanh-thu-309-ty-ndt-lai-tang-44-phan-tram shopify-quy-3-2026-gmv-119-ty-usd-doanh-thu-tang-32-phan-tram amazon-quy-3-2026-aws-tang-39-phan-tram-loi-nhuan-ky-luc black-friday-viet-nam-2026-shop-nho-5-ngay-vang; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "609" || (echo "SAI TONG sitemap, phai 609"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "582" || (echo "SAI TONG data.js, phai 582"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-thi-truong-2211-deploy.zip || rm -f mclivestream-thi-truong-2211-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-thi-truong-2026-11-22: 4 bai moi (SEO V2)"
            git push
          fi
