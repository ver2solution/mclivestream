name: "Deploy hang-hoa-2511 (4 bai Hang hoa 25/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-hang-hoa-2511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-hang-hoa-2511:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'ao-dai-tet-2026-shop-nho-nen-nhap-mau-nao-gia-nao' js/data.js; then echo "hang-hoa-2511 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "d8f94226af65cc0be7211716695afe78" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "718" || (echo "BASE DOI: data.js khong con 718 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "740" || (echo "BASE DOI: sitemap khong con 740 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip hang-hoa-2511 package
        run: |
          unzip -o mclivestream-hang-hoa-2511-deploy.zip
          echo "--- verify hang-hoa-2511 (4 bai) ---"
          for slug in ao-dai-tet-2026-shop-nho-nen-nhap-mau-nao-gia-nao thoi-trang-nu-nam-shop-nen-nhap-loai-nao-dip-tet kfc-nhat-kem-mem-kep-banh-quy-290-yen lich-dem-nguoc-giang-sinh-do-choi-bop-mem-26000-chiec; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "744" || (echo "SAI TONG sitemap, phai 744"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "722" || (echo "SAI TONG data.js, phai 722"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-hang-hoa-2511-deploy.zip || rm -f mclivestream-hang-hoa-2511-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-hang-hoa-2026-11-25: 4 bai (ao-dai-tet-2026-shop-nho-nen-nhap-mau-nao-gia-nao, thoi-trang-nu-nam-shop-nen-nhap-loai-nao-dip-tet, kfc-nhat-kem-mem-kep-banh-quy-290-yen, lich-dem-nguoc-giang-sinh-do-choi-bop-mem-26000-chiec)"
            git push
          fi
