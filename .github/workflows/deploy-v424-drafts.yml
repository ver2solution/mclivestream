name: Deploy v424-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v424-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v424-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v424-drafts package
        run: |
          unzip -o mclivestream-v424-drafts-deploy.zip
          echo "--- verify v424-drafts (2 bai) ---"
          test -f bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung-2020.html || (echo "THIEU bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung-2020.html"; exit 1)
          grep -q "bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung-2020.html" js/data.js || (echo "THIEU the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung-2020 trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung-2020.html</loc>" sitemap.xml || (echo "THIEU the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung-2020 trong sitemap"; exit 1)
          test -f bai-viet/chon-thu-cung-thay-vi-sinh-con.html || (echo "THIEU bai-viet/chon-thu-cung-thay-vi-sinh-con.html"; exit 1)
          grep -q "bai-viet/chon-thu-cung-thay-vi-sinh-con.html" js/data.js || (echo "THIEU chon-thu-cung-thay-vi-sinh-con trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/chon-thu-cung-thay-vi-sinh-con.html</loc>" sitemap.xml || (echo "THIEU chon-thu-cung-thay-vi-sinh-con trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v424-drafts-deploy.zip
          git add bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung-2020.html images/bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung-2020.jpg bai-viet/chon-thu-cung-thay-vi-sinh-con.html images/bai-viet/chon-thu-cung-thay-vi-sinh-con.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v424-drafts: 2 bai viet tu ban thao (Muse Zalo/admin) — the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung-2020, chon-thu-cung-thay-vi-sinh-con"
            git push
          fi
