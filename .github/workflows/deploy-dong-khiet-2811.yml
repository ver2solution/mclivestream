name: Deploy article-dong-khiet-2026-11-28 (1 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-dong-khiet-2811.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-dong-khiet-2811:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)"   = "886" || (echo "BASE DOI: data.js khong con 886 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)"   = "911" || (echo "BASE DOI: sitemap khong con 911 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip dong-khiet-2811 package
        run: |
          unzip -o mclivestream-dong-khiet-2811-deploy.zip
          echo "--- verify dong-khiet-2811 (1 bai moi) ---"
          for slug in bai-hoc-phien-live-dong-khiet-210-ty-shop-van-phong; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -qF "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -qF "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "--- verify lead 1 bai moi ---"
          grep -qF "Phiên live Đổng Khiết thứ ba trên Tiểu Hồng Thư đạt GMV 60 triệu nhân dân tệ" bai-viet/bai-hoc-phien-live-dong-khiet-210-ty-shop-van-phong.html || (echo "LEAD SAI bai dong-khiet"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)"  = "912" || (echo "SAI TONG sitemap, phai 912"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)"  = "887" || (echo "SAI TONG data.js, phai 887 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-dong-khiet-2811-deploy.zip || rm -f mclivestream-dong-khiet-2811-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy article-dong-khiet-2026-11-28: 1 bai (bai-hoc-phien-live-dong-khiet-210-ty-shop-van-phong)"
            git pull --rebase origin main || (echo "REBASE THAT BAI - co cron khac push chen, DUNG LAI de rebuild"; exit 1)
            git push
          fi
