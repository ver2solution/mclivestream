name: Deploy data 2026-11-25 lots v2

on:
  push:
    paths:
      - .github/workflows/deploy-data-2026-11-25-lots-v2.yml

permissions:
  contents: write

env:
  ZIP_FILE: mclivestream-data-2026-11-25-lots-deploy-v2.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: deploy/lots-20261125-v2

      - name: Install unzip and node
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          node --version

      - name: Unzip and verify 25 files
        run: |
          set -e
          test -f "$ZIP_FILE"
          unzip -o "$ZIP_FILE"
          test -f js/data.js
          test -s js/data.js
          for n in $(seq 306 318) $(seq 320 330); do
            test -f "images/lo/lot-$n.jpg" || { echo "missing images/lo/lot-$n.jpg"; exit 1; }
            test -s "images/lo/lot-$n.jpg" || { echo "empty images/lo/lot-$n.jpg"; exit 1; }
          done
          echo "All 25 files present: js/data.js + 24 lot images (306-318, 320-330)"

      - name: Verify data counts and moved articles
        run: |
          cat > /tmp/check.js <<'EOF'
          const fs=require('fs');
          const src=fs.readFileSync('js/data.js','utf8');
          const start=src.indexOf('const DATA');
          const eq=src.indexOf('=', start);
          const end=src.indexOf('};', eq);
          if(start<0||eq<0||end<0){console.error('DATA block not found');process.exit(1);}
          const DATA=eval(src.slice(eq+1, end+1));
          console.log('lots:',DATA.lots.length,'kiot:',DATA.kiot.length,'factories:',DATA.factories.length,'articles:',DATA.articles.length);
          if(DATA.lots.length!==330){console.error('lots must be 330');process.exit(1);}
          if(DATA.kiot.length!==384){console.error('kiot must be 384');process.exit(1);}
          if(DATA.factories.length!==442){console.error('factories must be 442');process.exit(1);}
          const slugs=['tet-nguyen-dan-2027-ngay-nao-con-73-ngay-shop-mau-live-lam-gi','uniqlo-black-friday-2026-giam-toi-50-phan-tram-het-26-11','hm-black-friday-2026-giam-toi-50-phan-tram-online-tu-26-11','levis-black-friday-2026-giam-40-phan-tram-501-chi-66-usd'];
          for(const s of slugs){ if(!DATA.articles.some(a=>a.slug===s)){console.error('slug not in articles:',s);process.exit(1);} if(DATA.lots.some(l=>l.slug===s)){console.error('slug still in lots:',s);process.exit(1);} }
          console.log('4 hot slugs are in articles and not in lots: OK');
          EOF
          node /tmp/check.js

      - name: Commit deployed files and remove zip + workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q "$ZIP_FILE" .github/workflows/deploy-data-2026-11-25-lots-v2.yml
          git add js/data.js images/lo/
          git status --short
          git diff --cached --quiet && { echo 'no changes to commit'; exit 1; }
          git commit -m "data: 25 lô mới lot-306..330 + chuyển 4 bài Đang hot về mảng articles (25/11)"
          git push

      - name: Summary
        run: |
          echo "### Deploy lots v2 2026-11-25" >> "$GITHUB_STEP_SUMMARY"
          echo "- lots: 330, kiot: 384, factories: 442" >> "$GITHUB_STEP_SUMMARY"
          echo "- 4 hot slugs moved to articles" >> "$GITHUB_STEP_SUMMARY"
