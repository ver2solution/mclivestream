name: deploy-v175
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          unzip -l mclivestream-v175-dropdown-deploy.zip
          unzip -o mclivestream-v175-dropdown-deploy.zip
          rm mclivestream-v175-dropdown-deploy.zip
          git add -A
          git config user.name "Ryan"
          git config user.email "ver2solution@gmail.com"
          git commit -m "v175: dropdown Tin tuc tren nav (8 bai moi nhat)"
          git push
