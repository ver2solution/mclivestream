name: "Deploy v322 (Chat AI admin: tab Chat AI + upload anh/video)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v322.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v322:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v322 package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; bai hoc v307: KHONG guard HEAD-SHA; bai hoc v305: dem bang grep -o | wc -l, KHONG grep -c; so sanh so bang -eq) ---"
          grep -q 'v322-shell-1' sw.js && (echo "v322 DA DEPLOY ROI - dung"; exit 1) || true
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "828bc91f10da5a88eda42686f77ac3e2" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -o '<loc>' sitemap.xml | wc -l)" -eq 392 || (echo "BASE DOI: sitemap khong con 392 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v322-deploy.zip
          echo "--- verify v322 (3 files) ---"
          test "$(unzip -l mclivestream-v322-deploy.zip | grep -cE ' (quan-tri\.html|js/admin\.js|sw\.js)$')" -eq 3 || (echo "SAI: goi v322 phai co dung 3 file (quan-tri.html, js/admin.js, sw.js)"; exit 1)
          grep -q "v322-shell-1" sw.js || (echo "SAI: sw.js phai co v322-shell-1"; exit 1)
          grep -q "admTab-ai-chat" quan-tri.html || (echo "SAI: quan-tri.html phai co panel admTab-ai-chat"; exit 1)
          grep -q "loadAiChat" js/admin.js || (echo "SAI: js/admin.js phai co loadAiChat"; exit 1)
          grep -q "ai-admin-room" js/admin.js || (echo "SAI: js/admin.js phai co kenh ai-admin-room"; exit 1)
          grep -q "chat-attachments" js/admin.js || (echo "SAI: js/admin.js phai co bucket chat-attachments"; exit 1)
          echo "verify OK: 3 files, v322 co mat, data.js/sitemap khong doi"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v322-deploy.zip
          git add quan-tri.html js/admin.js sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v322 (Chat AI admin): tab Chat AI noi bo + upload anh/video (PR-A2); bump SW CACHE v321-shell-1 -> v322-shell-1; data.js/sitemap khong doi (base 6894a17)"
            git push
          fi
