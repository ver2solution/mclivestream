name: Deploy articles-dang-hot-2026-11-25 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-dang-hot-2511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-dang-hot-2511:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "718" || (echo "BASE DOI: data.js khong con 718 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "740" || (echo "BASE DOI: sitemap khong con 740 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip dang-hot-2511 package
        run: |
          unzip -o mclivestream-dang-hot-2511-deploy.zip
          echo "--- verify dang-hot-2511 (4 bai moi) ---"
          for slug in tet-nguyen-dan-2027-ngay-nao-con-73-ngay-shop-mau-live-lam-gi uniqlo-black-friday-2026-giam-toi-50-phan-tram-het-26-11 hm-black-friday-2026-giam-toi-50-phan-tram-online-tu-26-11 levis-black-friday-2026-giam-40-phan-tram-501-chi-66-usd; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -qF "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -qF "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "--- verify lead 4 bai moi ---"
          grep -qF "Tết Nguyên đán 2027 rơi vào thứ Bảy 06/02/2027, tức mùng 1 Tết Đinh Mùi" bai-viet/tet-nguyen-dan-2027-ngay-nao-con-73-ngay-shop-mau-live-lam-gi.html || (echo "LEAD SAI bai tet-nguyen-dan"; exit 1)
          grep -qF "Uniqlo Black Friday 2026 đang chạy dưới tên Thank You Event, giảm tới 50%" bai-viet/uniqlo-black-friday-2026-giam-toi-50-phan-tram-het-26-11.html || (echo "LEAD SAI bai uniqlo"; exit 1)
          grep -qF "H&M Black Friday 2026 giảm tới 50% toàn cửa hàng, bắt đầu online từ thứ Năm 26/11/2026" bai-viet/hm-black-friday-2026-giam-toi-50-phan-tram-online-tu-26-11.html || (echo "LEAD SAI bai hm"; exit 1)
          grep -qF "Levi's Black Friday 2026 giảm 40% toàn bộ trang web levi.com, không cần nhập mã" bai-viet/levis-black-friday-2026-giam-40-phan-tram-501-chi-66-usd.html || (echo "LEAD SAI bai levis"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "744" || (echo "SAI TONG sitemap, phai 744"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "722" || (echo "SAI TONG data.js, phai 722 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-dang-hot-2511-deploy.zip || rm -f mclivestream-dang-hot-2511-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-dang-hot-2026-11-25: 4 bai (tet-nguyen-dan-2027-ngay-nao-con-73-ngay-shop-mau-live-lam-gi uniqlo-black-friday-2026-giam-toi-50-phan-tram-het-26-11 hm-black-friday-2026-giam-toi-50-phan-tram-online-tu-26-11 levis-black-friday-2026-giam-40-phan-tram-501-chi-66-usd)"
            git pull --rebase origin main || (echo "REBASE THAT BAI - co cron khac push chen, DUNG LAI de rebuild"; exit 1)
            git push
          fi
