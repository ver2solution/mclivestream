---
name: Deploy v192 (tab theo nhu cau mau/shop)

on:
  push:
    paths:
      - '.github/workflows/deploy-v192.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v192:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v192 package
        run: |
          unzip -o mclivestream-v192-deploy.zip
          echo "--- verify v192 (tab theo nhu cau) ---"
          test -f danh-sach-mau.html || (echo "THIEU danh-sach-mau.html"; exit 1)
          test -f danh-sach-shop.html || (echo "THIEU danh-sach-shop.html"; exit 1)
          grep -q "Tìm việc làm" danh-sach-mau.html || (echo "THIEU tab Tim viec lam trang Mau"; exit 1)
          grep -q "Tìm shop" danh-sach-mau.html || (echo "THIEU tab Tim shop trang Mau"; exit 1)
          grep -q "Lớp Livestream" danh-sach-mau.html || (echo "THIEU tab Lop Livestream"; exit 1)
          grep -q "Lớp Makeup" danh-sach-mau.html || (echo "THIEU tab Lop Makeup"; exit 1)
          if grep -q ">Tìm Mẫu Livestream</button>" danh-sach-mau.html; then echo "CON nut Tim Mau cu tren trang Mau"; exit 1; fi
          grep -q "Tìm Mẫu Livestream" danh-sach-shop.html || (echo "THIEU tab Tim Mau trang Shop"; exit 1)
          grep -q "Tìm lô hàng xả kho" danh-sach-shop.html || (echo "THIEU tab Lo trang Shop"; exit 1)
          grep -q "Tìm xưởng may sản xuất" danh-sach-shop.html || (echo "THIEU tab Xuong trang Shop"; exit 1)
          grep -q "lo-hang-xa-kho" danh-sach-mau.html || (echo "THIEU script mo muc theo hash"; exit 1)
          grep -q "Bộ lọc tìm kiếm" danh-sach-mau.html || (echo "THIEU nhan bo loc moi"; exit 1)
          echo "verify OK: tab Mau dung nhu cau mau, tab Shop dung nhu cau shop, khong con nut cu"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f mclivestream-v192-deploy.zip
          git add danh-sach-mau.html danh-sach-shop.html
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v192: tab theo nhu cau — trang Mau (Tim viec lam/Tim shop/Lop Livestream/Lop Makeup), trang Shop them Tim Mau/Lo/Xuong (chi 2 file HTML, khong bump CACHE)"
            git push
          fi
---
