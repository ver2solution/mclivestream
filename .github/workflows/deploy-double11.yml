name: Deploy Double 11

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giai nen double11-v1.zip
        run: |
          test -f double11-v1.zip
          unzip -o double11-v1.zip
          ls -l bai-viet/1995-ty-dong-1-ngay-double-11-2026-shop-tu-live-chiem-62-gmv-livestream.html images/bai-viet/1995-ty-dong-1-ngay-double-11-2026-shop-tu-live-chiem-62-gmv-livestream-hero.jpg images/bai-viet/1995-ty-dong-1-ngay-double-11-2026-shop-tu-live-chiem-62-gmv-livestream-hero-og.jpg js/data.js sitemap.xml

      - name: Kiem chung truoc khi commit (Node, dua vao exit code)
        run: |
          cat > /tmp/verify-double11.js <<'VERIFY_EOF'
          const fs = require('fs');
          const vm = require('vm');
          const src = fs.readFileSync('js/data.js', 'utf8');
          const ctx = { window: {} };
          vm.createContext(ctx);
          vm.runInContext(src, ctx);
          const arts = ctx.window.V20_DATA.articles;
          if (!Array.isArray(arts)) throw new Error('V20_DATA.articles khong phai mang');
          if (arts.length !== 220) throw new Error('so bai sai: ' + arts.length + ' (can 220)');
          if (!arts.some(a => a.page === 'bai-viet/1995-ty-dong-1-ngay-double-11-2026-shop-tu-live-chiem-62-gmv-livestream.html')) throw new Error('khong tim thay slug bai moi trong data.js');
          const sm = fs.readFileSync('sitemap.xml', 'utf8');
          const n = (sm.match(/<url>/g) || []).length;
          if (n !== 242) throw new Error('sitemap sai: ' + n + ' url (can 242)');
          if (!sm.includes('bai-viet/1995-ty-dong-1-ngay-double-11-2026-shop-tu-live-chiem-62-gmv-livestream.html')) throw new Error('sitemap thieu URL bai moi');
          for (const f of ['bai-viet/1995-ty-dong-1-ngay-double-11-2026-shop-tu-live-chiem-62-gmv-livestream.html','images/bai-viet/1995-ty-dong-1-ngay-double-11-2026-shop-tu-live-chiem-62-gmv-livestream-hero.jpg','images/bai-viet/1995-ty-dong-1-ngay-double-11-2026-shop-tu-live-chiem-62-gmv-livestream-hero-og.jpg']) {
            if (!fs.existsSync(f)) throw new Error('thieu file: ' + f);
          }
          console.log('KIEM CHUNG DAT: 220 bai, sitemap 242 url, du 3 file moi');
          VERIFY_EOF
          node /tmp/verify-double11.js

      - name: Commit va push
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Khong co thay doi de commit"
            exit 1
          fi
          git commit -m "deploy: Double 11 - 1995 ty dong 1 ngay, shop tu live chiem 62% GMV livestream (220 bai, 242 URL)"
          git push
