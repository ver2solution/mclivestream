name: "Deploy hang-hoa-2211 (4 bai Hang hoa 22/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-hang-hoa-2211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-hang-hoa-2211:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "07470f8fb9aa8e93517d2fdbd129c47a" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "590" || (echo "BASE DOI: data.js khong con 590 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "617" || (echo "BASE DOI: sitemap khong con 617 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip hang-hoa-2211 package
        run: |
          unzip -o mclivestream-hang-hoa-2211-deploy.zip
          echo "--- verify hang-hoa-2211 (4 bai) ---"
          for slug in banh-bao-slime-dragon-quest-familymart-256-yen den-rem-led-tiktok-shop-my-21-nghin-chiec-30-ngay leu-xong-hoi-tai-nha-nhat-ban-17780-yen do-gia-dung-ban-chay-tet-7966-ty-dong-quy-3-2026; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "621" || (echo "SAI TONG sitemap, phai 621"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "594" || (echo "SAI TONG data.js, phai 594"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-hang-hoa-2211-deploy.zip || rm -f mclivestream-hang-hoa-2211-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-hang-hoa-2026-11-22: 4 bai moi (SEO V2)"
            git push
          fi
