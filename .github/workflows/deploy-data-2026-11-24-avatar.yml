name: Deploy data 2026-11-24 avatar

on:
  push:
    paths:
      - .github/workflows/deploy-data-2026-11-24-avatar.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip data package
        run: |
          ls -l
          test -f mclivestream-data-2026-11-24-avatar-fix-deploy.zip
          unzip -o mclivestream-data-2026-11-24-avatar-fix-deploy.zip
          ls -l js/data.js images-new | head -40
      - name: Verify data package
        run: |
          set -e
          test -f js/data.js
          echo "data.js exists"
          test -f images-new/rt-27.jpg
          echo "rt-27.jpg exists"
          echo "images-total=$(ls images-new/*.jpg | grep -c .)"
          for f in cl-24 cl-25 cl-26 cl-27 cm-25 cm-26 cm-27 cm-28 em-23 em-24 em-25 em-26 em-27 lg-23 lg-25 lg-26 lg-27 lg-28 lg-29 lg-30 rt-23 rt-24 rt-25 rt-26 rt-27 rt-29; do test -f "images-new/$f.jpg" || { echo "missing images-new/$f.jpg"; exit 1; }; done
          echo "26 new images exist"
          FAC="$(grep -c '"id": "fac-' js/data.js)"
          echo "factories=$FAC"
          test "$FAC" = "437"
          KIOT="$(grep -c '"id": "kiot-' js/data.js)"
          echo "kiots=$KIOT"
          test "$KIOT" = "381"
          AV="$(grep -o 'images-new/' js/data.js | grep -c .)"
          echo "avatars=$AV"
          test "$AV" = "170"
          for f in cl-24 cl-25 cl-26 cl-27 cm-25 cm-26 cm-27 cm-28 em-23 em-24 em-25 em-26 em-27 lg-23 lg-25 lg-26 lg-27 lg-28 lg-29 lg-30 rt-23 rt-24 rt-25 rt-26 rt-27 rt-29; do grep -q "images-new/$f.jpg" js/data.js || { echo "missing avatar ref images-new/$f.jpg"; exit 1; }; done
          echo "26 new avatar refs exist"
          grep -q 'images-new/rt-27.jpg' js/data.js
          grep -q 'fac-437' js/data.js
          echo "verify OK"
      - name: Commit data to main
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy data 2026-11-24 avatar: 437 xuong, 381 kiot, 26 avatar moi (images-new/)"
          git push origin HEAD:main
