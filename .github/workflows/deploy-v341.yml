name: "Deploy v341 (sua goc v340 — .then() thay .catch() + nhan Bot)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v341.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v341:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v341 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v341-shell-1 thi da deploy roi, DUNG ---"
          if grep -q 'v341-shell-1' sw.js; then echo "v341 DA DEPLOY ROI (sw.js da co v341-shell-1) - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main 5b7bc0c — data.js/sitemap sau khi publish-drafts deploy 1 bai moi 14:47) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "916291119baf58dda94cb3a86042634f" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "448" || (echo "BASE DOI: sitemap khong con 448 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v341-deploy.zip
          echo "--- verify v341 (3 file) ---"
          test "$(unzip -l mclivestream-v341-deploy.zip | grep -cE ' (js/chat-bots\.js|js/community-chat\.js|sw\.js)$')" -eq 3 || (echo "SAI: goi v341 phai co dung 3 file (js/chat-bots.js + js/community-chat.js + sw.js)"; exit 1)
          grep -q "v341-shell-1" sw.js || (echo "SAI: sw.js phai co v341-shell-1"; exit 1)
          node --check js/chat-bots.js || (echo "SAI: chat-bots.js loi cu phap"; exit 1)
          node --check js/community-chat.js || (echo "SAI: community-chat.js loi cu phap"; exit 1)
          grep -q "p.then(function" js/chat-bots.js || (echo "SAI: chat-bots.js phai dung .then() thay .catch() (v341)"; exit 1)
          grep -q "🤖 Bot" js/community-chat.js || (echo "SAI: community-chat.js phai co nhan Bot (v341)"; exit 1)
          echo "verify OK: 3 file, sw.js v341-shell-1, JS hop le, du marker v341"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v341-deploy.zip
          git add js/chat-bots.js js/community-chat.js sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v341: sua goc v340 — recordBotTop dung .then() thay .catch() (PostgrestBuilder chi co .then, RPC khong chay, so Top dung yen); nhan Bot trong Top hien '🤖 Bot'; CACHE v341-shell-1"
            git push
          fi
