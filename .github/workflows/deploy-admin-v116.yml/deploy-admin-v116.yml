name: deploy-admin-v116
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip admin package
        run: |
          unzip -o admin-deploy-v116.zip -d .
          rm admin-deploy-v116.zip
      - name: Commit admin console
        run: |
          git config user.name "ver2solution-deploy"
          git config user.email "ver2solution@gmail.com"
          git add quan-tri.html js/admin.js sw.js
          git status --short
          git commit -m "Admin console 8 tab + chat live (deploy rieng, truoc v116)" || echo "nothing to commit"
          git push
