name: deploy-v250
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v250:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v250 package
        run: |
          unzip -o v250-n22.zip
          ls -l js/app.js sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v250 (N22)" js/app.js
          grep -Fq "data-v2s-like" js/app.js
          grep -Fq "CACHE = 'v250-shell-1'" sw.js
          node --check js/app.js
          node --check sw.js
      - name: Commit v250 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v250 N22 them nut Thich vao trang bai viet + sw.js v250-shell-1"
            git push
          fi
