name: Deploy v308-f-r2-01 (clarify news count line pinned/main split)

on:
  push:
    paths:
      - '.github/workflows/deploy-v308.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v308:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v308 package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; bai hoc v307: KHONG guard HEAD-SHA) ---"
          if grep -q "v308 (F-R2-01" js/app.js; then echo "v308 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "7008a075a6ee42f8d8b081fa68e506d8" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "379" || (echo "BASE DOI: sitemap khong con 379 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v308-deploy.zip
          echo "--- verify v308 (1 file) ---"
          test "$(unzip -l mclivestream-v308-deploy.zip | grep -c ' js/app.js$')" -eq 1 || (echo "SAI: goi v308 phai co dung 1 file js/app.js"; exit 1)
          if unzip -l mclivestream-v308-deploy.zip | grep -q ' sw.js$'; then echo "SAI: goi v308 KHONG duoc chua sw.js"; exit 1; fi
          grep -q "v308 (F-R2-01" js/app.js || (echo "THIEU khoi v308 trong js/app.js"; exit 1)
          grep -q "bai ghim ở hàng trên" js/app.js || (echo "THIEU dong giai thich ghim/ben duoi trong js/app.js"; exit 1)
          echo "verify OK: 1 file js/app.js, dong dem giai thich tach ghim/ben duoi, quyet v238 giu nguyen"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v308-deploy.zip
          git add js/app.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v308: clarify news count line with pinned/main split (F-R2-01, test vong 3); GIU quyet v238 (dem = tong khop bo loc); data.js/sitemap khong doi (base f59bcc4 + v307)"
            git push
          fi
