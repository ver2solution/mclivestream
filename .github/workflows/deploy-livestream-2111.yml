name: "Deploy livestream-2111 (4 bai Livestream 21/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-livestream-2111.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-livestream-2111:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "cd8e127735481a4fa447f65424e84986" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "524" || (echo "BASE DOI: data.js khong con 524 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "551" || (echo "BASE DOI: sitemap khong con 551 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip livestream-2111 package
        run: |
          unzip -o mclivestream-livestream-2111-deploy.zip
          echo "--- verify livestream-2111 (4 bai) ---"
          for slug in livestream-12-12-lich-live-shopee-tiktok-2026 livestream-ban-hang-12-12-phien-live-dai-fenty-53-trieu livestream-ban-hang-tet-3-giai-doan-6-tuan cach-tang-mat-xem-livestream-live-tang-gap-doi-2026; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "555" || (echo "SAI TONG sitemap, phai 555"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "528" || (echo "SAI TONG data.js, phai 528"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-livestream-2111-deploy.zip || rm -f mclivestream-livestream-2111-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-livestream-2026-11-21: 4 bai moi (SEO V2)"
            git push
          fi
