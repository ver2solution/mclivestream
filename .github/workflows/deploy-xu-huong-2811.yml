name: Deploy articles-xu-huong-2026-11-28 (4 bai Xu huong 28/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-xu-huong-2811.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-xu-huong-2811:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "8b5bb499f40582f86fcd5b6cfaed4e16" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "865" || (echo "BASE DOI: data.js khong con 865 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "890" || (echo "BASE DOI: sitemap khong con 890 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip xu-huong-2811 package
        run: |
          test "$(stat -c %s mclivestream-xu-huong-2811-deploy.zip)" = "1855113" || (echo "SAI KICH THUOC zip tai ve, phai 1855113"; exit 1)
          unzip -o mclivestream-xu-huong-2811-deploy.zip
          echo "--- verify xu-huong-2811 (4 bai) ---"
          for slug in xu-huong-qua-tet-2027-1-mon-tot-thay-gio-qua-day-ap xu-huong-office-siren-2026-cong-so-nu-mac-dep-di-lam dress-code-cong-so-2026-nam-gioi-vest-thua-hoodie-het-thoi cyber-monday-2026-ai-mua-ho-151-ty-usd-shop-nho-lam-gi; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "894" || (echo "SAI TONG sitemap, phai 894"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "869" || (echo "SAI TONG data.js, phai 869"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-xu-huong-2811-deploy.zip || rm -f mclivestream-xu-huong-2811-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-xu-huong-2026-11-28: 4 bai Xu huong 28/11/2026 (xu huong qua Tet 2027 vong 2 deep + office siren + dress code cong so + Cyber Monday 2026 AI mua ho); SEO V2"
            git fetch origin main
            git rebase origin/main || (echo "REBASE CONFLICT: mot cron khac da deploy xong trong luc chay, DUNG LAI de rebuild"; exit 1)
            test "$(grep -c '<loc>' sitemap.xml)" = "894" || (echo "SAI TONG sitemap sau rebase, phai 894"; exit 1)
            test "$(grep -c '"page": "bai-viet/' js/data.js)" = "869" || (echo "SAI TONG data.js sau rebase, phai 869"; exit 1)
            node --check js/data.js || (echo "data.js LOI CU PHAP sau rebase"; exit 1)
            git push
          fi
