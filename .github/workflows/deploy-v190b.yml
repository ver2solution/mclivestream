name: Deploy v190b (bo doan giai thich trang chu)

on:
  push:
    paths:
      - '.github/workflows/deploy-v190b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v190b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v190b package
        run: |
          unzip -o mclivestream-v190b-deploy.zip
          echo "--- verify v190b (bo doan giai thich hero trang chu) ---"
          test -f index.html || (echo "THIEU index.html"; exit 1)
          if grep -q "108 hồ sơ thật" index.html; then echo "CON doan giai thich '108 ho so that' trong index.html"; exit 1; fi
          grep -q "SÀN MẪU LIVESTREAM" index.html || (echo "THIEU eyebrow hero"; exit 1)
          grep -q "Tìm mẫu livestream đúng tỉnh" index.html || (echo "THIEU H1 hero"; exit 1)
          grep -q "heroSearchV2" index.html || (echo "THIEU form tim kiem hero"; exit 1)
          echo "verify OK: index.html khong con doan giai thich, eyebrow + H1 + form tim kiem con nguyen"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f mclivestream-v190b-deploy.zip
          git add index.html
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v190b: bo doan giai thich '108 ho so that' khoi hero trang chu (chi index.html, khong bump CACHE)"
            git push
          fi
