name: Deploy v144 Double 11

on:
  push:
    paths:
      - '.github/workflows/deploy-v144.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v144:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v144 Double 11 package
        run: |
          unzip -o mclivestream-v144-double11-deploy.zip
          echo "--- verify v144 Double 11 ---"
          test -f "bai-viet/double-11-2025-1695-nghin-ty-ndt-livestream-chiem-bao-nhieu.html" || (echo "THIEU bai-viet Double 11"; exit 1)
          grep -q "double-11-2025-1695-nghin-ty-ndt-livestream-chiem-bao-nhieu" js/data.js || (echo "THIEU slug trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/double-11-2025-1695-nghin-ty-ndt-livestream-chiem-bao-nhieu.html</loc>" sitemap.xml || (echo "THIEU slug trong sitemap"; exit 1)
          grep -q "v144-shell-1" sw.js || (echo "THIEU v144-shell-1 trong sw.js"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"title":' js/data.js)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v144-double11-deploy.zip
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v144: bai Double 11 2025 (1.695 nghin ty NDT) + data.js + sitemap + sw.js"
            git push
          fi
