name: Deploy articles-phan-tich-2026-11-19 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-phan-tich-1911.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-phan-tich-1911:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "453" || (echo "BASE DOI: data.js khong con 453 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "479" || (echo "BASE DOI: sitemap khong con 479 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip phan-tich-1911 package
        run: |
          unzip -o mclivestream-phan-tich-1911-deploy.zip
          echo "--- verify phan-tich-1911 (4 bai moi) ---"
          for slug in luat-livestream-ban-hang-2026-phat-toi-100-trieu-dong mo-hinh-kinh-doanh-doc-la-web-xau-kiem-106-trieu-usd affiliate-marketing-la-gi-42-phan-tram-gmv-tiktok-shop-my cach-kiem-tien-tu-livestream-10-150-usd-moi-gio; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -qF "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -qF "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "483" || (echo "SAI TONG sitemap, phai 483"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "457" || (echo "SAI TONG data.js, phai 457 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-phan-tich-1911-deploy.zip || rm -f mclivestream-phan-tich-1911-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-phan-tich-2026-11-19: 4 bai (luat-livestream-ban-hang-2026-phat-toi-100-trieu-dong, mo-hinh-kinh-doanh-doc-la-web-xau-kiem-106-trieu-usd, affiliate-marketing-la-gi-42-phan-tram-gmv-tiktok-shop-my, cach-kiem-tien-tu-livestream-10-150-usd-moi-gio)"
            git push
          fi
