name: Deploy v109

on:
  push:
    paths:
      - '.github/workflows/deploy-v109.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v109:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v109 deploy package
        run: |
          unzip -o mclivestream-v109-deploy.zip
          ls -l sw.js js/reward.js js/app.js
          sha256sum sw.js js/reward.js
          grep -q "v109-shell-1" sw.js && echo "sw.js CACHE OK: v109-shell-1"
          grep -q "1 xu = 1 giờ" js/reward.js && echo "reward.js pin rate OK"
          grep -r "250 xu" js/ *.html | head -3 || echo "WARN: khong thay 250 xu"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v109: doi ten tien te 'diem' -> 'xu' (879 cho, 156 file)"
            git push
          fi
