name: Deploy data 2026-11-15 factories

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-15-factories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-15-factories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-15 factories package
        run: |
          unzip -o mclivestream-data-2026-11-15-factories-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "7530648117d591156997b737bc8df5149f10f47741646b0c89251c1ad9346569" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "236" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "287" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "112" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "280" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "200" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "300" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "301" || (echo "BAD articles parsed count"; exit 1)
          for f in images/xuong/fac-241.jpg images/xuong/fac-242.jpg images/xuong/fac-243.jpg images/xuong/fac-244.jpg images/xuong/fac-245.jpg images/xuong/fac-246.jpg images/xuong/fac-247.jpg images/xuong/fac-248.jpg images/xuong/fac-249.jpg images/xuong/fac-250.jpg images/xuong/fac-251.jpg images/xuong/fac-252.jpg images/xuong/fac-253.jpg images/xuong/fac-254.jpg images/xuong/fac-255.jpg images/xuong/fac-256.jpg images/xuong/fac-257.jpg images/xuong/fac-258.jpg images/xuong/fac-259.jpg images/xuong/fac-260.jpg images/xuong/fac-261.jpg images/xuong/fac-262.jpg images/xuong/fac-263.jpg images/xuong/fac-277.jpg images/xuong/fac-278.jpg images/xuong/fac-279.jpg images/xuong/fac-280.jpg; do test -f "$f" || (echo "MISSING $f"; exit 1); done
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/xuong/fac-241.jpg images/xuong/fac-242.jpg images/xuong/fac-243.jpg images/xuong/fac-244.jpg images/xuong/fac-245.jpg images/xuong/fac-246.jpg images/xuong/fac-247.jpg images/xuong/fac-248.jpg images/xuong/fac-249.jpg images/xuong/fac-250.jpg images/xuong/fac-251.jpg images/xuong/fac-252.jpg images/xuong/fac-253.jpg images/xuong/fac-254.jpg images/xuong/fac-255.jpg images/xuong/fac-256.jpg images/xuong/fac-257.jpg images/xuong/fac-258.jpg images/xuong/fac-259.jpg images/xuong/fac-260.jpg images/xuong/fac-261.jpg images/xuong/fac-262.jpg images/xuong/fac-263.jpg images/xuong/fac-277.jpg images/xuong/fac-278.jpg images/xuong/fac-279.jpg images/xuong/fac-280.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-15 factories: 280 xuong (40 moi fac-241..fac-280, 27 anh moi), 236 mau / 287 shop / 112 lo / 200 kiot / 301 bai viet"
            git push
          fi
