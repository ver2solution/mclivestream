name: Deploy data 2026-11-14

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-14:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-14 package
        run: |
          unzip -o mclivestream-data-2026-11-14-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '\"id\": \"th-' js/data.js)"
          echo "shops: $(grep -c '\"id\": \"sh-' js/data.js)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-14: 230 mau / 270 shop (11 mau moi th-243..th-253 + 20 shop moi sh-253..sh-272; 5 muc moi giu nguyen 11/muc)"
            git push
          fi
