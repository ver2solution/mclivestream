name: Deploy v210 (chuyen danh muc theo tieu de menu, tach nut bo loc)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v210:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giai nen v210.zip
        run: |
          unzip -o v210.zip

      - name: Chay test v210
        run: node tests/test-v210-move-cats.mjs

      - name: Commit file da deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "v210: chuyen danh muc theo tieu de menu, tach nut bo loc"
            git push
          fi
