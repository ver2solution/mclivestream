name: Deploy v271 (F-R2-08b)

on:
  push:
    paths:
      - '.github/workflows/deploy-v271-f-r2-08b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v271-f-r2-08b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v271-f-r2-08b package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v271-f-r2-08b-deploy.zip
          echo "--- verify v271 (F-R2-08b) ---"
          node --check js/app.js || (echo "SYNTAX FAIL js/app.js"; exit 1)
          node --check sw.js || (echo "SYNTAX FAIL sw.js"; exit 1)
          grep -m1 "v271-shell-1" sw.js
          grep -m1 "v271 (F-R2-08b" js/app.js
          grep -m1 "f.moq === MISSING_META" js/app.js
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum js/app.js sw.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v271-f-r2-08b-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v271: F-R2-08b facMatches nhanh MISSING_META cho f.moq (bo loc trang Xuong), sw.js v271-shell-1"
            git push
          fi
