# Deploy #74 game-entry sweep 20261126 — go nut game-entry khoi 828 file HTML
# (rebase tu live 355bb56, 26/11; sinh bang tools/gen-game-entry-removal.mjs)
# Giai nen ZIP goc repo -> 828 file HTML -> commit len nhanh deploy -> PR merge vao main
# HTML la network-first nen KHONG bump CACHE (sw.js khong doi).
name: Deploy game sweep 20261126

on:
  push:
    branches: [deploy/game-sweep-20261126]
    paths:
      - mclivestream-game-sweep-20261126.zip
      - .github/workflows/deploy-game-sweep-20261126.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-game-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: deploy/game-sweep-20261126
          fetch-depth: 0

      - name: Unzip sweep package
        run: |
          ZIP=mclivestream-game-sweep-20261126.zip
          test -f "$ZIP" || { echo "Khong tim thay $ZIP"; exit 1; }
          COUNT=$(unzip -l "$ZIP" | awk 'NR>3 && $4 != "" && $4 !~ /\/$/ {n++} END {print n+0}')
          echo "So file trong ZIP: $COUNT"
          test "$COUNT" -eq 828 || { echo "ZIP phai co dung 828 file"; exit 1; }
          unzip -o "$ZIP"
          # Khong con chuoi game-entry trong bat ky file HTML nao
          LEFTOVER=$(grep -rl "game-entry" --include="*.html" --exclude-dir=.git . || true)
          if [ -n "$LEFTOVER" ]; then
            echo "CON game-entry trong HTML sau giai nen:"
            echo "$LEFTOVER"
            exit 1
          fi
          echo "0 game-entry trong HTML — OK"
          # Khong file HTML nao bi rong sau khi go dong
          EMPTY=$(find . -path ./.git -prune -o -name "*.html" -size 0 -print | head -5)
          if [ -n "$EMPTY" ]; then
            echo "File HTML rong:"
            echo "$EMPTY"
            exit 1
          fi
          echo "Verify OK: 828 file, 0 game-entry, 0 file rong"

      - name: Commit sweep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -10
          git diff --cached --stat | tail -3
          if git diff --cached --quiet; then
            echo "Khong co thay doi de commit"
          else
            git commit -m "#74: go nut game-entry khoi 828 file HTML (828 anchor chet: truyenthuaphatphap 245, pages-dev 499, noi-duong-tam 84; 5548 dong) — rebase tu live 355bb56 (26/11)"
            git push origin deploy/game-sweep-20261126
          fi
