name: "Deploy v377 (B-20261120-04 form ho so shop het trong ~10s — defer)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v377.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v377:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v377 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v377-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF 'v377-shell-1' sw.js; then echo "v377 DA DEPLOY ROI (sw.js da co v377-shell-1) - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main f99d7de) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "7bcd6aaa2b3f7069f6d8e2100a6ac48e" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "544" || (echo "BASE DOI: sitemap khong con 544 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v377-deploy.zip
          echo "--- verify v377 (2 file doi) ---"
          for f in danh-sach-mau.html sw.js; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "const CACHE = 'v377-shell-1'" sw.js || (echo "SAI: sw.js phai co const CACHE v377-shell-1"; exit 1)
          if grep -qF "const CACHE = 'v376-shell-1'" sw.js; then echo "SAI: sw.js van dung CACHE cu v376-shell-1"; exit 1; fi
          node --check sw.js || (echo "SAI: sw.js loi cu phap"; exit 1)
          grep -qF 'js/data.js" defer' danh-sach-mau.html || (echo "SAI: danh-sach-mau.html phai co data.js defer (B-04)"; exit 1)
          grep -qF 'js/app.js" defer' danh-sach-mau.html || (echo "SAI: danh-sach-mau.html phai co app.js defer (B-04)"; exit 1)
          grep -qF 'js/ticker.js" defer' danh-sach-mau.html || (echo "SAI: danh-sach-mau.html phai co ticker.js defer (B-04)"; exit 1)
          echo "--- guard hoi quy v375 (res.data phai con) ---"
          grep -qF "res.data" nguoi-dung.html || (echo "SAI: nguoi-dung.html mat res.data (v375)"; exit 1)
          echo "--- guard hoi quy v374 (refreshList + scrollToCommentHash phai con) ---"
          grep -qF "refreshList" js/comments.js || (echo "SAI: js/comments.js mat refreshList (v374)"; exit 1)
          grep -qF "scrollToCommentHash" js/comments.js || (echo "SAI: js/comments.js mat scrollToCommentHash (v370)"; exit 1)
          echo "--- guard hoi quy v372 (linkifyText phai con) ---"
          grep -qF "linkifyText" js/chat-page.js || (echo "SAI: js/chat-page.js mat linkifyText (v372)"; exit 1)
          grep -qF "linkifyText" js/community-chat.js || (echo "SAI: js/community-chat.js mat linkifyText (v372)"; exit 1)
          echo "verify OK: 2 file, sw.js v377-shell-1, defer x3 + hoi quy du"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v377-deploy.zip
          git add danh-sach-mau.html sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v377: B-20261120-04 form ho so shop het trong ~10s — defer data.js/app.js/ticker.js (danh-sach-mau.html); CACHE v377-shell-1 (rebase tu f99d7de)"
            git push
          fi
