name: Deploy data 2026-11-27 factories

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-27-factories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-27-factories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard live data.js unchanged (v233/v234)
        run: |
          curl -s -o /tmp/live-data.js https://vieclamlivestream.online/js/data.js
          LIVE_SHA="$(sha256sum /tmp/live-data.js | cut -d' ' -f1)"
          echo "live sha: $LIVE_SHA"
          test "$LIVE_SHA" = "cb03b1e9c26d5f5609b7e7e1703ad76b46ce984e2e4396846136c98f4fcff34e" || (echo "LIVE CHANGED since staging base — STOP, rebase first"; exit 1)
      - name: Unzip data 2026-11-27 factories package
        run: |
          unzip -o mclivestream-data-2026-11-27-factories-deploy.zip
          ls -l js/data.js images/xuong/fac-448.jpg
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "d9ff2f7180a7e37f65f76cd07fb36300e5dfb7ad2145489fd501201681074a9e" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "258" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "327" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "341" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "452" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "387" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "800" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "801" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/xuong/fac-448.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-27 factories: 452 xuong (5 moi fac-448..fac-452, 1 anh fac-448 Yi Da), 258 mau / 327 shop / 341 lo / 387 kiot / 801 bai viet"
            git push
          fi
