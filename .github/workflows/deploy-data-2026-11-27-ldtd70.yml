name: Deploy data 2026-11-27 ldtd-70

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-27-ldtd70.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-27-ldtd70:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard live data.js unchanged (v233/v234)
        run: |
          curl -s -o /tmp/live-data.js https://vieclamlivestream.online/js/data.js
          LIVE_SHA="$(sha256sum /tmp/live-data.js | cut -d' ' -f1)"
          echo "live sha: $LIVE_SHA"
          test "$LIVE_SHA" = "d1e89835e2ef49b54b0495bcada207407c44d51cfea08d463a681f7a682856bb" || (echo "LIVE CHANGED since staging base 8d6d38d — STOP, rebase first (copy base moi vao data-live-base.js + chay lai insert-ldtd70-2026-11-27.js)"; exit 1)
      - name: Unzip data 2026-11-27 ldtd-70 package
        run: |
          unzip -o mclivestream-data-2026-11-27-ldtd70-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "9fb4bf25a8f474702a497f6839e33a5b89a71e25b55022518a60185b22226e23" || (echo "BAD data.js sha256"; exit 1)
          test "$(grep -c '"id": "fl-' js/data.js)" = "112" || (echo "BAD freelanceJobs count"; exit 1)
          test "$(grep -c '"id": "fp-' js/data.js)" = "19" || (echo "BAD freelancePeople count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.freelanceJobs.length)")" = "112" || (echo "BAD jobs parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-27 ldtd-70: 112 viec / 19 nguoi (fl-053..112, fp-010..019), base 8d6d38d"
            git push
          fi
