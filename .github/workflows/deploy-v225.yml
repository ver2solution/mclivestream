name: deploy-v225
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v225:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v225 package
        run: |
          unzip -o v225.zip
          ls -l v20.css sw.js
          sha256sum v20.css sw.js
      - name: Verify package contents
        run: |
          set -e
          test "$(sha256sum v20.css | cut -d' ' -f1)" = "6eea77e8fd039b80e3f78942f3268bc72a988121cc2777915abdb11f47b96a92"
          test "$(sha256sum sw.js | cut -d' ' -f1)" = "06aefc10f30161d132468ad02a85366cd4e10fab83b5b5fad7678e58577edd7a"
          grep -Fq ".btn[hidden], .lot-more[hidden]{display:none}" v20.css
          grep -Fq "v225" v20.css
          grep -Fq "v225-shell-1" sw.js
      - name: Commit v225 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add v20.css sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v225 nut [hidden] that su an (L3 Kiot + L7 Tai them); v20.css + sw.js CACHE v225-shell-1"
            git push
          fi
