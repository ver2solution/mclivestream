name: Deploy data 2026-11-27 rebased

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-27-rebased.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-27-rebased:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard live data.js unchanged (v233/v234)
        run: |
          curl -s -o /tmp/live-data.js https://vieclamlivestream.online/js/data.js
          LIVE_SHA="$(sha256sum /tmp/live-data.js | cut -d' ' -f1)"
          echo "live sha: $LIVE_SHA"
          test "$LIVE_SHA" = "1e1010b2cd6f7b589eced890a3e5def7ce301951b176f7243562aa69e0f194f6" || (echo "LIVE CHANGED since staging base f3c438d0 — STOP, rebase first"; exit 1)
      - name: Unzip data 2026-11-27 rebased package
        run: |
          unzip -o mclivestream-data-2026-11-27-rebased-deploy.zip
          ls -l js/data.js images/th-285.jpg
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "d1e89835e2ef49b54b0495bcada207407c44d51cfea08d463a681f7a682856bb" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "263" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "332" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "341" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "452" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "387" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "800" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "801" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/th-285.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-27 rebased: 263 mau / 332 shop / 452 xuong / 15 cat moi (th-285..289, sh-331..335), rebase tu f3c438d0"
            git push
          fi
