name: deploy-v274
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v274:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v274 package
        run: |
          unzip -o v274-lich-sale.zip
          ls -l index.html
      - name: Verify package contents
        run: |
          set -e
          grep -Fq 'id="saleCalendar"' index.html
          grep -Fq 'v274-lich-sale' index.html
          grep -Fq 'data-track="lich-sale-moc-15-11"' index.html
          grep -Fq 'data-track="lich-sale-moc-12-12"' index.html
          if grep -Fq 'data-track="cong-cu-tinh-lai"' index.html; then echo "FAIL: nut 11.11 van con"; exit 1; fi
      - name: Commit v274 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add index.html
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v274 khoi Lich sale trang chu (index.html)"
            git push
          fi
