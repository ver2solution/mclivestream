name: Deploy v340-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v340-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v340-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v340-drafts package
        run: |
          unzip -o mclivestream-v340-drafts-deploy.zip
          echo "--- verify v340-drafts (1 bai) ---"
          test -f bai-viet/livestream-gia-dinh-525-ty-dong-1-ngay-ca-nha-cung-live-xu-huong-2026.html || (echo "THIEU bai-viet/livestream-gia-dinh-525-ty-dong-1-ngay-ca-nha-cung-live-xu-huong-2026.html"; exit 1)
          grep -q "bai-viet/livestream-gia-dinh-525-ty-dong-1-ngay-ca-nha-cung-live-xu-huong-2026.html" js/data.js || (echo "THIEU livestream-gia-dinh-525-ty-dong-1-ngay-ca-nha-cung-live-xu-huong-2026 trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/livestream-gia-dinh-525-ty-dong-1-ngay-ca-nha-cung-live-xu-huong-2026.html</loc>" sitemap.xml || (echo "THIEU livestream-gia-dinh-525-ty-dong-1-ngay-ca-nha-cung-live-xu-huong-2026 trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v340-drafts-deploy.zip
          git add bai-viet/livestream-gia-dinh-525-ty-dong-1-ngay-ca-nha-cung-live-xu-huong-2026.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v340-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — livestream-gia-dinh-525-ty-dong-1-ngay-ca-nha-cung-live-xu-huong-2026"
            git push
          fi
