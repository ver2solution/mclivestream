name: "Deploy viec-lam-2811 (4 bai Viec Lam 28/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-viec-lam-2811.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-viec-lam-2811:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'viec-lam-thoi-vu-tet-livestream-5-shop-moi-tuyen-nguoi-moi' js/data.js; then echo "viec-lam-2811 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "f017ac6773189c9a87a22060373a5453" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "845" || (echo "BASE DOI: data.js khong con 845 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "870" || (echo "BASE DOI: sitemap khong con 870 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip viec-lam-2811 package
        run: |
          unzip -o mclivestream-viec-lam-2811-deploy.zip
          echo "--- verify viec-lam-2811 (4 bai) ---"
          for slug in viec-lam-thoi-vu-tet-livestream-5-shop-moi-tuyen-nguoi-moi tuyen-mau-live-ban-thoi-trang-van-phong-nam-nu host-live-my-tra-toi-100-usd-gio-lam-tu-xa mars-lego-adidas-tuyen-van-hanh-livestream-douyin; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "874" || (echo "SAI TONG sitemap, phai 874"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "849" || (echo "SAI TONG data.js, phai 849"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-viec-lam-2811-deploy.zip || rm -f mclivestream-viec-lam-2811-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-viec-lam-2026-11-28: 4 bai (viec-lam-thoi-vu-tet-livestream-5-shop-moi-tuyen-nguoi-moi, tuyen-mau-live-ban-thoi-trang-van-phong-nam-nu, host-live-my-tra-toi-100-usd-gio-lam-tu-xa, mars-lego-adidas-tuyen-van-hanh-livestream-douyin)"
            git push
          fi
