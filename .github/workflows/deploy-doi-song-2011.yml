name: Deploy doi-song-2011 (5 bai Doi Song 20/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-doi-song-2011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-doi-song-2011:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip doi-song-2011 package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong) ---"
          test "$(grep -c '"page":\s*"bai-viet/' js/data.js)" = "505" || (echo "BASE DOI: data.js khong con 505 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "532" || (echo "BASE DOI: sitemap khong con 532 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-doi-song-2011-deploy.zip
          echo "--- verify doi-song-2011 (5 bai moi) ---"
          test "$(unzip -l mclivestream-doi-song-2011-deploy.zip | grep -c ' bai-viet/.*\.html$')" -eq 5 || (echo "SAI: goi doi-song-2011 phai co dung 5 file bai-viet HTML"; exit 1)
          test "$(unzip -l mclivestream-doi-song-2011-deploy.zip | grep -c ' images/bai-viet/.*\.jpg$')" -eq 10 || (echo "SAI: goi doi-song-2011 phai co dung 10 anh"; exit 1)
          if unzip -l mclivestream-doi-song-2011-deploy.zip | grep -q ' sw.js$'; then echo "SAI: goi doi-song-2011 KHONG duoc chua sw.js"; exit 1; fi
          for slug in mua-sam-tet-thong-minh-7-cach-chi-dung-khong-hut-tien du-lich-sapa-thang-12-san-bien-may-6h30 ngu-7-tieng-moi-ngay-nghien-cuu-500000-nguoi du-lich-mot-minh-2026-39-phan-tram-di-de-gap-nguoi-moi quan-cafe-check-in-dep-chuon-chuon-phu-quoc; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "--- verify KHONG mat bai ---"
          for slug in ai-mua-sam-mua-le-2026-758-ty-usd-tro-ly-ao bitcoin-tien-sat-60000-usd-etf-rut-25-ty-usd black-friday-2026-tiktok-shop-dat-cuoc-vao-livestream cach-thanh-ly-hang-ton-kho-live-dau-gia-black-friday-2026 chi-phi-quang-cao-tet-2027-tinh-sao-cho-lai coupang-quy-3-2026-10-ty-usd-mang-moi-tang-27-phan-tram du-lich-mot-minh-2026-39-phan-tram-di-de-gap-nguoi-moi du-lich-sapa-thang-12-san-bien-may-6h30 ebay-black-friday-2026-giam-toi-70-phan-tram-hang-refurbished gia-vang-roi-xuong-3625-usd-thap-nhat-14-thang ho-so-mau-livestream khach-xem-live-nhung-khong-mua-5-diem-nghen khung-gio-vang-livestream-ban-hang-14-18h kinh-nghiem-nhap-hang-trung-quoc-2026 kinh-te-my-19-11-tang-truong-cham-gia-van-nong kohls-black-friday-2026-tuan-sale-22-28-thang-11 livestream-ban-hang-bi-bop-reach-dip-tet livestream-ban-my-pham-medicube-194-trieu-usd livestream-ban-quan-ao-comfrt-166-trieu-usd lowes-black-friday-2026-12-days-of-deals-tu-16-11 luong-thang-13-mau-livestream mat-hang-ban-chay-dip-le-2026-1283-san-pham-etsy-ban-chay-nhat matcha-nhu-cau-tang-vot-gia-tang-33-lan mua-sam-tet-thong-minh-7-cach-chi-dung-khong-hut-tien ngu-7-tieng-moi-ngay-nghien-cuu-500000-nguoi phan-tich-thi-truong-tmdt-quy-4-2026-165500-ty-dong qua-tang-trai-nghiem-2026-50-phan-tram-nguoi-mua-chon-tang-trai-nghiem qua-tet-cho-doanh-nghiep-2026 quan-cafe-check-in-dep-chuon-chuon-phu-quoc sale-cuoi-nam-2026-lich-sale-black-friday-12-12-den-tet starbucks-gacha-nhat-ban-880-yen-mo-hop-mu tam-ly-mua-sam-dip-le-2026-chi-32-phan-tram-tin-gia-cong-bang thong-ke-ho-so-moi-19-11-2026 thuong-mai-dien-tu-toan-cau-2026-688-nghin-ty-usd tuyen-mau-livestream-can-tho vi-sao-khach-mua-ngay-tren-live-bang-chung-xa-hoi xu-huong-tim-kiem-cuoi-nam-10-mon-qua-google-tim-nhieu-nhat; do
            grep -q "bai-viet/$slug.html" js/data.js || (echo "MAT BAI: $slug khong co trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "MAT BAI: $slug khong co trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"page":\s*"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" -eq 537 || (echo "SAI: sitemap phai co 537 URL (532 live + 5 bai)"; exit 1)
          test "$(grep -c '"page":\s*"bai-viet/' js/data.js)" -eq 510 || (echo "SAI: data.js phai co 510 bai (505 live + 5 bai)"; exit 1)
          echo "verify OK: 5 bai moi + data.js (510 bai) + sitemap (537 URL), 0 bai hom nay bi mat"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-doi-song-2011-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-doi-song-2026-11-20: 5 bai (mua sam Tet thong minh keyword theo mua #7 deep + du lich Sapa thang 12 + ngu 7 tieng moi ngay + du lich mot minh 2026 + cafe Chuon Chuon Phu Quoc); SEO V2"
            git push
          fi
