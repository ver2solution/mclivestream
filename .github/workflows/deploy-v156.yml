name: Deploy v156
on: push
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip deploy package
        run: |
          unzip -o mclivestream-v156-chu-ky-deploy.zip
          rm mclivestream-v156-chu-ky-deploy.zip
      - name: Commit deploy
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add -A
          git commit -m "Deploy v156: chu ky Mau 2 + link vieclamlivestream.online (162 file HTML)"
          git push
