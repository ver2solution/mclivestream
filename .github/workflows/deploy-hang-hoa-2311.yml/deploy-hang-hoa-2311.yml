---
name: "Deploy hang-hoa-2311 (4 bai Hang hoa 23/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-hang-hoa-2311.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-hang-hoa-2311:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "f5c534956791cd027ac0615885863075" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "640" || (echo "BASE DOI: data.js khong con 640 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "665" || (echo "BASE DOI: sitemap khong con 665 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip hang-hoa-2311 package
        run: |
          unzip -o mclivestream-hang-hoa-2311-deploy.zip
          echo "--- verify hang-hoa-2311 (4 bai) ---"
          for slug in soda-pizza-4-pho-mai-120-yen-cheerio may-nen-quan-ao-pocket-tips-san-bay-nhat-ban tram-dien-ecoflow-delta-4-tang-570-phan-tram-tiktok-shop-my bao-li-xi-tet-ban-online-gia-in-494-dong; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "669" || (echo "SAI TONG sitemap, phai 669"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "644" || (echo "SAI TONG data.js, phai 644"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-hang-hoa-2311-deploy.zip || rm -f mclivestream-hang-hoa-2311-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-hang-hoa-2026-11-23: 4 bai moi (SEO V2)"
            git push
          fi
---
