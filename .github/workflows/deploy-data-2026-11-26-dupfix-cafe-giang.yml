name: Deploy data 2026-11-26 dupfix-cafe-giang

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-26-dupfix-cafe-giang.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-26-dupfix-cafe-giang:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-26 dupfix-cafe-giang package
        run: |
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "70d5a1253a38d4e64c83f9800d12268a349c5905e82607fcb1a047207cd17da9" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-26-dupfix-cafe-giang.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "31da2e11ff77e3c97585c4ad563f6c8bab315104572b4d2f2b21c26adc275a52" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "cafe-giang page: $(grep -c '"page": "bai-viet/quan-cafe-check-in-dep-cafe-giang-ha-noi.html"' js/data.js)"
          echo "freelanceJobs: $(grep -c '"id":"fl-' js/data.js)"
          echo "freelancePeople: $(grep -c '"id":"fp-' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "258" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "328" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "341" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "447" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "387" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "800" || (echo "BAD articles grep count"; exit 1)
          test "$(grep -c '"page": "bai-viet/quan-cafe-check-in-dep-cafe-giang-ha-noi.html"' js/data.js)" = "1" || (echo "BAD cafe-giang count (must be 1)"; exit 1)
          test "$(grep -c '"id":"fl-' js/data.js)" = "16" || (echo "BAD freelanceJobs count"; exit 1)
          test "$(grep -c '"id":"fp-' js/data.js)" = "2" || (echo "BAD freelancePeople count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "801" || (echo "BAD articles parsed count"; exit 1)
          node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));var D=window.V20_DATA;var pages=D.articles.map(function(a){return a.page}).filter(Boolean);if(new Set(pages).size!==pages.length)throw new Error('DUP page in articles');['models','shops','lots','kiots','factories'].forEach(function(k){var ids=D[k].map(function(x){return x.id});if(new Set(ids).size!==ids.length)throw new Error('DUP id in '+k)});if(new Set(pages).size!==800)throw new Error('distinct bai-viet pages != 800');console.log('unique-page guard PASS: 800 distinct bai-viet pages, 0 dup')"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-26 dupfix cafe-giang: xoa 1 entry trung (date 2026-11-18, giu 2026-11-25), articles 801 entries / 800 unique (khop sitemap 800), 258 mau / 328 shop / 341 lo / 447 xuong / 387 kiot"
            git push
          fi
