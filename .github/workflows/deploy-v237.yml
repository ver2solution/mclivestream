name: deploy-v237
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v237:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v237 package
        run: |
          unzip -o v237.zip
          ls -l js/app.js thanh-ly-kiot.html sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "function refreshLockedCountsForCat" js/app.js
          grep -Fq "function refreshKiotCatCounts" thanh-ly-kiot.html
          grep -Fq "CACHE = 'v237-shell-1'" sw.js
          node --check js/app.js
          node --check sw.js
      - name: Commit v237 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js thanh-ly-kiot.html sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v237 F-R2-10 so dem o loc bi khoa theo muc dang chon (js/app.js + thanh-ly-kiot.html) + sw.js v237-shell-1"
            git push
          fi
