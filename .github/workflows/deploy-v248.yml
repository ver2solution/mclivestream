name: deploy-v248
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v248:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v248 package
        run: |
          unzip -o v248.zip
          ls -l quy-tac-diem-thuong.html sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "Tạm thời miễn phí" quy-tac-diem-thuong.html
          grep -Fq "không trừ xu" quy-tac-diem-thuong.html
          grep -Fq "CACHE = 'v248-shell-1'" sw.js
          if grep -Fq "trừ xu ngay khi ghim" quy-tac-diem-thuong.html; then echo "FAIL: con chu sai 'tru xu ngay khi ghim'"; exit 1; fi
          if grep -Fq "vẫn tính xu như cũ" quy-tac-diem-thuong.html; then echo "FAIL: con chu sai 'van tinh xu nhu cu'"; exit 1; fi
          node --check sw.js
      - name: Commit v248 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add quy-tac-diem-thuong.html sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v248 MC-73 sua mo ta phi ghim tren quy-tac-diem-thuong + sw.js v248-shell-1"
            git push
          fi
