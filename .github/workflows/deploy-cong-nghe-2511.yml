name: "Deploy articles-cong-nghe-2026-11-25 (4 bai)"

on:
  push:
    paths:
      - '.github/workflows/deploy-cong-nghe-2511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cong-nghe-2511:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "702" || (echo "BASE DOI: data.js khong con 702 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "724" || (echo "BASE DOI: sitemap khong con 724 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip cong-nghe-2511 package
        run: |
          unzip -o mclivestream-cong-nghe-2511-deploy.zip
          echo "--- verify cong-nghe-2511 (4 bai moi) ---"
            test -f "bai-viet/quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi.html" || (echo "THIEU bai-viet/quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi.html"; exit 1)
            test -f "images/bai-viet/quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi.jpg" || (echo "THIEU images/bai-viet/quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi.jpg"; exit 1)
            test -f "images/bai-viet/quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi-og.jpg" || (echo "THIEU images/bai-viet/quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi-og.jpg"; exit 1)
            grep -q "bai-viet/quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi.html" js/data.js || (echo "THIEU quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi.html</loc>" sitemap.xml || (echo "THIEU quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi trong sitemap"; exit 1)
            test -f "bai-viet/ai-thu-do-ao-google-try-on-thoi-trang-nu-nam.html" || (echo "THIEU bai-viet/ai-thu-do-ao-google-try-on-thoi-trang-nu-nam.html"; exit 1)
            test -f "images/bai-viet/ai-thu-do-ao-google-try-on-thoi-trang-nu-nam.jpg" || (echo "THIEU images/bai-viet/ai-thu-do-ao-google-try-on-thoi-trang-nu-nam.jpg"; exit 1)
            test -f "images/bai-viet/ai-thu-do-ao-google-try-on-thoi-trang-nu-nam-og.jpg" || (echo "THIEU images/bai-viet/ai-thu-do-ao-google-try-on-thoi-trang-nu-nam-og.jpg"; exit 1)
            grep -q "bai-viet/ai-thu-do-ao-google-try-on-thoi-trang-nu-nam.html" js/data.js || (echo "THIEU ai-thu-do-ao-google-try-on-thoi-trang-nu-nam trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/ai-thu-do-ao-google-try-on-thoi-trang-nu-nam.html</loc>" sitemap.xml || (echo "THIEU ai-thu-do-ao-google-try-on-thoi-trang-nu-nam trong sitemap"; exit 1)
            test -f "bai-viet/tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max.html" || (echo "THIEU bai-viet/tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max.html"; exit 1)
            test -f "images/bai-viet/tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max.jpg"; exit 1)
            test -f "images/bai-viet/tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max-og.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max-og.jpg"; exit 1)
            grep -q "bai-viet/tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max.html" js/data.js || (echo "THIEU tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max.html</loc>" sitemap.xml || (echo "THIEU tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max trong sitemap"; exit 1)
            test -f "bai-viet/tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao.html" || (echo "THIEU bai-viet/tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao.html"; exit 1)
            test -f "images/bai-viet/tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao.jpg"; exit 1)
            test -f "images/bai-viet/tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao-og.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao-og.jpg"; exit 1)
            grep -q "bai-viet/tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao.html" js/data.js || (echo "THIEU tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao.html</loc>" sitemap.xml || (echo "THIEU tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "728" || (echo "SAI TONG sitemap, phai 728"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "706" || (echo "SAI TONG data.js, phai 706 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Guard node-parse (bai hoc v370)
        run: |
          node -e "global.window={};const fs=require('fs');eval(fs.readFileSync('js/data.js','utf8'));const a=window.V20_DATA.articles;console.log('articles.length =',a.length);console.log('empty =',a.filter(x=>!x).length);if(a.length!==707) { console.log('SAI: articles.length phai 707'); process.exit(1); } if(a.filter(x=>!x).length){ console.log('CO EMPTY ITEM'); process.exit(1); } const want=['quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi','ai-thu-do-ao-google-try-on-thoi-trang-nu-nam','tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max','tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao']; const miss=want.filter(s=>!a.some(x=>x&&x.page==='bai-viet/'+s+'.html')); if(miss.length){ console.log('SLUG NGOAI MANG articles:', miss); process.exit(1); } console.log('node guard OK: 4 slug moi deu TRONG mang articles');"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-cong-nghe-2511-deploy.zip || rm -f mclivestream-cong-nghe-2511-deploy.zip
          git rm -q .github/workflows/deploy-cong-nghe-2511.yml || true
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-cong-nghe-2026-11-25: 4 bai (quang-cao-tiktok-shop-12-12-het-hom-nay-25-11-con-lam-duoc-gi ai-thu-do-ao-google-try-on-thoi-trang-nu-nam tiktok-shop-seller-assistant-tro-ly-ai-tu-chay-gmv-max tiktok-shop-mo-cong-khieu-nai-ban-quyen-va-doi-tai-khoan-quang-cao)"
            git fetch origin main
            git rebase origin/main || (echo "REBASE CONFLICT: mot cron khac da deploy xong trong luc chay, DUNG LAI de rebuild"; exit 1)
            test "$(grep -c '<loc>' sitemap.xml)" = "728" || (echo "SAI TONG sitemap sau rebase, phai 728"; exit 1)
            test "$(grep -c '"page": "bai-viet/' js/data.js)" = "706" || (echo "SAI TONG data.js sau rebase, phai 706"; exit 1)
            node --check js/data.js || (echo "data.js LOI CU PHAP sau rebase"; exit 1)
            git push
          fi
