name: "Deploy viec-lam-2511 (4 bai Viec Lam 25/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-viec-lam-2511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-viec-lam-2511:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'viec-lam-livestream-tet-chot-ca-12-12-hom-nay' js/data.js; then echo "viec-lam-2511 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "2282660ae0415872d7a46e2619fb299f" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "690" || (echo "BASE DOI: data.js khong con 690 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "712" || (echo "BASE DOI: sitemap khong con 712 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip viec-lam-2511 package
        run: |
          unzip -o mclivestream-viec-lam-2511-deploy.zip
          echo "--- verify viec-lam-2511 (4 bai) ---"
          for slug in viec-lam-livestream-tet-chot-ca-12-12-hom-nay tuyen-mau-live-ban-thoi-trang-nu-nam luong-host-livestream-trung-quoc-thang-11-2026 mau-live-mexico-ban-1-trieu-peso-1-phien-10-gio; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "716" || (echo "SAI TONG sitemap, phai 716"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "694" || (echo "SAI TONG data.js, phai 694"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-viec-lam-2511-deploy.zip || rm -f mclivestream-viec-lam-2511-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-viec-lam-2026-11-25: 4 bai moi (SEO V2)"
            git pull --rebase || (echo "REBASE CONFLICT - dung lai de rebuild"; exit 1)
            git push
          fi
