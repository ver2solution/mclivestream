name: Deploy v401-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v401-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v401-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v401-drafts package
        run: |
          unzip -o mclivestream-v401-drafts-deploy.zip
          echo "--- verify v401-drafts (1 bai) ---"
          test -f bai-viet/xem-nhieu-chot-don-it-black-friday-2026-giam-toi-80-van-thua-khach.html || (echo "THIEU bai-viet/xem-nhieu-chot-don-it-black-friday-2026-giam-toi-80-van-thua-khach.html"; exit 1)
          grep -q "bai-viet/xem-nhieu-chot-don-it-black-friday-2026-giam-toi-80-van-thua-khach.html" js/data.js || (echo "THIEU xem-nhieu-chot-don-it-black-friday-2026-giam-toi-80-van-thua-khach trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/xem-nhieu-chot-don-it-black-friday-2026-giam-toi-80-van-thua-khach.html</loc>" sitemap.xml || (echo "THIEU xem-nhieu-chot-don-it-black-friday-2026-giam-toi-80-van-thua-khach trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v401-drafts-deploy.zip
          git add bai-viet/xem-nhieu-chot-don-it-black-friday-2026-giam-toi-80-van-thua-khach.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v401-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — xem-nhieu-chot-don-it-black-friday-2026-giam-toi-80-van-thua-khach"
            git push
          fi
