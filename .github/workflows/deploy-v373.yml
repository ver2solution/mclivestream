name: "Deploy v373 (B-20261120-05 avatar chat thanh link ho so)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v373.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v373:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v373 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v373-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF 'v373-shell-1' sw.js; then echo "v373 DA DEPLOY ROI (sw.js da co v373-shell-1) - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main 9f1fcae) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "448e420c8ec971d8ce413104414e4a2e" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "543" || (echo "BASE DOI: sitemap khong con 543 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v373-deploy.zip
          echo "--- verify v373 (3 file doi) ---"
          for f in js/chat-page.js v20.css sw.js; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "const CACHE = 'v373-shell-1'" sw.js || (echo "SAI: sw.js phai co const CACHE v373-shell-1"; exit 1)
          if grep -qF "const CACHE = 'v372-shell-1'" sw.js; then echo "SAI: sw.js van dung CACHE cu v372-shell-1"; exit 1; fi
          node --check js/chat-page.js || (echo "SAI: js/chat-page.js loi cu phap"; exit 1)
          node --check sw.js || (echo "SAI: sw.js loi cu phap"; exit 1)
          grep -qF "chat-avatar-link" js/chat-page.js || (echo "SAI: js/chat-page.js phai co chat-avatar-link (B-05)"; exit 1)
          grep -qF "chat-avatar-link" v20.css || (echo "SAI: v20.css phai co .chat-avatar-link (B-05)"; exit 1)
          grep -qF 'href="/nguoi-dung.html?u=' js/chat-page.js || (echo "SAI: avatarHtml phai link toi /nguoi-dung.html?u="; exit 1)
          echo "--- guard hoi quy v372 (linkifyText phai con) ---"
          grep -qF "linkifyText" js/chat-page.js || (echo "SAI: js/chat-page.js mat linkifyText (v372)"; exit 1)
          grep -qF "linkifyText" js/community-chat.js || (echo "SAI: js/community-chat.js mat linkifyText (v372)"; exit 1)
          echo "verify OK: 3 file, sw.js v373-shell-1, avatar chat la link ho so"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v373-deploy.zip
          git add js/chat-page.js v20.css sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v373: B-20261120-05 avatar trong /cong-dong/chat thanh link toi ho so (js/chat-page.js avatarHtml + v20.css .chat-avatar-link); CACHE v373-shell-1 (rebase tu 9f1fcae)"
            git push
          fi
