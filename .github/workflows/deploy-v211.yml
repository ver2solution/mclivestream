name: Deploy v211

on:
  push:
    paths:
      - 'v211.zip'
      - '.github/workflows/deploy-v211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip v211 package
        run: unzip -o v211.zip

      - name: Run v211 tests
        run: node tests/test-v211-merge-switch.mjs

      - name: Commit v211 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/app.js tests/test-v211-merge-switch.mjs danh-sach-mau.html danh-sach-shop.html sw.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "v211: gop nut muc vao switch chinh 1 hang giong Kiot"
            git push
          fi
