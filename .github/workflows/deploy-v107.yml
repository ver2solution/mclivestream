name: Deploy v107

on:
  push:
    paths:
      - '.github/workflows/deploy-v107.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v107:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v107 deploy package
        run: |
          unzip -o mclivestream-v107-deploy.zip
          ls -l sw.js
          sha256sum sw.js
          grep -q "v107-shell-1" sw.js && echo "sw.js CACHE OK: v107-shell-1"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v107: bump CACHE v107-shell-1 (ép SW cài lại app.js mới, sửa kẹt cache v106)"
            git push
          fi
