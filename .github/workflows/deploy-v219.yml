name: deploy-v219
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v219 package
        run: unzip -o v219.zip
      - name: Verify package contents
        run: |
          set -e
          test -f js/online-counter.js
          test -f sw.js
          node --check js/online-counter.js
          node --check sw.js
          grep -Fq "v219-shell-1" sw.js
          grep -Fq "pointsSeq" js/online-counter.js
          grep -Fq "if (seq !== pointsSeq) return;" js/online-counter.js
      - name: Commit v219 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/online-counter.js sw.js
          git commit -m "v219: N23 popup online hien xu cu sau doi phien (doc xu co danh so thu tu)"
          git push
