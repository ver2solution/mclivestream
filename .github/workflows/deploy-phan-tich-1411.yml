---
name: Deploy articles-phan-tich-2026-11-14 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-phan-tich-1411.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-phan-tich-1411:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "227" || (echo "BASE DOI: data.js khong con 227 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "250" || (echo "BASE DOI: sitemap khong con 250 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip phan-tich-1411 package
        run: |
          unzip -o mclivestream-phan-tich-1411-deploy.zip
          echo "--- verify phan-tich-1411 (4 bai) ---"
          for slug in phan-tich-double-day-2026-1776-ty-ndt-12-12-shop-nho mo-hinh-livestream-ban-hang-my-20-ty-usd-tiktok-whatnot kinh-doanh-dropshipping-2026-my-xoa-mien-thue-800-usd ban-hang-tren-tiktok-shop-cho-nguoi-moi-malaysia-140-phan-tram; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "254" || (echo "SAI TONG sitemap, phai 254"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "231" || (echo "SAI TONG data.js, phai 231"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-phan-tich-1411-deploy.zip || rm -f mclivestream-phan-tich-1411-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-phan-tich-2026-11-14: 4 bai (phan-tich-double-day-2026, mo-hinh-livestream-ban-hang-my, kinh-doanh-dropshipping-2026, ban-hang-tren-tiktok-shop-cho-nguoi-moi)"
            git push
          fi
---
