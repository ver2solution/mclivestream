name: "Deploy doi-song-2811 (5 bai Doi Song 28/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-doi-song-2811.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-doi-song-2811:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'can-bang-lam-viec-ngay-tet-3-lich-mau-live-can-co' js/data.js; then echo "doi-song-2811 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "5dff8bd156b322dc2823a4d4584a3ac6" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "877" || (echo "BASE DOI: data.js khong con 877 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "902" || (echo "BASE DOI: sitemap khong con 902 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip doi-song-2811 package
        run: |
          unzip -o mclivestream-doi-song-2811-deploy.zip
          echo "--- verify doi-song-2811 (5 bai) ---"
          for slug in can-bang-lam-viec-ngay-tet-3-lich-mau-live-can-co small-business-saturday-2026-shop-nho-hut-118-ty-usd di-may-bay-dip-le-2026-176-trieu-khach-ve-tang-39-phan-tram du-lich-thang-12-5-diem-den-re-nhat-truoc-19-12 quan-cafe-check-in-dep-xofa-cafe-ha-noi; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "907" || (echo "SAI TONG sitemap, phai 907"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "882" || (echo "SAI TONG data.js, phai 882"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-doi-song-2811-deploy.zip || rm -f mclivestream-doi-song-2811-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-doi-song-2026-11-28: 5 bai moi (SEO V2) - can-bang-lam-viec-ngay-tet-3-lich-mau-live-can-co, small-business-saturday-2026-shop-nho-hut-118-ty-usd, di-may-bay-dip-le-2026-176-trieu-khach-ve-tang-39-phan-tram, du-lich-thang-12-5-diem-den-re-nhat-truoc-19-12, quan-cafe-check-in-dep-xofa-cafe-ha-noi"
            git push
          fi
