name: Deploy v296-fix (Winnie Tang para 3-4 + alt)

on:
  push:
    paths:
      - '.github/workflows/deploy-v296-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v296-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v296-fix package
        run: |
          unzip -o mclivestream-v296-fix-deploy.zip
          echo "--- verify v296-fix (1 file: bai Winnie Tang) ---"
          F=bai-viet/meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay.html
          test -f "$F" || (echo "THIEU $F"; exit 1)
          grep -q "niềm tin là sản phẩm đầu tiên bạn phải bán, và nó không bán được trong một buổi live.</p>" "$F" || (echo "THIEU cau gop doan 3-4"; exit 1)
          grep -q "<p><span>Bài phân tích của 36Kr gọi đây là logic cốt lõi" "$F" || (echo "THIEU doan tach 36Kr"; exit 1)
          grep -q 'alt="Winnie Tang bán trang sức livestream 595 tỷ đồng trong 2 ngày — Gala trang sức Xiaohongshu"' "$F" || (echo "THIEU alt moi"; exit 1)
          if grep -q "sản phẩm đầu tiên&amp;nbsp;" "$F"; then echo "CON dang tach doan cu"; exit 1; fi
          grep -q "bai-viet/meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay.html" js/data.js || (echo "THIEU slug trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay.html</loc>" sitemap.xml || (echo "THIEU slug trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v296-fix-deploy.zip
          git add bai-viet/meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay.html
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v296-fix: Winnie Tang tach/gop doan 3-4 + alt dung nhu Zalo dan (khong them/bot chu)"
            git push
          fi
