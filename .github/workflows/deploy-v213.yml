name: Deploy v213

on:
  push:
    paths:
      - 'v213.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v213:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v213 package
        run: |
          unzip -o v213.zip
          echo "--- verify v213 (5 files) ---"
          unzip -l v213.zip
          test -f danh-sach-shop.html || (echo "THIEU danh-sach-shop.html"; exit 1)
          test -f thanh-ly-kiot.html || (echo "THIEU thanh-ly-kiot.html"; exit 1)
          test -f js/app.js || (echo "THIEU js/app.js"; exit 1)
          test -f sw.js || (echo "THIEU sw.js"; exit 1)
          test -f tests/test-v213-lop-hoc.mjs || (echo "THIEU tests/test-v213-lop-hoc.mjs"; exit 1)
          grep -q "CACHE = 'v213-shell-1'" sw.js || (echo "SAI: sw.js chua co CACHE v213-shell-1"; exit 1)
          grep -q "refreshClassMoreBtn" js/app.js || (echo "SAI: js/app.js thieu refreshClassMoreBtn"; exit 1)
          echo "verify OK: 5 files + CACHE v213-shell-1"
      - name: Run v213 tests
        run: node tests/test-v213-lop-hoc.mjs
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add danh-sach-shop.html thanh-ly-kiot.html js/app.js sw.js tests/test-v213-lop-hoc.mjs
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "v213: lop hoc 2 hang + nut Xem them hien so luong + Ap dung loc muc moi cuon toi ket qua"
            git push
          fi
