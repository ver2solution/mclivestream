name: Deploy v440-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v440-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v440-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v440-drafts package
        run: |
          unzip -o mclivestream-v440-drafts-deploy.zip
          echo "--- verify v440-drafts (3 bai) ---"
          test -f bai-viet/livestream-buoi-trua-khung-gio-it-canh-tranh-shop-tan-dung-ra-sao.html || (echo "THIEU bai-viet/livestream-buoi-trua-khung-gio-it-canh-tranh-shop-tan-dung-ra-sao.html"; exit 1)
          grep -q "bai-viet/livestream-buoi-trua-khung-gio-it-canh-tranh-shop-tan-dung-ra-sao.html" js/data.js || (echo "THIEU livestream-buoi-trua-khung-gio-it-canh-tranh-shop-tan-dung-ra-sao trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/livestream-buoi-trua-khung-gio-it-canh-tranh-shop-tan-dung-ra-sao.html</loc>" sitemap.xml || (echo "THIEU livestream-buoi-trua-khung-gio-it-canh-tranh-shop-tan-dung-ra-sao trong sitemap"; exit 1)
          test -f bai-viet/buoi-thu-live-dau-tien-cua-mau-moi-chuan-bi-gi-de-shop-chot-nhan-viec.html || (echo "THIEU bai-viet/buoi-thu-live-dau-tien-cua-mau-moi-chuan-bi-gi-de-shop-chot-nhan-viec.html"; exit 1)
          grep -q "bai-viet/buoi-thu-live-dau-tien-cua-mau-moi-chuan-bi-gi-de-shop-chot-nhan-viec.html" js/data.js || (echo "THIEU buoi-thu-live-dau-tien-cua-mau-moi-chuan-bi-gi-de-shop-chot-nhan-viec trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/buoi-thu-live-dau-tien-cua-mau-moi-chuan-bi-gi-de-shop-chot-nhan-viec.html</loc>" sitemap.xml || (echo "THIEU buoi-thu-live-dau-tien-cua-mau-moi-chuan-bi-gi-de-shop-chot-nhan-viec trong sitemap"; exit 1)
          test -f bai-viet/tuyen-mau-live-do-gia-dung-nganh-hang-moi-noi-mau-can-biet-gi-khac-thoi-trang.html || (echo "THIEU bai-viet/tuyen-mau-live-do-gia-dung-nganh-hang-moi-noi-mau-can-biet-gi-khac-thoi-trang.html"; exit 1)
          grep -q "bai-viet/tuyen-mau-live-do-gia-dung-nganh-hang-moi-noi-mau-can-biet-gi-khac-thoi-trang.html" js/data.js || (echo "THIEU tuyen-mau-live-do-gia-dung-nganh-hang-moi-noi-mau-can-biet-gi-khac-thoi-trang trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/tuyen-mau-live-do-gia-dung-nganh-hang-moi-noi-mau-can-biet-gi-khac-thoi-trang.html</loc>" sitemap.xml || (echo "THIEU tuyen-mau-live-do-gia-dung-nganh-hang-moi-noi-mau-can-biet-gi-khac-thoi-trang trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v440-drafts-deploy.zip
          git add bai-viet/livestream-buoi-trua-khung-gio-it-canh-tranh-shop-tan-dung-ra-sao.html images/bai-viet/livestream-buoi-trua-khung-gio-it-canh-tranh-shop-tan-dung-ra-sao.jpg bai-viet/buoi-thu-live-dau-tien-cua-mau-moi-chuan-bi-gi-de-shop-chot-nhan-viec.html images/bai-viet/buoi-thu-live-dau-tien-cua-mau-moi-chuan-bi-gi-de-shop-chot-nhan-viec.jpg bai-viet/tuyen-mau-live-do-gia-dung-nganh-hang-moi-noi-mau-can-biet-gi-khac-thoi-trang.html images/bai-viet/tuyen-mau-live-do-gia-dung-nganh-hang-moi-noi-mau-can-biet-gi-khac-thoi-trang.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v440-drafts: 3 bai viet tu ban thao (Muse Zalo/admin) — livestream-buoi-trua-khung-gio-it-canh-tranh-shop-tan-dung-ra-sao, buoi-thu-live-dau-tien-cua-mau-moi-chuan-bi-gi-de-shop-chot-nhan-viec, tuyen-mau-live-do-gia-dung-nganh-hang-moi-noi-mau-can-biet-gi-khac-thoi-trang"
            git push
          fi
