name: Deploy v269 (MC-94)

on:
  push:
    paths:
      - '.github/workflows/deploy-v269-mc94.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v269-mc94:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v269-mc94 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v269-mc94-deploy.zip
          echo "--- verify v269 (MC-94) ---"
          node --check js/claim.js || (echo "SYNTAX FAIL js/claim.js"; exit 1)
          node --check sw.js || (echo "SYNTAX FAIL sw.js"; exit 1)
          grep -m1 "v269-shell-1" sw.js
          grep -m1 "v269 (MC-94" js/claim.js
          grep -m1 "v2s_signup_prefs_' + uid" js/claim.js
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum js/claim.js sw.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v269-mc94-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v269: MC-94 getUserContact uu tien phone_zalo metadata + khoa rieng v2s_signup_prefs_<uid>, sw.js v269-shell-1"
            git push
          fi
