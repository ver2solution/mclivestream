name: Deploy v132-revert-nav

on:
  push:
    paths:
      - '.github/workflows/deploy-v132-revert-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v132-revert-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v132-revert-nav package
        run: |
          unzip -o mclivestream-v132-revert-nav.zip
          echo "--- verify v132-revert-nav payload (121 files) ---"
          echo "files in zip: $(unzip -l mclivestream-v132-revert-nav.zip | tail -1)"
          grep -q "const CACHE = 'v132-shell-1';" sw.js && echo "sw.js CACHE v132-shell-1 OK"
          grep -q 'href="danh-sach-mau.html" class="">Dành cho Mẫu' index.html && echo "index nav Mau->mau.html OK"
          grep -q 'href="danh-sach-shop.html" class="">Dành cho Shop' index.html && echo "index nav Shop->shop.html OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v132-revert-nav.zip
          git add -A
          git status --short | head -60
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v132: hoan tac nav ve v130 (Dành cho Mẫu -> mau.html, Dành cho Shop -> shop.html) + bump CACHE v132"
            git push
          fi
