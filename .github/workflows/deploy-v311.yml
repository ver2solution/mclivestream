name: Deploy v311-f-r2-06 (register CTA on gioi-thieu page)

on:
  push:
    paths:
      - '.github/workflows/deploy-v311.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v311:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v311 package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; bai hoc v307: KHONG guard HEAD-SHA) ---"
          if grep -q "v311 (F-R2-06" gioi-thieu.html; then echo "v311 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "7008a075a6ee42f8d8b081fa68e506d8" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "379" || (echo "BASE DOI: sitemap khong con 379 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v311-deploy.zip
          echo "--- verify v311 (1 file) ---"
          test "$(unzip -l mclivestream-v311-deploy.zip | grep -c ' gioi-thieu.html$')" -eq 1 || (echo "SAI: goi v311 phai co dung 1 file gioi-thieu.html"; exit 1)
          if unzip -l mclivestream-v311-deploy.zip | grep -q ' sw.js$'; then echo "SAI: goi v311 KHONG duoc chua sw.js"; exit 1; fi
          grep -q "v311 (F-R2-06" gioi-thieu.html || (echo "THIEU khoi v311 trong gioi-thieu.html"; exit 1)
          grep -q 'href="dang-ky.html" data-track="dang-ky-gioi-thieu"' gioi-thieu.html || (echo "THIEU nut CTA dang ky trong gioi-thieu.html"; exit 1)
          echo "verify OK: 1 file gioi-thieu.html, nut CTA Dang ky mien phi - nhan 10 xu, nav-register khong doi"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v311-deploy.zip
          git add gioi-thieu.html
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v311: add register CTA to gioi-thieu page (F-R2-06, test vong 3); desktop truoc day khong co duong dang ky nhin thay (nav-register an theo v90); data.js/sitemap khong doi (base f59bcc4 + v307 + v308 + v309 + v310)"
            git push
          fi
