name: Deploy data 2026-11-19 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-19-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-19-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-19 lots package
        run: |
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "6aa7352c15cc5d4794f10505f77e084f51dff9d054bb614ad91037b173bffe76" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-19-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "8e300fd4f14524849b97ad7bc5abd56cf7ce8c25fe163abb00e2677f2e87c50a" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          for f in lot-228 lot-229 lot-233 lot-234 lot-235 lot-237 lot-238 lot-239 lot-240 lot-241 lot-242 lot-243 lot-244 lot-245 lot-246 lot-247 lot-248 lot-249 lot-250 lot-251 lot-252 lot-253 lot-254 lot-255 lot-256; do ls -l images/lo/$f.jpg; done
          test "$(grep -c '"id": "th-' js/data.js)" = "238" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "299" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "266" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "407" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "363" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "467" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "468" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-228.jpg images/lo/lot-229.jpg images/lo/lot-233.jpg images/lo/lot-234.jpg images/lo/lot-235.jpg images/lo/lot-237.jpg images/lo/lot-238.jpg images/lo/lot-239.jpg images/lo/lot-240.jpg images/lo/lot-241.jpg images/lo/lot-242.jpg images/lo/lot-243.jpg images/lo/lot-244.jpg images/lo/lot-245.jpg images/lo/lot-246.jpg images/lo/lot-247.jpg images/lo/lot-248.jpg images/lo/lot-249.jpg images/lo/lot-250.jpg images/lo/lot-251.jpg images/lo/lot-252.jpg images/lo/lot-253.jpg images/lo/lot-254.jpg images/lo/lot-255.jpg images/lo/lot-256.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-19 lots: 266 lo (40 lo moi lot-227..266: A10 VOZ/OTOFUN + B10 YouTube + C10 Cho Tot/web + D10 dong cua FB; nhom 1: 2, nhom 2: 1, nhom 3: 37; 25 anh moi; sua lot-239 ngay 15/11->16/11, lot-249 prov Binh Duong->TP.HCM), 238 mau / 299 shop / 407 xuong / 363 kiot / 468 bai viet"
            git push
          fi
