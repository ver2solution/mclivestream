name: "Deploy v325 (bot tom tat tin khung chat + doi vi tri Tin tuc)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v325.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v325:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v325 package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; bai hoc v307: KHONG guard HEAD-SHA; bai hoc v305: dem bang grep -o | wc -l, KHONG grep -c; so sanh so bang -eq) ---"
          grep -q 'v325-shell-1' sw.js && (echo "v325 DA DEPLOY ROI - dung"; exit 1) || true
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "828bc91f10da5a88eda42686f77ac3e2" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -o '<loc>' sitemap.xml | wc -l)" -eq 392 || (echo "BASE DOI: sitemap khong con 392 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v325-deploy.zip
          echo "--- verify v325 (26 files) ---"
          test "$(unzip -l mclivestream-v325-deploy.zip | grep -cE ' (index\.html|js/community-chat\.js|js/chat-bots\.js|sw\.js|trang-cua-toi\.html|v20\.css)$')" -eq 6 || (echo "SAI: goi v325 phai co dung 6 file code"; exit 1)
          test "$(unzip -l mclivestream-v325-deploy.zip | grep -cE ' images/bots/bot-[0-9]+\.png$')" -eq 20 || (echo "SAI: goi v325 phai co dung 20 avatar bot"; exit 1)
          grep -q "v325-shell-1" sw.js || (echo "SAI: sw.js phai co v325-shell-1"; exit 1)
          grep -q "js/chat-bots.js" index.html || (echo "SAI: index.html phai nap js/chat-bots.js"; exit 1)
          grep -q "chat-bot-note" index.html || (echo "SAI: index.html phai co dong chu nho bot-note"; exit 1)
          grep -q "id=\"chat-cong-dong\"" index.html || (echo "SAI: index.html phai giu muc chat"; exit 1)
          grep -q "id=\"lo-trinh\"" index.html || (echo "SAI: index.html phai giu muc Tin moi"; exit 1)
          grep -q "id=\"bot-tom-tat\"" trang-cua-toi.html || (echo "SAI: trang-cua-toi.html phai co muc chon chu de bot"; exit 1)
          grep -q "V2SChatBots" js/community-chat.js || (echo "SAI: js/community-chat.js phai hook repaint bot"; exit 1)
          grep -q "BOT_INTERVAL_MS = 5000" js/chat-bots.js || (echo "SAI: js/chat-bots.js phai co chu ky 5 giay"; exit 1)
          test "$(grep -o 'bot-[0-9]*\.png' js/chat-bots.js | sort -u | wc -l)" -eq 20 || (echo "SAI: js/chat-bots.js phai dinh nghia du 20 bot"; exit 1)
          grep -q "chat-input.*margin-top:auto" v20.css || (echo "SAI: v20.css phai co chat-input margin-top:auto (login xuong day)"; exit 1)
          grep -q "chat-msg-bot" v20.css || (echo "SAI: v20.css phai co style tin bot"; exit 1)
          echo "verify OK: 26 files, v325 co mat, bot 20 + 7 chu de + 5 giay/tin, Tin tuc duoi chat, login xuong day, data.js/sitemap khong doi"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v325-deploy.zip
          git add index.html js/community-chat.js js/chat-bots.js images/bots/ sw.js trang-cua-toi.html v20.css
          git status --short | head -30
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v325 (bot tom tat tin khung chat + doi vi tri Tin tuc): 20 bot AI 5 giay/tin, 7 chu de + chon/tat o Trang cua toi; Tin tuc ngay duoi chat; login xuong day khung chat; bump SW CACHE v324-shell-1 -> v325-shell-1; data.js/sitemap khong doi (base 07ecb48)"
            git push
          fi
