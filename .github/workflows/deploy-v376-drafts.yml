name: Deploy v376-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v376-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v376-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v376-drafts package
        run: |
          unzip -o mclivestream-v376-drafts-deploy.zip
          echo "--- verify v376-drafts (1 bai) ---"
          test -f bai-viet/black-friday-2026-thi-truong-nhon-nhip-khap-the-gioi.html || (echo "THIEU bai-viet/black-friday-2026-thi-truong-nhon-nhip-khap-the-gioi.html"; exit 1)
          grep -q "bai-viet/black-friday-2026-thi-truong-nhon-nhip-khap-the-gioi.html" js/data.js || (echo "THIEU black-friday-2026-thi-truong-nhon-nhip-khap-the-gioi trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/black-friday-2026-thi-truong-nhon-nhip-khap-the-gioi.html</loc>" sitemap.xml || (echo "THIEU black-friday-2026-thi-truong-nhon-nhip-khap-the-gioi trong sitemap"; exit 1)
          grep -q "v376-shell-1" sw.js || (echo "THIEU v376-shell-1 trong sw.js"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v376-drafts-deploy.zip
          git add bai-viet/black-friday-2026-thi-truong-nhon-nhip-khap-the-gioi.html js/data.js sitemap.xml sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v376-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — black-friday-2026-thi-truong-nhon-nhip-khap-the-gioi"
            git push
          fi
