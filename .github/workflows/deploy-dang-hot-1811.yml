            test -f "images/bai-viet/shopee-11-11-pha-ky-luc-live-tang-5-lan-sale-toi-17-11-og.jpg" || (echo "THIEU images/bai-viet/shopee-11-11-pha-ky-luc-live-tang-5-lan-sale-toi-17-11-og.jpg"; exit 1)
