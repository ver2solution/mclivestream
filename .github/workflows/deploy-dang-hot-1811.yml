name: Deploy articles-dang-hot-2026-11-18 (8 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-dang-hot-1811.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-dang-hot-1811:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "411" || (echo "BASE DOI: data.js khong con 411 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "437" || (echo "BASE DOI: sitemap khong con 437 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          for slug in xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don shopee-11-11-pha-ky-luc-live-tang-5-lan-sale-toi-17-11 shein-black-friday-giam-toi-95-phan-tram-live-15-gio temu-black-friday-giam-toi-90-phan-tram-may-lam-da-56-usd sale-12-12-shopee-live-giam-50-phan-tram-mo-ban-20h-11-12 dau-gia-live-24-gio-ky-luc-tiktok-shop-anh-115867-usd walmart-black-friday-2026-3-dot-sale-tv-128-usd best-buy-black-friday-2026-gift-card-100-usd-chi-60-usd; do
            grep -q "bai-viet/$slug.html" js/data.js && (echo "DA DEPLOY ROI: $slug da co trong data.js - DUNG LAI"; exit 1) || true
          done
      - name: Unzip dang-hot-1811 package
        run: |
          unzip -o mclivestream-v331-dang-hot-deploy.zip
          echo "--- verify dang-hot-1811 (8 bai) ---"
            test -f "bai-viet/xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don.html" || (echo "THIEU bai-viet/xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don.html"; exit 1)
            test -f "images/bai-viet/xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don.jpg" || (echo "THIEU images/bai-viet/xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don.jpg"; exit 1)
            test -f "images/bai-viet/xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don-og.jpg" || (echo "THIEU images/bai-viet/xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don-og.jpg"; exit 1)
            grep -q "bai-viet/xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don.html" js/data.js || (echo "THIEU xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don.html</loc>" sitemap.xml || (echo "THIEU xa-kho-cuoi-nam-bang-livestream-7-buoc-chot-don trong sitemap"; exit 1)
            test -f "bai-viet/shopee-11-11-pha-ky-luc-live-tang-5-lan-sale-toi-17-11.html" || (echo "THIEU bai-viet/shopee-11-11-pha-ky-luc-live-tang-5-lan-sale-toi-17-11.html"; exit 1)
