name: Deploy v125-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v125-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v125-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v125-drafts package
        run: |
          unzip -o mclivestream-v125-drafts-deploy.zip
          echo "--- verify v125-drafts (3 bai) ---"
          test -f bai-viet/meo-tang-follower-hoc-dong-vu-huy.html || (echo "THIEU bai-viet/meo-tang-follower-hoc-dong-vu-huy.html"; exit 1)
          grep -q "bai-viet/meo-tang-follower-hoc-dong-vu-huy.html" js/data.js || (echo "THIEU meo-tang-follower-hoc-dong-vu-huy trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/meo-tang-follower-hoc-dong-vu-huy.html</loc>" sitemap.xml || (echo "THIEU meo-tang-follower-hoc-dong-vu-huy trong sitemap"; exit 1)
          test -f bai-viet/quyen-leo-daily-100-ty-17-gio-livestream.html || (echo "THIEU bai-viet/quyen-leo-daily-100-ty-17-gio-livestream.html"; exit 1)
          grep -q "bai-viet/quyen-leo-daily-100-ty-17-gio-livestream.html" js/data.js || (echo "THIEU quyen-leo-daily-100-ty-17-gio-livestream trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/quyen-leo-daily-100-ty-17-gio-livestream.html</loc>" sitemap.xml || (echo "THIEU quyen-leo-daily-100-ty-17-gio-livestream trong sitemap"; exit 1)
          test -f bai-viet/ngay-mai-11-11-tiktok-shop-viet-nam-ban-913-ty-trong-1-ngay-du-lieu-double-day.html || (echo "THIEU bai-viet/ngay-mai-11-11-tiktok-shop-viet-nam-ban-913-ty-trong-1-ngay-du-lieu-double-day.html"; exit 1)
          grep -q "bai-viet/ngay-mai-11-11-tiktok-shop-viet-nam-ban-913-ty-trong-1-ngay-du-lieu-double-day.html" js/data.js || (echo "THIEU ngay-mai-11-11-tiktok-shop-viet-nam-ban-913-ty-trong-1-ngay-du-lieu-double-day trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/ngay-mai-11-11-tiktok-shop-viet-nam-ban-913-ty-trong-1-ngay-du-lieu-double-day.html</loc>" sitemap.xml || (echo "THIEU ngay-mai-11-11-tiktok-shop-viet-nam-ban-913-ty-trong-1-ngay-du-lieu-double-day trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v125-drafts-deploy.zip
          git add bai-viet/meo-tang-follower-hoc-dong-vu-huy.html bai-viet/quyen-leo-daily-100-ty-17-gio-livestream.html bai-viet/ngay-mai-11-11-tiktok-shop-viet-nam-ban-913-ty-trong-1-ngay-du-lieu-double-day.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v125-drafts: 3 bai viet tu ban thao (Muse Zalo/admin) — meo-tang-follower-hoc-dong-vu-huy, quyen-leo-daily-100-ty-17-gio-livestream, ngay-mai-11-11-tiktok-shop-viet-nam-ban-913-ty-trong-1-ngay-du-lieu-double-day"
            git push
          fi
