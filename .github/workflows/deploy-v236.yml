name: deploy-v236
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v236:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v236 package
        run: |
          unzip -o v236.zip
          ls -l js/search.js sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "'lop-makeup': {label: 'Lớp Makeup'" js/search.js
          grep -Fq "CACHE = 'v236-shell-1'" sw.js
          node --check js/search.js
          node --check sw.js
      - name: Commit v236 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/search.js sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v236 S1-1 sua nhan tim kiem 'lop-makeup' (js/search.js) + sw.js v236-shell-1"
            git push
          fi
