name: Deploy articles-dang-hot-2026-11-15 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-dang-hot-1511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-dang-hot-1511:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "282" || (echo "BASE DOI: data.js khong con 282 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "308" || (echo "BASE DOI: sitemap khong con 308 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip dang-hot-1511 package
        run: |
          unzip -o mclivestream-dang-hot-1511-deploy.zip
          echo "--- verify dang-hot-1511 (4 bai) ---"
          for slug in cach-thanh-ly-hang-ton-kho-ban-si-ky-gui-dau-gia hang-ton-kho-gia-re-mua-o-dau-tranh-lua-dao sale-12-12-shopee-lazada-tiktok-shop-giam-gia tiktok-shop-black-friday-2026-live-tang-84-phan-tram-phi; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "312" || (echo "SAI TONG sitemap, phai 312"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "286" || (echo "SAI TONG data.js, phai 286 bai-viet page"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-dang-hot-1511-deploy.zip || rm -f mclivestream-dang-hot-1511-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-dang-hot-2026-11-15: 4 bai (cach-thanh-ly-hang-ton-kho-ban-si-ky-gui-dau-gia, hang-ton-kho-gia-re-mua-o-dau-tranh-lua-dao, sale-12-12-shopee-lazada-tiktok-shop-giam-gia, tiktok-shop-black-friday-2026-live-tang-84-phan-tram-phi)"
            git push
          fi
