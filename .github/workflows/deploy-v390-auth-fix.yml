name: Deploy v390-auth-fix (dang ky/dang nhap + UX)

on:
  push:
    paths:
      - '.github/workflows/deploy-v390-auth-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v390-auth-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v390-auth-fix package
        run: |
          unzip -o mclivestream-v390-auth-fix-deploy.zip
          echo "--- verify v390-auth-fix (P1-1, P2-1, P2-2, P2-4, P2-6, P2-8) ---"
          test -f js/community-chat.js || (echo "THIEU js/community-chat.js"; exit 1)
          test -f index.html || (echo "THIEU index.html"; exit 1)
          test -f dang-ky.html || (echo "THIEU dang-ky.html"; exit 1)
          test -f sitemap.xml || (echo "THIEU sitemap.xml"; exit 1)
          test -f js/activation.js || (echo "THIEU js/activation.js"; exit 1)
          test -f sw.js || (echo "THIEU sw.js"; exit 1)
          grep -q "dang-nhap.html?next=index.html" js/community-chat.js || (echo "THIEU P1-1 trong community-chat.js"; exit 1)
          grep -q 'href="dang-nhap.html?next=index.html">Đăng nhập' index.html || (echo "THIEU P1-1 trong index.html"; exit 1)
          grep -q 'href="dang-ky.html?type=model"' index.html || (echo "THIEU P2-2 trong index.html"; exit 1)
          grep -q "Tạo trong 5 phút" index.html || (echo "THIEU P2-4 trong index.html"; exit 1)
          grep -q "tạo hồ sơ trong 5 phút" js/activation.js || (echo "THIEU P2-4 trong activation.js"; exit 1)
          grep -q "V2SAuthUI && typeof" dang-ky.html || (echo "THIEU P2-1 trong dang-ky.html"; exit 1)
          grep -q "heroCta.hidden = true" js/activation.js || (echo "THIEU P2-8 trong activation.js"; exit 1)
          grep -q "v390-shell-1" sw.js || (echo "THIEU CACHE v390-shell-1 trong sw.js"; exit 1)
          if grep -q "vieclamlivestream.online/dang-ky.html</loc>" sitemap.xml; then echo "THUA dang-ky.html trong sitemap"; exit 1; fi
          if grep -q "vieclamlivestream.online/dang-nhap.html</loc>" sitemap.xml; then echo "THUA dang-nhap.html trong sitemap"; exit 1; fi
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v390-auth-fix-deploy.zip
          git add js/community-chat.js index.html dang-ky.html sitemap.xml js/activation.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v390: sua loi dang ky/dang nhap + UX theo audit 13:40 (P1-1, P2-1, P2-2, P2-4, P2-6, P2-8)"
            git push
          fi
