name: Deploy v117 (temp bridge)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v117 deploy package
        run: unzip -o mclivestream-v117-deploy.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy v117: 3 trang danh-sach-lo/xuong/kiot + game/three.core.js, sw.js v117-shell-1, admin tab Viet bai GD4, sua pheu dang ky" || echo "Nothing to commit"
          git push














