name: "Fix hang-hoa-2811 restore (4 entries dropped by data deploy 784d38c0)"

on:
  push:
    paths:
      - '.github/workflows/deploy-fix-hang-hoa-2811-restore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hang-hoa-2811-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "a5ce88dbcfb6d4179cc5dcfb78f69ec4" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "869" || (echo "BASE DOI: data.js khong con 869 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "898" || (echo "BASE DOI: sitemap khong con 898 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip fix package (js/data.js only)
        run: |
          unzip -o mclivestream-hang-hoa-2811-fix-restore.zip
          echo "--- verify fix (4 entries restored) ---"
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "873" || (echo "SAI TONG data.js, phai 873"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "898" || (echo "SAI TONG sitemap, phai 898"; exit 1)
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "9cb4f5dda2af73eae7820a3bed627d22" || (echo "SAI MD5 data.js sau fix"; exit 1)
          python3 - <<'EOF'
          import re
          d = open('js/data.js', encoding='utf-8').read()
          for slug in ['dac-san-vung-mien-tet-livestream-htx-chuan-bi-hang','blazer-nu-van-phong-ban-chay-5-kieu-shop-nen-nhap','suit-nam-van-phong-ban-chay-amazon-gia-55-usd','omusubi-family-mart-nhat-ban-4-vi-181-yen']:
              i = d.find(f'"page": "bai-viet/{slug}.html"')
              assert i > 0, f'missing {slug}'
              st = d.rfind('  {', 0, i); en = d.find('  }', i)
              assert '"date": "2026-11-28"' in d[st:en], f'{slug} date wrong'
              assert '"cat": "Hàng hoá"' in d[st:en], f'{slug} cat wrong'
              assert '"pinned": false' in d[st:en], f'{slug} pinned wrong'
          # the data deploy's new entries must survive the fix
          for m in ['th-290','th-294','sh-336','sh-340']:
              assert m in d, f'data-deploy entry lost: {m}'
          print('4/4 Hang hoa entries restored (date 2026-11-28, cat Hang hoa, pinned false); data-deploy entries th-290..294 + sh-336..340 intact')
          EOF
      - name: Commit fixed data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-hang-hoa-2811-fix-restore.zip || rm -f mclivestream-hang-hoa-2811-fix-restore.zip
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix hang-hoa-2811 restore: 4 article entries dropped by data deploy 784d38c0 (data.js only; HTML + images + sitemap were intact)"
            git push
          fi
