name: "Deploy thi-truong-2611 (4 bai Thi truong 26/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-thi-truong-2611.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-thi-truong-2611:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "32651bfa2c34c968fb93a4ec13a12c6d" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "776" || (echo "BASE DOI: data.js khong con 776 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "800" || (echo "BASE DOI: sitemap khong con 800 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip thi-truong-2611 package
        run: |
          unzip -o mclivestream-thi-truong-2611-deploy.zip
          echo "--- verify thi-truong-2611 (4 bai) ---"
          for slug in tiktok-shop-12-12-16-ngay-con-lai-shop-ban-gi thi-truong-thuc-pham-chuc-nang-shop-nho-ban-gi thuc-pham-chuc-nang-toan-cau-2026-421-ty-usd herbalife-quy-3-2026-doanh-thu-135-ty-usd-tang-6-phan-tram; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "804" || (echo "SAI TONG sitemap, phai 804"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "780" || (echo "SAI TONG data.js, phai 780"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-thi-truong-2611-deploy.zip || rm -f mclivestream-thi-truong-2611-deploy.zip
          git rm -q .github/workflows/deploy-thi-truong-2611.yml || rm -f .github/workflows/deploy-thi-truong-2611.yml
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-thi-truong-2026-11-26: 4 bai moi (SEO V2)"
            git push
          fi
