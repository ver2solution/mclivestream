name: Deploy v421-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v421-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v421-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v421-drafts package
        run: |
          unzip -o mclivestream-v421-drafts-deploy.zip
          echo "--- verify v421-drafts (2 bai) ---"
          test -f bai-viet/100-ty-trong-17-gio-bai-hoc-chon-mau-live-dung-nganh-dung-tinh.html || (echo "THIEU bai-viet/100-ty-trong-17-gio-bai-hoc-chon-mau-live-dung-nganh-dung-tinh.html"; exit 1)
          grep -q "bai-viet/100-ty-trong-17-gio-bai-hoc-chon-mau-live-dung-nganh-dung-tinh.html" js/data.js || (echo "THIEU 100-ty-trong-17-gio-bai-hoc-chon-mau-live-dung-nganh-dung-tinh trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/100-ty-trong-17-gio-bai-hoc-chon-mau-live-dung-nganh-dung-tinh.html</loc>" sitemap.xml || (echo "THIEU 100-ty-trong-17-gio-bai-hoc-chon-mau-live-dung-nganh-dung-tinh trong sitemap"; exit 1)
          test -f bai-viet/xuong-va-kiot-tuyen-mau-live-tai-cho-khac-gi-so-voi-mau-live-online.html || (echo "THIEU bai-viet/xuong-va-kiot-tuyen-mau-live-tai-cho-khac-gi-so-voi-mau-live-online.html"; exit 1)
          grep -q "bai-viet/xuong-va-kiot-tuyen-mau-live-tai-cho-khac-gi-so-voi-mau-live-online.html" js/data.js || (echo "THIEU xuong-va-kiot-tuyen-mau-live-tai-cho-khac-gi-so-voi-mau-live-online trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/xuong-va-kiot-tuyen-mau-live-tai-cho-khac-gi-so-voi-mau-live-online.html</loc>" sitemap.xml || (echo "THIEU xuong-va-kiot-tuyen-mau-live-tai-cho-khac-gi-so-voi-mau-live-online trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v421-drafts-deploy.zip
          git add bai-viet/100-ty-trong-17-gio-bai-hoc-chon-mau-live-dung-nganh-dung-tinh.html bai-viet/xuong-va-kiot-tuyen-mau-live-tai-cho-khac-gi-so-voi-mau-live-online.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v421-drafts: 2 bai viet tu ban thao (Muse Zalo/admin) — 100-ty-trong-17-gio-bai-hoc-chon-mau-live-dung-nganh-dung-tinh, xuong-va-kiot-tuyen-mau-live-tai-cho-khac-gi-so-voi-mau-live-online"
            git push
          fi
