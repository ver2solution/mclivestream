name: Deploy v138-ticker

on:
  push:
    paths:
      - '.github/workflows/deploy-v138-ticker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v138-ticker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v138 package
        run: |
          unzip -o mclivestream-v138-ticker.zip
          echo "--- verify v138 payload (6 files) ---"
          grep -q "const CACHE = 'v138-shell-1';" sw.js && echo "sw.js CACHE v138-shell-1 OK"
          for f in index.html danh-sach-mau.html danh-sach-shop.html thanh-ly-kiot.html; do
            grep -q 'class="ticker"' "$f" || { echo "LOI: $f thieu markup ticker"; exit 1; }
            grep -q 'js/ticker.js' "$f" || { echo "LOI: $f thieu script ticker.js"; exit 1; }
          done
          echo "4 trang co markup + script ticker OK"
          grep -q '.ticker{background:#fff;color:#000' v20.css && echo "v20.css co CSS ticker OK"
          grep -q '@keyframes ticker-scroll' v20.css && echo "v20.css co keyframes OK"
          grep -q "typeof window.McLivestreamAPI.fetchApprovedUserKiots === 'function'" thanh-ly-kiot.html && echo "Kiot guard v137 OK"
          grep -q 'filter-section' thanh-ly-kiot.html && echo "Kiot filter-section v137 OK"
          grep -q 'href="danh-sach-mau.html" class="">Dành cho Shop' index.html && echo "index nav Mau->Shop label OK"
          grep -q 'href="danh-sach-shop.html" class="">Dành cho Mẫu' index.html && echo "index nav Shop->Mau label OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v138-ticker.zip
          git add -A
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v138: them lai chu chay (ticker) duoi menu 4 trang + bump CACHE v138"
            git push
          fi
