name: Deploy v218-livestream (4 bai Livestream 14/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v218-livestream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v218-livestream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "223" || (echo "BASE DOI: data.js khong con 223 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "246" || (echo "BASE DOI: sitemap khong con 246 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip v218-livestream package
        run: |
          unzip -o mclivestream-v218-livestream-deploy.zip
          echo "--- verify v218-livestream (4 bai) ---"
          for slug in cach-tang-mat-xem-livestream-tet-4-don-bay-giu-nguoi-xem cach-giu-chan-nguoi-xem-livestream-90-giay-dau-quyet-dinh minigame-livestream-ban-hang-quiz-giu-nguoi-xem-gap-doi livestream-ban-do-gia-dung-157-phan-tram-double-11; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "250" || (echo "SAI TONG sitemap, phai 250"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "227" || (echo "SAI TONG data.js, phai 227"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v218-livestream-deploy.zip || rm -f mclivestream-v218-livestream-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v218-livestream: 4 bai Livestream 14/11/2026 (cach tang mat xem livestream Tet keyword #4 + cach giu chan nguoi xem + minigame + livestream ban do gia dung)"
            git push
          fi
