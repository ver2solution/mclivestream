name: Deploy v295-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v295-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v295-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v295-drafts package
        run: |
          unzip -o mclivestream-v295-drafts-deploy.zip
          echo "--- verify v295-drafts (1 bai) ---"
          test -f bai-viet/meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay.html || (echo "THIEU bai-viet/meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay.html"; exit 1)
          grep -q "bai-viet/meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay.html" js/data.js || (echo "THIEU meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay.html</loc>" sitemap.xml || (echo "THIEU meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v295-drafts-deploy.zip
          git add bai-viet/meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v295-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — meo-dat-truoc-ban-trang-suc-cao-cap-hoc-winnie-tang-595-ty-dong-2-ngay"
            git push
          fi
