name: Deploy v219-thi-truong (4 bai Thi truong 14/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v219-thi-truong.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v219-thi-truong:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "231" || (echo "BASE DOI: data.js khong con 231 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "254" || (echo "BASE DOI: sitemap khong con 254 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip v219-thi-truong package
        run: |
          unzip -o mclivestream-v219-thi-truong-deploy.zip
          echo "--- verify v219-thi-truong (4 bai) ---"
          for slug in thi-truong-livestream-viet-nam-2026-32-ty-usd shopee-quy-3-2026-gmv-39-7-ty-usd-lai-ky-luc ban-le-viet-nam-thang-10-2026-695-nghin-ty-tang-14-7-phan-tram luat-thuong-mai-dien-tu-2026-mau-live-xac-minh-danh-tinh; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "258" || (echo "SAI TONG sitemap, phai 258"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "235" || (echo "SAI TONG data.js, phai 235"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v219-thi-truong-deploy.zip || rm -f mclivestream-v219-thi-truong-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v219-thi-truong: 4 bai Thi truong 14/11/2026 (thi truong livestream VN 2026 keyword #2 + Shopee Q3 2026 + ban le T10 2026 + Luat TMDT 2026)"
            git push
          fi
