name: Deploy articles-cong-nghe-2026-11-18 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-cong-nghe-1811.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cong-nghe-1811:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "382" || (echo "BASE DOI: data.js khong con 382 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "408" || (echo "BASE DOI: sitemap khong con 408 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip cong-nghe-1811 package
        run: |
          unzip -o mclivestream-v330-cong-nghe-deploy.zip
          echo "--- verify cong-nghe-1811 (4 bai moi) ---"
            test -f "bai-viet/xac-thuc-vneid-ban-hang-online-han-31-12-2026.html" || (echo "THIEU bai-viet/xac-thuc-vneid-ban-hang-online-han-31-12-2026.html"; exit 1)
            test -f "images/bai-viet/xac-thuc-vneid-ban-hang-online-han-31-12-2026.jpg" || (echo "THIEU images/bai-viet/xac-thuc-vneid-ban-hang-online-han-31-12-2026.jpg"; exit 1)
            test -f "images/bai-viet/xac-thuc-vneid-ban-hang-online-han-31-12-2026-og.jpg" || (echo "THIEU images/bai-viet/xac-thuc-vneid-ban-hang-online-han-31-12-2026-og.jpg"; exit 1)
            grep -q "bai-viet/xac-thuc-vneid-ban-hang-online-han-31-12-2026.html" js/data.js || (echo "THIEU xac-thuc-vneid-ban-hang-online-han-31-12-2026 trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/xac-thuc-vneid-ban-hang-online-han-31-12-2026.html</loc>" sitemap.xml || (echo "THIEU xac-thuc-vneid-ban-hang-online-han-31-12-2026 trong sitemap"; exit 1)
            test -f "bai-viet/tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam.html" || (echo "THIEU bai-viet/tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam.html"; exit 1)
            test -f "images/bai-viet/tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam.jpg"; exit 1)
            test -f "images/bai-viet/tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam-og.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam-og.jpg"; exit 1)
            grep -q "bai-viet/tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam.html" js/data.js || (echo "THIEU tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam.html</loc>" sitemap.xml || (echo "THIEU tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam trong sitemap"; exit 1)
            test -f "bai-viet/tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026.html" || (echo "THIEU bai-viet/tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026.html"; exit 1)
            test -f "images/bai-viet/tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026.jpg"; exit 1)
            test -f "images/bai-viet/tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026-og.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026-og.jpg"; exit 1)
            grep -q "bai-viet/tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026.html" js/data.js || (echo "THIEU tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026 trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026.html</loc>" sitemap.xml || (echo "THIEU tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026 trong sitemap"; exit 1)
            test -f "bai-viet/nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12.html" || (echo "THIEU bai-viet/nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12.html"; exit 1)
            test -f "images/bai-viet/nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12.jpg" || (echo "THIEU images/bai-viet/nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12.jpg"; exit 1)
            test -f "images/bai-viet/nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12-og.jpg" || (echo "THIEU images/bai-viet/nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12-og.jpg"; exit 1)
            grep -q "bai-viet/nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12.html" js/data.js || (echo "THIEU nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12 trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12.html</loc>" sitemap.xml || (echo "THIEU nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12 trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "412" || (echo "SAI TONG sitemap, phai 412"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "386" || (echo "SAI TONG data.js, phai 386 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v330-cong-nghe-deploy.zip || rm -f mclivestream-v330-cong-nghe-deploy.zip
          git rm -q .github/workflows/deploy-cong-nghe-1811.yml || true
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-cong-nghe-2026-11-18: 4 bai (xac-thuc-vneid-ban-hang-online-han-31-12-2026 tiktok-shop-product-diagnosis-10-ly-do-don-hang-giam tiktok-shop-seller-ai-uoc-don-tang-black-friday-2026 nhan-ai-shopee-video-bat-truoc-khi-dang-video-12-12)"
            git push
          fi
