name: Deploy v171-gopy (them markup nut Gop y 22 bai-viet)

on:
  push:
    paths:
      - '.github/workflows/deploy-v171-gopy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v171-gopy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v171-gopy package
        run: |
          unzip -o mclivestream-v171-gopy-deploy.zip
          echo "--- verify v171-gopy ---"
          grep -q 'id="gopyFab"' bai-viet/quyen-leo-daily-100-ty-17-gio-livestream.html || (echo "THIEU gopyFab trong bai Quyen Leo"; exit 1)
          grep -q 'id="gopyFab"' bai-viet/viec-lam-mc-livestream-2026.html || (echo "THIEU gopyFab trong bai viec-lam-mc-livestream-2026"; exit 1)
          test "$(grep -L 'id="gopyFab"' bai-viet/*.html | wc -l)" -eq 0 || (echo "CO file bai-viet THIEU gopyFab"; grep -L 'id="gopyFab"' bai-viet/*.html; exit 1)
          echo "verify OK: tat ca file bai-viet deu co markup nut Gop y (khong doi sw.js)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v171-gopy-deploy.zip
          git add bai-viet/11-11-dong-nam-a-shopee-lazada-tiktok-shop.html bai-viet/11-11-toan-cau-bai-hoc-shop-viet.html bai-viet/boc-me-dong-vu-huy-163-trieu-ndt-4-gio-mo-hinh-sieu-ca-the.html bai-viet/boc-me-vo-ha-linh-237-ty-mot-phien-live-cong-thuc-chot-don.html bai-viet/cach-xa-hang-ton-kho-dang-lo-xuong-kiot.html bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html bai-viet/dich-vu-comment-seeding-livestream.html bai-viet/doanh-thu-11-11-trung-quoc-alibaba-jd-douyin.html bai-viet/doanh-thu-11-11-viet-nam-shopee-lazada-tiktok-shop.html bai-viet/double-11-2025-1695-nghin-ty-ndt-livestream-chiem-bao-nhieu.html bai-viet/khan-ve-sinh-doa-vi-800000-don-mot-dem-livestream.html bai-viet/livestream-chiem-bao-nhieu-doanh-thu-11-11.html bai-viet/luong-mau-livestream-2026.html bai-viet/mau-livestream-khong-can-kinh-nghiem.html bai-viet/mau-livestream-luong-theo-gio.html bai-viet/meo-chot-don-ngay-sale-lon-hoc-dong-vu-huy-30-phut-100000-don.html bai-viet/meo-tang-follower-hoc-dong-vu-huy.html bai-viet/ngay-mai-11-11-tiktok-shop-viet-nam-ban-913-ty-trong-1-ngay-du-lieu-double-day.html bai-viet/quy-dinh-facebook-2026-khoa-tai-khoan-cam-dang-thuat-toan-uu-tien.html bai-viet/quyen-leo-daily-100-ty-17-gio-livestream.html bai-viet/viec-lam-livestream-tai-nha.html bai-viet/viec-lam-mc-livestream-2026.html
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v171: them markup nut Gop y (button + overlay + form) cho 22 bai-viet"
            git push
          fi
