name: Deploy v128-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v128-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v128-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v128-drafts package
        run: |
          unzip -o mclivestream-v128-drafts-deploy.zip
          echo "--- verify v128-drafts (1 bai) ---"
          test -f bai-viet/boc-me-dong-vu-huy-163-trieu-ndt-4-gio-mo-hinh-sieu-ca-the.html || (echo "THIEU bai-viet/boc-me-dong-vu-huy-163-trieu-ndt-4-gio-mo-hinh-sieu-ca-the.html"; exit 1)
          grep -q "bai-viet/boc-me-dong-vu-huy-163-trieu-ndt-4-gio-mo-hinh-sieu-ca-the.html" js/data.js || (echo "THIEU boc-me-dong-vu-huy-163-trieu-ndt-4-gio-mo-hinh-sieu-ca-the trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/boc-me-dong-vu-huy-163-trieu-ndt-4-gio-mo-hinh-sieu-ca-the.html</loc>" sitemap.xml || (echo "THIEU boc-me-dong-vu-huy-163-trieu-ndt-4-gio-mo-hinh-sieu-ca-the trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v128-drafts-deploy.zip
          git add bai-viet/boc-me-dong-vu-huy-163-trieu-ndt-4-gio-mo-hinh-sieu-ca-the.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v128-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — boc-me-dong-vu-huy-163-trieu-ndt-4-gio-mo-hinh-sieu-ca-the"
            git push
          fi
