name: Deploy v150 ads.txt (AdSense)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v150-adsense-adstxt.yml'
      - 'mclivestream-v150-adsense-adstxt-deploy.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v150 package
        run: |
          set -e
          test -f mclivestream-v150-adsense-adstxt-deploy.zip
          unzip -o mclivestream-v150-adsense-adstxt-deploy.zip
          test -f ads.txt
          echo "--- ads.txt ---"
          cat ads.txt
          grep -qx 'google.com, pub-9122525620994777, DIRECT, f08c47fec0942fa0' ads.txt
          test "$(grep -c . ads.txt)" = "1"
          git status --short
      - name: Commit ads.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy v150: add ads.txt for Google AdSense (pub-9122525620994777)"
          git push
