name: Deploy data 2026-11-28 lao-dong-tu-do

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-28-lao-dong-tu-do.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-28-lao-dong-tu-do:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard main data.js unchanged (bai hoc dua deploy 26/11)
        run: |
          git fetch origin main
          MAIN_SHA="$(git show origin/main:js/data.js | sha256sum | cut -d' ' -f1)"
          echo "main sha: $MAIN_SHA"
          test "$MAIN_SHA" = "aa647fbcb8f67ec74ca5b1d9788499a5ee06b446e3a693eb243e754e2a07f2b7" || (echo "MAIN CHANGED since staging base — STOP, rebase first"; exit 1)
      - name: Guard live data.js unchanged (v233/v234)
        run: |
          curl -s -o /tmp/live-data.js https://vieclamlivestream.online/js/data.js
          LIVE_SHA="$(sha256sum /tmp/live-data.js | cut -d' ' -f1)"
          echo "live sha: $LIVE_SHA"
          test "$LIVE_SHA" = "aa647fbcb8f67ec74ca5b1d9788499a5ee06b446e3a693eb243e754e2a07f2b7" || (echo "LIVE CHANGED since staging base — STOP, rebase first"; exit 1)
      - name: Unzip data 2026-11-28 lao-dong-tu-do package
        run: |
          unzip -o mclivestream-data-2026-11-28-lao-dong-tu-do-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "3c0e379605998135ce8774746544528935aa3cb09fe9ba07a5f223a0c27c48c0" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "freelance jobs: $(grep -c '"id":"fl-' js/data.js)"
          echo "freelance people: $(grep -c '"id":"fp-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "268" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "337" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "363" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "457" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "393" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"id":"fl-' js/data.js)" = "165" || (echo "BAD freelance jobs count"; exit 1)
          test "$(grep -c '"id":"fp-' js/data.js)" = "28" || (echo "BAD freelance people count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "888" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "889" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-28 lao-dong-tu-do: +53 viec (fl-113..165) +9 nguoi (fp-020..028) = 165 viec / 28 nguoi (san-xuat 41, van-tai 35, dich-vu 41, cham-soc 14, xay-dung 21, nong-nghiep 13, ca-nhan 28), fix fl-020 salary, 268 mau / 337 shop / 363 lo / 457 xuong / 393 kiot / 889 bai viet"
            git push
          fi
