name: Deploy data 2026-11-27 kiot+lots (bu KPI)

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-27-kiot-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-27-kiot-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-27 kiot+lots package
        run: |
          # 28/11 bu KPI 27/11 (rebase tu live fcfe4344…, origin/main df11a74f v463-drafts):
          # +3 kiot (kiot-388..390) +11 lo (lot-342..352). Gop 1 goi vi 2 zip cu (24f533a0… /
          # f784769a…) deu build tren nen cb03b1e9… da het han — group-work (263 mau / 332 shop)
          # + v462 + v463 da land; day zip cu se ghi de 5 mau + 5 shop + 5 xuong + 5 bai moi.
          # Data.js moi chi them entry (diff live: 0 dong xoa, 238 dong them + 1 dong changelog).
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "fcfe43448370eab743f97572491aebaf7574a5836204f7378cd3fa6c8b588b46" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-27-kiot-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "2c493253a223cbef4f8615c63dd2f46138f09bb2468c3d95a359f9090d471789" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "kiot images: $(ls images/kiot/*.jpg | wc -l)"
          echo "lot images: $(ls images/lo/*.jpg | wc -l)"
          for f in kiot-388 kiot-389 kiot-390; do ls -l images/kiot/$f.jpg; done
          for f in lot-342 lot-343 lot-344 lot-345 lot-346 lot-347 lot-348 lot-349 lot-350 lot-351 lot-352; do ls -l images/lo/$f.jpg; done
          test "$(grep -c '"id": "th-' js/data.js)" = "263" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "332" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "352" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "452" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "390" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "805" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "806" || (echo "BAD articles parsed count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));const g={1:0,2:0,3:0};for(const l of window.V20_DATA.lots)g[l.group]++;console.log(g[1]+'/'+g[2]+'/'+g[3])")" = "38/40/274" || (echo "BAD lot groups"; exit 1)
          # Bai hoc v171: KHONG hardcode tong so file — kiem tra bat bien "0 file thieu":
          # moi img kiot trong data.js phai ton tai tren dia sau khi giai nen.
          missing=0
          for f in $(grep -o 'images/kiot/kiot-[0-9]*\.jpg' js/data.js | sort -u); do
            [ -f "$f" ] || { echo "THIEU ANH: $f"; missing=$((missing+1)); }
          done
          echo "anh kiot thieu: $missing"
          [ "$missing" -eq 0 ]
          # Luu y: KHONG kiem toan bo anh lo — 29 anh lot-149..186 thieu san tu deploy 17/11
          # (lot-149 live 404, da ghi trong kiem ke 27/11), ngoai pham vi goi bu nay.
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/kiot/kiot-388.jpg images/kiot/kiot-389.jpg images/kiot/kiot-390.jpg images/lo/lot-342.jpg images/lo/lot-343.jpg images/lo/lot-344.jpg images/lo/lot-345.jpg images/lo/lot-346.jpg images/lo/lot-347.jpg images/lo/lot-348.jpg images/lo/lot-349.jpg images/lo/lot-350.jpg images/lo/lot-351.jpg images/lo/lot-352.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-27 kiot+lots (bu KPI): 390 kiot (3 moi kiot-388..390: Sang quán cafe KDC Tân Quy Đông 360 triệu, Sang quán cafe Tây Thạnh 150 triệu, Sang quán cafe Tân Sơn Nhất 130 triệu) + 352 lo (11 moi lot-342..352, 11 YouTube g3, 11 anh moi), 263 mau / 332 shop / 452 xuong / 806 bai"
            git push
          fi
