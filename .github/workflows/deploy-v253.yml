name: deploy-v253
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v253:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v253 package
        run: |
          unzip -o v253-moi-mc-4.zip
          ls -l gioi-thieu.html sw.js images/bai-viet/gioi-thieu-ver2solution.png images/bai-viet/gioi-thieu-ver2solution-og.jpg
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "gioi-thieu-ver2solution.png" gioi-thieu.html
          grep -Fq "230 mẫu livestream" gioi-thieu.html
          grep -Fq "CACHE = 'v253-shell-1'" sw.js
      - name: Commit v253 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add gioi-thieu.html sw.js images/bai-viet/gioi-thieu-ver2solution.png images/bai-viet/gioi-thieu-ver2solution-og.jpg
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v253 MOI-MC-4 lam lai infographic gioi thieu 230/270/71/240/200 + sw.js v253-shell-1"
            git push
          fi
