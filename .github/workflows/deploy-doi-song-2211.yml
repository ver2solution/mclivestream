name: Deploy doi-song-2211 (5 bai Doi Song 22/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-doi-song-2211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-doi-song-2211:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip doi-song-2211 package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong) ---"
          test "$(grep -c '"page":\s*"bai-viet/' js/data.js)" = "598" || (echo "BASE DOI: data.js khong con 598 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "625" || (echo "BASE DOI: sitemap khong con 625 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-doi-song-2211-deploy.zip
          echo "--- verify doi-song-2211 (5 bai moi) ---"
          test "$(unzip -l mclivestream-doi-song-2211-deploy.zip | grep -c ' bai-viet/.*\.html$')" -eq 5 || (echo "SAI: goi doi-song-2211 phai co dung 5 file bai-viet HTML"; exit 1)
          test "$(unzip -l mclivestream-doi-song-2211-deploy.zip | grep -c ' images/bai-viet/.*\.jpg$')" -eq 10 || (echo "SAI: goi doi-song-2211 phai co dung 10 anh"; exit 1)
          if unzip -l mclivestream-doi-song-2211-deploy.zip | grep -q ' sw.js$'; then echo "SAI: goi doi-song-2211 KHONG duoc chua sw.js"; exit 1; fi
          for slug in nghi-tet-shop-online-7-viec-chot-truoc-tet-2027 du-lich-da-nang-thang-12-mua-nhieu-di-duoc-khong gen-z-khong-co-quy-du-phong-34-phan-tram-trang-tay ngu-bu-cuoi-tuan-co-bu-duoc-giac-ngu-thieu quan-cafe-check-in-dep-jungle-coffee-nha-trang; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "--- verify KHONG mat bai ---"
          for slug in ai-streamer-tet-giu-ca-dem-khi-mau-nghi amazon-quy-3-2026-aws-tang-39-phan-tram-loi-nhuan-ky-luc banh-bao-slime-dragon-quest-familymart-256-yen bitcoin-roi-ve-55130-usd-thap-nhat-tu-thang-9-2024 black-friday-viet-nam-2026-shop-nho-5-ngay-vang cach-tang-mat-xem-livestream-tet-5-don-bay-shopee-16-ty-luot-xem den-rem-led-tiktok-shop-my-21-nghin-chiec-30-ngay do-gia-dung-ban-chay-tet-7966-ty-dong-quy-3-2026 du-lich-da-nang-thang-12-mua-nhieu-di-duoc-khong gemini-mua-hang-thay-ban-mien-phi-tu-17-11 gen-z-khong-co-quy-du-phong-34-phan-tram-trang-tay gen-z-mua-sam-le-2026-lan-dau-chiem-mot-nua-chi-tieu gia-xang-giam-lan-5-shop-nho-tinh-lai-phi-ship hieu-ung-moi-livestream-84-phan-tram-chon-goi-dat jd-com-quy-3-2026-doanh-thu-309-ty-ndt-lai-tang-44-phan-tram ke-hoach-tai-chinh-shop-cuoi-nam-6-buoc-chot-so kich-ban-livestream-tet-120-phut-mon-moi-chu-luc-combo kuaishou-quy-3-2026-lo-959-trieu-ndt-live-giam-19-phan-tram leu-xong-hoi-tai-nha-nhat-ban-17780-yen livestream-ban-hang-hieu-qua-tokconnect-medicube-741-trieu-usd livestream-mua-sam-le-2026-tiktok-live-tang-gap-doi livestream-tiktok-ban-hang-black-friday-2026-gmv-max mau-livestream-my-pham ngan-sach-mua-sam-le-2026-nguoi-my-cat-gan-600-usd nghi-tet-shop-online-7-viec-chot-truoc-tet-2027 ngu-bu-cuoi-tuan-co-bu-duoc-giac-ngu-thieu nguoi-my-cat-ngan-sach-le-gan-600-usd-ai-mua-nhieu-hon quan-cafe-check-in-dep-jungle-coffee-nha-trang shopee-ai-livestream-4-cong-cu-shop-viet-dung shopify-quy-3-2026-gmv-119-ty-usd-doanh-thu-tang-32-phan-tram thong-ke-ho-so-moi-21-11-2026 tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien tong-ket-thi-truong-livestream-2026-my-tang-35-phan-tram tuyen-mau-live-ban-ao-dai-tet tuyen-mau-livestream-hai-phong vang-sjc-ve-1285-trieu-nguoi-mua-lo-95-trieu-luong xu-huong-thi-truong-tet-dinh-mui-51-phan-tram-chi-nhieu-hon; do
            grep -q "bai-viet/$slug.html" js/data.js || (echo "MAT BAI: $slug khong co trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "MAT BAI: $slug khong co trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"page":\s*"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" -eq 630 || (echo "SAI: sitemap phai co 630 URL (625 live + 5 bai)"; exit 1)
          test "$(grep -c '"page":\s*"bai-viet/' js/data.js)" -eq 603 || (echo "SAI: data.js phai co 603 bai (598 live + 5 bai)"; exit 1)
          echo "verify OK: 5 bai moi + data.js (603 bai) + sitemap (630 URL), 0 bai hom nay bi mat"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-doi-song-2211-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-doi-song-2026-11-22: 5 bai (nghi Tet shop online keyword theo mua #9 deep + du lich Da Nang thang 12 + Gen Z khong co quy du phong + ngu bu cuoi tuan + cafe Jungle Coffee Nha Trang); SEO V2"
            git push
          fi
