name: Deploy v392-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v392-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v392-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v392-drafts package
        run: |
          unzip -o mclivestream-v392-drafts-deploy.zip
          echo "--- verify v392-drafts (1 bai) ---"
          test -f bai-viet/douyin-double-11-2026-livestream-ban-hang-shop-tu-live-len-ngoi.html || (echo "THIEU bai-viet/douyin-double-11-2026-livestream-ban-hang-shop-tu-live-len-ngoi.html"; exit 1)
          grep -q "bai-viet/douyin-double-11-2026-livestream-ban-hang-shop-tu-live-len-ngoi.html" js/data.js || (echo "THIEU douyin-double-11-2026-livestream-ban-hang-shop-tu-live-len-ngoi trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/douyin-double-11-2026-livestream-ban-hang-shop-tu-live-len-ngoi.html</loc>" sitemap.xml || (echo "THIEU douyin-double-11-2026-livestream-ban-hang-shop-tu-live-len-ngoi trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v392-drafts-deploy.zip
          git add bai-viet/douyin-double-11-2026-livestream-ban-hang-shop-tu-live-len-ngoi.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v392-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — douyin-double-11-2026-livestream-ban-hang-shop-tu-live-len-ngoi"
            git push
          fi
