name: Deploy v392-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v392-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v392-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v392-drafts package
        run: |
          unzip -o mclivestream-v392-drafts-deploy.zip
          echo "--- verify v392-drafts (1 bai) ---"
          test -f bai-viet/la-vinh-hao-hoa-thieu-luu-dao-uong-ham-ai-thang-cuoc-dua-live-dau-2020.html || (echo "THIEU bai-viet/la-vinh-hao-hoa-thieu-luu-dao-uong-ham-ai-thang-cuoc-dua-live-dau-2020.html"; exit 1)
          grep -q "bai-viet/la-vinh-hao-hoa-thieu-luu-dao-uong-ham-ai-thang-cuoc-dua-live-dau-2020.html" js/data.js || (echo "THIEU la-vinh-hao-hoa-thieu-luu-dao-uong-ham-ai-thang-cuoc-dua-live-dau-2020 trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/la-vinh-hao-hoa-thieu-luu-dao-uong-ham-ai-thang-cuoc-dua-live-dau-2020.html</loc>" sitemap.xml || (echo "THIEU la-vinh-hao-hoa-thieu-luu-dao-uong-ham-ai-thang-cuoc-dua-live-dau-2020 trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v392-drafts-deploy.zip
          git add bai-viet/la-vinh-hao-hoa-thieu-luu-dao-uong-ham-ai-thang-cuoc-dua-live-dau-2020.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v392-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — la-vinh-hao-hoa-thieu-luu-dao-uong-ham-ai-thang-cuoc-dua-live-dau-2020"
            git push
          fi
