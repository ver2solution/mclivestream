name: deploy-v286
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v286:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v286 package
        run: |
          unzip -o v286-stats-p0.zip
          ls -l gioi-thieu.html sw.js images/bai-viet/gioi-thieu-vieclamlivestream-online.png
      - name: Verify package contents
        run: |
          set -e
          grep -Fq 'data-stat="models"' gioi-thieu.html
          grep -Fq 'data-stat="lots"' gioi-thieu.html
          grep -Fq 'data-stat="kiots"' gioi-thieu.html
          grep -Fq "v286-shell-1" sw.js
          test -s images/bai-viet/gioi-thieu-vieclamlivestream-online.png
          echo "OK: v286 dong bo so lieu trang gioi thieu (3 file, CACHE v286-shell-1)"
      - name: Commit v286 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add gioi-thieu.html sw.js images/bai-viet/gioi-thieu-vieclamlivestream-online.png
          echo "So file staged:"
          git status --short | wc -l
          git status --short | head -5
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v286 dong bo so lieu trang gioi thieu (3 file)"
            git push
          fi
