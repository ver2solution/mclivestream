name: Deploy v172-pham-thoai (bai Pham Thoai 58 ty/36 gio, slug moi SEO 26/26)

on:
  push:
    paths:
      - '.github/workflows/deploy-v172-pham-thoai.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v172-pham-thoai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v172-pham-thoai package
        run: |
          unzip -o mclivestream-v172-pham-thoai-deploy.zip
          echo "--- verify v172-pham-thoai ---"
          test -f bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live.html || (echo "THIEU file bai Pham Thoai"; exit 1)
          test -f images/bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live-hero.jpg || (echo "THIEU hero jpg"; exit 1)
          test -f images/bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live-hero-og.jpg || (echo "THIEU hero og jpg"; exit 1)
          grep -q 'rel="canonical" href="https://vieclamlivestream.online/bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live.html"' bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live.html || (echo "THIEU canonical slug moi"; exit 1)
          grep -q 'bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live.html' js/data.js || (echo "THIEU bai trong data.js"; exit 1)
          grep -q 'bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live.html' sitemap.xml || (echo "THIEU bai trong sitemap"; exit 1)
          ! grep -q 'pham-thoai-58-ty-36-gio-live-2000' bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live.html js/data.js sitemap.xml || (echo "CON slug cu"; exit 1)
          echo "verify OK: bai Pham Thoai (slug moi, SEO 26/26) + data.js (176 bai) + sitemap (198 URL), khong doi sw.js"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v172-pham-thoai-deploy.zip
          git add -A bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live.html images/bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live-hero.jpg images/bai-viet/y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live-hero-og.jpg sitemap.xml js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v172: bai Pham Thoai 58 ty/36 gio (slug y-tuong-ban-hang-online-pham-thoai-58-ty-36-gio-live, SEO 26/26) + data.js (176 bai) + sitemap (198 URL)"
            git push
          fi
