name: Deploy v205

on:
  push:
    paths:
      - '.github/workflows/deploy-v205.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v205:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v205 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o v205.zip
          echo "--- verify v205 payload ---"
          grep -m1 "const CACHE = 'v205-shell-1'" sw.js
          grep -m1 "grid-template-columns:repeat(8,1fr)" v20.css
          grep -m1 'id="trustNewObjClassesLive"' index.html
          grep -m1 'id="trustNewObjLiveEquipment"' index.html
          grep -m1 'class="filter-actions"' danh-sach-mau.html
          grep -m1 'class="filter-actions"' danh-sach-shop.html
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
      - name: Run v205 test (exit code decides)
        run: node tests/test-v205-home-stats-filter.mjs
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f v205.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v205: them 8 so lieu muc moi vao trust-nums trang chu (2 hang, grid 8 cot) + nut loc Mau/Shop ra hang 3 can phai, sw.js v205-shell-1"
            git push
          fi
