name: Deploy v161
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          unzip -o mclivestream-v161-deploy.zip
          rm mclivestream-v161-deploy.zip
          git config user.name "Ryan"
          git config user.email "ver2solution@gmail.com"
          git add -A
          git commit -m "v161: fix loi Rion (S1-3, S3-1, S3-2, loi phien, 9a-9e) + 3 file JS editor" || echo "nothing to commit"
          git push
