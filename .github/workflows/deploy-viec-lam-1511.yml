name: Deploy articles-viec-lam-2026-11-15 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-viec-lam-1511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-viec-lam-1511:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "300" || (echo "BASE DOI: data.js khong con 300 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "326" || (echo "BASE DOI: sitemap khong con 326 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip viec-lam-1511 package
        run: |
          unzip -o mclivestream-viec-lam-1511-deploy.zip
          echo "--- verify viec-lam-1511 (4 bai) ---"
          for slug in thong-ke-ho-so-moi-14-11-2026 tuyen-mau-live-tp-hcm luong-mau-livestream-tet tuyen-mau-live-ban-quan-ao; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "330" || (echo "SAI TONG sitemap, phai 330"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "304" || (echo "SAI TONG data.js, phai 304 bai-viet page (305 bai tong, 1 bai cu dung truong url)"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-viec-lam-1511-deploy.zip || rm -f mclivestream-viec-lam-1511-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-viec-lam-2026-11-15: 4 bai (thong-ke-ho-so-moi-14-11, tuyen-mau-live-tp-hcm, luong-mau-livestream-tet, tuyen-mau-live-ban-quan-ao)"
            git push
          fi
