name: "Deploy dong-tien-2811 (4 bai Dong tien 28/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-dong-tien-2811.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-dong-tien-2811:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'kiem-tien-an-tet-bang-livestream-song-12-12-tet' js/data.js; then echo "dong-tien-2811 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "faa0656e15b801088b0fc62262264f05" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "861" || (echo "BASE DOI: data.js khong con 861 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "886" || (echo "BASE DOI: sitemap khong con 886 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip dong-tien-2811 package
        run: |
          unzip -o mclivestream-dong-tien-2811-deploy.zip
          echo "--- verify dong-tien-2811 (4 bai) ---"
          for slug in kiem-tien-an-tet-bang-livestream-song-12-12-tet dong-phuc-van-phong-thue-hay-mua-doanh-nghiep-tra-bao-nhieu do-cong-so-secondhand-ban-lai-tu-do-van-phong mua-truoc-tra-sau-black-friday-807-trieu-usd; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "890" || (echo "SAI TONG sitemap, phai 890"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "865" || (echo "SAI TONG data.js, phai 865"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-dong-tien-2811-deploy.zip || rm -f mclivestream-dong-tien-2811-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-dong-tien-2026-11-28: 4 bai moi (SEO V2)"
            git push
          fi
