name: Deploy v460 fl-prov-counts

on:
  push:
    paths:
      - '.github/workflows/deploy-fl-prov-counts-20261127.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v460-fl-prov-counts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v460 fl-prov-counts package
        run: |
          LIVE_CACHE="$(curl -s https://vieclamlivestream.online/sw.js | grep -o "CACHE = '[^']*'")"
          echo "live sw.js: $LIVE_CACHE"
          test "$LIVE_CACHE" = "CACHE = 'v458-ldtd-row3-1'" || (echo "LIVE sw.js CACHE is not v458 - v458 has not landed yet or base moved; do not deploy v460 yet"; exit 1)
          LIVE_APP_MD5="$(curl -s https://vieclamlivestream.online/js/app.js | md5sum | cut -d' ' -f1)"
          echo "live js/app.js md5: $LIVE_APP_MD5"
          test "$LIVE_APP_MD5" = "e3f21a5388770b92329a2987f2f28a52" || (echo "LIVE js/app.js is not the v458 file - base moved; rebase v460 package first"; exit 1)
          unzip -o mclivestream-fl-prov-counts-20261127-deploy.zip
          test "$(md5sum js/app.js | cut -d' ' -f1)" = "1958262cea4a6a362eaabe2c8e7876b4" || (echo "BAD js/app.js md5"; exit 1)
          test "$(md5sum sw.js | cut -d' ' -f1)" = "9b806f2bc5a6cd34edf60f523565e11a" || (echo "BAD sw.js md5"; exit 1)
          grep -q "rebuildFlProvOptions" js/app.js || (echo "BAD app.js marker"; exit 1)
          grep -q "CACHE = 'v460-fl-prov-counts-1'" sw.js || (echo "BAD sw.js CACHE marker"; exit 1)
          node --check js/app.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "v460-fl-prov-counts: dropdown Tinh trang LDTD hien so luong that theo tab dang chon (js/app.js rebuildFlProvOptions + sw.js CACHE v460)"
            git push
          fi
