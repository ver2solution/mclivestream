name: "Deploy articles-cong-nghe-2026-11-20 (4 bai)"

on:
  push:
    paths:
      - '.github/workflows/deploy-cong-nghe-2011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cong-nghe-2011:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "512" || (echo "BASE DOI: data.js khong con 512 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "539" || (echo "BASE DOI: sitemap khong con 539 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip cong-nghe-2011 package
        run: |
          unzip -o mclivestream-v371-cong-nghe-deploy.zip
          echo "--- verify cong-nghe-2011 (4 bai moi) ---"
            test -f "bai-viet/livestream-ban-hang-bang-ai-2026-9-trieu-gio-live.html" || (echo "THIEU bai-viet/livestream-ban-hang-bang-ai-2026-9-trieu-gio-live.html"; exit 1)
            test -f "images/bai-viet/livestream-ban-hang-bang-ai-2026-9-trieu-gio-live.jpg" || (echo "THIEU images/bai-viet/livestream-ban-hang-bang-ai-2026-9-trieu-gio-live.jpg"; exit 1)
            test -f "images/bai-viet/livestream-ban-hang-bang-ai-2026-9-trieu-gio-live-og.jpg" || (echo "THIEU images/bai-viet/livestream-ban-hang-bang-ai-2026-9-trieu-gio-live-og.jpg"; exit 1)
            grep -q "bai-viet/livestream-ban-hang-bang-ai-2026-9-trieu-gio-live.html" js/data.js || (echo "THIEU livestream-ban-hang-bang-ai-2026-9-trieu-gio-live trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/livestream-ban-hang-bang-ai-2026-9-trieu-gio-live.html</loc>" sitemap.xml || (echo "THIEU livestream-ban-hang-bang-ai-2026-9-trieu-gio-live trong sitemap"; exit 1)
            test -f "bai-viet/ban-hang-bang-ai-hyundai-khong-can-nguoi-dan.html" || (echo "THIEU bai-viet/ban-hang-bang-ai-hyundai-khong-can-nguoi-dan.html"; exit 1)
            test -f "images/bai-viet/ban-hang-bang-ai-hyundai-khong-can-nguoi-dan.jpg" || (echo "THIEU images/bai-viet/ban-hang-bang-ai-hyundai-khong-can-nguoi-dan.jpg"; exit 1)
            test -f "images/bai-viet/ban-hang-bang-ai-hyundai-khong-can-nguoi-dan-og.jpg" || (echo "THIEU images/bai-viet/ban-hang-bang-ai-hyundai-khong-can-nguoi-dan-og.jpg"; exit 1)
            grep -q "bai-viet/ban-hang-bang-ai-hyundai-khong-can-nguoi-dan.html" js/data.js || (echo "THIEU ban-hang-bang-ai-hyundai-khong-can-nguoi-dan trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/ban-hang-bang-ai-hyundai-khong-can-nguoi-dan.html</loc>" sitemap.xml || (echo "THIEU ban-hang-bang-ai-hyundai-khong-can-nguoi-dan trong sitemap"; exit 1)
            test -f "bai-viet/tiktok-symphony-video-quang-cao-ai-30-giay.html" || (echo "THIEU bai-viet/tiktok-symphony-video-quang-cao-ai-30-giay.html"; exit 1)
            test -f "images/bai-viet/tiktok-symphony-video-quang-cao-ai-30-giay.jpg" || (echo "THIEU images/bai-viet/tiktok-symphony-video-quang-cao-ai-30-giay.jpg"; exit 1)
            test -f "images/bai-viet/tiktok-symphony-video-quang-cao-ai-30-giay-og.jpg" || (echo "THIEU images/bai-viet/tiktok-symphony-video-quang-cao-ai-30-giay-og.jpg"; exit 1)
            grep -q "bai-viet/tiktok-symphony-video-quang-cao-ai-30-giay.html" js/data.js || (echo "THIEU tiktok-symphony-video-quang-cao-ai-30-giay trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/tiktok-symphony-video-quang-cao-ai-30-giay.html</loc>" sitemap.xml || (echo "THIEU tiktok-symphony-video-quang-cao-ai-30-giay trong sitemap"; exit 1)
            test -f "bai-viet/shopee-trong-chatgpt-ban-hang-qua-tro-chuyen.html" || (echo "THIEU bai-viet/shopee-trong-chatgpt-ban-hang-qua-tro-chuyen.html"; exit 1)
            test -f "images/bai-viet/shopee-trong-chatgpt-ban-hang-qua-tro-chuyen.jpg" || (echo "THIEU images/bai-viet/shopee-trong-chatgpt-ban-hang-qua-tro-chuyen.jpg"; exit 1)
            test -f "images/bai-viet/shopee-trong-chatgpt-ban-hang-qua-tro-chuyen-og.jpg" || (echo "THIEU images/bai-viet/shopee-trong-chatgpt-ban-hang-qua-tro-chuyen-og.jpg"; exit 1)
            grep -q "bai-viet/shopee-trong-chatgpt-ban-hang-qua-tro-chuyen.html" js/data.js || (echo "THIEU shopee-trong-chatgpt-ban-hang-qua-tro-chuyen trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/shopee-trong-chatgpt-ban-hang-qua-tro-chuyen.html</loc>" sitemap.xml || (echo "THIEU shopee-trong-chatgpt-ban-hang-qua-tro-chuyen trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "543" || (echo "SAI TONG sitemap, phai 543"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "516" || (echo "SAI TONG data.js, phai 516 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Guard node-parse (bai hoc v370)
        run: |
          node -e "global.window={};const fs=require('fs');eval(fs.readFileSync('js/data.js','utf8'));const a=window.V20_DATA.articles;console.log('articles.length =',a.length);console.log('empty =',a.filter(x=>!x).length);if(a.length!==513) { console.log('SAI: articles.length phai 513'); process.exit(1); } if(a.filter(x=>!x).length){ console.log('CO EMPTY ITEM'); process.exit(1); } const want=['livestream-ban-hang-bang-ai-2026-9-trieu-gio-live','ban-hang-bang-ai-hyundai-khong-can-nguoi-dan','tiktok-symphony-video-quang-cao-ai-30-giay','shopee-trong-chatgpt-ban-hang-qua-tro-chuyen']; const miss=want.filter(s=>!a.some(x=>x&&x.page==='bai-viet/'+s+'.html')); if(miss.length){ console.log('SLUG NGOAI MANG articles:', miss); process.exit(1); } console.log('node guard OK: 4 slug moi deu TRONG mang articles');"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v371-cong-nghe-deploy.zip || rm -f mclivestream-v371-cong-nghe-deploy.zip
          git rm -q .github/workflows/deploy-cong-nghe-2011.yml || true
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-cong-nghe-2026-11-20: 4 bai (livestream-ban-hang-bang-ai-2026-9-trieu-gio-live ban-hang-bang-ai-hyundai-khong-can-nguoi-dan tiktok-symphony-video-quang-cao-ai-30-giay shopee-trong-chatgpt-ban-hang-qua-tro-chuyen)"
            git push
          fi
