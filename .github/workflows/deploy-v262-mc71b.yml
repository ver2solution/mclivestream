name: Deploy v262 (MC-71b)

on:
  push:
    paths:
      - '.github/workflows/deploy-v262-mc71b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v262-mc71b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v262-mc71b package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v262-mc71b-deploy.zip
          echo "--- verify v262 (MC-71b) ---"
          node --check sw.js || (echo "SYNTAX FAIL sw.js"; exit 1)
          grep -m1 "v262-shell-1" sw.js
          grep -m1 "v262 (MC-71b)" v20.css
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum sw.js v20.css
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v262-mc71b-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v262: MC-71b an nut dang ky o hero khi da dang nhap (.hero-cta), sw.js v262-shell-1"
            git push
          fi
