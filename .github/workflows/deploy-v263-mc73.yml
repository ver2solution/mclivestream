name: Deploy v263 (MC-73)

on:
  push:
    paths:
      - '.github/workflows/deploy-v263-mc73.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v263-mc73:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v263-mc73 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v263-mc73-deploy.zip
          echo "--- verify v263 (MC-73) ---"
          grep -m1 "Ghim bài lên top hiện đang tạm thời miễn phí" quy-tac-diem-thuong.html
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum quy-tac-diem-thuong.html
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v263-mc73-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v263: MC-73 sua cau mau thuan o S4 quy tac diem (ghim dang mien phi, khong can du xu)"
            git push
          fi
