name: Deploy v371-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v371-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v371-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v371-drafts package
        run: |
          unzip -o mclivestream-v371-drafts-deploy.zip
          echo "--- verify v371-drafts (1 bai) ---"
          test -f bai-viet/douyin-siet-nguoi-ao-cao-dich-mat-quyen-live-7-meo-shop-viet-black-friday.html || (echo "THIEU bai-viet/douyin-siet-nguoi-ao-cao-dich-mat-quyen-live-7-meo-shop-viet-black-friday.html"; exit 1)
          grep -q "bai-viet/douyin-siet-nguoi-ao-cao-dich-mat-quyen-live-7-meo-shop-viet-black-friday.html" js/data.js || (echo "THIEU douyin-siet-nguoi-ao-cao-dich-mat-quyen-live-7-meo-shop-viet-black-friday trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/douyin-siet-nguoi-ao-cao-dich-mat-quyen-live-7-meo-shop-viet-black-friday.html</loc>" sitemap.xml || (echo "THIEU douyin-siet-nguoi-ao-cao-dich-mat-quyen-live-7-meo-shop-viet-black-friday trong sitemap"; exit 1)
          grep -q "v371-shell-1" sw.js || (echo "THIEU v371-shell-1 trong sw.js"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v371-drafts-deploy.zip
          git add bai-viet/douyin-siet-nguoi-ao-cao-dich-mat-quyen-live-7-meo-shop-viet-black-friday.html js/data.js sitemap.xml sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v371-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — douyin-siet-nguoi-ao-cao-dich-mat-quyen-live-7-meo-shop-viet-black-friday"
            git push
          fi
