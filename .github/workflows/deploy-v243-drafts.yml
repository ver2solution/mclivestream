name: Deploy v243-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v243-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v243-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v243-drafts package
        run: |
          unzip -o mclivestream-v243-drafts-deploy.zip
          echo "--- verify v243-drafts (1 bai) ---"
          test -f bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html || (echo "THIEU bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html"; exit 1)
          grep -q "bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html" js/data.js || (echo "THIEU vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html</loc>" sitemap.xml || (echo "THIEU vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v243-drafts-deploy.zip
          git add bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v243-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong"
            git push
          fi
