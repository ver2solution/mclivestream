name: Deploy v212

on:
  push:
    paths:
      - 'v212.zip'
      - '.github/workflows/deploy-v212.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip v212 package
        run: unzip -o v212.zip

      - name: Run v212 tests
        run: node tests/test-v212-kiot.mjs

      - name: Commit v212 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thanh-ly-kiot.html tests/test-v212-kiot.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "v212: kiot xoa dong dang tin + xem them hien so luong"
            git push
          fi
