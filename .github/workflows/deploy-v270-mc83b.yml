name: Deploy v270 (MC-83b)

on:
  push:
    paths:
      - '.github/workflows/deploy-v270-mc83b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v270-mc83b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v270-mc83b package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v270-mc83b-deploy.zip
          echo "--- verify v270 (MC-83b) ---"
          node --check mclivestream-supabase.js || (echo "SYNTAX FAIL mclivestream-supabase.js"; exit 1)
          node --check sw.js || (echo "SYNTAX FAIL sw.js"; exit 1)
          grep -m1 "v270-shell-1" sw.js
          grep -m1 "v270 (MC-83b" mclivestream-supabase.js
          grep -m1 ".select('id')" mclivestream-supabase.js
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum mclivestream-supabase.js sw.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v270-mc83b-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v270: MC-83b deleteJobPost/deleteUserListing .select('id') + kiem tra 0 dong (bao loi that thay vi Da xoa tin gia), sw.js v270-shell-1"
            git push
          fi
