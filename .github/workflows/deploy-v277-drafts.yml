name: Deploy v277-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v277-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v277-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v277-drafts package
        run: |
          unzip -o mclivestream-v277-drafts-deploy.zip
          echo "--- verify v277-drafts (1 bai) ---"
          test -f bai-viet/huong-thai-1050-ty-dong-livestream-ban-hang-99-ndt-mat-1-trieu-follower.html || (echo "THIEU bai-viet/huong-thai-1050-ty-dong-livestream-ban-hang-99-ndt-mat-1-trieu-follower.html"; exit 1)
          grep -q "bai-viet/huong-thai-1050-ty-dong-livestream-ban-hang-99-ndt-mat-1-trieu-follower.html" js/data.js || (echo "THIEU huong-thai-1050-ty-dong-livestream-ban-hang-99-ndt-mat-1-trieu-follower trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/huong-thai-1050-ty-dong-livestream-ban-hang-99-ndt-mat-1-trieu-follower.html</loc>" sitemap.xml || (echo "THIEU huong-thai-1050-ty-dong-livestream-ban-hang-99-ndt-mat-1-trieu-follower trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v277-drafts-deploy.zip
          git add bai-viet/huong-thai-1050-ty-dong-livestream-ban-hang-99-ndt-mat-1-trieu-follower.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v277-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — huong-thai-1050-ty-dong-livestream-ban-hang-99-ndt-mat-1-trieu-follower"
            git push
          fi
