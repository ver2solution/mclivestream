name: Deploy v398-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v398-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v398-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v398-drafts package
        run: |
          unzip -o mclivestream-v398-drafts-deploy.zip
          echo "--- verify v398-drafts (1 bai) ---"
          test -f bai-viet/meo-bien-buoi-live-thanh-su-kien-1610-ty-dong-5-tuan.html || (echo "THIEU bai-viet/meo-bien-buoi-live-thanh-su-kien-1610-ty-dong-5-tuan.html"; exit 1)
          grep -q "bai-viet/meo-bien-buoi-live-thanh-su-kien-1610-ty-dong-5-tuan.html" js/data.js || (echo "THIEU meo-bien-buoi-live-thanh-su-kien-1610-ty-dong-5-tuan trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/meo-bien-buoi-live-thanh-su-kien-1610-ty-dong-5-tuan.html</loc>" sitemap.xml || (echo "THIEU meo-bien-buoi-live-thanh-su-kien-1610-ty-dong-5-tuan trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v398-drafts-deploy.zip
          git add bai-viet/meo-bien-buoi-live-thanh-su-kien-1610-ty-dong-5-tuan.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v398-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — meo-bien-buoi-live-thanh-su-kien-1610-ty-dong-5-tuan"
            git push
          fi
