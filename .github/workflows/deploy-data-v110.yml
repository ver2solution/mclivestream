name: Deploy data v110

on:
  push:
    paths:
      - '.github/workflows/deploy-data-v110.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-v110:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data deploy package
        run: |
          unzip -o mclivestream-data-v110-deploy.zip
          ls -l js/data.js images/th-44.jpg images/th-47.jpg images-shop/shop-trang-xinh.jpg
          sha256sum js/data.js
          grep -q "th-47" js/data.js && echo "data.js has th-47 OK"
          grep -q "sh-76" js/data.js && echo "data.js has sh-76 OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data: mau 37, shop 76 (thu thap tinh thieu toi 08/11)"
            git push
          fi
