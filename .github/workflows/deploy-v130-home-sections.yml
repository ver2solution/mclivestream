name: Deploy v130-home-sections

on:
  push:
    paths:
      - '.github/workflows/deploy-v130-home-sections.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v130-home-sections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v130-home-sections package
        run: |
          unzip -o mclivestream-v130-home-sections.zip
          echo "--- verify v130-home-sections payload (3 files) ---"
          echo "files in zip: $(unzip -l mclivestream-v130-home-sections.zip | tail -1)"
          grep -q "const CACHE = 'v130-shell-1';" sw.js && echo "sw.js CACHE v130-shell-1 OK"
          grep -q 'id="kiot-moi"' index.html && echo "index kiot-moi section OK"
          grep -q 'id="lo-moi"' index.html && echo "index lo-moi section OK"
          grep -q 'id="xuong-moi"' index.html && echo "index xuong-moi section OK"
          grep -q 'href="danh-sach-lo.html"' index.html && echo "index menu Lo link OK"
          grep -q 'href="danh-sach-xuong.html"' index.html && echo "index menu Xuong link OK"
          grep -q 'renderHomeSection' js/app.js && echo "app.js renderHomeSection OK"
          grep -q 'sortByDMYDesc' js/app.js && echo "app.js sortByDMYDesc OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v130-home-sections.zip
          git add -A
          git status --short | head -60
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v130: 3 muc Kiot + Lo + Xuong tren trang chu + link menu Lo/Xuong + bump CACHE v130"
            git push
          fi
