name: Deploy bai bao bu KPI 27/11 (40 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-bai-bao-bu-2711.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-bai-bao-bu-2711:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip bai bao bu 27/11 package
        run: |
          # 28/11 bu KPI 27/11: 10 goi bai bao buoi sang 27/11 (viec-lam/livestream/
          # phan-tich/cong-nghe/thi-truong/dong-tien/xu-huong/hang-hoa/dang-hot/
          # doi-song) — 40 bai moi, gop 1 goi vi data.js/sitemap cua tung goi cu
          # deu build tren nen 26/11, deploy rieng se ghi de lan nhau (bai hoc
          # kiot+lots 28/11). data.js moi = live 4f8600ce + 40 entry (0 dong xoa).
          # Slug trung thi-truong-thoi-trang-tre-em-2026-482-ty-usd: giu ban
          # thi-truong (4321 tu, 482,7 ty), bo ban phan-tich.
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "2c493253a223cbef4f8615c63dd2f46138f09bb2468c3d95a359f9090d471789" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          LIVE_SM="$(curl -s https://vieclamlivestream.online/sitemap.xml | grep -c '<url>')"
          echo "live sitemap urls: $LIVE_SM"
          test "$LIVE_SM" = "830" || (echo "LIVE sitemap changed since package built - aborting"; exit 1)
          unzip -o mclivestream-bai-bao-bu-2711-deploy.zip
          ls -l js/data.js sitemap.xml
          sha256sum js/data.js sitemap.xml
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "96cfe0b19e8d9421233baef765118498fd16bab882a30cb053d596bfee8053e6" || (echo "BAD data.js sha256"; exit 1)
          test "$(sha256sum sitemap.xml | cut -d' ' -f1)" = "cd834da19fcdf418a510637a6c94bdd33d9c67c392b76a6a18bfa2180e0790e1" || (echo "BAD sitemap sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls: $(grep -c '<url>' sitemap.xml)"
          test "$(grep -c '"id": "th-' js/data.js)" = "263" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "332" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "352" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "452" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "390" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "845" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "846" || (echo "BAD articles parsed count"; exit 1)
          test "$(grep -c '<url>' sitemap.xml)" = "870" || (echo "BAD sitemap count"; exit 1)
          test -f bai-viet/black-friday-2026-825-ty-usd-chi-truoc-ngay-sale.html || (echo "THIEU HTML: black-friday-2026-825-ty-usd-chi-truoc-ngay-sale.html"; exit 1)
          test -f images/bai-viet/black-friday-2026-825-ty-usd-chi-truoc-ngay-sale.jpg || (echo "THIEU ANH: black-friday-2026-825-ty-usd-chi-truoc-ngay-sale.jpg"; exit 1)
          test -f images/bai-viet/black-friday-2026-825-ty-usd-chi-truoc-ngay-sale-og.jpg || (echo "THIEU ANH: black-friday-2026-825-ty-usd-chi-truoc-ngay-sale-og.jpg"; exit 1)
          test -f bai-viet/black-friday-2026-tien-mua-sam-chay-vao-do-thiet-yeu.html || (echo "THIEU HTML: black-friday-2026-tien-mua-sam-chay-vao-do-thiet-yeu.html"; exit 1)
