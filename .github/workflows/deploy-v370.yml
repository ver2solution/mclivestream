name: "Deploy v370 (B-20261120-02: Xem tai nguon tu mo + cuon + to sang binh luan)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v370.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v370:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v370 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v370-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF 'v370-shell-1' sw.js; then echo "v370 DA DEPLOY ROI (sw.js da co v370-shell-1) - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main 2e2aff4) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "2d178b956f9ca3a1a2dbee1033afcfa0" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -o '<loc>' sitemap.xml | wc -l)" -eq 538 || (echo "BASE DOI: sitemap khong con 538 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v370-deploy.zip
          echo "--- verify v370 (3 file doi) ---"
          for f in js/comments.js v20.css sw.js; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "const CACHE = 'v370-shell-1'" sw.js || (echo "SAI: sw.js phai co const CACHE v370-shell-1"; exit 1)
          if grep -qF "const CACHE = 'v369-shell-1'" sw.js; then echo "SAI: sw.js van dung CACHE cu v369-shell-1"; exit 1; fi
          node --check js/comments.js || (echo "SAI: js/comments.js loi cu phap"; exit 1)
          node --check sw.js || (echo "SAI: sw.js loi cu phap"; exit 1)
          grep -qF "scrollToCommentHash" js/comments.js || (echo "SAI: js/comments.js phai co scrollToCommentHash"; exit 1)
          grep -qF "v2s-comment-target" v20.css || (echo "SAI: v20.css phai co .v2s-comment-target"; exit 1)
          echo "verify OK: 3 file, sw.js v370-shell-1, Xem tai nguon tu mo + cuon + to sang"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v370-deploy.zip
          git add js/comments.js v20.css sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v370: B-20261120-02 Xem tai nguon (#comment-<id>) tu mo khu binh luan + cuon toi + to sang; CACHE v370-shell-1 (renumbered tu v369 vi v369-shell-1 da bi v369-drafts dung; rebase tu 2e2aff4)"
            git push
          fi
