name: deploy-v118
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy v118
        run: |
          unzip -o mclivestream-v118-deploy.zip
          rm mclivestream-v118-deploy.zip
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add -A
          git commit -m "v118: custom domain vieclamlivestream.online + SEO + fix nut Dang bai"
          git push
          rm .github/workflows/deploy-v118.yml
          git add -A
          git commit -m "remove deploy-v118 workflow"
          git push
