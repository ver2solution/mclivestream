name: Deploy data 2026-11-16 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-16-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-16-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-16 lots package
        run: |
          unzip -o mclivestream-data-2026-11-16-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "48397ef2afea53ff4780f6887d9dff3bedc3f288d0accab7346834ffedb1f559" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          for f in lot-72 lot-73 lot-74 lot-75 lot-76 lot-81 lot-83 lot-85 lot-86 lot-87 lot-88 lot-89 lot-90 lot-91 lot-92 lot-95 lot-96 lot-100 lot-101 lot-111 lot-113 lot-114 lot-115 lot-117 lot-118 lot-119 lot-120 lot-121 lot-122 lot-123 lot-124 lot-125 lot-126 lot-127 lot-128 lot-129 lot-130 lot-131 lot-132 lot-133 lot-134 lot-135 lot-137 lot-138; do ls -l images/lo/$f.jpg; done
          test "$(grep -c '"id": "th-' js/data.js)" = "238" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "290" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "146" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "280" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "280" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "350" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "352" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-72.jpg images/lo/lot-73.jpg images/lo/lot-74.jpg images/lo/lot-75.jpg images/lo/lot-76.jpg images/lo/lot-81.jpg images/lo/lot-83.jpg images/lo/lot-85.jpg images/lo/lot-86.jpg images/lo/lot-87.jpg images/lo/lot-88.jpg images/lo/lot-89.jpg images/lo/lot-90.jpg images/lo/lot-91.jpg images/lo/lot-92.jpg images/lo/lot-95.jpg images/lo/lot-96.jpg images/lo/lot-100.jpg images/lo/lot-101.jpg images/lo/lot-111.jpg images/lo/lot-113.jpg images/lo/lot-114.jpg images/lo/lot-115.jpg images/lo/lot-117.jpg images/lo/lot-118.jpg images/lo/lot-119.jpg images/lo/lot-120.jpg images/lo/lot-121.jpg images/lo/lot-122.jpg images/lo/lot-123.jpg images/lo/lot-124.jpg images/lo/lot-125.jpg images/lo/lot-126.jpg images/lo/lot-127.jpg images/lo/lot-128.jpg images/lo/lot-129.jpg images/lo/lot-130.jpg images/lo/lot-131.jpg images/lo/lot-132.jpg images/lo/lot-133.jpg images/lo/lot-134.jpg images/lo/lot-135.jpg images/lo/lot-137.jpg images/lo/lot-138.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-16 lots: 146 lo (34 lo moi lot-113..146: nhom 1: 0, nhom 2: 6, nhom 3: 28, 24 anh moi; kem 20 anh lot-72..111 chua live; chuan hoa prov lot-107/108/112 Kien Giang -> An Giang; rebase len live sau deploy kiot, giu 280 kiot), 238 mau / 290 shop / 352 bai viet"
            git push
          fi
