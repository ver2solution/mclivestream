name: Deploy v289-thi-truong (4 bai Thi truong 16/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v289-thi-truong.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v289-thi-truong:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "315" || (echo "BASE DOI: data.js khong con 315 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "341" || (echo "BASE DOI: sitemap khong con 341 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip v289-thi-truong package
        run: |
          unzip -o mclivestream-v289-thi-truong-deploy.zip
          echo "--- verify v289-thi-truong (4 bai) ---"
          for slug in shopee-12-12-sinh-nhat-sale-cuoi-nam-voucher-freeship-live shopee-quy-3-2026-gmv-39-7-ty-usd-phi-san-15-3 livestream-trung-quoc-2026-double-11-1776-ty-ndt thuong-mai-dien-tu-dong-nam-a-2026-226-ty-usd-viet-nam-32-ty; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "345" || (echo "SAI TONG sitemap, phai 345"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "319" || (echo "SAI TONG data.js, phai 319"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v289-thi-truong-deploy.zip || rm -f mclivestream-v289-thi-truong-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v289-thi-truong: 4 bai Thi truong 16/11/2026 (Shopee 12.12 keyword #4 + Shopee Q3 2026 + livestream Trung Quoc 2026 + TMDT Dong Nam A 2026)"
            git push
          fi
