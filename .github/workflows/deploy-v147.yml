name: Deploy v147 form fix

on:
  push:
    paths:
      - '.github/workflows/deploy-v147.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v147:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v147 form-fix package
        run: |
          unzip -o mclivestream-v147-form-fix-deploy.zip
          echo "--- verify v147 ---"
          grep -q "articleTextLength" js/admin.js || (echo "THIEU articleTextLength trong js/admin.js"; exit 1)
          grep -q "v147-shell-1" sw.js || (echo "THIEU v147-shell-1 trong sw.js"; exit 1)
          echo "js/admin.js: OK articleTextLength"
          echo "sw.js: OK v147-shell-1"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v147-form-fix-deploy.zip
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v147: fix do do dai form Viet bai (articleTextLength) + sw.js CACHE v147-shell-1"
            git push
          fi
