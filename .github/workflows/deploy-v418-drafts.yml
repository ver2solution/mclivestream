name: Deploy v418-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v418-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v418-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v418-drafts package
        run: |
          unzip -o mclivestream-v418-drafts-deploy.zip
          echo "--- verify v418-drafts (1 bai) ---"
          test -f bai-viet/truong-dai-dich-595-ty-dong-1-ngay-double-11-nu-hoang-thoi-trang-taobao-ipo-nasdaq.html || (echo "THIEU bai-viet/truong-dai-dich-595-ty-dong-1-ngay-double-11-nu-hoang-thoi-trang-taobao-ipo-nasdaq.html"; exit 1)
          grep -q "bai-viet/truong-dai-dich-595-ty-dong-1-ngay-double-11-nu-hoang-thoi-trang-taobao-ipo-nasdaq.html" js/data.js || (echo "THIEU truong-dai-dich-595-ty-dong-1-ngay-double-11-nu-hoang-thoi-trang-taobao-ipo-nasdaq trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/truong-dai-dich-595-ty-dong-1-ngay-double-11-nu-hoang-thoi-trang-taobao-ipo-nasdaq.html</loc>" sitemap.xml || (echo "THIEU truong-dai-dich-595-ty-dong-1-ngay-double-11-nu-hoang-thoi-trang-taobao-ipo-nasdaq trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v418-drafts-deploy.zip
          git add bai-viet/truong-dai-dich-595-ty-dong-1-ngay-double-11-nu-hoang-thoi-trang-taobao-ipo-nasdaq.html images/bai-viet/truong-dai-dich-595-ty-dong-1-ngay-double-11-nu-hoang-thoi-trang-taobao-ipo-nasdaq-hero.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v418-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — truong-dai-dich-595-ty-dong-1-ngay-double-11-nu-hoang-thoi-trang-taobao-ipo-nasdaq"
            git push
          fi
