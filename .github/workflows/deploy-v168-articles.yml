name: Deploy v168-articles (40 bai 12/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v168-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v168-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v168-articles package
        run: |
          unzip -o mclivestream-v168-articles-deploy.zip
          echo "--- verify v168-articles (40 bai) ---"
          for slug in tong-ket-double-11-viet-nam-d1-12-11-dinh-doanh-thu vo-ha-linh-237-ty-so-voi-phien-11-11-2026 ly-giai-ky-toi-11-11-taobao-live-2026 dong-vu-huy-double-11-2026-mo-hinh-sieu-ca-the shopee-vs-tiktok-shop-song-ma-11-11-2026 dinh-doanh-thu-d1-12-11-2026 thong-ke-ho-so-moi-11-11-2026 tiktok-shop-my-black-friday-2025-500-trieu-usd-4-ngay live-commerce-han-quoc-47-nghin-ty-won-2025 tan-tuyen-kuaishou-double-11-2026-600-trieu-ndt mau-livestream-luong-theo-gio-bang-luong-tin-tuyen-11-11 tuyen-mau-livestream-part-time-ha-noi viec-lam-mc-livestream tiktok-shop-dong-bang-hoa-hong-90-ngay-koc-can-biet phi-tiktok-shop-2026-hoa-hong-9-178-phan-tram quang-cao-facebook-live-2026-shop-nho-chay-the-nao ai-livestream-thay-mc-that-shop-nho-co-nen-dung nhap-hang-trung-quoc-cuoi-nam-chot-don-truoc-thang-12 livestream-ban-xe-xiaomi-su7-88898-don-24-gio dong-minh-chau-livestream-ban-dieu-hoa-1027-ty-ndt-mot-ngay shopee-live-indonesia-erigo-raffi-ahmad-305000-usd-10-phut khairul-aming-43-trieu-rm-mot-phien-live-tiktok-shop-malaysia amazon-prime-day-2025-241-ty-usd-4-ngay-live-ban-hang tieu-duong-ca-douyin-100-trieu-ndt-mot-dem simba-kuaishou-1427-ty-ndt-phien-mo-man-618 mon-hang-la-ban-chay-geats-news-shop-viet-co-nen-ban phat-minh-di-nhat-ban-chindogu-muda-zukuri-shop-nho lai-suat-ty-gia-dau-tu-cong-anh-huong-shop-nho-2026 du-lich-thang-12-mau-livestream-nghi-sau-mua-sale mua-sam-qua-video-ngan-social-commerce-tang-manh-2026 xiaomi-yu7-200000-don-3-phut-live-ban-o-to mami-louisse-1-trieu-usd-1-ngay-koc-indonesia-ban-my-pham nong-dan-son-dong-80000-don-dao-livestream-nong-san idol-live-bigo-live-kiem-tien-10000-usd-thang thuong-hieu-viet-tiktok-shop-my-151-ty-usd-xuyen-bien-gioi tiktok-shop-100-ngay-toi-tet-2027-shop-nho-lam-gi mo-neo-gia-livestream-tam-ly-khach-chot-don thi-truong-livestream-viet-nam-q4-2026-shopee-tiktok-shop tinh-nao-dang-can-lo-xa-kho-thoi-trang-nhat dong-tien-11-11-nguoi-viet-mua-gi-sau-sale; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"title":' js/data.js)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v168-articles-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v168-articles: 40 bai viet 12/11/2026 (6 Double 11 D+1 + thong-ke-ho-so-moi-11-11 + 3 keyword guides + 29 tin tuc, chu de xoay vong #5 dong-tien-11-11 cuoi)"
            git push
          fi
