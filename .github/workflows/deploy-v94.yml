name: Deploy v94

on:
  push:
    paths:
      - '.github/workflows/deploy-v94.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v94 deploy package
        run: unzip -o mclivestream-v94-deploy.zip
      - name: Commit v94 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/comments.js sw.js
          git commit -m "v94: comments via RPC submit_comment (NEW-01) + sw.js v94-shell-1" || echo "nothing to commit"
          git push
