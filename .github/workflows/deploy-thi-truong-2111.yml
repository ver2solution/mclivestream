name: "Deploy thi-truong-2111 (4 bai Thi truong 21/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-thi-truong-2111.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-thi-truong-2111:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "46e23295ca4b9e15b3c4c6161f43bd13" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "532" || (echo "BASE DOI: data.js khong con 532 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "559" || (echo "BASE DOI: sitemap khong con 559 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip thi-truong-2111 package
        run: |
          unzip -o mclivestream-thi-truong-2111-deploy.zip
          echo "--- verify thi-truong-2111 (4 bai) ---"
          for slug in pdd-quy-3-2026-temu-chung-lai-doanh-thu-di-ngang tencent-quy-3-2026-wechat-1449-ty-nguoi-quang-cao-tang-19-phan-tram mercado-libre-quy-3-2026-gmv-23-ty-usd-tang-33-phan-tram thi-truong-qua-tet-2026-gio-qua-dan-dau-mua-som-thang-11; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "563" || (echo "SAI TONG sitemap, phai 563"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "536" || (echo "SAI TONG data.js, phai 536"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-thi-truong-2111-deploy.zip || rm -f mclivestream-thi-truong-2111-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-thi-truong-2026-11-21: 4 bai moi (SEO V2)"
            git push
          fi
