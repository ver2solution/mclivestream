name: Deploy v157
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v157 package
        run: unzip -o mclivestream-v157-4hang.zip
      - name: Commit and push
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@users.noreply.github.com"
          git add -A
          git commit -m "Deploy v157: shop 24/trang + kiot 24/lan + khu tin 3 hang duoi (danh-sach-shop, thanh-ly-kiot) + FAQ 24 shop"
          git push
