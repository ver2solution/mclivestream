name: Deploy v257-thi-truong (4 bai Thi truong 15/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v257-thi-truong.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v257-thi-truong:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "270" || (echo "BASE DOI: data.js khong con 270 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "296" || (echo "BASE DOI: sitemap khong con 296 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip v257-thi-truong package
        run: |
          unzip -o mclivestream-v257-thi-truong-deploy.zip
          echo "--- verify v257-thi-truong (4 bai) ---"
          for slug in tiktok-shop-12-12-sale-cuoi-nam-voucher-gmv-max lazada-11-11-2026-lazmall-gmv-tang-10-lan-ai-lazzie thuong-mai-dien-tu-viet-nam-9-thang-2026-442-nghin-ty temu-shein-2026-het-mien-thue-my-eu-thu-phi-buu-kien; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "300" || (echo "SAI TONG sitemap, phai 300"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "274" || (echo "SAI TONG data.js, phai 274"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v257-thi-truong-deploy.zip || rm -f mclivestream-v257-thi-truong-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v257-thi-truong: 4 bai Thi truong 15/11/2026 (TikTok Shop 12.12 keyword #3 + Lazada 11.11 2026 + TMDT VN 9 thang 2026 + Temu Shein 2026)"
            git push
          fi
