name: "Deploy hang-hoa-2011 (4 bai Hang hoa 20/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-hang-hoa-2011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-hang-hoa-2011:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "0af962ac7eaf0e4216959ed9e1367bf1" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "493" || (echo "BASE DOI: data.js khong con 493 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "520" || (echo "BASE DOI: sitemap khong con 520 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip hang-hoa-2011 package
        run: |
          unzip -o mclivestream-hang-hoa-2011-deploy.zip
          echo "--- verify hang-hoa-2011 (4 bai) ---"
          for slug in kinh-nghiem-nhap-hang-trung-quoc-2026 starbucks-gacha-nhat-ban-880-yen-mo-hop-mu qua-tet-cho-doanh-nghiep-2026 matcha-nhu-cau-tang-vot-gia-tang-33-lan; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "524" || (echo "SAI TONG sitemap, phai 524"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "497" || (echo "SAI TONG data.js, phai 497"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-hang-hoa-2011-deploy.zip || rm -f mclivestream-hang-hoa-2011-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-hang-hoa-2026-11-20: 4 bai moi (SEO V2)"
            git push
          fi
