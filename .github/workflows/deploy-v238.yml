name: deploy-v238
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v238:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v238 package
        run: |
          unzip -o v238.zip
          ls -l js/app.js sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "cnt.textContent=list.length+' bài khớp bộ lọc.'" js/app.js
          grep -Fq "CACHE = 'v238-shell-1'" sw.js
          node --check js/app.js
          node --check sw.js
      - name: Commit v238 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v238 F-R2-01 so dem Tin tuc = tong bai khop bo loc (js/app.js) + sw.js v238-shell-1"
            git push
          fi
