name: Deploy v169-n8 (sua loc kiot TP.HCM/Binh Duong)

on:
  push:
    paths:
      - '.github/workflows/deploy-v169-n8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v169-n8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v169-n8 package
        run: |
          unzip -o mclivestream-v169-n8-deploy.zip
          echo "--- verify v169-n8 ---"
          grep -q "normProvKiot" danh-sach-kiot.html || (echo "THIEU normProvKiot trong danh-sach-kiot.html"; exit 1)
          grep -q "v169-shell-1" sw.js || (echo "THIEU v169-shell-1 trong sw.js"; exit 1)
          echo "verify OK: danh-sach-kiot.html + sw.js (v169-shell-1)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v169-n8-deploy.zip
          git add danh-sach-kiot.html sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v169-n8: danh-sach-kiot.html dung normProvKiot (TP.HCM 34 tin, Binh Duong 2 tin) + sw.js v169-shell-1"
            git push
          fi
