name: Deploy v255-bu-seo (SEO fix 2 articles)

on:
  push:
    paths:
      - '.github/workflows/deploy-v255-bu-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v255-bu-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v255-bu-seo package
        run: |
          unzip -o mclivestream-v255-bu-seo-deploy.zip
          echo "--- verify v255-bu-seo (SEO fix sau-rieng + vi-a) ---"
          test -f bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html || (echo "THIEU bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html"; exit 1)
          test -f bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html || (echo "THIEU bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html"; exit 1)
          grep -q "<title>Sầu riêng 22 tấn bán hết trong 5 phút livestream kỷ lục</title>" bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html || (echo "SAI title sau-rieng"; exit 1)
          grep -q "<title>Vi Á: 28.700 tỷ đồng trong 1 đêm livestream bán hàng kỷ lục</title>" bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html || (echo "SAI title vi-a"; exit 1)
          grep -q "Xem ngay 7 bài học bán nghìn đơn cho shop Việt." bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html || (echo "SAI meta sau-rieng"; exit 1)
          grep -q "Xem ngay hành trình lên đỉnh và cú ngã trốn thuế 4.693 tỷ." bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html || (echo "SAI meta vi-a"; exit 1)
          grep -q '<h2 id="bai-muc-9">9. Theo Ver2Solution</h2>' bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html || (echo "THIEU H2-9 sau-rieng"; exit 1)
          grep -q '<h2 id="bai-muc-11">11. Theo Ver2Solution</h2>' bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html || (echo "THIEU H2-11 vi-a"; exit 1)
          test "$(grep -o '<h2 id="bai-muc-' bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html | wc -l)" = "9" || (echo "sau-rieng phai co 9 H2"; exit 1)
          test "$(grep -o '<h2 id="bai-muc-' bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html | wc -l)" = "11" || (echo "vi-a phai co 11 H2"; exit 1)
          grep -q "Sầu riêng 22 tấn bán hết trong 5 phút livestream kỷ lục" js/data.js || (echo "THIEU title moi sau-rieng trong data.js"; exit 1)
          grep -q "Vi Á: 28.700 tỷ đồng trong 1 đêm livestream bán hàng kỷ lục" js/data.js || (echo "THIEU title moi vi-a trong data.js"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html</loc>" sitemap.xml || (echo "THIEU sau-rieng trong sitemap"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html</loc>" sitemap.xml || (echo "THIEU vi-a trong sitemap"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "288" || (echo "sitemap phai co 288 URL, hien co $(grep -c '<loc>' sitemap.xml)"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v255-bu-seo-deploy.zip
          git add bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html bai-viet/vi-a-28700-ty-dong-1-dem-livestream-ban-hang-tron-thue-4693-ty-dong.html js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v255-bu-seo: sua SEO 2 bai (sau-rieng title 55 ky tu + meta 153 + 9 H2; vi-a title 59 + meta 152 + 11 H2), 0 canh bao"
            git push
          fi
