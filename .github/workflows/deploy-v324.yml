name: "Deploy v324 (muc chat cong dong trang chu)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v324.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v324:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v324 package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; bai hoc v307: KHONG guard HEAD-SHA) ---"
          if grep -q "v324 (17/11/2026)" v20.css; then echo "v324 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "828bc91f10da5a88eda42686f77ac3e2" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "392" || (echo "BASE DOI: sitemap khong con 392 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v324-deploy.zip
          echo "--- verify v324 (4 files) ---"
          test "$(unzip -l mclivestream-v324-deploy.zip | grep -c ' index.html$')" -eq 1 || (echo "SAI: goi v324 phai co dung 1 file index.html"; exit 1)
          test "$(unzip -l mclivestream-v324-deploy.zip | grep -c ' v20.css$')" -eq 1 || (echo "SAI: goi v324 phai co dung 1 file v20.css"; exit 1)
          test "$(unzip -l mclivestream-v324-deploy.zip | grep -c ' sw.js$')" -eq 1 || (echo "SAI: goi v324 phai co dung 1 file sw.js"; exit 1)
          test "$(unzip -l mclivestream-v324-deploy.zip | grep -c ' js/community-chat.js$')" -eq 1 || (echo "SAI: goi v324 phai co dung 1 file js/community-chat.js"; exit 1)
          grep -q 'id="chat-cong-dong"' index.html || (echo "THIEU section #chat-cong-dong trong index.html"; exit 1)
          grep -q 'js/community-chat.js' index.html || (echo "THIEU script community-chat.js trong index.html"; exit 1)
          grep -q "v324 (17/11/2026)" v20.css || (echo "THIEU khoi v324 trong v20.css"; exit 1)
          grep -q "v324-shell-1" sw.js || (echo "THIEU CACHE v324-shell-1 trong sw.js"; exit 1)
          grep -q "get_home_chat_messages" js/community-chat.js || (echo "THIEU RPC get_home_chat_messages trong js/community-chat.js"; exit 1)
          node --check js/community-chat.js || (echo "LOI CU PHAP js/community-chat.js"; exit 1)
          echo "verify OK: 4 files, section chat + CSS + SW v324 + community-chat.js hop le"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v324-deploy.zip
          git add index.html v20.css sw.js js/community-chat.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v324: muc chat cong dong trang chu (Vi tri 1, thiet ke v3 da duyet); backend PR-03 + Top level; data.js/sitemap khong doi (base b0129d3)"
            git push
          fi
