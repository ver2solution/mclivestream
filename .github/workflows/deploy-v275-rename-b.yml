name: Deploy v275-rename-b

on:
  push:
    paths:
      - '.github/workflows/deploy-v275-rename-b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v275-rename-b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip rename-b package (data.js only)
        run: |
          unzip -o mclivestream-v275-rename-b-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          node --check js/data.js && echo "SYNTAX OK"
          echo "old-brand remaining (must be 0/0/0):"
          echo "Ver2Solution: $(grep -c 'Ver2Solution' js/data.js || true)"
          echo "ver2solution: $(grep -c 'ver2solution' js/data.js || true)"
          echo "V2S: $(grep -c 'V2S' js/data.js || true)"
          if grep -q 'Ver2Solution\|ver2solution\|V2S' js/data.js; then echo "FAIL: old brand remains"; exit 1; fi
          echo "counts (must be unchanged):"
          echo "models: $(grep -oE '\"id\": ?\"th-[0-9]+' js/data.js | wc -l) (expect 236)"
          echo "shops: $(grep -oE '\"id\": ?\"sh-[0-9]+' js/data.js | wc -l) (expect 287)"
          echo "lots: $(grep -oE '\"id\": ?\"lot-[0-9]+' js/data.js | wc -l) (expect 112)"
          echo "factories: $(grep -oE '\"id\": ?\"fac-[0-9]+' js/data.js | wc -l) (expect 280)"
          echo "kiots: $(grep -oE '\"id\": ?\"kiot-[0-9]+' js/data.js | wc -l) (expect 240)"
          echo "classesLive: $(grep -oE '\"id\": ?\"cl-[0-9]+' js/data.js | wc -l) (expect 20)"
          echo "classesMakeup: $(grep -oE '\"id\": ?\"cm-[0-9]+' js/data.js | wc -l) (expect 20)"
          echo "eventsMarketing: $(grep -oE '\"id\": ?\"em-[0-9]+' js/data.js | wc -l) (expect 20)"
          echo "logistics: $(grep -oE '\"id\": ?\"lg-[0-9]+' js/data.js | wc -l) (expect 20)"
          echo "rentals: $(grep -oE '\"id\": ?\"rt-[0-9]+' js/data.js | wc -l) (expect 20)"
          [ "$(grep -oE '\"id\": ?\"th-[0-9]+' js/data.js | wc -l)" = "236" ] || exit 1
          [ "$(grep -oE '\"id\": ?\"sh-[0-9]+' js/data.js | wc -l)" = "287" ] || exit 1
          [ "$(grep -oE '\"id\": ?\"lot-[0-9]+' js/data.js | wc -l)" = "112" ] || exit 1
          [ "$(grep -oE '\"id\": ?\"fac-[0-9]+' js/data.js | wc -l)" = "280" ] || exit 1
          [ "$(grep -oE '\"id\": ?\"kiot-[0-9]+' js/data.js | wc -l)" = "240" ] || exit 1
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v275-rename-b: doi ten thuong hieu trong js/data.js (60 cho) — 0 Ver2Solution con sot, dem doi tuong khong doi"
            git push
          fi
