name: Deploy v255-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v255-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v255-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v255-drafts package
        run: |
          unzip -o mclivestream-v255-drafts-deploy.zip
          echo "--- verify v255-drafts (1 bai) ---"
          test -f bai-viet/dong-vu-huy-73500-ty-dong-nam-2025-421-buoi-livestream.html || (echo "THIEU bai-viet/dong-vu-huy-73500-ty-dong-nam-2025-421-buoi-livestream.html"; exit 1)
          grep -q "bai-viet/dong-vu-huy-73500-ty-dong-nam-2025-421-buoi-livestream.html" js/data.js || (echo "THIEU dong-vu-huy-73500-ty-dong-nam-2025-421-buoi-livestream trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/dong-vu-huy-73500-ty-dong-nam-2025-421-buoi-livestream.html</loc>" sitemap.xml || (echo "THIEU dong-vu-huy-73500-ty-dong-nam-2025-421-buoi-livestream trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v255-drafts-deploy.zip
          git add bai-viet/dong-vu-huy-73500-ty-dong-nam-2025-421-buoi-livestream.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v255-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — dong-vu-huy-73500-ty-dong-nam-2025-421-buoi-livestream"
            git push
          fi
