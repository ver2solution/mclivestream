name: "Deploy v356 (Hang chon chu de Bot tom tat tin)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v356.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v356:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v356 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v356-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF 'v356-shell-1' sw.js; then echo "v356 DA DEPLOY ROI (sw.js da co v356-shell-1) - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main c755ed4) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "e1b9c4fac1e6eb0dbe960d0ebea68d61" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "494" || (echo "BASE DOI: sitemap khong con 494 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v356-deploy.zip
          echo "--- verify v356 (4 file) ---"
          for f in index.html v20.css js/bot-topics.js sw.js; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "v356-shell-1" sw.js || (echo "SAI: sw.js phai co v356-shell-1"; exit 1)
          if grep -qF "const CACHE = 'v355-shell-1'" sw.js; then echo "SAI: sw.js van dung CACHE cu v355-shell-1"; exit 1; fi
          node --check js/bot-topics.js || (echo "SAI: js/bot-topics.js loi cu phap"; exit 1)
          grep -qF "botTopicsRow" index.html || (echo "SAI: index.html phai co botTopicsRow"; exit 1)
          grep -qF "js/bot-topics.js" index.html || (echo "SAI: index.html phai nap js/bot-topics.js"; exit 1)
          grep -qF "bot-topics-row" v20.css || (echo "SAI: v20.css phai co bot-topics-row"; exit 1)
          grep -qF "v2s_bot_prefs" js/bot-topics.js || (echo "SAI: js/bot-topics.js phai dung v2s_bot_prefs"; exit 1)
          grep -qF "V2SChatBots" js/bot-topics.js || (echo "SAI: js/bot-topics.js phai dung API V2SChatBots"; exit 1)
          echo "verify OK: 4 file, sw.js v356-shell-1, hang chon chu de Bot dung chung v2s_bot_prefs"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v356-deploy.zip
          git add index.html v20.css js/bot-topics.js sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v356: Hang chon chu de Bot tom tat tin tren top muc chat cong dong (lenh anh Tho 14:10) — khach thay hang mo + nut Dang nhap, da dang nhap thay 7 chip chu de + Luu / Tat tom tat (dung chung v2s_bot_prefs + API V2SChatBots cua v325); CACHE v356-shell-1 (rebase tu c755ed4)"
            git push
          fi
