name: Deploy v351-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v351-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v351-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v351-drafts package
        run: |
          unzip -o mclivestream-v351-drafts-deploy.zip
          echo "--- verify v351-drafts (1 bai) ---"
          test -f bai-viet/loi-quan-735-ty-dong-1-buoi-live-ceo-xiaomi-bi-ep-livestream-ban-hang.html || (echo "THIEU bai-viet/loi-quan-735-ty-dong-1-buoi-live-ceo-xiaomi-bi-ep-livestream-ban-hang.html"; exit 1)
          grep -q "bai-viet/loi-quan-735-ty-dong-1-buoi-live-ceo-xiaomi-bi-ep-livestream-ban-hang.html" js/data.js || (echo "THIEU loi-quan-735-ty-dong-1-buoi-live-ceo-xiaomi-bi-ep-livestream-ban-hang trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/loi-quan-735-ty-dong-1-buoi-live-ceo-xiaomi-bi-ep-livestream-ban-hang.html</loc>" sitemap.xml || (echo "THIEU loi-quan-735-ty-dong-1-buoi-live-ceo-xiaomi-bi-ep-livestream-ban-hang trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v351-drafts-deploy.zip
          git add bai-viet/loi-quan-735-ty-dong-1-buoi-live-ceo-xiaomi-bi-ep-livestream-ban-hang.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v351-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — loi-quan-735-ty-dong-1-buoi-live-ceo-xiaomi-bi-ep-livestream-ban-hang"
            git push
          fi
