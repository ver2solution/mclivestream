name: Deploy v198

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unzip v198 overlay
        run: |
          ls -la v198.zip
          unzip -o v198.zip
          if [ ! -f tests/test-v198-categories-2026-11-13.mjs ]; then
            TOP=$(unzip -Z1 v198.zip | head -n 1 | cut -d/ -f1)
            echo "Overlay is inside top folder: $TOP"
            cp -r "$TOP"/. .
          fi
          ls tests/ js/

      - name: Run Node test on overlaid repo tree
        run: node tests/test-v198-categories-2026-11-13.mjs

      - name: Verify v198 markers
        run: |
          grep -Fq 'v198-shell-1' sw.js
          grep -Fq 'agencyAds' js/app.js
          if grep -Fq 'STAR_LIMIT_MS' js/app.js; then
            echo 'ERROR: js/app.js still contains STAR_LIMIT_MS (v185 code must not ship in v198)'
            exit 1
          fi
          COUNT=$(grep -oE 'ag-(0[1-9]|1[01])' js/data.js | sort -u | wc -l)
          echo "agencyAds ids in js/data.js: $COUNT"
          test "$COUNT" = "11"

      - name: Commit and push v198
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@users.noreply.github.com"
          git status --short
          git add -A
          git status --short
          git commit -m "v198: Kiot 2 hang hien luon + Cho thue sang Kiot + Agency Ads Livestream" || echo "nothing to commit"
          git push origin main
