name: Deploy comment-livestream revised

on:
  push:
    paths:
      - '.github/workflows/deploy-comment-livestream-revised.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-comment-livestream-revised:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip comment-livestream revised package
        run: |
          unzip -o mclivestream-comment-livestream-revised.zip
          echo "--- verify comment-livestream revised ---"
          test -f bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html || (echo "THIEU bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html"; exit 1)
          grep -q "4 buổi dùng thử miễn phí" bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html || (echo "THIEU muc 4 buoi dung thu mien phi"; exit 1)
          grep -q "Hỏi đáp nhanh" bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html || (echo "THIEU muc Hoi dap nhanh"; exit 1)
          grep -q "Vì sao chọn Ver2Solution" bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html || (echo "THIEU muc Vi sao chon Ver2Solution"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-comment-livestream-revised.zip
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy comment-livestream revised: 2.557 tu / 9 muc — them 4 buoi dung thu mien phi, Vi sao chon Ver2Solution, Hoi dap nhanh"
            git push
          fi
