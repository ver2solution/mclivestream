name: "Deploy articles-cong-nghe-2026-11-23 (4 bai)"

on:
  push:
    paths:
      - '.github/workflows/deploy-cong-nghe-2311.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cong-nghe-2311:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "628" || (echo "BASE DOI: data.js khong con 628 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "653" || (echo "BASE DOI: sitemap khong con 653 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip cong-nghe-2311 package
        run: |
          unzip -o mclivestream-cong-nghe-2311-deploy.zip
          echo "--- verify cong-nghe-2311 (4 bai moi) ---"
            test -f "bai-viet/cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop.html" || (echo "THIEU bai-viet/cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop.html"; exit 1)
            test -f "images/bai-viet/cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop.jpg" || (echo "THIEU images/bai-viet/cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop.jpg"; exit 1)
            test -f "images/bai-viet/cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop-og.jpg" || (echo "THIEU images/bai-viet/cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop-og.jpg"; exit 1)
            grep -q "bai-viet/cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop.html" js/data.js || (echo "THIEU cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop.html</loc>" sitemap.xml || (echo "THIEU cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop trong sitemap"; exit 1)
            test -f "bai-viet/instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio.html" || (echo "THIEU bai-viet/instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio.html"; exit 1)
            test -f "images/bai-viet/instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio.jpg" || (echo "THIEU images/bai-viet/instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio.jpg"; exit 1)
            test -f "images/bai-viet/instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio-og.jpg" || (echo "THIEU images/bai-viet/instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio-og.jpg"; exit 1)
            grep -q "bai-viet/instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio.html" js/data.js || (echo "THIEU instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio.html</loc>" sitemap.xml || (echo "THIEU instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio trong sitemap"; exit 1)
            test -f "bai-viet/tiktok-shop-app-rieng-mua-sam-live.html" || (echo "THIEU bai-viet/tiktok-shop-app-rieng-mua-sam-live.html"; exit 1)
            test -f "images/bai-viet/tiktok-shop-app-rieng-mua-sam-live.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-app-rieng-mua-sam-live.jpg"; exit 1)
            test -f "images/bai-viet/tiktok-shop-app-rieng-mua-sam-live-og.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-app-rieng-mua-sam-live-og.jpg"; exit 1)
            grep -q "bai-viet/tiktok-shop-app-rieng-mua-sam-live.html" js/data.js || (echo "THIEU tiktok-shop-app-rieng-mua-sam-live trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/tiktok-shop-app-rieng-mua-sam-live.html</loc>" sitemap.xml || (echo "THIEU tiktok-shop-app-rieng-mua-sam-live trong sitemap"; exit 1)
            test -f "bai-viet/bio-essence-shopee-live-ai-avatar-giai-vang.html" || (echo "THIEU bai-viet/bio-essence-shopee-live-ai-avatar-giai-vang.html"; exit 1)
            test -f "images/bai-viet/bio-essence-shopee-live-ai-avatar-giai-vang.jpg" || (echo "THIEU images/bai-viet/bio-essence-shopee-live-ai-avatar-giai-vang.jpg"; exit 1)
            test -f "images/bai-viet/bio-essence-shopee-live-ai-avatar-giai-vang-og.jpg" || (echo "THIEU images/bai-viet/bio-essence-shopee-live-ai-avatar-giai-vang-og.jpg"; exit 1)
            grep -q "bai-viet/bio-essence-shopee-live-ai-avatar-giai-vang.html" js/data.js || (echo "THIEU bio-essence-shopee-live-ai-avatar-giai-vang trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/bio-essence-shopee-live-ai-avatar-giai-vang.html</loc>" sitemap.xml || (echo "THIEU bio-essence-shopee-live-ai-avatar-giai-vang trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "657" || (echo "SAI TONG sitemap, phai 657"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "632" || (echo "SAI TONG data.js, phai 632 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Guard node-parse (bai hoc v370)
        run: |
          node -e "global.window={};const fs=require('fs');eval(fs.readFileSync('js/data.js','utf8'));const a=window.V20_DATA.articles;console.log('articles.length =',a.length);console.log('empty =',a.filter(x=>!x).length);if(a.length!==633) { console.log('SAI: articles.length phai 633'); process.exit(1); } if(a.filter(x=>!x).length){ console.log('CO EMPTY ITEM'); process.exit(1); } const want=['cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop','instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio','tiktok-shop-app-rieng-mua-sam-live','bio-essence-shopee-live-ai-avatar-giai-vang']; const miss=want.filter(s=>!a.some(x=>x&&x.page==='bai-viet/'+s+'.html')); if(miss.length){ console.log('SLUG NGOAI MANG articles:', miss); process.exit(1); } console.log('node guard OK: 4 slug moi deu TRONG mang articles');"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-cong-nghe-2311-deploy.zip || rm -f mclivestream-cong-nghe-2311-deploy.zip
          git rm -q .github/workflows/deploy-cong-nghe-2311.yml || true
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-cong-nghe-2026-11-23: 4 bai (cong-cu-livestream-tet-5-cong-cu-moi-tiktok-shop instagram-reels-thuat-toan-45-phan-tram-duoi-24-gio tiktok-shop-app-rieng-mua-sam-live bio-essence-shopee-live-ai-avatar-giai-vang)"
            git push
          fi
