name: Deploy data 2026-11-26 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-26-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-26-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-26 lots package
        run: |
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "44abf724b2f16e0ff543d2d3e8125096fdfc369816368e03487ce4b658758262" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-26-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "6b3bf4dbda18ece22d71359f4e2bf1c779291fb17937b2af95595dc6b8eb2dfd" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          for f in lot-331 lot-332 lot-333 lot-334 lot-335 lot-336 lot-337 lot-338 lot-339 lot-340 lot-341; do ls -l images/lo/$f.jpg; done
          test "$(grep -c '"id": "th-' js/data.js)" = "258" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "328" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "341" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "447" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "387" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "801" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "802" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-331.jpg images/lo/lot-332.jpg images/lo/lot-333.jpg images/lo/lot-334.jpg images/lo/lot-335.jpg images/lo/lot-336.jpg images/lo/lot-337.jpg images/lo/lot-338.jpg images/lo/lot-339.jpg images/lo/lot-340.jpg images/lo/lot-341.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-26 lots: 341 lo (11 lo moi lot-331..341 cua 26/11, 11 YouTube g3 moi nhat moi kenh; 11 anh moi), 258 mau / 328 shop / 447 xuong / 387 kiot / 802 bai viet"
            git push
          fi
