name: "Deploy articles-cong-nghe-2026-11-26 (4 bai)"

on:
  push:
    paths:
      - '.github/workflows/deploy-cong-nghe-2611.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cong-nghe-2611:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "772" || (echo "BASE DOI: data.js khong con 772 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "796" || (echo "BASE DOI: sitemap khong con 796 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip cong-nghe-2611 package
        run: |
          unzip -o mclivestream-cong-nghe-2611-deploy.zip
          echo "--- verify cong-nghe-2611 (4 bai moi) ---"
            test -f "bai-viet/quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet.html" || (echo "THIEU bai-viet/quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet.html"; exit 1)
            test -f "images/bai-viet/quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet.jpg" || (echo "THIEU images/bai-viet/quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet.jpg"; exit 1)
            test -f "images/bai-viet/quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet-og.jpg" || (echo "THIEU images/bai-viet/quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet-og.jpg"; exit 1)
            grep -q "bai-viet/quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet.html" js/data.js || (echo "THIEU quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet.html</loc>" sitemap.xml || (echo "THIEU quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet trong sitemap"; exit 1)
            test -f "bai-viet/thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026.html" || (echo "THIEU bai-viet/thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026.html"; exit 1)
            test -f "images/bai-viet/thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026.jpg" || (echo "THIEU images/bai-viet/thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026.jpg"; exit 1)
            test -f "images/bai-viet/thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026-og.jpg" || (echo "THIEU images/bai-viet/thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026-og.jpg"; exit 1)
            grep -q "bai-viet/thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026.html" js/data.js || (echo "THIEU thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026 trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026.html</loc>" sitemap.xml || (echo "THIEU thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026 trong sitemap"; exit 1)
            test -f "bai-viet/tiktok-shop-ai-diagnosis-live-bao-cao-48-gio.html" || (echo "THIEU bai-viet/tiktok-shop-ai-diagnosis-live-bao-cao-48-gio.html"; exit 1)
            test -f "images/bai-viet/tiktok-shop-ai-diagnosis-live-bao-cao-48-gio.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-ai-diagnosis-live-bao-cao-48-gio.jpg"; exit 1)
            test -f "images/bai-viet/tiktok-shop-ai-diagnosis-live-bao-cao-48-gio-og.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-ai-diagnosis-live-bao-cao-48-gio-og.jpg"; exit 1)
            grep -q "bai-viet/tiktok-shop-ai-diagnosis-live-bao-cao-48-gio.html" js/data.js || (echo "THIEU tiktok-shop-ai-diagnosis-live-bao-cao-48-gio trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/tiktok-shop-ai-diagnosis-live-bao-cao-48-gio.html</loc>" sitemap.xml || (echo "THIEU tiktok-shop-ai-diagnosis-live-bao-cao-48-gio trong sitemap"; exit 1)
            test -f "bai-viet/facebook-your-algorithm-nguoi-dung-tu-chinh-feed.html" || (echo "THIEU bai-viet/facebook-your-algorithm-nguoi-dung-tu-chinh-feed.html"; exit 1)
            test -f "images/bai-viet/facebook-your-algorithm-nguoi-dung-tu-chinh-feed.jpg" || (echo "THIEU images/bai-viet/facebook-your-algorithm-nguoi-dung-tu-chinh-feed.jpg"; exit 1)
            test -f "images/bai-viet/facebook-your-algorithm-nguoi-dung-tu-chinh-feed-og.jpg" || (echo "THIEU images/bai-viet/facebook-your-algorithm-nguoi-dung-tu-chinh-feed-og.jpg"; exit 1)
            grep -q "bai-viet/facebook-your-algorithm-nguoi-dung-tu-chinh-feed.html" js/data.js || (echo "THIEU facebook-your-algorithm-nguoi-dung-tu-chinh-feed trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/facebook-your-algorithm-nguoi-dung-tu-chinh-feed.html</loc>" sitemap.xml || (echo "THIEU facebook-your-algorithm-nguoi-dung-tu-chinh-feed trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "800" || (echo "SAI TONG sitemap, phai 800"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "776" || (echo "SAI TONG data.js, phai 776 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Guard node-parse (bai hoc v370)
        run: |
          node -e "global.window={};const fs=require('fs');eval(fs.readFileSync('js/data.js','utf8'));const a=window.V20_DATA.articles;console.log('articles.length =',a.length);console.log('empty =',a.filter(x=>!x).length);if(a.length!==777) { console.log('SAI: articles.length phai 777'); process.exit(1); } if(a.filter(x=>!x).length){ console.log('CO EMPTY ITEM'); process.exit(1); } const want=['quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet','thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026','tiktok-shop-ai-diagnosis-live-bao-cao-48-gio','facebook-your-algorithm-nguoi-dung-tu-chinh-feed']; const miss=want.filter(s=>!a.some(x=>x&&x.page==='bai-viet/'+s+'.html')); if(miss.length){ console.log('SLUG NGOAI MANG articles:', miss); process.exit(1); } console.log('node guard OK: 4 slug moi deu TRONG mang articles');"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-cong-nghe-2611-deploy.zip || rm -f mclivestream-cong-nghe-2611-deploy.zip
          git rm -q .github/workflows/deploy-cong-nghe-2611.yml || true
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-cong-nghe-2026-11-26: 4 bai (quang-cao-shopee-tet-de-cu-12-12-mo-25-11-lam-gi-truoc-tet thuc-pham-chuc-nang-len-live-ai-tra-loi-khach-2026 tiktok-shop-ai-diagnosis-live-bao-cao-48-gio facebook-your-algorithm-nguoi-dung-tu-chinh-feed)"
            git fetch origin main
            git rebase origin/main || (echo "REBASE CONFLICT: mot cron khac da deploy xong trong luc chay, DUNG LAI de rebuild"; exit 1)
            test "$(grep -c '<loc>' sitemap.xml)" = "800" || (echo "SAI TONG sitemap sau rebase, phai 800"; exit 1)
            test "$(grep -c '"page": "bai-viet/' js/data.js)" = "776" || (echo "SAI TONG data.js sau rebase, phai 776"; exit 1)
            node --check js/data.js || (echo "data.js LOI CU PHAP sau rebase"; exit 1)
            git push
          fi
