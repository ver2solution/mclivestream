name: Deploy v423-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v423-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v423-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v423-drafts package
        run: |
          unzip -o mclivestream-v423-drafts-deploy.zip
          echo "--- verify v423-drafts (1 bai) ---"
          test -f bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung.html || (echo "THIEU bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung.html"; exit 1)
          grep -q "bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung.html" js/data.js || (echo "THIEU the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung.html</loc>" sitemap.xml || (echo "THIEU the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v423-drafts-deploy.zip
          git add bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung.html images/bai-viet/the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v423-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — the-he-khong-cuoi-khong-de-chi-nuoi-thu-cung"
            git push
          fi
