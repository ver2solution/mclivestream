name: Deploy v464-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v464-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v464-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v464-drafts package
        run: |
          unzip -o mclivestream-v464-drafts-deploy.zip
          echo "--- verify v464-drafts (1 bai) ---"
          test -f bai-viet/thi-truong-thoi-trang-van-phong-nam-nu-2026-72-trieu-ty-dong-livestream.html || (echo "THIEU bai-viet/thi-truong-thoi-trang-van-phong-nam-nu-2026-72-trieu-ty-dong-livestream.html"; exit 1)
          grep -q "bai-viet/thi-truong-thoi-trang-van-phong-nam-nu-2026-72-trieu-ty-dong-livestream.html" js/data.js || (echo "THIEU thi-truong-thoi-trang-van-phong-nam-nu-2026-72-trieu-ty-dong-livestream trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/thi-truong-thoi-trang-van-phong-nam-nu-2026-72-trieu-ty-dong-livestream.html</loc>" sitemap.xml || (echo "THIEU thi-truong-thoi-trang-van-phong-nam-nu-2026-72-trieu-ty-dong-livestream trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v464-drafts-deploy.zip
          git add bai-viet/thi-truong-thoi-trang-van-phong-nam-nu-2026-72-trieu-ty-dong-livestream.html images/bai-viet/thi-truong-thoi-trang-van-phong-nam-nu-2026.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v464-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — thi-truong-thoi-trang-van-phong-nam-nu-2026-72-trieu-ty-dong-livestream"
            git push
          fi
