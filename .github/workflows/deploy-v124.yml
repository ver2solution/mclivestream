name: Deploy v124 (news rows + seeding image fix)

on:
  push:
    paths:
      - '.github/workflows/deploy-v124.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v124:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v124 package
        run: |
          unzip -o mclivestream-v124-news-rows.zip
          echo "--- verify v124 files ---"
          test -f js/app.js || (echo "THIEU js/app.js"; exit 1)
          test -f js/data.js || (echo "THIEU js/data.js"; exit 1)
          test -f danh-sach-shop.html || (echo "THIEU danh-sach-shop.html"; exit 1)
          test -f sw.js || (echo "THIEU sw.js"; exit 1)
          test -f bai-viet/dich-vu-comment-seeding-livestream.html || (echo "THIEU bai-viet/dich-vu-comment-seeding-livestream.html"; exit 1)
          grep -q "v124" sw.js || (echo "THIEU v124 trong sw.js"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f mclivestream-v124-news-rows.zip
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "v124 deploy"
            git push
          fi
