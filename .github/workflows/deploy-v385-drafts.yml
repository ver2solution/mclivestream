name: Deploy v385-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v385-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v385-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v385-drafts package
        run: |
          unzip -o mclivestream-v385-drafts-deploy.zip
          echo "--- verify v385-drafts (1 bai) ---"
          test -f bai-viet/ngo-thien-ngu-525-ty-dong-1-buoi-live-7-meo-ban-hang-dat-tien-chuyen-doi-1322-phan-tram.html || (echo "THIEU bai-viet/ngo-thien-ngu-525-ty-dong-1-buoi-live-7-meo-ban-hang-dat-tien-chuyen-doi-1322-phan-tram.html"; exit 1)
          grep -q "bai-viet/ngo-thien-ngu-525-ty-dong-1-buoi-live-7-meo-ban-hang-dat-tien-chuyen-doi-1322-phan-tram.html" js/data.js || (echo "THIEU ngo-thien-ngu-525-ty-dong-1-buoi-live-7-meo-ban-hang-dat-tien-chuyen-doi-1322-phan-tram trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/ngo-thien-ngu-525-ty-dong-1-buoi-live-7-meo-ban-hang-dat-tien-chuyen-doi-1322-phan-tram.html</loc>" sitemap.xml || (echo "THIEU ngo-thien-ngu-525-ty-dong-1-buoi-live-7-meo-ban-hang-dat-tien-chuyen-doi-1322-phan-tram trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v385-drafts-deploy.zip
          git add bai-viet/ngo-thien-ngu-525-ty-dong-1-buoi-live-7-meo-ban-hang-dat-tien-chuyen-doi-1322-phan-tram.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v385-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — ngo-thien-ngu-525-ty-dong-1-buoi-live-7-meo-ban-hang-dat-tien-chuyen-doi-1322-phan-tram"
            git push
          fi
