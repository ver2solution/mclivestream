name: Deploy v400-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v400-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v400-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v400-drafts package
        run: |
          unzip -o mclivestream-v400-drafts-deploy.zip
          echo "--- verify v400-drafts (1 bai) ---"
          test -f bai-viet/shopee-live-11-11-gmv-tang-12-lan-don-tang-9-lan-shop-viet-hoc-gi-truoc-black-friday.html || (echo "THIEU bai-viet/shopee-live-11-11-gmv-tang-12-lan-don-tang-9-lan-shop-viet-hoc-gi-truoc-black-friday.html"; exit 1)
          grep -q "bai-viet/shopee-live-11-11-gmv-tang-12-lan-don-tang-9-lan-shop-viet-hoc-gi-truoc-black-friday.html" js/data.js || (echo "THIEU shopee-live-11-11-gmv-tang-12-lan-don-tang-9-lan-shop-viet-hoc-gi-truoc-black-friday trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/shopee-live-11-11-gmv-tang-12-lan-don-tang-9-lan-shop-viet-hoc-gi-truoc-black-friday.html</loc>" sitemap.xml || (echo "THIEU shopee-live-11-11-gmv-tang-12-lan-don-tang-9-lan-shop-viet-hoc-gi-truoc-black-friday trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v400-drafts-deploy.zip
          git add bai-viet/shopee-live-11-11-gmv-tang-12-lan-don-tang-9-lan-shop-viet-hoc-gi-truoc-black-friday.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v400-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — shopee-live-11-11-gmv-tang-12-lan-don-tang-9-lan-shop-viet-hoc-gi-truoc-black-friday"
            git push
          fi
