name: Deploy data 2026-11-26 lao-dong-tu-do

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-26-lao-dong-tu-do.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-26-lao-dong-tu-do:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard live data.js unchanged (v233/v234)
        run: |
          curl -s -o /tmp/live-data.js https://vieclamlivestream.online/js/data.js
          LIVE_SHA="$(sha256sum /tmp/live-data.js | cut -d' ' -f1)"
          echo "live sha: $LIVE_SHA"
          test "$LIVE_SHA" = "44abf724b2f16e0ff543d2d3e8125096fdfc369816368e03487ce4b658758262" || (echo "LIVE CHANGED since staging base — STOP, rebase first"; exit 1)
      - name: Unzip data 2026-11-26 lao-dong-tu-do package
        run: |
          unzip -o mclivestream-data-2026-11-26-lao-dong-tu-do-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "be5a2d5f4028101376c18c29c8fce6147e845041ec441bf7eb188c0599ae5022" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "freelance jobs: $(grep -c '"id":"fl-' js/data.js)"
          echo "freelance people: $(grep -c '"id":"fp-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "258" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "328" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "330" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "447" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "387" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"id":"fl-' js/data.js)" = "16" || (echo "BAD freelance jobs count"; exit 1)
          test "$(grep -c '"id":"fp-' js/data.js)" = "2" || (echo "BAD freelance people count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "801" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "802" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-26 lao-dong-tu-do: 16 viec + 2 nguoi (san-xuat 4, van-tai 2, dich-vu 3, cham-soc 4, xay-dung 3, nong-nghiep 0, ca-nhan 2), 258 mau / 328 shop / 330 lo / 447 xuong / 387 kiot / 802 bai viet"
            git push
          fi
