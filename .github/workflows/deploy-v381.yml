# Workflow deploy v381 (khóa tạm nút "Cấp quyền admin" — chỉ Owner thấy nút).
# Gói: js/admin.js + sw.js (CACHE v381-shell-1), nhánh fix/lock-grant-admin-v381
# (commit d6048bd, rebase từ origin/main a24394b).
# BASE guard đúng cho trạng thái live SAU v380-drafts (data.js md5 4599b0ed,
# sitemap 546 URL, CACHE live v380-shell-1 — kiểm lại 21:00 20/11).
# Zip: mclivestream-v381-deploy.zip = js/admin.js + sw.js.
name: "Deploy v381 (khoa tam nut Cap quyen admin — chi Owner thay nut)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v381.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v381:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v381 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v381-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF 'v381-shell-1' sw.js; then echo "v381 DA DEPLOY ROI (sw.js da co v381-shell-1) - dung"; exit 1; fi
          echo "--- Guard thu tu: v380 phai live truoc ---"
          grep -qF "const CACHE = 'v380-shell-1'" sw.js || (echo "v380 CHUA LIVE (sw.js chua co v380-shell-1) - dung, doi v380 xong"; exit 1)
          echo "--- BASE guard (base sau v380-drafts: data.js + sitemap) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "4599b0edbf920fdaddbaf44851f25ac2" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "546" || (echo "BASE DOI: sitemap khong con 546 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v381-deploy.zip
          echo "--- verify v381 (2 file doi) ---"
          for f in js/admin.js sw.js; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "const CACHE = 'v381-shell-1'" sw.js || (echo "SAI: sw.js phai co const CACHE v381-shell-1"; exit 1)
          if grep -qF "const CACHE = 'v380-shell-1'" sw.js; then echo "SAI: sw.js van dung CACHE cu v380-shell-1"; exit 1; fi
          node --check sw.js || (echo "SAI: sw.js loi cu phap"; exit 1)
          node --check js/admin.js || (echo "SAI: js/admin.js loi cu phap"; exit 1)
          echo "--- verify khoa nut v381: OWNER_UID + isOwner + guard ---"
          grep -qF "var OWNER_UID = '6ffc8507-4020-40a2-b79d-9d022ba7a915'" js/admin.js || (echo "SAI: js/admin.js thieu OWNER_UID (Owner ver2solution@gmail.com)"; exit 1)
          grep -qF "function isOwner()" js/admin.js || (echo "SAI: js/admin.js thieu ham isOwner()"; exit 1)
          grep -qF "(isOwner() ? '<button class=\"btn btn-ghost btn-sm\" id=\"admGrantAdminBtn\"" js/admin.js || (echo "SAI: nut Cap quyen admin chua co dieu kien isOwner()"; exit 1)
          grep -qF "Chỉ Owner mới được cấp quyền admin" js/admin.js || (echo "SAI: onGrantAdmin thieu guard chi-Owner"; exit 1)
          echo "--- guard hoi quy v380-drafts (bai La Chapelle phai con) ---"
          test -f "bai-viet/la-chapelle-4550-ty-dong-double-11-2026-ban-da-san-kuaishou-tang-169-phan-tram.html" || (echo "SAI: mat bai La Chapelle Double 11 (v380-drafts)"; exit 1)
          echo "--- guard hoi quy v378 (marker B-06 phai con) ---"
          grep -qF "cộng ngay khi gửi" dang-ky.html || (echo "SAI: dang-ky.html mat 'cộng ngay khi gửi' (v378)"; exit 1)
          grep -qF "tổng tương tác giảm dần" trang-cua-toi.html || (echo "SAI: trang-cua-toi.html mat 'tổng tương tác giảm dần' (v378)"; exit 1)
          echo "--- guard hoi quy v377 (defer x3 phai con) ---"
          grep -qF 'js/data.js" defer' danh-sach-mau.html || (echo "SAI: danh-sach-mau.html mat data.js defer (v377)"; exit 1)
          grep -qF 'js/app.js" defer' danh-sach-mau.html || (echo "SAI: danh-sach-mau.html mat app.js defer (v377)"; exit 1)
          grep -qF 'js/ticker.js" defer' danh-sach-mau.html || (echo "SAI: danh-sach-mau.html mat ticker.js defer (v377)"; exit 1)
          echo "--- guard hoi quy v375 (res.data phai con) ---"
          grep -qF "res.data" nguoi-dung.html || (echo "SAI: nguoi-dung.html mat res.data (v375)"; exit 1)
          echo "--- guard hoi quy v374 (refreshList + scrollToCommentHash phai con) ---"
          grep -qF "refreshList" js/comments.js || (echo "SAI: js/comments.js mat refreshList (v374)"; exit 1)
          grep -qF "scrollToCommentHash" js/comments.js || (echo "SAI: js/comments.js mat scrollToCommentHash (v370)"; exit 1)
          echo "--- guard hoi quy v372 (linkifyText phai con) ---"
          grep -qF "linkifyText" js/chat-page.js || (echo "SAI: js/chat-page.js mat linkifyText (v372)"; exit 1)
          grep -qF "linkifyText" js/community-chat.js || (echo "SAI: js/community-chat.js mat linkifyText (v372)"; exit 1)
          echo "verify OK: 2 file, sw.js v381-shell-1, khoa nut du marker + hoi quy du"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v381-deploy.zip
          git add js/admin.js sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v381: khoa tam nut 'Cap quyen admin' — chi Owner (ver2solution@gmail.com, UID 6ffc8507…) thay nut (js/admin.js OWNER_UID/isOwner + guard onGrantAdmin); CACHE v381-shell-1 (rebase tu a24394b)"
            git push
          fi
