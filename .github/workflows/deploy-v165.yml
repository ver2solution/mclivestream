name: Deploy v165 (profile claim V1)

on:
  push:
    paths:
      - '.github/workflows/deploy-v165.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v165:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v165 package
        run: |
          unzip -o mclivestream-v165-deploy.zip
          echo "--- verify v165 markers ---"
          grep -q "v165-shell-1" sw.js || (echo "THIEU v165-shell-1 trong sw.js"; exit 1)
          grep -q "V2SClaim" js/claim.js || (echo "THIEU V2SClaim trong js/claim.js"; exit 1)
          grep -q "claimBanner" trang-cua-toi.html || (echo "THIEU claimBanner trong trang-cua-toi.html"; exit 1)
          echo "verify OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m 'v165: profile claim V1 (phone match + admin approval) + fix session display bugs'
            git push
          fi
