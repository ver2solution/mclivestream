name: Deploy v93
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v93 package
        run: |
          unzip -o mclivestream-v93-deploy.zip -d /tmp/v93
          ls -l /tmp/v93
      - name: Copy files with checksum
        run: |
          rsync --checksum /tmp/v93/online-counter.js js/online-counter.js
          rsync --checksum /tmp/v93/sw.js sw.js
      - name: Verify sha256 and cache name
        run: |
          sha256sum js/online-counter.js sw.js
          grep -q "v93-shell-1" sw.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/online-counter.js sw.js
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "v93: online counter 6-tick cycle, sw cache v93-shell-1"
          git push
