name: "Deploy v372 (B-20261120-08: URL trong tin nhan chat thanh link bam duoc)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v372.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v372:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v372 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v372-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF 'v372-shell-1' sw.js; then echo "v372 DA DEPLOY ROI (sw.js da co v372-shell-1) - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main 5d1c46c) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "448e420c8ec971d8ce413104414e4a2e" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -o '<loc>' sitemap.xml | wc -l)" -eq 543 || (echo "BASE DOI: sitemap khong con 543 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v372-deploy.zip
          echo "--- verify v372 (3 file doi) ---"
          for f in js/chat-page.js js/community-chat.js sw.js; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "const CACHE = 'v372-shell-1'" sw.js || (echo "SAI: sw.js phai co const CACHE v372-shell-1"; exit 1)
          if grep -qF "const CACHE = 'v371-shell-1'" sw.js; then echo "SAI: sw.js van dung CACHE cu v371-shell-1"; exit 1; fi
          node --check js/chat-page.js || (echo "SAI: js/chat-page.js loi cu phap"; exit 1)
          node --check js/community-chat.js || (echo "SAI: js/community-chat.js loi cu phap"; exit 1)
          node --check sw.js || (echo "SAI: sw.js loi cu phap"; exit 1)
          grep -qF "linkifyText" js/chat-page.js || (echo "SAI: js/chat-page.js phai co linkifyText"; exit 1)
          grep -qF "linkifyText" js/community-chat.js || (echo "SAI: js/community-chat.js phai co linkifyText"; exit 1)
          echo "verify OK: 3 file, sw.js v372-shell-1, URL trong tin chat thanh link bam duoc"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v372-deploy.zip
          git add js/chat-page.js js/community-chat.js sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v372: B-20261120-08 URL trong tin nhan chat thanh link bam duoc (mo tab moi); CACHE v372-shell-1 (renumbered tu v371 vi v371-shell-1 da bi v371-drafts dung; rebase tu 5d1c46c)"
            git push
          fi
