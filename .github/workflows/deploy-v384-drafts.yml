name: Deploy v384-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v384-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v384-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v384-drafts package
        run: |
          unzip -o mclivestream-v384-drafts-deploy.zip
          echo "--- verify v384-drafts (1 bai) ---"
          test -f bai-viet/kuaishou-yoola-350-trieu-dong-1-game-lam-bang-cau-chu-ai-bien-nguoi-xem-livestream-thanh-nguoi-choi.html || (echo "THIEU bai-viet/kuaishou-yoola-350-trieu-dong-1-game-lam-bang-cau-chu-ai-bien-nguoi-xem-livestream-thanh-nguoi-choi.html"; exit 1)
          grep -q "bai-viet/kuaishou-yoola-350-trieu-dong-1-game-lam-bang-cau-chu-ai-bien-nguoi-xem-livestream-thanh-nguoi-choi.html" js/data.js || (echo "THIEU kuaishou-yoola-350-trieu-dong-1-game-lam-bang-cau-chu-ai-bien-nguoi-xem-livestream-thanh-nguoi-choi trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/kuaishou-yoola-350-trieu-dong-1-game-lam-bang-cau-chu-ai-bien-nguoi-xem-livestream-thanh-nguoi-choi.html</loc>" sitemap.xml || (echo "THIEU kuaishou-yoola-350-trieu-dong-1-game-lam-bang-cau-chu-ai-bien-nguoi-xem-livestream-thanh-nguoi-choi trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v384-drafts-deploy.zip
          git add bai-viet/kuaishou-yoola-350-trieu-dong-1-game-lam-bang-cau-chu-ai-bien-nguoi-xem-livestream-thanh-nguoi-choi.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v384-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — kuaishou-yoola-350-trieu-dong-1-game-lam-bang-cau-chu-ai-bien-nguoi-xem-livestream-thanh-nguoi-choi"
            git push
          fi
