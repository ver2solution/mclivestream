name: deploy-v288
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v288:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v288 package
        run: |
          unzip -o v288-kiot-subtypes.zip
          ls -l js/data.js js/app.js js/search.js thanh-ly-kiot.html sw.js
      - name: Verify package contents
        run: |
          set -e
          test "$(grep -o '"subType"' js/data.js | wc -l)" = "43"
          grep -Fq "KIOT_SUBTYPES" js/app.js
          grep -Fq "kiotSubtypeLabel" js/app.js
          grep -Fq "KIOT_SUBTYPE_LABELS" js/search.js
          grep -Fq "refreshKiotCatOptions" thanh-ly-kiot.html
          grep -Fq "v288-shell-1" sw.js
          node --check js/app.js
          node --check js/search.js
          node --check js/data.js
          node --check sw.js
          echo "OK: v288 v229 loai hinh con Kiot rebase (5 file, 43 subType, CACHE v288-shell-1)"
      - name: Commit v288 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/data.js js/app.js js/search.js thanh-ly-kiot.html sw.js
          echo "So file staged:"
          git status --short | wc -l
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v288 v229 loai hinh con Kiot rebase (5 file)"
            git push
          fi
