name: Deploy v123-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v123-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v123-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v123-drafts package
        run: |
          unzip -o mclivestream-v123-drafts-deploy.zip
          echo "--- verify v123-drafts (1 bai) ---"
          test -f bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html || (echo "THIEU bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html"; exit 1)
          grep -q "bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html" js/data.js || (echo "THIEU dich-vu-comment-livestream-tang-don-ban-hang trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html</loc>" sitemap.xml || (echo "THIEU dich-vu-comment-livestream-tang-don-ban-hang trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v123-drafts-deploy.zip
          git add bai-viet/dich-vu-comment-livestream-tang-don-ban-hang.html images/bai-viet/dich-vu-comment-livestream-bang-gia.jpg images/bai-viet/dich-vu-comment-livestream-cach-hoat-dong.jpg images/bai-viet/dich-vu-comment-livestream-hero-og.jpg images/bai-viet/dich-vu-comment-livestream-hero.jpg images/bai-viet/dich-vu-comment-livestream-loi-ich.jpg images/bai-viet/dich-vu-comment-livestream-phan-tich.jpg images/bai-viet/dich-vu-comment-livestream-van-de.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v123-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — dich-vu-comment-livestream-tang-don-ban-hang"
            git push
          fi
