name: Deploy v125-vieclam

on:
  push:
    paths:
      - '.github/workflows/deploy-v125-vieclam.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v125-vieclam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v125-vieclam package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v125-vieclam-deploy.zip
          echo "--- verify v125-vieclam payload (10 HTML + 25 images) ---"
          ls bai-viet/viec-lam-tiktok-shop-dong-nam-a-thu-nhap-hoa-hong-ky-nang.html bai-viet/viec-lam-livestream-trung-quoc-tuyen-host-douyin-luong-cao.html bai-viet/nghe-creator-livestream-250-ty-usd-ai-kiem-duoc-tien.html bai-viet/viec-lam-livestream-dong-nam-a-host-indonesia-thai-lan.html bai-viet/nghe-livestream-trung-quoc-15-trieu-nguoi-luong-ra-sao.html bai-viet/viec-lam-mc-livestream-2026.html bai-viet/mau-livestream-luong-theo-gio.html bai-viet/viec-lam-livestream-tai-nha.html bai-viet/mau-livestream-khong-can-kinh-nghiem.html bai-viet/luong-mau-livestream-2026.html
          echo "hero images: $(ls images/bai-viet/*-hero.jpg | wc -l) (expect 10)"
          echo "hero-og images: $(ls images/bai-viet/*-hero-og.jpg | wc -l) (expect 10)"
          echo "in-body images (-2.jpg): $(ls images/bai-viet/*-2.jpg | wc -l) (expect 5)"
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v125-vieclam-deploy.zip
          git add -A
          git status --short | head -40
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy 10 bai Viec Lam + 25 anh (fix 404)"
            git push
          fi
