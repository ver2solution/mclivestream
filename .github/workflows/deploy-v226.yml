name: deploy-v226
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v226:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v226 package
        run: |
          unzip -o v226.zip
          ls -l js/app.js sw.js
          sha256sum js/app.js sw.js
      - name: Verify package contents
        run: |
          set -e
          test "$(sha256sum js/app.js | cut -d' ' -f1)" = "982b636ad695526d2a610bfe28c84d57609409db03fd4cc38a523344da44f93e"
          test "$(sha256sum sw.js | cut -d' ' -f1)" = "b9e2b0e052336ffd82b1500b9a67b78976e99a7d4ae48ebf0a1741ab4d8b3322"
          grep -Fq "v226 (L4)" js/app.js
          grep -Fq "v226-shell-1" sw.js
      - name: Commit v226 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v226 parseHourlyMin chi lay so tien ke moc gio (L4); js/app.js + sw.js CACHE v226-shell-1"
            git push
          fi
