name: Deploy v143-articles (40 bai 11/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v143-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v143-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v143-articles package
        run: |
          unzip -o mclivestream-v143-articles-deploy.zip
          echo "--- verify v143-articles (40 bai) ---"
          for slug in doanh-thu-11-11-viet-nam-shopee-lazada-tiktok-shop livestream-chiem-bao-nhieu-doanh-thu-11-11 doanh-thu-11-11-trung-quoc-alibaba-jd-douyin 11-11-dong-nam-a-shopee-lazada-tiktok-shop 11-11-toan-cau-bai-hoc-shop-viet tuyen-streamer-game thong-ke-ho-so-moi-10-11-2026 56209-gian-hang-bien-mat-mot-quy-metric-q3-2026 diep-le-doi-vuong-mien-live-shopee-chien-than-tung-deal douyin-11-11-phong-live-tren-10-trieu-ndt-tang-98-phan-tram sinh-vien-kiem-6-con-so-nho-tiktok-shop-talon-krebs sac-ngoc-khang-tiktok-shop-tang-66-lan-nho-live-video shopee-live-video-tang-don-52-phan-tram-video-ngan-dan-ve-live 11-11-trung-quoc-khong-san-nao-cong-bo-gmv-ban-le-tuc-thi koc-viet-hoa-hong-47-67-trieu-moi-ngay-dinh-cao-hay-mat-bang boc-me-live-nong-san-kol-4-phien-1724-don-nong-dan-606-don tiktok-shop-11-11-2026-viet-nam-ban-3-15-11 shopee-11-11-2026-6-khung-gio-vang-voucher-11-trieu tiktok-shop-auto-post-carousel-tu-dang-2026 facebook-reels-2026-thuat-toan-day-video-goc facebook-live-video-ads-2026-meta-ban-mat-xem-live facebook-groups-2026-keo-khach-ve-live-dung-luat shop-nho-giu-tien-mua-11-11-tien-ve-khi-nao thang-11-12-di-dau-dep-nhat-mau-livestream-sau-mua-sale 11-11-trung-quoc-2026-bo-coupon-124-hang-can-moc-lon gia-vang-hom-nay-11-11-2026-sjc-140-9-trieu thue-ban-hang-online-2026-shop-nho-can-biet phi-san-shopee-tiktok-shop-lazada-thang-11-2026 tiktok-shop-vs-shopee-cuoi-2026-shop-nho-chon-san-nao fomo-khach-chot-don-trong-live-3-nghien-cuu-moi mat-hang-tiem-nang-ban-livestream-tet-2027 shopee-tang-phi-04-10-shop-nho-tinh-lai-gia-ban thue-mau-livestream-gia-bao-nhieu-1-gio-theo-tinh thue-mau-livestream-lan-dau-5-sai-lam-live-flop mc-ai-live-24-7-hon-100000-shop-tq-da-dung xa-kho-cuoi-nam-3-chieu-thu-hoi-von-truoc-tet nhap-hang-trung-quoc-don-tet-2027-chot-don-truoc-thang-12 mat-hang-nao-noi-nhat-mua-11-11-bach-hoa-tang-806-phan-tram lazada-11-11-2026-live-9-tieng-voucher-11-trieu-shop-nho-lam-gi boc-me-hannah-olala-tu-kol-my-pham-toi-thuong-vu-750-ty-marico; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"title":' js/data.js)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v143-articles-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v143-articles: 40 bai viet 11/11/2026 (5 series 11.11 + tuyen-streamer-game + thong-ke-ho-so-moi-10-11 + 33 tin tuc, chu de xoay vong #4 Hannah Olala cuoi)"
            git push
          fi
