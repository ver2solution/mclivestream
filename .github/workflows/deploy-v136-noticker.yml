name: Deploy v136-noticker

on:
  push:
    paths:
      - '.github/workflows/deploy-v136-noticker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v136-noticker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v136-noticker package
        run: |
          unzip -o mclivestream-v136-noticker.zip
          echo "--- verify v136-noticker payload (5 files) ---"
          grep -q "const CACHE = 'v136-shell-1';" sw.js && echo "sw.js CACHE v136-shell-1 OK"
          for f in index.html danh-sach-mau.html danh-sach-shop.html thanh-ly-kiot.html; do
            if grep -q 'ticker' "$f"; then echo "LOI: $f van con ticker"; exit 1; else echo "$f khong con ticker OK"; fi
          done
          grep -q 'href="danh-sach-mau.html" class="">Dành cho Shop' index.html && echo "index nav Mau->Shop label OK"
          grep -q 'href="danh-sach-shop.html" class="">Dành cho Mẫu' index.html && echo "index nav Shop->Mau label OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v136-noticker.zip
          git add -A
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v136: go chu chay (ticker) khoi 4 trang + bump CACHE v136 (hoan tac v127 ticker)"
            git push
          fi
