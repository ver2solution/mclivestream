name: Deploy v92 fix (temp)

on:
  push:
    paths:
      - '.github/workflows/deploy-v92-fix.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flatten v92 package folder to site root
        run: |
          ls -la
          ls mclivestream-final-v88-prep | head -n 20
          test -f mclivestream-final-v88-prep/sw.js
          grep -q 'v92-shell-1' mclivestream-final-v88-prep/sw.js
          rsync -a \
            --exclude='android/' \
            --exclude='tools/' \
            --exclude='.well-known/' \
            --exclude='docs-diem-thuong-*.md' \
            --exclude='docs-email-*.md' \
            --exclude='PORTABILITY.md' \
            --exclude='README.md' \
            --exclude='site.config.json' \
            --exclude='supabase-config.example.js' \
            --exclude='js/data.js' \
            mclivestream-final-v88-prep/ ./
          rm -rf mclivestream-final-v88-prep
          ls -la
          test ! -e mclivestream-final-v88-prep
          grep -q 'v92-shell-1' sw.js
          git status --short

      - name: Commit deployed site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "v92: deploy site files (fix: flatten package folder)"
            git push
          fi

      - name: Remove this workflow
        run: |
          rm -f .github/workflows/deploy-v92-fix.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean up."
          else
            git commit -m "v92: remove temp fix workflow"
            git push
          fi
