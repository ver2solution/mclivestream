name: "Deploy hang-hoa-2611 (4 bai Hang hoa 26/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-hang-hoa-2611.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-hang-hoa-2611:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'banh-keo-tet-ban-online-nhap-keo-ngoai-hay-keo-viet' js/data.js; then echo "hang-hoa-2611 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "a847c87539af360e4c15c340e02a5c29" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "788" || (echo "BASE DOI: data.js khong con 788 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "812" || (echo "BASE DOI: sitemap khong con 812 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip hang-hoa-2611 package
        run: |
          unzip -o mclivestream-hang-hoa-2611-deploy.zip
          echo "--- verify hang-hoa-2611 (4 bai) ---"
          for slug in banh-keo-tet-ban-online-nhap-keo-ngoai-hay-keo-viet thuc-pham-chuc-nang-ban-tet-shop-nen-nhap-nhom-nao thuc-pham-chuc-nang-tiktok-shop-magnesium-dan-dau-7-ngay banh-donut-slowpoke-345-yen-pokemon-ban-bang-anh; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "816" || (echo "SAI TONG sitemap, phai 816"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "792" || (echo "SAI TONG data.js, phai 792"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-hang-hoa-2611-deploy.zip || rm -f mclivestream-hang-hoa-2611-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-hang-hoa-2026-11-26: 4 bai (banh-keo-tet-ban-online-nhap-keo-ngoai-hay-keo-viet, thuc-pham-chuc-nang-ban-tet-shop-nen-nhap-nhom-nao, thuc-pham-chuc-nang-tiktok-shop-magnesium-dan-dau-7-ngay, banh-donut-slowpoke-345-yen-pokemon-ban-bang-anh)"
            git push
          fi
