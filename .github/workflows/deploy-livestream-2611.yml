name: "Deploy livestream-2611 (4 bai Livestream 26/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-livestream-2611.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-livestream-2611:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'cach-tang-mat-xem-livestream-tet-lich-co-dinh-li-xi' js/data.js; then echo "livestream-2611 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "6db18f3c3251ecb2325d2ca53ad2fe92" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "764" || (echo "BASE DOI: data.js khong con 764 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "788" || (echo "BASE DOI: sitemap khong con 788 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip livestream-2611 package
        run: |
          unzip -o mclivestream-livestream-2611-deploy.zip
          echo "--- verify livestream-2611 (4 bai) ---"
          for slug in cach-tang-mat-xem-livestream-tet-lich-co-dinh-li-xi livestream-ban-thuc-pham-chuc-nang-thi-truong-132-ty-usd livestream-black-friday-27-11-checklist-24-gio-cuoi shopee-live-11-11-gmv-tang-12-lan-25-ty-luot-xem; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "792" || (echo "SAI TONG sitemap, phai 792"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "768" || (echo "SAI TONG data.js, phai 768"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-livestream-2611-deploy.zip || rm -f mclivestream-livestream-2611-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-livestream-2026-11-26: 4 bai (cach-tang-mat-xem-livestream-tet-lich-co-dinh-li-xi, livestream-ban-thuc-pham-chuc-nang-thi-truong-132-ty-usd, livestream-black-friday-27-11-checklist-24-gio-cuoi, shopee-live-11-11-gmv-tang-12-lan-25-ty-luot-xem)"
            git push
          fi
