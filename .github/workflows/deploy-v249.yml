name: deploy-v249
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v249:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v249 package
        run: |
          unzip -o v249-mb-16.zip
          ls -l js/app.js sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "data-detail-id" js/app.js
          grep -Fq "Giá đơn vị" js/app.js
          grep -Fq "CACHE = 'v249-shell-1'" sw.js
          node --check js/app.js
          node --check sw.js
      - name: Commit v249 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v249 MB-16 them data-detail-id the lo + hang Gia don vi modal lo + sw.js v249-shell-1"
            git push
          fi
