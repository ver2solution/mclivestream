name: deploy-v164

on:
  push:
    paths:
      - .github/workflows/deploy-v164.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v164 deploy package
        run: unzip -o mclivestream-v164-deploy.zip -d .
      - name: Verify v164 contents
        run: |
          grep -F "v164-shell-1" sw.js
          grep -F 'maxlength="10000"' quan-tri.html
          grep -F "Thọ Zalo" quan-tri.html
          grep -F "10000" js/admin.js
      - name: Commit and push v164
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@users.noreply.github.com"
          git add -A
          git commit -m "v164: chat limit 10000 + rename Muse BDS to Tho Zalo, bump sw CACHE to v164-shell-1"
          git push
