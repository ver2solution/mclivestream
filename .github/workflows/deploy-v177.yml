name: deploy-v177
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip deploy package
        run: |
          unzip -o mclivestream-v177-disclaimer-deploy.zip
          rm mclivestream-v177-disclaimer-deploy.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v177: ghi chu ho so (mien tru + ghim sao)" || echo "nothing to commit"
          git push
