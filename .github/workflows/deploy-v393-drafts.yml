name: Deploy v393-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v393-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v393-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v393-drafts package
        run: |
          unzip -o mclivestream-v393-drafts-deploy.zip
          echo "--- verify v393-drafts (1 bai) ---"
          test -f bai-viet/co-bida-way-cues-74-ty-dong-video-duoi-dai-6-ngay-gmv-tang-gap-doi.html || (echo "THIEU bai-viet/co-bida-way-cues-74-ty-dong-video-duoi-dai-6-ngay-gmv-tang-gap-doi.html"; exit 1)
          grep -q "bai-viet/co-bida-way-cues-74-ty-dong-video-duoi-dai-6-ngay-gmv-tang-gap-doi.html" js/data.js || (echo "THIEU co-bida-way-cues-74-ty-dong-video-duoi-dai-6-ngay-gmv-tang-gap-doi trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/co-bida-way-cues-74-ty-dong-video-duoi-dai-6-ngay-gmv-tang-gap-doi.html</loc>" sitemap.xml || (echo "THIEU co-bida-way-cues-74-ty-dong-video-duoi-dai-6-ngay-gmv-tang-gap-doi trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v393-drafts-deploy.zip
          git add bai-viet/co-bida-way-cues-74-ty-dong-video-duoi-dai-6-ngay-gmv-tang-gap-doi.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v393-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — co-bida-way-cues-74-ty-dong-video-duoi-dai-6-ngay-gmv-tang-gap-doi"
            git push
          fi
