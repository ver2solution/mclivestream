name: "Deploy thi-truong-2811 (4 bai Thị trường 28/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-thi-truong-2811.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-thi-truong-2811:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'thi-truong-thuong-mai-dien-tu-cuoi-nam-825-ty-usd' js/data.js; then echo "thi-truong-2811 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "51d7b95989e5f3b2f5a87d58cafa6b95" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "857" || (echo "BASE DOI: data.js khong con 857 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "882" || (echo "BASE DOI: sitemap khong con 882 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip thi-truong-2811 package
        run: |
          # ZIP duoc day len qua GitHub MCP connector nen noi dung file la base64 text
          # (connector base64-encode chuoi content). Thu giai ma truoc roi unzip.
          if ! unzip -o mclivestream-thi-truong-2811-deploy.zip >/dev/null 2>&1; then
            echo "Khong phai zip tho - thu base64 -d"
            base64 -d mclivestream-thi-truong-2811-deploy.zip > /tmp/pkg-2811.zip
            unzip -o /tmp/pkg-2811.zip
          fi
          # Zip nay khong chua file -og.jpg (de nhe); copy tu anh hero
          for slug in thi-truong-thuong-mai-dien-tu-cuoi-nam-825-ty-usd thi-truong-thoi-trang-van-phong-2026-276-ty-usd thoi-trang-van-phong-nu-2026-tang-nhanh-nhat thoi-trang-van-phong-nam-2026-nam-chiem-60-phan-tram; do
            cp "images/bai-viet/$slug.jpg" "images/bai-viet/$slug-og.jpg"
          done
          echo "--- verify thi-truong-2811 (4 bai) ---"
          for slug in thi-truong-thuong-mai-dien-tu-cuoi-nam-825-ty-usd thi-truong-thoi-trang-van-phong-2026-276-ty-usd thoi-trang-van-phong-nu-2026-tang-nhanh-nhat thoi-trang-van-phong-nam-2026-nam-chiem-60-phan-tram; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "886" || (echo "SAI TONG sitemap, phai 886"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "861" || (echo "SAI TONG data.js, phai 861"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-thi-truong-2811-deploy.zip || rm -f mclivestream-thi-truong-2811-deploy.zip
          git rm -q .github/workflows/deploy-thi-truong-2811.yml || true
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-thi-truong-2026-11-28: 4 bai moi (SEO V2)"
            git push
          fi
