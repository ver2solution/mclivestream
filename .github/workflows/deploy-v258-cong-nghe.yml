name: Deploy v258-cong-nghe (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-v258-cong-nghe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v258-cong-nghe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "274" || (echo "BASE DOI: data.js khong con 274 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "300" || (echo "BASE DOI: sitemap khong con 300 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip v258-cong-nghe package
        run: |
          unzip -o mclivestream-v258-cong-nghe-deploy.zip
          echo "--- verify v258-cong-nghe (4 bai) ---"
          for slug in ai-streamer-tet-9-trieu-gio-live-mien-phi-den-31-12 gmv-max-tiktok-shop-2026-hoa-hong-affiliate-tinh-vao-roi thuat-toan-facebook-2026-chu-de-moi-duoc-uu-tien-hien-thi chatbot-cham-soc-khach-tet-57-phan-tram-khi-co-nguoi; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "304" || (echo "SAI TONG sitemap, phai 304"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "278" || (echo "SAI TONG data.js, phai 278"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v258-cong-nghe-deploy.zip || rm -f mclivestream-v258-cong-nghe-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v258-cong-nghe: 4 bai Cong nghe 15/11/2026 (ai-streamer-tet-9-trieu-gio-live-mien-phi-den-31-12, gmv-max-tiktok-shop-2026-hoa-hong-affiliate-tinh-vao-roi, thuat-toan-facebook-2026-chu-de-moi-duoc-uu-tien-hien-thi, chatbot-cham-soc-khach-tet-57-phan-tram-khi-co-nguoi)"
            git push
          fi
