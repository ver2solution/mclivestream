name: Deploy v206

on:
  push:
    paths:
      - '.github/workflows/deploy-v206.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v206:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v206 package
        run: |
          unzip -o v206.zip
          echo "--- verify v206 payload ---"
          grep -m1 "cao hơn 10.000 NDT so với thế hệ đầu" bai-viet/livestream-ban-xe-xiaomi-su7-88898-don-24-gio.html
          if grep -q "cao hơn hơn 10.000 NDT" bai-viet/livestream-ban-xe-xiaomi-su7-88898-don-24-gio.html; then echo "FAIL: typo still present"; exit 1; fi
          echo "typo gone, fix confirmed"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f v206.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v206: sua loi chinh ta 'cao hon hon 10.000 NDT' -> 'cao hon 10.000 NDT' (bai Xiaomi SU7)"
            git push
          fi
