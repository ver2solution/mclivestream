name: deploy-v254
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v254:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v254 package
        run: |
          unzip -o v254-f-r2-08.zip
          ls -l js/data.js js/app.js sw.js danh-sach-mau.html danh-sach-lo.html
      - name: Verify package contents
        run: |
          set -e
          node --check js/data.js
          node --check js/app.js
          grep -Fq "__missing__" js/app.js
          grep -Fq "Chưa ghi tỉnh" js/app.js
          grep -Fq "Chưa ghi số lượng" danh-sach-mau.html
          grep -Fq "Chưa công khai MOQ" danh-sach-mau.html
          grep -Fq '"prov": "TP. Hồ Chí Minh"' js/data.js
          grep -Fq "CACHE = 'v254-shell-1'" sw.js
      - name: Commit v254 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/data.js js/app.js sw.js danh-sach-mau.html danh-sach-lo.html
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v254 F-R2-08 backfill tinh 4 lo + option Chua ghi (tinh/SL lo, MOQ xuong) + sw.js v254-shell-1"
            git push
          fi
