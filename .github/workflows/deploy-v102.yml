name: Deploy v102

on:
  push:
    paths:
      - '.github/workflows/deploy-v102.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v102:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v102 deploy package
        run: |
          unzip -o mclivestream-v102-deploy.zip
          ls -l v20.css sw.js
          sha256sum v20.css sw.js
          grep -q "v102-shell-1" sw.js && echo "sw.js CACHE OK: v102-shell-1"
          grep -q "repeat(6,1fr)" v20.css && echo "css 6-col grid OK"
          grep -q "n+13" v20.css && echo "css lot n+13 OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20.css sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v102: 1 hang PC 6 ho so dong bo moi loai the (tru tin tuc), cache v102-shell-1"
            git push
          fi
