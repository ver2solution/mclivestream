name: Deploy articles-phan-tich-2026-11-25 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-phan-tich-2511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-phan-tich-2511:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "694" || (echo "BASE DOI: data.js khong con 694 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "716" || (echo "BASE DOI: sitemap khong con 716 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip phan-tich-2511 package
        run: |
          unzip -o mclivestream-phan-tich-2511-deploy.zip
          echo "--- verify phan-tich-2511 (4 bai moi) ---"
          for slug in phan-tich-double-day-2026-nhin-lai-ca-nam-con-black-friday-12-12 thi-truong-thoi-trang-nu-2026-11-nghin-ty-usd-tiktok-shop-645-phan-tram thi-truong-thoi-trang-nam-2026-681-ty-usd-tiktok-shop-681-phan-tram adidas-quy-3-2026-lai-1-ty-euro-ban-gia-day-du-thang-giam-gia; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -qF "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -qF "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "720" || (echo "SAI TONG sitemap, phai 720"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "698" || (echo "SAI TONG data.js, phai 698 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-phan-tich-2511-deploy.zip || rm -f mclivestream-phan-tich-2511-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-phan-tich-2026-11-25: 4 bai moi (SEO V2)"
            git pull --rebase origin main || (echo "REBASE THAT BAI - co cron khac push chen, DUNG LAI de rebuild"; exit 1)
            git push
          fi
