name: Deploy v204
on:
  workflow_dispatch:
jobs:
  deploy-v204:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip package
        run: |
          unzip -o v204.zip
          rm -f v204.zip
      - name: Verify package contents
        run: |
          test -f danh-sach-mau.html
          test -f danh-sach-shop.html
          test -f tests/test-v204-switch-hidden.mjs
      - name: Run v204 test
        run: node tests/test-v204-switch-hidden.mjs
      - name: Commit deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add danh-sach-mau.html danh-sach-shop.html tests/test-v204-switch-hidden.mjs
          git commit -m "v204: an nut switch sai trang — 2 nut Lop (trang Mau) + 3 nut dich vu (trang Shop) theo quyet 12:35 (v194); test 27/27; sw.js NOT touched" || echo "nothing to commit"
          git push
