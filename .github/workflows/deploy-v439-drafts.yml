name: Deploy v439-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v439-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v439-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v439-drafts package
        run: |
          unzip -o mclivestream-v439-drafts-deploy.zip
          echo "--- verify v439-drafts (1 bai) ---"
          test -f bai-viet/thi-truong-quan-ao-viet-nam-2026-137000-ty-dong-livestream-thoi-trang-nu-nam.html || (echo "THIEU bai-viet/thi-truong-quan-ao-viet-nam-2026-137000-ty-dong-livestream-thoi-trang-nu-nam.html"; exit 1)
          grep -q "bai-viet/thi-truong-quan-ao-viet-nam-2026-137000-ty-dong-livestream-thoi-trang-nu-nam.html" js/data.js || (echo "THIEU thi-truong-quan-ao-viet-nam-2026-137000-ty-dong-livestream-thoi-trang-nu-nam trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/thi-truong-quan-ao-viet-nam-2026-137000-ty-dong-livestream-thoi-trang-nu-nam.html</loc>" sitemap.xml || (echo "THIEU thi-truong-quan-ao-viet-nam-2026-137000-ty-dong-livestream-thoi-trang-nu-nam trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v439-drafts-deploy.zip
          git add bai-viet/thi-truong-quan-ao-viet-nam-2026-137000-ty-dong-livestream-thoi-trang-nu-nam.html images/bai-viet/thi-truong-quan-ao-viet-nam-2026-137000-ty-dong-livestream-thoi-trang-nu-nam.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v439-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — thi-truong-quan-ao-viet-nam-2026-137000-ty-dong-livestream-thoi-trang-nu-nam"
            git push
          fi
