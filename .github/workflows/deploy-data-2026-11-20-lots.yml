name: Deploy data 2026-11-20 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-20-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-20-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-20 lots package
        run: |
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "753f5cff4df1885aec9ac7b99656f1c793959a6642facfef20818634e7ba2cab" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-20-lots-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "6b67c414100f38409bcabf59c8805822742ba0bcfca821feee1172f8e8c70af9" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          for f in lot-267 lot-268 lot-269 lot-270 lot-271 lot-272 lot-273 lot-276 lot-277; do ls -l images/lo/$f.jpg; done
          test "$(grep -c '"id": "th-' js/data.js)" = "238" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "299" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "277" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "412" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "369" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "516" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "517" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-267.jpg images/lo/lot-268.jpg images/lo/lot-269.jpg images/lo/lot-270.jpg images/lo/lot-271.jpg images/lo/lot-272.jpg images/lo/lot-273.jpg images/lo/lot-276.jpg images/lo/lot-277.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-20 lots: 277 lo (11 lo moi lot-267..277: 7 YouTube g3 + 1 Facebook g3 + 1 Facebook g1 + 2 thu mua g2 Duc Duong Cao Bang/Son La; 9 anh moi; CHUYEN 4 bai Dang hot 20/11 tu lots sang articles), 238 mau / 299 shop / 412 xuong / 369 kiot / 517 bai viet"
            git push
          fi
