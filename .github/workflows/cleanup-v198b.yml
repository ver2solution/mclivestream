name: Cleanup v198b
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Remove v198b.zip and deploy workflow
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@users.noreply.github.com"
          git rm -f v198b.zip .github/workflows/deploy-v198b.yml .github/workflows/cleanup-v198b.yml
          git status --short
          git commit -m "chore: remove deploy-v198b workflow"
          git push origin main
