name: deploy-v278
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v278:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v278 package
        run: |
          unzip -o v278-footer.zip
          ls -l index.html bai-viet/huong-thai-1050-ty-dong-livestream-ban-hang-99-ndt-mat-1-trieu-follower.html
      - name: Verify package contents
        run: |
          set -e
          test "$(grep -rl 'Powered by Ver2Solution.com' --include='*.html' . | wc -l)" = "331"
          if grep -rq 'Powered by vieclamlivestream.online' --include='*.html' .; then echo "FAIL: con footer cu vieclamlivestream.online"; exit 1; fi
          if grep -rq 'Powered by Ver2Solution</p>' --include='*.html' .; then echo "FAIL: con footer thieu .com"; exit 1; fi
          echo "OK: 331 file footer Ver2Solution.com, 0 file cu"
      - name: Commit v278 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add -- '*.html'
          echo "So file staged:"
          git status --short | wc -l
          git status --short | head -5
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v278 footer Powered by Ver2Solution.com (331 files)"
            git push
          fi
