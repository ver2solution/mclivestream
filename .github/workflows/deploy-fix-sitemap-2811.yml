name: "Fix sitemap 2811: 40 URL .html.html -> .html + log cong-nghe 27/11"

on:
  push:
    paths:
      - '.github/workflows/deploy-fix-sitemap-2811.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-sitemap-2811:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          echo "sitemap .html.html truoc unzip: $(grep -c 'html\.html' sitemap.xml || true)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "853" || (echo "BASE DOI: data.js khong con 853 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "878" || (echo "BASE DOI: sitemap khong con 878 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c 'html\.html' sitemap.xml || true)" = "40" || (echo "BASE DOI: sitemap khong con 40 URL .html.html - da co nguoi sua, DUNG LAI"; exit 1)
      - name: Unzip fix-sitemap-2811 package
        run: |
          unzip -o mclivestream-fix-sitemap-2811-deploy.zip
          echo "--- verify fix-sitemap-2811 ---"
          test "$(grep -c '<loc>' sitemap.xml)" = "878" || (echo "SAI TONG sitemap, phai 878"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "853" || (echo "SAI TONG data.js, phai 853 bai-viet page"; exit 1)
          test "$(grep -c 'html\.html' sitemap.xml || true)" = "0" || (echo "CON URL .html.html trong sitemap"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/chatbot-cham-soc-khach-tet-bat-ai-assistance-truoc-12-12.html</loc>" sitemap.xml || (echo "THIEU chatbot URL dung trong sitemap"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/quang-cao-tiktok-shop-12-12-hoc-tu-black-friday-27-11.html</loc>" sitemap.xml || (echo "THIEU quang-cao-tiktok URL dung trong sitemap"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/quang-cao-facebook-12-12-meta-doi-cach-dem-don.html</loc>" sitemap.xml || (echo "THIEU quang-cao-facebook URL dung trong sitemap"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/video-commerce-viet-nam-tiktok-tach-app-shop-rieng-05-11.html</loc>" sitemap.xml || (echo "THIEU video-commerce URL dung trong sitemap"; exit 1)
          grep -q "articles-cong-nghe-2026-11-27 adds" js/data.js || (echo "THIEU log line cong-nghe 27/11 trong data.js"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
          node -e "global.window={};const fs=require('fs');eval(fs.readFileSync('js/data.js','utf8'));const a=window.V20_DATA.articles;console.log('articles.length =',a.length);console.log('empty =',a.filter(x=>!x).length);if(a.length!==854) { console.log('SAI: articles.length phai 854'); process.exit(1); } if(a.filter(x=>!x).length){ console.log('CO EMPTY ITEM'); process.exit(1); } const want=['chatbot-cham-soc-khach-tet-bat-ai-assistance-truoc-12-12','quang-cao-tiktok-shop-12-12-hoc-tu-black-friday-27-11','quang-cao-facebook-12-12-meta-doi-cach-dem-don','video-commerce-viet-nam-tiktok-tach-app-shop-rieng-05-11']; const miss=want.filter(s=>!a.some(x=>x&&x.page==='bai-viet/'+s+'.html')); if(miss.length){ console.log('SLUG NGOAI MANG articles:', miss); process.exit(1); } console.log('node guard OK: 4 slug cong-nghe 27/11 deu TRONG mang articles');"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-fix-sitemap-2811-deploy.zip || rm -f mclivestream-fix-sitemap-2811-deploy.zip
          git rm -q .github/workflows/deploy-fix-sitemap-2811.yml || true
          git add js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix sitemap 2811: 40 URL .html.html -> .html (bu KPI 27/11) + log cong-nghe 27/11"
            git fetch origin main
            git rebase origin/main || (echo "REBASE CONFLICT: mot cron khac da deploy xong trong luc chay, DUNG LAI de rebuild"; exit 1)
            test "$(grep -c '<loc>' sitemap.xml)" = "878" || (echo "SAI TONG sitemap sau rebase, phai 878"; exit 1)
            test "$(grep -c 'html\.html' sitemap.xml || true)" = "0" || (echo "CON URL .html.html sau rebase"; exit 1)
            test "$(grep -c '"page": "bai-viet/' js/data.js)" = "853" || (echo "SAI TONG data.js sau rebase, phai 853"; exit 1)
            node --check js/data.js || (echo "data.js LOI CU PHAP sau rebase"; exit 1)
            git push
          fi
