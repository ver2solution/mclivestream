name: Deploy v145 Dong Vu Huy

on:
  push:
    paths:
      - '.github/workflows/deploy-v145.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v145:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v145 package
        run: |
          unzip -o mclivestream-v145-dongvuhuy-deploy.zip
          echo "--- verify v145 (Dong Vu Huy) ---"
          test -f "bai-viet/meo-chot-don-ngay-sale-lon-hoc-dong-vu-huy-30-phut-100000-don.html" || (echo "THIEU bai moi"; exit 1)
          grep -q "bai-viet/meo-chot-don-ngay-sale-lon-hoc-dong-vu-huy-30-phut-100000-don.html" js/data.js || (echo "THIEU bai moi trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/meo-chot-don-ngay-sale-lon-hoc-dong-vu-huy-30-phut-100000-don.html</loc>" sitemap.xml || (echo "THIEU bai moi trong sitemap"; exit 1)
          grep -q "v145-shell-1" sw.js || (echo "THIEU v145-shell-1 trong sw.js"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"title":' js/data.js)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v145-dongvuhuy-deploy.zip
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v145: Dong Vu Huy - 30 phut ban 100.000 don, 3 ngay ban 6,79 ty NDT"
            git push
          fi
