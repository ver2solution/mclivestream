name: Deploy v304-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v304-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v304-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v304-drafts package
        run: |
          unzip -o mclivestream-v304-drafts-deploy.zip
          echo "--- verify v304-drafts (1 bai) ---"
          test -f bai-viet/tong-ket-double-11-2026-ai-thang-ai-thua.html || (echo "THIEU bai-viet/tong-ket-double-11-2026-ai-thang-ai-thua.html"; exit 1)
          grep -q "bai-viet/tong-ket-double-11-2026-ai-thang-ai-thua.html" js/data.js || (echo "THIEU tong-ket-double-11-2026-ai-thang-ai-thua trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/tong-ket-double-11-2026-ai-thang-ai-thua.html</loc>" sitemap.xml || (echo "THIEU tong-ket-double-11-2026-ai-thang-ai-thua trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v304-drafts-deploy.zip
          git add bai-viet/tong-ket-double-11-2026-ai-thang-ai-thua.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v304-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — tong-ket-double-11-2026-ai-thang-ai-thua"
            git push
          fi
