name: "Deploy articles-cong-nghe-2026-11-24 (4 bai)"

on:
  push:
    paths:
      - '.github/workflows/deploy-cong-nghe-2411.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cong-nghe-2411:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "655" || (echo "BASE DOI: data.js khong con 655 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "677" || (echo "BASE DOI: sitemap khong con 677 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip cong-nghe-2411 package
        run: |
          unzip -o mclivestream-cong-nghe-2411-deploy.zip
          echo "--- verify cong-nghe-2411 (4 bai moi) ---"
            test -f "bai-viet/tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong.html" || (echo "THIEU bai-viet/tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong.html"; exit 1)
            test -f "images/bai-viet/tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong.jpg"; exit 1)
            test -f "images/bai-viet/tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong-og.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong-og.jpg"; exit 1)
            grep -q "bai-viet/tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong.html" js/data.js || (echo "THIEU tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong.html</loc>" sitemap.xml || (echo "THIEU tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong trong sitemap"; exit 1)
            test -f "bai-viet/meta-advantage-quang-cao-facebook-tu-chay-toi-dau.html" || (echo "THIEU bai-viet/meta-advantage-quang-cao-facebook-tu-chay-toi-dau.html"; exit 1)
            test -f "images/bai-viet/meta-advantage-quang-cao-facebook-tu-chay-toi-dau.jpg" || (echo "THIEU images/bai-viet/meta-advantage-quang-cao-facebook-tu-chay-toi-dau.jpg"; exit 1)
            test -f "images/bai-viet/meta-advantage-quang-cao-facebook-tu-chay-toi-dau-og.jpg" || (echo "THIEU images/bai-viet/meta-advantage-quang-cao-facebook-tu-chay-toi-dau-og.jpg"; exit 1)
            grep -q "bai-viet/meta-advantage-quang-cao-facebook-tu-chay-toi-dau.html" js/data.js || (echo "THIEU meta-advantage-quang-cao-facebook-tu-chay-toi-dau trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/meta-advantage-quang-cao-facebook-tu-chay-toi-dau.html</loc>" sitemap.xml || (echo "THIEU meta-advantage-quang-cao-facebook-tu-chay-toi-dau trong sitemap"; exit 1)
            test -f "bai-viet/video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia.html" || (echo "THIEU bai-viet/video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia.html"; exit 1)
            test -f "images/bai-viet/video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia.jpg" || (echo "THIEU images/bai-viet/video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia.jpg"; exit 1)
            test -f "images/bai-viet/video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia-og.jpg" || (echo "THIEU images/bai-viet/video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia-og.jpg"; exit 1)
            grep -q "bai-viet/video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia.html" js/data.js || (echo "THIEU video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia.html</loc>" sitemap.xml || (echo "THIEU video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia trong sitemap"; exit 1)
            test -f "bai-viet/instagram-gan-link-amazon-affiliate-trong-reels.html" || (echo "THIEU bai-viet/instagram-gan-link-amazon-affiliate-trong-reels.html"; exit 1)
            test -f "images/bai-viet/instagram-gan-link-amazon-affiliate-trong-reels.jpg" || (echo "THIEU images/bai-viet/instagram-gan-link-amazon-affiliate-trong-reels.jpg"; exit 1)
            test -f "images/bai-viet/instagram-gan-link-amazon-affiliate-trong-reels-og.jpg" || (echo "THIEU images/bai-viet/instagram-gan-link-amazon-affiliate-trong-reels-og.jpg"; exit 1)
            grep -q "bai-viet/instagram-gan-link-amazon-affiliate-trong-reels.html" js/data.js || (echo "THIEU instagram-gan-link-amazon-affiliate-trong-reels trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/instagram-gan-link-amazon-affiliate-trong-reels.html</loc>" sitemap.xml || (echo "THIEU instagram-gan-link-amazon-affiliate-trong-reels trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "681" || (echo "SAI TONG sitemap, phai 681"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "659" || (echo "SAI TONG data.js, phai 659 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Guard node-parse (bai hoc v370)
        run: |
          node -e "global.window={};const fs=require('fs');eval(fs.readFileSync('js/data.js','utf8'));const a=window.V20_DATA.articles;console.log('articles.length =',a.length);console.log('empty =',a.filter(x=>!x).length);if(a.length!==660) { console.log('SAI: articles.length phai 660'); process.exit(1); } if(a.filter(x=>!x).length){ console.log('CO EMPTY ITEM'); process.exit(1); } const want=['tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong','meta-advantage-quang-cao-facebook-tu-chay-toi-dau','video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia','instagram-gan-link-amazon-affiliate-trong-reels']; const miss=want.filter(s=>!a.some(x=>x&&x.page==='bai-viet/'+s+'.html')); if(miss.length){ console.log('SLUG NGOAI MANG articles:', miss); process.exit(1); } console.log('node guard OK: 4 slug moi deu TRONG mang articles');"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-cong-nghe-2411-deploy.zip || rm -f mclivestream-cong-nghe-2411-deploy.zip
          git rm -q .github/workflows/deploy-cong-nghe-2411.yml || true
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-cong-nghe-2026-11-24: 4 bai (tiktok-shop-affiliate-tet-giam-gia-an-vao-hoa-hong meta-advantage-quang-cao-facebook-tu-chay-toi-dau video-ai-lam-clip-san-pham-12-12-7-mo-hinh-thu-gia instagram-gan-link-amazon-affiliate-trong-reels)"
            git push
          fi
