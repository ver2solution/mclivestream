name: "Deploy v340 (Top tuong tac TOP-01 — Bot len Top tam)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v340.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v340:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v340 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v340-shell-1 thi da deploy roi, DUNG ---"
          if grep -q 'v340-shell-1' sw.js; then echo "v340 DA DEPLOY ROI (sw.js da co v340-shell-1) - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main 8f24678 - data.js/sitemap khong doi so voi v339) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "c5268417d1312344ddb41ec07cec0b90" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "447" || (echo "BASE DOI: sitemap khong con 447 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v340-deploy.zip
          echo "--- verify v340 (6 file) ---"
          test "$(unzip -l mclivestream-v340-deploy.zip | grep -cE ' (index\.html|trang-cua-toi\.html|sw\.js|js/chat-bots\.js|js/community-chat\.js)$')" -eq 5 || (echo "SAI: goi v340 phai co dung 5 file (index.html + trang-cua-toi.html + sw.js + js/chat-bots.js + js/community-chat.js)"; exit 1)
          grep -q "v340-shell-1" sw.js || (echo "SAI: sw.js phai co v340-shell-1"; exit 1)
          node --check js/chat-bots.js || (echo "SAI: chat-bots.js loi cu phap"; exit 1)
          node --check js/community-chat.js || (echo "SAI: community-chat.js loi cu phap"; exit 1)
          grep -q "record_bot_message" js/chat-bots.js || (echo "SAI: chat-bots.js phai goi RPC record_bot_message (v340)"; exit 1)
          grep -q "Top tương tác hôm nay" index.html || (echo "SAI: index.html phai co tieu de Top hom nay (v340)"; exit 1)
          grep -q "Luật chơi Top tương tác" trang-cua-toi.html || (echo "SAI: trang-cua-toi.html phai co muc luat choi Top (v340)"; exit 1)
          echo "verify OK: 5 file, sw.js v340-shell-1, JS hop le, du marker v340"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v340-deploy.zip
          git add index.html trang-cua-toi.html js/chat-bots.js js/community-chat.js sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v340: Top tuong tac TOP-01 — Bot len Top tam (record_bot_message + get_home_chat_top cong tong tin chat tu 5h + binh luan luy ke; tieu de Top hom nay + luat choi); CACHE v340-shell-1"
            git push
          fi
