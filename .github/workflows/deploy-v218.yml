name: deploy-v218
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v218 package
        run: unzip -o v218.zip
      - name: Verify package contents
        run: |
          set -e
          test -f js/admin.js
          test -f sw.js
          node --check js/admin.js
          node --check sw.js
          grep -Fq "v218-shell-1" sw.js
          grep -Fq "state.chatSeq" js/admin.js
          grep -Fq "state.chatLoading" js/admin.js
          grep -Fq "if (seq !== state.chatSeq) return;" js/admin.js
          grep -Fq "if (state.chatLoading) { loadChat(); return true; }" js/admin.js
          grep -Fq "onSessionChange(function" js/admin.js
          grep -Fq "window.location.reload()" js/admin.js
      - name: Commit v218 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/admin.js sw.js
          git commit -m "v218: C1/N1 console theo doi doi phien (doi tai khoan thi tai lai) + P3 khung chat chong luot loadChat"
          git push
