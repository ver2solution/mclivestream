name: deploy-v280
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v280:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v280 package
        run: |
          unzip -o v280-mobile-p0.zip
          ls -l js/app.js v20.css sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v280-shell-1" sw.js
          if grep -Fq "Mở web PC" js/app.js v20.css; then echo "FAIL: banner text van con"; exit 1; fi
          if grep -Fq "initMobileNotice" js/app.js; then echo "FAIL: initMobileNotice van con"; exit 1; fi
          if grep -Fq "mobile-notice" v20.css; then echo "FAIL: mobile-notice CSS van con"; exit 1; fi
          grep -Fq "bottom:84px" v20.css
          echo "OK: v280 bo banner Mo web PC + doi widget online xuong goc duoi mobile"
      - name: Commit v280 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js v20.css sw.js
          echo "So file staged:"
          git status --short | wc -l
          git status --short | head -5
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v280 bo banner Mo web PC + doi widget online xuong goc duoi mobile (3 files)"
            git push
          fi
