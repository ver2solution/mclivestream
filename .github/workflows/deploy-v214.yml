name: deploy-v214
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v214 package
        run: unzip -o v214.zip
      - name: Verify package contents
        run: |
          set -e
          test -f js/app.js
          test -f sw.js
          test -f danh-sach-mau.html
          test -f danh-sach-shop.html
          test -f thanh-ly-kiot.html
          node --check js/app.js
          grep -q "v216-shell-1" sw.js
          grep -q "rebuildProvOptions" js/app.js
          grep -q "KIOT_PRICE" thanh-ly-kiot.html
          grep -q "fUniPayMinList" danh-sach-mau.html
          grep -q "fShPayMinList" danh-sach-shop.html
          grep -q "NEWOBJ_NO_COUNT" js/app.js
      - name: Commit v214 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js sw.js danh-sach-mau.html danh-sach-shop.html thanh-ly-kiot.html
          git commit -m "v214: tinh theo muc + gia Kiot overlay + luong datalist + nut Kiot can phai + bo so (11) canh ten muc moi"
          git push
