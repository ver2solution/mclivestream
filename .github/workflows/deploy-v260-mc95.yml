name: Deploy v260 (MC-95)

on:
  push:
    paths:
      - '.github/workflows/deploy-v260-mc95.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v260-mc95:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v260-mc95 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v260-mc95-deploy.zip
          echo "--- verify v260 (MC-95) ---"
          node --check js/comments.js || (echo "SYNTAX FAIL js/comments.js"; exit 1)
          node --check sw.js || (echo "SYNTAX FAIL sw.js"; exit 1)
          grep -m1 "v260-shell-1" sw.js
          grep -m1 "v260 (MC-95)" js/comments.js
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum sw.js js/comments.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v260-mc95-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v260: MC-95 ghi luat 60 giay duoi form binh luan + cooldown client + loi chan than thien, sw.js v260-shell-1"
            git push
          fi
