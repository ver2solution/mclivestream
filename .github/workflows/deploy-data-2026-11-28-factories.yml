name: Deploy data 2026-11-28 factories

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-28-factories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-28-factories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard live data.js unchanged (v233/v234)
        run: |
          curl -s -o /tmp/live-data.js https://vieclamlivestream.online/js/data.js
          LIVE_SHA="$(sha256sum /tmp/live-data.js | cut -d' ' -f1)"
          echo "live sha: $LIVE_SHA"
          test "$LIVE_SHA" = "b03b6a38120e76db09e0cd2d6b0b9a4846143bb221172143864f30a0370072c6" || (echo "LIVE CHANGED since staging base — STOP, rebase first"; exit 1)
      - name: Unzip data 2026-11-28 factories package
        run: |
          unzip -o mclivestream-data-2026-11-28-factories-deploy.zip
          ls -l js/data.js images/xuong/fac-453.jpg images/xuong/fac-454.jpg images/xuong/fac-455.jpg images/xuong/fac-456.jpg
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "75a016c849938640341eb9884a922e0bf1ce11170dbf4cb8a543cb28a1451b68" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "268" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "337" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "363" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "457" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "390" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "886" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "887" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/xuong/fac-453.jpg images/xuong/fac-454.jpg images/xuong/fac-455.jpg images/xuong/fac-456.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-28 factories: 457 xuong (5 moi fac-453..fac-457, 4 anh moi), 268 mau / 337 shop / 363 lo / 390 kiot / 887 bai viet"
            git push
          fi
