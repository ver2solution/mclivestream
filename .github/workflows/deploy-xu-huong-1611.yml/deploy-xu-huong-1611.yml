name: Deploy articles-xu-huong-2026-11-16 (4 bai Xu huong 16/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-xu-huong-1611.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-xu-huong-1611:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "335" || (echo "BASE DOI: data.js khong con 335 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "361" || (echo "BASE DOI: sitemap khong con 361 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip xu-huong-1611 package
        run: |
          unzip -o mclivestream-xu-huong-1611-deploy.zip
          echo "--- verify xu-huong-1611 (4 bai) ---"
          for slug in xu-huong-livestream-2027-22-ty-usd-whatnot gen-z-mua-sam-online-2026-73-phan-tram-kham-pha-qua-dien-thoai mua-sam-bang-ai-51-phan-tram-da-dung-chi-5-phan-tram-de-ai-chot-don mua-sam-giang-sinh-2026-1654-usd-gen-z-dan-dau; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "365" || (echo "SAI TONG sitemap, phai 365"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "339" || (echo "SAI TONG data.js, phai 339"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-xu-huong-1611-deploy.zip || rm -f mclivestream-xu-huong-1611-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-xu-huong-2026-11-16: 4 bai Xu huong 16/11/2026 (xu huong livestream 2027 keyword #4 + Gen Z mua sam online 2026 + mua sam bang AI + mua sam Giang sinh 2026)"
            git push
          fi
