name: Deploy v415-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v415-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v415-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v415-drafts package
        run: |
          unzip -o mclivestream-v415-drafts-deploy.zip
          echo "--- verify v415-drafts (4 bai) ---"
          test -f bai-viet/vo-mong-mua-hang-gan-mac-mall-su-that-phia-sau-nhan-chinh-hang.html || (echo "THIEU bai-viet/vo-mong-mua-hang-gan-mac-mall-su-that-phia-sau-nhan-chinh-hang.html"; exit 1)
          grep -q "bai-viet/vo-mong-mua-hang-gan-mac-mall-su-that-phia-sau-nhan-chinh-hang.html" js/data.js || (echo "THIEU vo-mong-mua-hang-gan-mac-mall-su-that-phia-sau-nhan-chinh-hang trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/vo-mong-mua-hang-gan-mac-mall-su-that-phia-sau-nhan-chinh-hang.html</loc>" sitemap.xml || (echo "THIEU vo-mong-mua-hang-gan-mac-mall-su-that-phia-sau-nhan-chinh-hang trong sitemap"; exit 1)
          test -f bai-viet/gia-vang-cao-shop-trang-suc-xoay-sang-ban-gi-de-giu-lai-charm-chuoi-hat-da-mau.html || (echo "THIEU bai-viet/gia-vang-cao-shop-trang-suc-xoay-sang-ban-gi-de-giu-lai-charm-chuoi-hat-da-mau.html"; exit 1)
          grep -q "bai-viet/gia-vang-cao-shop-trang-suc-xoay-sang-ban-gi-de-giu-lai-charm-chuoi-hat-da-mau.html" js/data.js || (echo "THIEU gia-vang-cao-shop-trang-suc-xoay-sang-ban-gi-de-giu-lai-charm-chuoi-hat-da-mau trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/gia-vang-cao-shop-trang-suc-xoay-sang-ban-gi-de-giu-lai-charm-chuoi-hat-da-mau.html</loc>" sitemap.xml || (echo "THIEU gia-vang-cao-shop-trang-suc-xoay-sang-ban-gi-de-giu-lai-charm-chuoi-hat-da-mau trong sitemap"; exit 1)
          test -f bai-viet/bi-quyet-livestream-ban-trang-suc-chot-don-nhanh-yun-shang-xu-980-ty-dong-2-phien.html || (echo "THIEU bai-viet/bi-quyet-livestream-ban-trang-suc-chot-don-nhanh-yun-shang-xu-980-ty-dong-2-phien.html"; exit 1)
          grep -q "bai-viet/bi-quyet-livestream-ban-trang-suc-chot-don-nhanh-yun-shang-xu-980-ty-dong-2-phien.html" js/data.js || (echo "THIEU bi-quyet-livestream-ban-trang-suc-chot-don-nhanh-yun-shang-xu-980-ty-dong-2-phien trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/bi-quyet-livestream-ban-trang-suc-chot-don-nhanh-yun-shang-xu-980-ty-dong-2-phien.html</loc>" sitemap.xml || (echo "THIEU bi-quyet-livestream-ban-trang-suc-chot-don-nhanh-yun-shang-xu-980-ty-dong-2-phien trong sitemap"; exit 1)
          test -f bai-viet/xiaohongshu-ban-trang-suc-cham-ma-chac-560-ty-dong-1-phien-tiet-giai-ngung-karena-ng-huong-thai.html || (echo "THIEU bai-viet/xiaohongshu-ban-trang-suc-cham-ma-chac-560-ty-dong-1-phien-tiet-giai-ngung-karena-ng-huong-thai.html"; exit 1)
          grep -q "bai-viet/xiaohongshu-ban-trang-suc-cham-ma-chac-560-ty-dong-1-phien-tiet-giai-ngung-karena-ng-huong-thai.html" js/data.js || (echo "THIEU xiaohongshu-ban-trang-suc-cham-ma-chac-560-ty-dong-1-phien-tiet-giai-ngung-karena-ng-huong-thai trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/xiaohongshu-ban-trang-suc-cham-ma-chac-560-ty-dong-1-phien-tiet-giai-ngung-karena-ng-huong-thai.html</loc>" sitemap.xml || (echo "THIEU xiaohongshu-ban-trang-suc-cham-ma-chac-560-ty-dong-1-phien-tiet-giai-ngung-karena-ng-huong-thai trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v415-drafts-deploy.zip
          git add bai-viet/vo-mong-mua-hang-gan-mac-mall-su-that-phia-sau-nhan-chinh-hang.html images/bai-viet/vo-mong-mua-hang-gan-mac-mall-su-that-phia-sau-nhan-chinh-hang-hero.jpg bai-viet/gia-vang-cao-shop-trang-suc-xoay-sang-ban-gi-de-giu-lai-charm-chuoi-hat-da-mau.html images/bai-viet/gia-vang-cao-shop-trang-suc-xoay-sang-ban-gi-de-giu-lai-charm-chuoi-hat-da-mau-hero.jpg bai-viet/bi-quyet-livestream-ban-trang-suc-chot-don-nhanh-yun-shang-xu-980-ty-dong-2-phien.html images/bai-viet/bi-quyet-livestream-ban-trang-suc-chot-don-nhanh-yun-shang-xu-980-ty-dong-2-phien-hero.jpg bai-viet/xiaohongshu-ban-trang-suc-cham-ma-chac-560-ty-dong-1-phien-tiet-giai-ngung-karena-ng-huong-thai.html images/bai-viet/xiaohongshu-ban-trang-suc-cham-ma-chac-560-ty-dong-1-phien-tiet-giai-ngung-karena-ng-huong-thai-hero.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v415-drafts: 4 bai viet tu ban thao (Muse Zalo/admin) — vo-mong-mua-hang-gan-mac-mall-su-that-phia-sau-nhan-chinh-hang, gia-vang-cao-shop-trang-suc-xoay-sang-ban-gi-de-giu-lai-charm-chuoi-hat-da-mau, bi-quyet-livestream-ban-trang-suc-chot-don-nhanh-yun-shang-xu-980-ty-dong-2-phien, xiaohongshu-ban-trang-suc-cham-ma-chac-560-ty-dong-1-phien-tiet-giai-ngung-karena-ng-huong-thai"
            git push
          fi
