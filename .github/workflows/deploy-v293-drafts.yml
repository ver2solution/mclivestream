name: Deploy v293-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v293-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v293-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v293-drafts package
        run: |
          unzip -o mclivestream-v293-drafts-deploy.zip
          echo "--- verify v293-drafts (1 bai) ---"
          test -f bai-viet/jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang.html || (echo "THIEU bai-viet/jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang.html"; exit 1)
          grep -q "bai-viet/jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang.html" js/data.js || (echo "THIEU jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang.html</loc>" sitemap.xml || (echo "THIEU jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v293-drafts-deploy.zip
          git add bai-viet/jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v293-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang"
            git push
          fi
