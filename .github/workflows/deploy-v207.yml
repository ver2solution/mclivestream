name: Deploy v207

on:
  push:
    paths:
      - '.github/workflows/deploy-v207.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v207:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v207 package
        run: |
          unzip -o v207.zip
          echo "--- verify v207 payload ---"
          grep -m1 "const CACHE = 'v207-shell-1'" sw.js
          grep -m1 'home-newobj-agencyAds' index.html
          grep -m1 'home-newobj-movingServices' index.html
          grep -m1 'home-newobj-liveEquipment' index.html
          grep -m1 'noScroll: true' js/app.js
          grep -m1 'list.slice(0, 12)' js/app.js
          grep -m1 'updateKiotCountForSub' thanh-ly-kiot.html
          if grep -q "var msec = document.getElementById(ncfg.sectionId);" js/app.js; then echo "FAIL: mau scroll still present"; exit 1; fi
          if grep -q "var ssec = document.getElementById(ncfg.sectionId);" js/app.js; then echo "FAIL: shop scroll still present"; exit 1; fi
          echo "v207 payload verified"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f v207.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v207: bo hieu ung tu cuon (troi) cho muc moi + them 3 section trang chu + dong dem the loc Kiot theo muc dang chon"
            git push
          fi
