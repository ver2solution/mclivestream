name: Deploy data 2026-11-26 lao-dong-tu-do bu

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-26-lao-dong-tu-do-bu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-26-lao-dong-tu-do-bu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard main data.js unchanged since bad deploy (must still be f7fb5b1)
        run: |
          MAIN_SHA="$(sha256sum js/data.js | cut -d' ' -f1)"
          echo "main data.js sha: $MAIN_SHA"
          test "$MAIN_SHA" = "be5a2d5f4028101376c18c29c8fce6147e845041ec441bf7eb188c0599ae5022" || (echo "MAIN CHANGED since f7fb5b1 — STOP, rebase first"; exit 1)
      - name: Unzip data 2026-11-26 lao-dong-tu-do bu package
        run: |
          unzip -o mclivestream-data-2026-11-26-lao-dong-tu-do-bu-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "70d5a1253a38d4e64c83f9800d12268a349c5905e82607fcb1a047207cd17da9" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "freelance jobs: $(grep -c '"id":"fl-' js/data.js)"
          echo "freelance people: $(grep -c '"id":"fp-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "258" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "328" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "341" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "447" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "387" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"id":"fl-' js/data.js)" = "16" || (echo "BAD freelance jobs count"; exit 1)
          test "$(grep -c '"id":"fp-' js/data.js)" = "2" || (echo "BAD freelance people count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "801" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "802" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-26 lao-dong-tu-do BU: restore 341 lo (lot-331..341) + 16 viec + 2 nguoi, 258 mau / 328 shop / 447 xuong / 387 kiot / 802 bai viet"
            git push
          fi
