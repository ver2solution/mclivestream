name: Deploy data 2026-11-11 kiot

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-11-kiot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-11-kiot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-11 kiot package
        run: |
          unzip -o mclivestream-data-2026-11-11-kiot-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          ls -l images/kiot/kiot-01.jpg images/kiot/kiot-02.jpg images/kiot/kiot-03.jpg images/kiot/kiot-04.jpg images/kiot/kiot-05.jpg images/kiot/kiot-06.jpg images/kiot/kiot-10.jpg images/kiot/kiot-12.jpg images/kiot/kiot-13.jpg images/kiot/kiot-16.jpg images/kiot/kiot-20.jpg images/kiot/kiot-22.jpg images/kiot/kiot-23.jpg images/kiot/kiot-24.jpg images/kiot/kiot-25.jpg images/kiot/kiot-26.jpg images/kiot/kiot-28.jpg images/kiot/kiot-29.jpg images/kiot/kiot-30.jpg images/kiot/kiot-31.jpg images/kiot/kiot-34.jpg images/kiot/kiot-35.jpg images/kiot/kiot-36.jpg images/kiot/kiot-37.jpg images/kiot/kiot-38.jpg images/kiot/kiot-39.jpg images/kiot/kiot-42.jpg images/kiot/kiot-43.jpg images/kiot/kiot-44.jpg images/kiot/kiot-45.jpg images/kiot/kiot-46.jpg images/kiot/kiot-47.jpg images/kiot/kiot-48.jpg images/kiot/kiot-49.jpg images/kiot/kiot-50.jpg images/kiot/kiot-51.jpg images/kiot/kiot-52.jpg images/kiot/kiot-54.jpg images/kiot/kiot-55.jpg images/kiot/kiot-56.jpg images/kiot/kiot-57.jpg images/kiot/kiot-58.jpg images/kiot/kiot-59.jpg images/kiot/kiot-60.jpg images/kiot/kiot-64.jpg images/kiot/kiot-65.jpg images/kiot/kiot-66.jpg images/kiot/kiot-67.jpg images/kiot/kiot-68.jpg images/kiot/kiot-69.jpg images/kiot/kiot-70.jpg images/kiot/kiot-71.jpg images/kiot/kiot-72.jpg images/kiot/kiot-73.jpg images/kiot/kiot-74.jpg images/kiot/kiot-75.jpg images/kiot/kiot-76.jpg images/kiot/kiot-78.jpg images/kiot/kiot-79.jpg images/kiot/kiot-80.jpg
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/kiot/kiot-01.jpg images/kiot/kiot-02.jpg images/kiot/kiot-03.jpg images/kiot/kiot-04.jpg images/kiot/kiot-05.jpg images/kiot/kiot-06.jpg images/kiot/kiot-10.jpg images/kiot/kiot-12.jpg images/kiot/kiot-13.jpg images/kiot/kiot-16.jpg images/kiot/kiot-20.jpg images/kiot/kiot-22.jpg images/kiot/kiot-23.jpg images/kiot/kiot-24.jpg images/kiot/kiot-25.jpg images/kiot/kiot-26.jpg images/kiot/kiot-28.jpg images/kiot/kiot-29.jpg images/kiot/kiot-30.jpg images/kiot/kiot-31.jpg images/kiot/kiot-34.jpg images/kiot/kiot-35.jpg images/kiot/kiot-36.jpg images/kiot/kiot-37.jpg images/kiot/kiot-38.jpg images/kiot/kiot-39.jpg images/kiot/kiot-42.jpg images/kiot/kiot-43.jpg images/kiot/kiot-44.jpg images/kiot/kiot-45.jpg images/kiot/kiot-46.jpg images/kiot/kiot-47.jpg images/kiot/kiot-48.jpg images/kiot/kiot-49.jpg images/kiot/kiot-50.jpg images/kiot/kiot-51.jpg images/kiot/kiot-52.jpg images/kiot/kiot-54.jpg images/kiot/kiot-55.jpg images/kiot/kiot-56.jpg images/kiot/kiot-57.jpg images/kiot/kiot-58.jpg images/kiot/kiot-59.jpg images/kiot/kiot-60.jpg images/kiot/kiot-64.jpg images/kiot/kiot-65.jpg images/kiot/kiot-66.jpg images/kiot/kiot-67.jpg images/kiot/kiot-68.jpg images/kiot/kiot-69.jpg images/kiot/kiot-70.jpg images/kiot/kiot-71.jpg images/kiot/kiot-72.jpg images/kiot/kiot-73.jpg images/kiot/kiot-74.jpg images/kiot/kiot-75.jpg images/kiot/kiot-76.jpg images/kiot/kiot-78.jpg images/kiot/kiot-79.jpg images/kiot/kiot-80.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-11 kiot: 80 kiot (40 kiot moi, muc x4 KPI; gop + sap xep theo ngay giam dan, danh lai id kiot-01..80), 116 mau / 152 shop / 26 lo / 120 xuong"
