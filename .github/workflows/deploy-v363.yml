name: "Deploy v363 (BXH-01/02/03 Bang xep hang tuong tac)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v363.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v363:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v363 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v363-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF 'v363-shell-1' sw.js; then echo "v363 DA DEPLOY ROI (sw.js da co v363-shell-1) - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main e62e2d9) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "349dd3773fc61f4116b6ecb862b15bf3" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "496" || (echo "BASE DOI: sitemap khong con 496 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v363-deploy.zip
          echo "--- verify v363 (7 file) ---"
          for f in bang-xep-hang.html js/leaderboard.js index.html js/community-chat.js v20.css sitemap.xml sw.js; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "v363-shell-1" sw.js || (echo "SAI: sw.js phai co v363-shell-1"; exit 1)
          if grep -qF "const CACHE = 'v361-shell-1'" sw.js; then echo "SAI: sw.js van dung CACHE cu v361-shell-1"; exit 1; fi
          node --check js/leaderboard.js || (echo "SAI: js/leaderboard.js loi cu phap"; exit 1)
          node --check js/community-chat.js || (echo "SAI: js/community-chat.js loi cu phap"; exit 1)
          grep -qF "bang-xep-hang" sitemap.xml || (echo "SAI: sitemap phai co bang-xep-hang"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "497" || (echo "SAI: sitemap phai co 497 URL"; exit 1)
          grep -qF "/bang-xep-hang" index.html || (echo "SAI: index.html phai co link /bang-xep-hang"; exit 1)
          grep -qF "lb-page" v20.css || (echo "SAI: v20.css phai co .lb-page"; exit 1)
          grep -qF "interact_count" js/community-chat.js || (echo "SAI: community-chat.js phai xep tong-truoc (interact_count)"; exit 1)
          grep -qF "get_full_leaderboard" js/leaderboard.js || (echo "SAI: leaderboard.js phai goi RPC get_full_leaderboard"; exit 1)
          echo "verify OK: 7 file, sw.js v363-shell-1, sitemap 497, Top trang chu dong bo tong-truoc"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v363-deploy.zip
          git add bang-xep-hang.html js/leaderboard.js index.html js/community-chat.js v20.css sitemap.xml sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v363: BXH-01/02/03 — Trang Bang xep hang tuong tac day du /bang-xep-hang (RPC get_full_leaderboard, bục Top 3 + bang 24 hang/trang + loc Chi nguoi that) + link Xem bang xep hang o Top trang chu + dong bo Top trang chu sang xep TONG-truoc (Q1); CACHE v363-shell-1 (rebase tu e62e2d9)"
            git push
          fi
