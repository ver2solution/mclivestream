name: Deploy v352-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v352-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v352-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v352-drafts package
        run: |
          unzip -o mclivestream-v352-drafts-deploy.zip
          echo "--- verify v352-drafts (1 bai) ---"
          test -f bai-viet/ecomday-2026-175840-ty-dong-7-meo-bien-traffic-thanh-doanh-thu.html || (echo "THIEU bai-viet/ecomday-2026-175840-ty-dong-7-meo-bien-traffic-thanh-doanh-thu.html"; exit 1)
          grep -q "bai-viet/ecomday-2026-175840-ty-dong-7-meo-bien-traffic-thanh-doanh-thu.html" js/data.js || (echo "THIEU ecomday-2026-175840-ty-dong-7-meo-bien-traffic-thanh-doanh-thu trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/ecomday-2026-175840-ty-dong-7-meo-bien-traffic-thanh-doanh-thu.html</loc>" sitemap.xml || (echo "THIEU ecomday-2026-175840-ty-dong-7-meo-bien-traffic-thanh-doanh-thu trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v352-drafts-deploy.zip
          git add bai-viet/ecomday-2026-175840-ty-dong-7-meo-bien-traffic-thanh-doanh-thu.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v352-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — ecomday-2026-175840-ty-dong-7-meo-bien-traffic-thanh-doanh-thu"
            git push
          fi
