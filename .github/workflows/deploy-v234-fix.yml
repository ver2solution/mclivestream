name: Deploy v234-fix (sitemap + data.js restore)

on:
  push:
    paths:
      - '.github/workflows/deploy-v234-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v234-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v234-fix package
        run: |
          unzip -o mclivestream-v234-fix-deploy.zip
          echo "--- verify v234-fix (restore sitemap/data.js + footer) ---"
          test -f bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html || (echo "THIEU bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html"; exit 1)
          grep -q "bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html" js/data.js || (echo "THIEU sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don trong data.js"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html</loc>" sitemap.xml || (echo "THIEU sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don trong sitemap"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/tuyen-bo-mien-tru.html</loc>" sitemap.xml || (echo "THIEU tuyen-bo-mien-tru trong sitemap"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/chinh-sach-cookie.html</loc>" sitemap.xml || (echo "THIEU chinh-sach-cookie trong sitemap"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "286" || (echo "sitemap phai co 286 URL, hien co $(grep -c '<loc>' sitemap.xml)"; exit 1)
          grep -q "tuyen-bo-mien-tru.html" bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html || (echo "THIEU link tuyen-bo-mien-tru trong footer bai viet"; exit 1)
          grep -q "chinh-sach-cookie.html" bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html || (echo "THIEU link chinh-sach-cookie trong footer bai viet"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v234-fix-deploy.zip
          git add bai-viet/sau-rieng-22-tan-5-phut-livestream-nong-san-viet-ban-nghin-don.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v234-fix: khoi phuc sitemap 286 URL + data.js (v233-drafts ghi de) + footer 2 link phap ly bai sau-rieng"
            git push
          fi
