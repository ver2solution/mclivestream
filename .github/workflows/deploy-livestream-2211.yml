name: Deploy articles-livestream-2026-11-22 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-livestream-2211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-livestream-2211:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "570" || (echo "BASE DOI: data.js khong con 570 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "597" || (echo "BASE DOI: sitemap khong con 597 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          for slug in kich-ban-livestream-tet-120-phut-mon-moi-chu-luc-combo cach-tang-mat-xem-livestream-tet-5-don-bay-shopee-16-ty-luot-xem livestream-tiktok-ban-hang-black-friday-2026-gmv-max livestream-ban-hang-hieu-qua-tokconnect-medicube-741-trieu-usd; do
            grep -q "bai-viet/$slug.html" js/data.js && (echo "DA DEPLOY ROI: $slug da co trong data.js - DUNG LAI"; exit 1) || true
          done
      - name: Unzip livestream-2211 package
        run: |
          unzip -o mclivestream-livestream-2211-deploy.zip
          echo "--- verify livestream-2211 (4 bai) ---"
          for slug in kich-ban-livestream-tet-120-phut-mon-moi-chu-luc-combo cach-tang-mat-xem-livestream-tet-5-don-bay-shopee-16-ty-luot-xem livestream-tiktok-ban-hang-black-friday-2026-gmv-max livestream-ban-hang-hieu-qua-tokconnect-medicube-741-trieu-usd; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "601" || (echo "SAI TONG sitemap, phai 601"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "574" || (echo "SAI TONG data.js, phai 574 bai-viet page"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-livestream-2211-deploy.zip || rm -f mclivestream-livestream-2211-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-livestream-2026-11-22: 4 bai (kich-ban-livestream-tet-120-phut-mon-moi-chu-luc-combo, cach-tang-mat-xem-livestream-tet-5-don-bay-shopee-16-ty-luot-xem, livestream-tiktok-ban-hang-black-friday-2026-gmv-max, livestream-ban-hang-hieu-qua-tokconnect-medicube-741-trieu-usd)"
            git push
          fi
