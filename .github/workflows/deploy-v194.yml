name: Deploy v194 (sua tab/noi dung theo nhu cau — menu Mau/Shop)

on:
  push:
    paths:
      - '.github/workflows/deploy-v194.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v194:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v194 package
        run: |
          N=$(unzip -l mclivestream-v194-deploy.zip | grep -c '\.html$')
          echo "HTML files in zip: $N"
          test "$N" -eq 245 || (echo "ZIP KHONG DU 245 FILE HTML (co $N)"; exit 1)
          if unzip -l mclivestream-v194-deploy.zip | grep -qE 'sw\.js|app\.js'; then echo "ZIP CHUA FILE CAM (sw.js/app.js)"; exit 1; fi
          mkdir -p v194-staged
          unzip -o -q mclivestream-v194-deploy.zip -d v194-staged
          echo "--- verify v194 trong zip (chi file trong goi) ---"
          test -f v194-staged/danh-sach-mau.html || (echo "THIEU danh-sach-mau.html"; exit 1)
          test -f v194-staged/danh-sach-shop.html || (echo "THIEU danh-sach-shop.html"; exit 1)
          test -f v194-staged/index.html || (echo "THIEU index.html"; exit 1)
          test $(grep -r --include='*.html' -E 'href="[^"]*danh-sach-shop\.html"[^>]*>Dành cho Mẫu' v194-staged | wc -l) -eq 245 || (echo "SAI SO LUONG Mau->shop.html trong zip"; exit 1)
          test $(grep -r --include='*.html' -E 'href="[^"]*danh-sach-mau\.html"[^>]*>Dành cho Shop' v194-staged | wc -l) -eq 245 || (echo "SAI SO LUONG Shop->mau.html trong zip"; exit 1)
          test $(grep -r --include='*.html' -E 'href="[^"]*danh-sach-mau\.html"[^>]*>Dành cho Mẫu' v194-staged | wc -l) -eq 0 || (echo "CON cap cu Mau->mau.html trong zip"; exit 1)
          test $(grep -r --include='*.html' -E 'href="[^"]*danh-sach-shop\.html"[^>]*>Dành cho Shop' v194-staged | wc -l) -eq 0 || (echo "CON cap cu Shop->shop.html trong zip"; exit 1)
          test $(grep -c 'Tìm Mẫu Livestream' v194-staged/danh-sach-shop.html) -eq 0 || (echo "shop.html CON 'Tim Mau Livestream'"; exit 1)
          grep -q 'Tìm lô hàng xả kho' v194-staged/danh-sach-mau.html || (echo "mau.html THIEU tab Tim lo"; exit 1)
          grep -q 'Tìm việc làm' v194-staged/danh-sach-shop.html || (echo "shop.html THIEU tab Tim viec lam"; exit 1)
          grep -q 'Tìm Mẫu Livestream' v194-staged/danh-sach-mau.html || (echo "mau.html THIEU tab Tim mau"; exit 1)
          echo "verify trong zip OK: menu 245/245 moi, khong con cap cu, tab dung nhu cau, HTML-only (khong sw.js/app.js)"
          echo "--- overlay len repo + kiem tra TOAN SITE (bat ca file le ngoai goi) ---"
          cp -a v194-staged/. .
          rm -rf v194-staged
          test $(grep -r --include='*.html' -E 'href="[^"]*danh-sach-mau\.html"[^>]*>Dành cho Mẫu' . --exclude-dir=.git | wc -l) -eq 0 || (echo "CON cap cu Mau->mau.html tren repo (file le ngoai goi)"; exit 1)
          test $(grep -r --include='*.html' -E 'href="[^"]*danh-sach-shop\.html"[^>]*>Dành cho Shop' . --exclude-dir=.git | wc -l) -eq 0 || (echo "CON cap cu Shop->shop.html tren repo (file le ngoai goi)"; exit 1)
          echo "verify toan site OK: 0 cap cu tren repo"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f mclivestream-v194-deploy.zip
          git add -A
          git status --short
          test $(git diff --cached --name-only | wc -l) -eq 246 || (echo "SAI SO FILE STAGED (doi 246 = 245 HTML + 1 zip)"; exit 1)
          git commit -m "Deploy v194: sua tab/noi dung theo nhu cau — menu Mau->tin tuyen shop, Shop->danh sach mau + Lo/Xuong (245 file HTML, khong bump CACHE)"
          git push
