name: Deploy v321-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v321-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v321-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v321-drafts package
        run: |
          unzip -o mclivestream-v321-drafts-deploy.zip
          echo "--- verify v321-drafts (5 bai) ---"
          test -f bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba.html || (echo "THIEU bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba.html"; exit 1)
          grep -q "bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba.html" js/data.js || (echo "THIEU tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba.html</loc>" sitemap.xml || (echo "THIEU tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba trong sitemap"; exit 1)
          test -f bai-viet/ao-phao-gile-hehi-19-ty-dong-video-19-giay-shopee-top-3.html || (echo "THIEU bai-viet/ao-phao-gile-hehi-19-ty-dong-video-19-giay-shopee-top-3.html"; exit 1)
          grep -q "bai-viet/ao-phao-gile-hehi-19-ty-dong-video-19-giay-shopee-top-3.html" js/data.js || (echo "THIEU ao-phao-gile-hehi-19-ty-dong-video-19-giay-shopee-top-3 trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/ao-phao-gile-hehi-19-ty-dong-video-19-giay-shopee-top-3.html</loc>" sitemap.xml || (echo "THIEU ao-phao-gile-hehi-19-ty-dong-video-19-giay-shopee-top-3 trong sitemap"; exit 1)
          test -f bai-viet/mega-sale-q4-tiktok-shop-live-5-gio-gmv-gap-doi.html || (echo "THIEU bai-viet/mega-sale-q4-tiktok-shop-live-5-gio-gmv-gap-doi.html"; exit 1)
          grep -q "bai-viet/mega-sale-q4-tiktok-shop-live-5-gio-gmv-gap-doi.html" js/data.js || (echo "THIEU mega-sale-q4-tiktok-shop-live-5-gio-gmv-gap-doi trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/mega-sale-q4-tiktok-shop-live-5-gio-gmv-gap-doi.html</loc>" sitemap.xml || (echo "THIEU mega-sale-q4-tiktok-shop-live-5-gio-gmv-gap-doi trong sitemap"; exit 1)
          test -f bai-viet/meo-do-luong-live-tiktok-shop-compass-14-ngay-black-friday-13000-ty-dong.html || (echo "THIEU bai-viet/meo-do-luong-live-tiktok-shop-compass-14-ngay-black-friday-13000-ty-dong.html"; exit 1)
          grep -q "bai-viet/meo-do-luong-live-tiktok-shop-compass-14-ngay-black-friday-13000-ty-dong.html" js/data.js || (echo "THIEU meo-do-luong-live-tiktok-shop-compass-14-ngay-black-friday-13000-ty-dong trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/meo-do-luong-live-tiktok-shop-compass-14-ngay-black-friday-13000-ty-dong.html</loc>" sitemap.xml || (echo "THIEU meo-do-luong-live-tiktok-shop-compass-14-ngay-black-friday-13000-ty-dong trong sitemap"; exit 1)
          test -f bai-viet/do-manh-cuong-677-ty-dong-1-phien-live-tu-mac-vay-ban-hang-sixdo.html || (echo "THIEU bai-viet/do-manh-cuong-677-ty-dong-1-phien-live-tu-mac-vay-ban-hang-sixdo.html"; exit 1)
          grep -q "bai-viet/do-manh-cuong-677-ty-dong-1-phien-live-tu-mac-vay-ban-hang-sixdo.html" js/data.js || (echo "THIEU do-manh-cuong-677-ty-dong-1-phien-live-tu-mac-vay-ban-hang-sixdo trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/do-manh-cuong-677-ty-dong-1-phien-live-tu-mac-vay-ban-hang-sixdo.html</loc>" sitemap.xml || (echo "THIEU do-manh-cuong-677-ty-dong-1-phien-live-tu-mac-vay-ban-hang-sixdo trong sitemap"; exit 1)
          grep -q "v321-shell-1" sw.js || (echo "THIEU v321-shell-1 trong sw.js"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v321-drafts-deploy.zip
          git add sw.js bai-viet/tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba.html bai-viet/ao-phao-gile-hehi-19-ty-dong-video-19-giay-shopee-top-3.html bai-viet/mega-sale-q4-tiktok-shop-live-5-gio-gmv-gap-doi.html bai-viet/meo-do-luong-live-tiktok-shop-compass-14-ngay-black-friday-13000-ty-dong.html bai-viet/do-manh-cuong-677-ty-dong-1-phien-live-tu-mac-vay-ban-hang-sixdo.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v321-drafts: 5 bai viet tu ban thao (Muse Zalo/admin) — tran-tien-sinh-2086-ty-dong-1-ngay-mo-hinh-doi-tac-thay-the-tan-ba, ao-phao-gile-hehi-19-ty-dong-video-19-giay-shopee-top-3, mega-sale-q4-tiktok-shop-live-5-gio-gmv-gap-doi, meo-do-luong-live-tiktok-shop-compass-14-ngay-black-friday-13000-ty-dong, do-manh-cuong-677-ty-dong-1-phien-live-tu-mac-vay-ban-hang-sixdo"
            git push
          fi
