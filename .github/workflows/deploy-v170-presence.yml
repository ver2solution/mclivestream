name: Deploy v170-presence (khu trung 'Dang online')

on:
  push:
    paths:
      - '.github/workflows/deploy-v170-presence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v170-presence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v170-presence package
        run: |
          unzip -o mclivestream-v170-presence-deploy.zip
          echo "--- verify v170-presence ---"
          grep -q "filter(function (a, i, arr)" js/admin.js || (echo "THIEU dedup filter trong js/admin.js"; exit 1)
          grep -q "v170-shell-1" sw.js || (echo "THIEU v170-shell-1 trong sw.js"; exit 1)
          echo "verify OK: js/admin.js (dedup) + sw.js (v170-shell-1)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v170-presence-deploy.zip
          git add js/admin.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v170: khử trùng 'Đang online' (presence dedup theo email) + sw.js v170-shell-1"
            git push
          fi
