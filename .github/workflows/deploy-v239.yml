name: deploy-v239
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v239:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v239 package
        run: |
          unzip -o v239.zip
          ls -l quy-tac-diem-thuong.html sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "Không cần đăng nhập — khách vãng lai vẫn lọc được" quy-tac-diem-thuong.html
          grep -Fq "CACHE = 'v239-shell-1'" sw.js
          node --check sw.js
      - name: Commit v239 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add quy-tac-diem-thuong.html sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v239 F-R2-05 sua cau sai ve dieu kien loc o quy-tac-diem-thuong.html + sw.js v239-shell-1"
            git push
          fi
