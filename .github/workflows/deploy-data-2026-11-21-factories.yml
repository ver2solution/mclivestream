name: Deploy data 2026-11-21 factories

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-21-factories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-21-factories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-21 factories package
        run: |
          unzip -o mclivestream-data-2026-11-21-factories-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "06e71db25c2d9fbb91145ce2f14d0303f5c3bdb49cc4ef799a1436993554d06c" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "238" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "304" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "290" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "422" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "372" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "563" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "564" || (echo "BAD articles parsed count"; exit 1)
          for f in images/xuong/fac-418.jpg images/xuong/fac-421.jpg images/xuong/fac-422.jpg; do test -f "$f" || (echo "MISSING $f"; exit 1); done
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/xuong/fac-418.jpg images/xuong/fac-421.jpg images/xuong/fac-422.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-21 factories: 422 xuong (5 moi fac-418..fac-422, 3 anh), 238 mau / 304 shop / 290 lo / 372 kiot / 564 bai viet"
            git push
          fi
