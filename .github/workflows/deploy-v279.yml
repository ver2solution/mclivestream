name: deploy-v279
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v279:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v279 package
        run: |
          unzip -o v279-counter-sync.zip
          ls -l js/app.js sw.js bai-viet/gioi-thieu-vieclamlivestream-online.html
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v279-shell-1" sw.js
          grep -Fq "function liveCount" js/app.js
          grep -Fq "function renderLiveStats" js/app.js
          grep -Fq "liveCount:liveCount, renderLiveStats:renderLiveStats" js/app.js
          grep -Fq 'src="../js/data.js"' bai-viet/gioi-thieu-vieclamlivestream-online.html
          test "$(grep -o 'data-stat="[a-z]*"' bai-viet/gioi-thieu-vieclamlivestream-online.html | wc -l)" = "5"
          test "$(grep -c '230 mẫu' bai-viet/gioi-thieu-vieclamlivestream-online.html)" = "1"
          if grep -Fq 'cho shop nhỏ: 230 mẫu' bai-viet/gioi-thieu-vieclamlivestream-online.html; then echo "FAIL: meta van con so cu"; exit 1; fi
          echo "OK: v279 bo dem dong bo"
      - name: Commit v279 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js sw.js bai-viet/gioi-thieu-vieclamlivestream-online.html
          echo "So file staged:"
          git status --short | wc -l
          git status --short | head -5
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v279 bo dem tu dong dong bo (3 files)"
            git push
          fi
