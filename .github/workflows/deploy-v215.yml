name: Deploy v215
on:
  push:
    paths:
      - 'v215.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v215:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v215 package
        run: |
          unzip -o v215.zip
          echo "--- verify v215 (3 files) ---"
          unzip -l v215.zip
          test -f v20.css || (echo "THIEU v20.css"; exit 1)
          test -f sw.js || (echo "THIEU sw.js"; exit 1)
          test -f tests/test-v215-khoa-game.mjs || (echo "THIEU tests/test-v215-khoa-game.mjs"; exit 1)
          grep -q "CACHE = 'v215-shell-1'" sw.js || (echo "SAI: sw.js chua co CACHE v215-shell-1"; exit 1)
          grep -q "game-entry{display:none!important}" v20.css || (echo "SAI: v20.css thieu luat an game-entry"; exit 1)
          echo "verify OK: 3 files + CACHE v215-shell-1"
      - name: Run v215 tests
        run: node tests/test-v215-khoa-game.mjs
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20.css sw.js tests/test-v215-khoa-game.mjs
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "v215: tam khoa Popup Game - an nut gameEntry toan site (v20.css)"
            git push
          fi
