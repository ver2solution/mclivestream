name: deploy-v240
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v240:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v240 package
        run: |
          unzip -o v240.zip
          ls -l js/data.js bai-viet/gioi-thieu-ver2solution.html sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "230 mẫu, 270 shop đang tuyển, 71 lô xả kho, 240 xưởng may và 200 kiot" js/data.js
          grep -Fq "230 mẫu, 270 shop, 71 lô xả kho" bai-viet/gioi-thieu-ver2solution.html
          grep -Fq "CACHE = 'v240-shell-1'" sw.js
          node --check sw.js
          node -e "const fs=require('fs');const vm=require('vm');const s=fs.readFileSync('js/data.js','utf8');const sb={window:{}};vm.createContext(sb);vm.runInContext(s,sb);console.log('data.js parse OK, articles:',sb.window.V20_DATA.articles.length);"
      - name: Commit v240 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/data.js bai-viet/gioi-thieu-ver2solution.html sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v240 F-R2-07 cap nhat so cu bai gioi-thieu-ver2solution (bai-viet + js/data.js) + sw.js v240-shell-1"
            git push
          fi
