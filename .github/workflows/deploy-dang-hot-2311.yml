name: "Deploy articles-dang-hot-2026-11-23 (4 bai)"

on:
  push:
    paths:
      - '.github/workflows/deploy-dang-hot-2311.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-dang-hot-2311:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "640" || (echo "BASE DOI: data.js khong con 640 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "665" || (echo "BASE DOI: sitemap khong con 665 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip dang-hot-2311 package
        run: |
          unzip -o mclivestream-dang-hot-2311-deploy.zip
          echo "--- verify dang-hot-2311 (4 bai moi) ---"
            test -f "bai-viet/cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin.html" || (echo "THIEU bai-viet/cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin.html"; exit 1)
            test -f "images/bai-viet/cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin.jpg" || (echo "THIEU images/bai-viet/cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin.jpg"; exit 1)
            test -f "images/bai-viet/cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin-og.jpg" || (echo "THIEU images/bai-viet/cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin-og.jpg"; exit 1)
            grep -q "bai-viet/cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin.html" js/data.js || (echo "THIEU cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin.html</loc>" sitemap.xml || (echo "THIEU cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin trong sitemap"; exit 1)
            test -f "bai-viet/nintendo-switch-2-black-friday-2026-bundle-499-usd.html" || (echo "THIEU bai-viet/nintendo-switch-2-black-friday-2026-bundle-499-usd.html"; exit 1)
            test -f "images/bai-viet/nintendo-switch-2-black-friday-2026-bundle-499-usd.jpg" || (echo "THIEU images/bai-viet/nintendo-switch-2-black-friday-2026-bundle-499-usd.jpg"; exit 1)
            test -f "images/bai-viet/nintendo-switch-2-black-friday-2026-bundle-499-usd-og.jpg" || (echo "THIEU images/bai-viet/nintendo-switch-2-black-friday-2026-bundle-499-usd-og.jpg"; exit 1)
            grep -q "bai-viet/nintendo-switch-2-black-friday-2026-bundle-499-usd.html" js/data.js || (echo "THIEU nintendo-switch-2-black-friday-2026-bundle-499-usd trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/nintendo-switch-2-black-friday-2026-bundle-499-usd.html</loc>" sitemap.xml || (echo "THIEU nintendo-switch-2-black-friday-2026-bundle-499-usd trong sitemap"; exit 1)
            test -f "bai-viet/dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd.html" || (echo "THIEU bai-viet/dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd.html"; exit 1)
            test -f "images/bai-viet/dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd.jpg" || (echo "THIEU images/bai-viet/dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd.jpg"; exit 1)
            test -f "images/bai-viet/dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd-og.jpg" || (echo "THIEU images/bai-viet/dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd-og.jpg"; exit 1)
            grep -q "bai-viet/dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd.html" js/data.js || (echo "THIEU dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd.html</loc>" sitemap.xml || (echo "THIEU dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd trong sitemap"; exit 1)
            test -f "bai-viet/lego-black-friday-2026-283-bo-gia-thap-nhat.html" || (echo "THIEU bai-viet/lego-black-friday-2026-283-bo-gia-thap-nhat.html"; exit 1)
            test -f "images/bai-viet/lego-black-friday-2026-283-bo-gia-thap-nhat.jpg" || (echo "THIEU images/bai-viet/lego-black-friday-2026-283-bo-gia-thap-nhat.jpg"; exit 1)
            test -f "images/bai-viet/lego-black-friday-2026-283-bo-gia-thap-nhat-og.jpg" || (echo "THIEU images/bai-viet/lego-black-friday-2026-283-bo-gia-thap-nhat-og.jpg"; exit 1)
            grep -q "bai-viet/lego-black-friday-2026-283-bo-gia-thap-nhat.html" js/data.js || (echo "THIEU lego-black-friday-2026-283-bo-gia-thap-nhat trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/lego-black-friday-2026-283-bo-gia-thap-nhat.html</loc>" sitemap.xml || (echo "THIEU lego-black-friday-2026-283-bo-gia-thap-nhat trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "669" || (echo "SAI TONG sitemap, phai 669"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "644" || (echo "SAI TONG data.js, phai 644 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Guard node-parse (bai hoc v370)
        run: |
          node -e "global.window={};const fs=require('fs');eval(fs.readFileSync('js/data.js','utf8'));const a=window.V20_DATA.articles;console.log('articles.length =',a.length);console.log('empty =',a.filter(x=>!x).length);if(a.length!==645) { console.log('SAI: articles.length phai 645'); process.exit(1); } if(a.filter(x=>!x).length){ console.log('CO EMPTY ITEM'); process.exit(1); } const want=['cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin','nintendo-switch-2-black-friday-2026-bundle-499-usd','dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd','lego-black-friday-2026-283-bo-gia-thap-nhat']; const miss=want.filter(s=>!a.some(x=>x&&x.page==='bai-viet/'+s+'.html')); if(miss.length){ console.log('SLUG NGOAI MANG articles:', miss); process.exit(1); } console.log('node guard OK: 4 slug moi deu TRONG mang articles');"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-dang-hot-2311-deploy.zip || rm -f mclivestream-dang-hot-2311-deploy.zip
          git rm -q .github/workflows/deploy-dang-hot-2311.yml || true
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-dang-hot-2026-11-23: 4 bai (cach-nhap-hang-1688-truoc-tet-chon-xuong-uy-tin nintendo-switch-2-black-friday-2026-bundle-499-usd dyson-black-friday-2026-giam-toi-400-usd-airwrap-499-usd lego-black-friday-2026-283-bo-gia-thap-nhat)"
            git push
          fi
