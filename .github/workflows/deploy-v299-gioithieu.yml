name: "Deploy v299-gioithieu-livestats (trang gioi-thieu dong bo so live 238/290/143/320/280)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v299-gioithieu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v299-gioithieu-livestats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v299-gioithieu-livestats package
        run: |
          unzip -o mclivestream-v299-gioithieu-deploy.zip
          echo "--- verify v299-gioithieu-livestats (4 file: gioi-thieu.html + js/app.js + sw.js + infographic PNG) ---"
          test -f gioi-thieu.html || (echo "THIEU gioi-thieu.html"; exit 1)
          test -f js/app.js || (echo "THIEU js/app.js"; exit 1)
          test -f sw.js || (echo "THIEU sw.js"; exit 1)
          test -f images/bai-viet/gioi-thieu-vieclamlivestream-online.png || (echo "THIEU infographic PNG"; exit 1)
          grep -F -q 'id="gioi-thieu-infographic"' gioi-thieu.html || (echo "THIEU id gioi-thieu-infographic trong HTML"; exit 1)
          grep -F -q '<span data-stat="models">238</span>' gioi-thieu.html || (echo "THIEU fallback 238 mau"; exit 1)
          grep -F -q '<span data-stat="shops">290</span>' gioi-thieu.html || (echo "THIEU fallback 290 shop"; exit 1)
          grep -F -q '<span data-stat="lots">143</span>' gioi-thieu.html || (echo "THIEU fallback 143 lo"; exit 1)
          grep -F -q '<span data-stat="factories">320</span>' gioi-thieu.html || (echo "THIEU fallback 320 xuong"; exit 1)
          grep -F -q '<span data-stat="kiots">280</span>' gioi-thieu.html || (echo "THIEU fallback 280 kiot"; exit 1)
          if grep -F -q '236 mẫu livestream, 287 shop, 109 lô' gioi-thieu.html; then echo "CON so cu 236/287/109 trong HTML"; exit 1; fi
          grep -F -q "v299" js/app.js || (echo "THIEU comment v299 trong app.js"; exit 1)
          grep -F -q "getElementById('gioi-thieu-infographic')" js/app.js || (echo "THIEU logic dien alt infographic trong app.js"; exit 1)
          grep -F -q "v299-shell-1" sw.js || (echo "THIEU CACHE v299-shell-1 trong sw.js"; exit 1)
          node --check js/app.js || (echo "app.js LOI CU PHAP"; exit 1)
          file images/bai-viet/gioi-thieu-vieclamlivestream-online.png | grep -q "PNG image data, 1200 x 630" || (echo "PNG infographic sai dinh dang/kich thuoc (can 1200x630)"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v299-gioithieu-deploy.zip
          git add gioi-thieu.html js/app.js sw.js images/bai-viet/gioi-thieu-vieclamlivestream-online.png
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v299-gioithieu-livestats: trang gioi-thieu dong bo so live 238 mau / 290 shop / 143 lo dang hoat dong / 320 xuong / 280 kiot (fallback + alt tinh moi; renderLiveStats dien ca alt infographic; anh PNG tai tao 1200x630; sw.js v299-shell-1)"
            git push
          fi
