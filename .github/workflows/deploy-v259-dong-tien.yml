name: Deploy v259-dong-tien (4 bai Dong tien 15/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v259-dong-tien.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v259-dong-tien:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v259-dong-tien package
        run: |
          unzip -o mclivestream-v259-dong-tien-deploy.zip
          echo "--- verify v259-dong-tien (4 bai) ---"
          test "$(unzip -l mclivestream-v259-dong-tien-deploy.zip | grep -c ' bai-viet/.*\.html$')" -eq 4 || (echo "SAI: goi v259 phai co dung 4 file bai-viet HTML"; exit 1)
          test "$(unzip -l mclivestream-v259-dong-tien-deploy.zip | grep -c ' images/bai-viet/.*\.jpg$')" -eq 8 || (echo "SAI: goi v259 phai co dung 8 anh"; exit 1)
          if unzip -l mclivestream-v259-dong-tien-deploy.zip | grep -q ' sw.js$'; then echo "SAI: goi v259 KHONG duoc chua sw.js"; exit 1; fi
          for slug in von-nhap-hang-tet-can-bao-nhieu-von-5-muc-von-shop-nho gia-vang-the-gioi-giam-46-phan-tram-tuan-ve-3884-usd usd-len-dinh-19-thang-yen-vuot-160-nhat-ban-canh-bao mua-sam-le-cuoi-nam-2026-vuot-1013-nghin-ty-usd; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "--- verify KHONG mat bai cua cac cron khac hom nay (chong ghi de v190/v191) ---"
          for slug in luong-mau-livestream-2026-phan-tich y-tuong-ban-hang-online-22-y-tuong-shopify-2026 ban-hang-online-von-it-5-do-la-mo-shop-2026 kinh-doanh-online-cho-nguoi-moi-9-buoc-xero-2026 lazada-11-11-2026-lazmall-gmv-tang-10-lan-ai-lazzie temu-shein-2026-het-mien-thue-my-eu-thu-phi-buu-kien thuong-mai-dien-tu-viet-nam-9-thang-2026-442-nghin-ty tiktok-shop-12-12-sale-cuoi-nam-voucher-gmv-max cach-tang-tuong-tac-livestream-7-don-bay-giu-nguoi-xem cach-xu-ly-binh-luan-khi-livestream-ban-hang-5-buoc livestream-ban-hang-12-12-lich-van-hanh-4-giai-doan thiet-bi-livestream-ban-hang-3-muc-gia-50-usd; do
            grep -q "bai-viet/$slug.html" js/data.js || (echo "MAT BAI KHAC: $slug khong co trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "MAT BAI KHAC: $slug khong co trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" -eq 304 || (echo "SAI: sitemap phai co 304 URL (300 live + 4 bai moi)"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" -eq 278 || (echo "SAI: data.js phai co 278 bai (274 live + 4 bai moi)"; exit 1)
          echo "verify OK: 4 bai + 8 anh + data.js (278 bai) + sitemap (304 URL), 0 bai hom nay bi mat"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v259-dong-tien-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v259-dong-tien: 4 bai Dong tien 15/11/2026 (von nhap hang Tet keyword theo mua #3 + gia vang the gioi + ty gia USD/yen + mua sam le cuoi nam); data.js/sitemap rebase tren live 274 bai/300 URL (sau v257 Thi truong), 0 bai hom nay bi mat; sw.js NOT touched"
            git push
          fi
