name: Deploy data 2026-11-22 kiot

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-22-kiot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-22-kiot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-22 kiot package
        run: |
          # 22/11: chi 3 kiot moi APPEND (kiot-373..375), khong doi ten anh cu
          # nen khong rm file nao — zip chi chua data.js + 3 anh moi.
          unzip -o mclivestream-data-2026-11-22-kiot-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "894812cb210612da0a086ca4450d10ca80e69cdb53d4c80ec75fe280d3b2a5b4" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "kiot images: $(ls images/kiot/*.jpg | wc -l)"
          test "$(grep -c '"id": "kiot-' js/data.js)" = "375" || (echo "BAD kiots count"; exit 1)
          # Bai hoc v171: KHONG hardcode tong so file — kiem tra bat bien "0 file thieu":
          # moi img trong data.js phai ton tai tren dia sau khi giai nen.
          missing=0
          for f in $(grep -o 'images/kiot/kiot-[0-9]*\.jpg' js/data.js | sort -u); do
            [ -f "$f" ] || { echo "THIEU ANH: $f"; missing=$((missing+1)); }
          done
          echo "anh thieu: $missing"
          [ "$missing" -eq 0 ]
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/data.js images/kiot/
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-22 kiot: 375 kiot (3 moi 22/11: Sang Nhượng Quán Bida 320m2  448 triệu, Sang nhượng quán cafe góc 2  700 triệu, Sang nhượng quán cafe góc 2  180 triệu), 238 mau / 304 shop / 294 lo / 422 xuong / 605 bai"
            git push
          fi
