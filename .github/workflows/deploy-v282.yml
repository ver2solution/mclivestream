name: deploy-v282
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v282:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v282 package
        run: |
          unzip -o v282-gopy-fab.zip
          ls -l v20.css sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v282-shell-1" sw.js
          grep -Fq "gopy-fab-text" v20.css
          grep -Fq ".gopy-fab{display:flex;flex-direction:column" v20.css
          grep -Fq ".gopy-fab[hidden]{display:none}" v20.css
          echo "OK: v282 sua nut Gop y chu Gop y tran khoi vong tron"
      - name: Commit v282 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add v20.css sw.js
          echo "So file staged:"
          git status --short | wc -l
          git status --short | head -5
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v282 sua nut Gop y chu tran khoi vong tron (2 files)"
            git push
          fi
