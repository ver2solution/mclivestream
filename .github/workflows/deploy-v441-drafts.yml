name: Deploy v441-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v441-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v441-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v441-drafts package
        run: |
          unzip -o mclivestream-v441-drafts-deploy.zip
          echo "--- verify v441-drafts (7 bai) ---"
          test -f bai-viet/case-shop-nho-tuyen-mau-live-lan-dau-quy-trinh-4-buoc-tu-dang-tin-toi-len-song.html || (echo "THIEU bai-viet/case-shop-nho-tuyen-mau-live-lan-dau-quy-trinh-4-buoc-tu-dang-tin-toi-len-song.html"; exit 1)
          grep -q "bai-viet/case-shop-nho-tuyen-mau-live-lan-dau-quy-trinh-4-buoc-tu-dang-tin-toi-len-song.html" js/data.js || (echo "THIEU case-shop-nho-tuyen-mau-live-lan-dau-quy-trinh-4-buoc-tu-dang-tin-toi-len-song trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/case-shop-nho-tuyen-mau-live-lan-dau-quy-trinh-4-buoc-tu-dang-tin-toi-len-song.html</loc>" sitemap.xml || (echo "THIEU case-shop-nho-tuyen-mau-live-lan-dau-quy-trinh-4-buoc-tu-dang-tin-toi-len-song trong sitemap"; exit 1)
          test -f bai-viet/mau-live-moi-vao-nghe-5-loi-thuong-gap-trong-tuan-dau-va-cach-sua.html || (echo "THIEU bai-viet/mau-live-moi-vao-nghe-5-loi-thuong-gap-trong-tuan-dau-va-cach-sua.html"; exit 1)
          grep -q "bai-viet/mau-live-moi-vao-nghe-5-loi-thuong-gap-trong-tuan-dau-va-cach-sua.html" js/data.js || (echo "THIEU mau-live-moi-vao-nghe-5-loi-thuong-gap-trong-tuan-dau-va-cach-sua trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/mau-live-moi-vao-nghe-5-loi-thuong-gap-trong-tuan-dau-va-cach-sua.html</loc>" sitemap.xml || (echo "THIEU mau-live-moi-vao-nghe-5-loi-thuong-gap-trong-tuan-dau-va-cach-sua trong sitemap"; exit 1)
          test -f bai-viet/kich-ban-30-phut-dau-phien-live-mo-dau-gioi-thieu-va-chot-don-dau-tien.html || (echo "THIEU bai-viet/kich-ban-30-phut-dau-phien-live-mo-dau-gioi-thieu-va-chot-don-dau-tien.html"; exit 1)
          grep -q "bai-viet/kich-ban-30-phut-dau-phien-live-mo-dau-gioi-thieu-va-chot-don-dau-tien.html" js/data.js || (echo "THIEU kich-ban-30-phut-dau-phien-live-mo-dau-gioi-thieu-va-chot-don-dau-tien trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/kich-ban-30-phut-dau-phien-live-mo-dau-gioi-thieu-va-chot-don-dau-tien.html</loc>" sitemap.xml || (echo "THIEU kich-ban-30-phut-dau-phien-live-mo-dau-gioi-thieu-va-chot-don-dau-tien trong sitemap"; exit 1)
          test -f bai-viet/tuyen-mau-live-ha-noi-da-nang-tp-hcm-khac-nhau-o-diem-nao.html || (echo "THIEU bai-viet/tuyen-mau-live-ha-noi-da-nang-tp-hcm-khac-nhau-o-diem-nao.html"; exit 1)
          grep -q "bai-viet/tuyen-mau-live-ha-noi-da-nang-tp-hcm-khac-nhau-o-diem-nao.html" js/data.js || (echo "THIEU tuyen-mau-live-ha-noi-da-nang-tp-hcm-khac-nhau-o-diem-nao trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/tuyen-mau-live-ha-noi-da-nang-tp-hcm-khac-nhau-o-diem-nao.html</loc>" sitemap.xml || (echo "THIEU tuyen-mau-live-ha-noi-da-nang-tp-hcm-khac-nhau-o-diem-nao trong sitemap"; exit 1)
          test -f bai-viet/case-idol-live-tu-phien-live-0-don-toi-don-dau-tien-mau-va-shop-da-doi-nhung-gi.html || (echo "THIEU bai-viet/case-idol-live-tu-phien-live-0-don-toi-don-dau-tien-mau-va-shop-da-doi-nhung-gi.html"; exit 1)
          grep -q "bai-viet/case-idol-live-tu-phien-live-0-don-toi-don-dau-tien-mau-va-shop-da-doi-nhung-gi.html" js/data.js || (echo "THIEU case-idol-live-tu-phien-live-0-don-toi-don-dau-tien-mau-va-shop-da-doi-nhung-gi trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/case-idol-live-tu-phien-live-0-don-toi-don-dau-tien-mau-va-shop-da-doi-nhung-gi.html</loc>" sitemap.xml || (echo "THIEU case-idol-live-tu-phien-live-0-don-toi-don-dau-tien-mau-va-shop-da-doi-nhung-gi trong sitemap"; exit 1)
          test -f bai-viet/shop-viet-tin-tuyen-mau-live-ro-rang-mau-ung-tuyen-nhanh-shop-do-mat-thoi-gian.html || (echo "THIEU bai-viet/shop-viet-tin-tuyen-mau-live-ro-rang-mau-ung-tuyen-nhanh-shop-do-mat-thoi-gian.html"; exit 1)
          grep -q "bai-viet/shop-viet-tin-tuyen-mau-live-ro-rang-mau-ung-tuyen-nhanh-shop-do-mat-thoi-gian.html" js/data.js || (echo "THIEU shop-viet-tin-tuyen-mau-live-ro-rang-mau-ung-tuyen-nhanh-shop-do-mat-thoi-gian trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/shop-viet-tin-tuyen-mau-live-ro-rang-mau-ung-tuyen-nhanh-shop-do-mat-thoi-gian.html</loc>" sitemap.xml || (echo "THIEU shop-viet-tin-tuyen-mau-live-ro-rang-mau-ung-tuyen-nhanh-shop-do-mat-thoi-gian trong sitemap"; exit 1)
          test -f bai-viet/case-mau-live-gan-bo-voi-mot-shop-sau-black-friday-dieu-gi-giu-chan-nhau.html || (echo "THIEU bai-viet/case-mau-live-gan-bo-voi-mot-shop-sau-black-friday-dieu-gi-giu-chan-nhau.html"; exit 1)
          grep -q "bai-viet/case-mau-live-gan-bo-voi-mot-shop-sau-black-friday-dieu-gi-giu-chan-nhau.html" js/data.js || (echo "THIEU case-mau-live-gan-bo-voi-mot-shop-sau-black-friday-dieu-gi-giu-chan-nhau trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/case-mau-live-gan-bo-voi-mot-shop-sau-black-friday-dieu-gi-giu-chan-nhau.html</loc>" sitemap.xml || (echo "THIEU case-mau-live-gan-bo-voi-mot-shop-sau-black-friday-dieu-gi-giu-chan-nhau trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v441-drafts-deploy.zip
          git add bai-viet/case-shop-nho-tuyen-mau-live-lan-dau-quy-trinh-4-buoc-tu-dang-tin-toi-len-song.html images/bai-viet/case-shop-nho-tuyen-mau-live-lan-dau-quy-trinh-4-buoc-tu-dang-tin-toi-len-song.jpg bai-viet/mau-live-moi-vao-nghe-5-loi-thuong-gap-trong-tuan-dau-va-cach-sua.html images/bai-viet/mau-live-moi-vao-nghe-5-loi-thuong-gap-trong-tuan-dau-va-cach-sua.jpg bai-viet/kich-ban-30-phut-dau-phien-live-mo-dau-gioi-thieu-va-chot-don-dau-tien.html images/bai-viet/kich-ban-30-phut-dau-phien-live-mo-dau-gioi-thieu-va-chot-don-dau-tien.jpg bai-viet/tuyen-mau-live-ha-noi-da-nang-tp-hcm-khac-nhau-o-diem-nao.html images/bai-viet/tuyen-mau-live-ha-noi-da-nang-tp-hcm-khac-nhau-o-diem-nao.jpg bai-viet/case-idol-live-tu-phien-live-0-don-toi-don-dau-tien-mau-va-shop-da-doi-nhung-gi.html images/bai-viet/case-idol-live-tu-phien-live-0-don-toi-don-dau-tien-mau-va-shop-da-doi-nhung-gi.jpg bai-viet/shop-viet-tin-tuyen-mau-live-ro-rang-mau-ung-tuyen-nhanh-shop-do-mat-thoi-gian.html images/bai-viet/shop-viet-tin-tuyen-mau-live-ro-rang-mau-ung-tuyen-nhanh-shop-do-mat-thoi-gian.jpg bai-viet/case-mau-live-gan-bo-voi-mot-shop-sau-black-friday-dieu-gi-giu-chan-nhau.html images/bai-viet/case-mau-live-gan-bo-voi-mot-shop-sau-black-friday-dieu-gi-giu-chan-nhau.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v441-drafts: 7 bai viet tu ban thao (Muse Zalo/admin) — case-shop-nho-tuyen-mau-live-lan-dau-quy-trinh-4-buoc-tu-dang-tin-toi-len-song, mau-live-moi-vao-nghe-5-loi-thuong-gap-trong-tuan-dau-va-cach-sua, kich-ban-30-phut-dau-phien-live-mo-dau-gioi-thieu-va-chot-don-dau-tien, tuyen-mau-live-ha-noi-da-nang-tp-hcm-khac-nhau-o-diem-nao, case-idol-live-tu-phien-live-0-don-toi-don-dau-tien-mau-va-shop-da-doi-nhung-gi, shop-viet-tin-tuyen-mau-live-ro-rang-mau-ung-tuyen-nhanh-shop-do-mat-thoi-gian, case-mau-live-gan-bo-voi-mot-shop-sau-black-friday-dieu-gi-giu-chan-nhau"
            git push
          fi
