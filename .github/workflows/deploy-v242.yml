name: deploy-v242
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v242:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v242 package
        run: |
          unzip -o v242.zip
          ls -l v20.css sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v242 (F-R2-03)" v20.css
          grep -Fq "CACHE = 'v242-shell-1'" sw.js
          node --check sw.js
      - name: Commit v242 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add v20.css sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v242 F-R2-03 nut switch khong bi cat chu (flex-basis auto + padding 4px) + sw.js v242-shell-1"
            git push
          fi
