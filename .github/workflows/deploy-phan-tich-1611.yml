name: Deploy articles-phan-tich-2026-11-16 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-phan-tich-1611.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-phan-tich-1611:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "311" || (echo "BASE DOI: data.js khong con 311 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "337" || (echo "BASE DOI: sitemap khong con 337 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip phan-tich-1611 package
        run: |
          unzip -o mclivestream-phan-tich-1611-deploy.zip
          echo "--- verify phan-tich-1611 (4 bai moi) ---"
          for slug in phi-san-tiktok-shop-shopee-2026 y-tuong-kinh-doanh-it-von-24-y-tuong-shopify-2026 ban-hang-online-khong-can-von-5-mo-hinh-2026 khoi-nghiep-ban-hang-online-gymshark-646-trieu-bang; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          for slug in thong-ke-ho-so-moi-14-11-2026 tuyen-mau-live-tp-hcm luong-mau-livestream-tet tuyen-mau-live-ban-quan-ao; do
            grep -q "\"page\": \"bai-viet/$slug.html\"" js/data.js || (echo "THIEU RESTORE $slug trong data.js"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "341" || (echo "SAI TONG sitemap, phai 341"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "315" || (echo "SAI TONG data.js, phai 315 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-phan-tich-1611-deploy.zip || rm -f mclivestream-phan-tich-1611-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-phan-tich-2026-11-16: 4 bai (phi-san-tiktok-shop-shopee-2026, y-tuong-kinh-doanh-it-von-24-y-tuong-shopify-2026, ban-hang-online-khong-can-von-5-mo-hinh-2026, khoi-nghiep-ban-hang-online-gymshark-646-trieu-bang)"
            git push
          fi
