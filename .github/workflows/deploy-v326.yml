name: "Deploy v326 (dong ghi chu bot theo trang thai dang nhap)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v326.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v326:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v326 package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; bai hoc v307: KHONG guard HEAD-SHA; bai hoc v305: dem bang grep -o | wc -l, KHONG grep -c; so sanh so bang -eq) ---"
          grep -q 'v326-shell-1' sw.js && (echo "v326 DA DEPLOY ROI - dung"; exit 1) || true
          grep -q 'v325-shell-1' sw.js || (echo "BASE SAI: sw.js phai dang o v325-shell-1 (v325 da live)"; exit 1)
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "828bc91f10da5a88eda42686f77ac3e2" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -o '<loc>' sitemap.xml | wc -l)" -eq 392 || (echo "BASE DOI: sitemap khong con 392 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v326-deploy.zip
          echo "--- verify v326 (3 files) ---"
          test "$(unzip -l mclivestream-v326-deploy.zip | grep -cE ' (index\.html|js/community-chat\.js|sw\.js)$')" -eq 3 || (echo "SAI: goi v326 phai co dung 3 file"; exit 1)
          grep -q "v326-shell-1" sw.js || (echo "SAI: sw.js phai co v326-shell-1"; exit 1)
          grep -q 'id="homeChatBotNote"' index.html || (echo "SAI: index.html phai co id homeChatBotNote"; exit 1)
          grep -q "Mẹo nhỏ: Bạn đăng nhập để chọn tin tóm tắt yêu thích cho bot hoặc tắt nó đi" index.html || (echo "SAI: index.html phai co dong ghi chu moi"; exit 1)
          grep -q "homeChatBotNote" js/community-chat.js || (echo "SAI: js/community-chat.js phai doi note theo trang thai"; exit 1)
          grep -q "js/chat-bots.js" index.html || (echo "SAI: index.html phai giu script chat-bots.js (v325)"; exit 1)
          echo "verify OK: 3 files, v326 co mat, dong ghi chu bot moi co mat, v325 con nguyen, data.js/sitemap khong doi"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v326-deploy.zip
          git add index.html js/community-chat.js sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v326 (dong ghi chu bot theo trang thai dang nhap): khach thay loi moi dang nhap (kich thich dang ky), nguoi da dang nhap thay link chinh muc tom tat; bump SW CACHE v325-shell-1 -> v326-shell-1; data.js/sitemap khong doi (base 3bc9230)"
            git push
          fi
