name: Deploy v463-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v463-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v463-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v463-drafts package
        run: |
          unzip -o mclivestream-v463-drafts-deploy.zip
          echo "--- verify v463-drafts (1 bai) ---"
          test -f bai-viet/carters-75400-ty-dong-nam-lai-roi-mot-nua-mo-hinh-kinh-doanh-thoi-trang-tre-em-patpat.html || (echo "THIEU bai-viet/carters-75400-ty-dong-nam-lai-roi-mot-nua-mo-hinh-kinh-doanh-thoi-trang-tre-em-patpat.html"; exit 1)
          grep -q "bai-viet/carters-75400-ty-dong-nam-lai-roi-mot-nua-mo-hinh-kinh-doanh-thoi-trang-tre-em-patpat.html" js/data.js || (echo "THIEU carters-75400-ty-dong-nam-lai-roi-mot-nua-mo-hinh-kinh-doanh-thoi-trang-tre-em-patpat trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/carters-75400-ty-dong-nam-lai-roi-mot-nua-mo-hinh-kinh-doanh-thoi-trang-tre-em-patpat.html</loc>" sitemap.xml || (echo "THIEU carters-75400-ty-dong-nam-lai-roi-mot-nua-mo-hinh-kinh-doanh-thoi-trang-tre-em-patpat trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v463-drafts-deploy.zip
          git add bai-viet/carters-75400-ty-dong-nam-lai-roi-mot-nua-mo-hinh-kinh-doanh-thoi-trang-tre-em-patpat.html images/bai-viet/carters-thoi-trang-tre-em.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v463-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — carters-75400-ty-dong-nam-lai-roi-mot-nua-mo-hinh-kinh-doanh-thoi-trang-tre-em-patpat"
            git push
          fi
