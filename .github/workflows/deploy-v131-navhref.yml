name: Deploy v131-navhref

on:
  push:
    paths:
      - '.github/workflows/deploy-v131-navhref.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v131-navhref:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v131-navhref package
        run: |
          unzip -o mclivestream-v131-navhref.zip
          echo "--- verify v131-navhref payload (121 files) ---"
          echo "files in zip: $(unzip -l mclivestream-v131-navhref.zip | tail -1)"
          grep -q "const CACHE = 'v131-shell-1';" sw.js && echo "sw.js CACHE v131-shell-1 OK"
          grep -q 'href="danh-sach-shop.html" class="">Dành cho Mẫu' index.html && echo "index nav Mau->shop.html OK"
          grep -q 'href="danh-sach-mau.html" class="">Dành cho Shop' index.html && echo "index nav Shop->mau.html OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v131-navhref.zip
          git add -A
          git status --short | head -60
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v131: doi dich nav Dành cho Mẫu -> shop list, Dành cho Shop -> 3 doi tuong + bump CACHE v131"
            git push
          fi
