name: deploy-v276
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v276:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v276 package
        run: |
          unzip -o v276.zip
          ls -l v20.css sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v276 (mobile-auth)" v20.css
          grep -Fq "CACHE = 'v276-shell-1'" sw.js
          node --check sw.js
      - name: Commit v276 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add v20.css sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v276 sua tran the dang-ky/dang-nhap mobile + sw.js v276-shell-1"
            git push
          fi
