name: deploy-v283
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v283:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v283 package
        run: |
          unzip -o v283-search-p0.zip
          ls -l js/search.js v20.css sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v283-shell-1" sw.js
          grep -Fq "#searchLoadMore[hidden], .feed-status[hidden], .search-results[hidden]{display:none}" v20.css
          grep -Fq "fmtElapsed" js/search.js
          grep -Fq ".gopy-fab{display:flex;flex-direction:column" v20.css
          echo "OK: v283 sua tim kiem MBS-1/2/4 (giua nguyen sua v282)"
      - name: Commit v283 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/search.js v20.css sw.js
          echo "So file staged:"
          git status --short | wc -l
          git status --short | head -5
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v283 sua tim kiem MBS-1/2/4 (3 files)"
            git push
          fi
