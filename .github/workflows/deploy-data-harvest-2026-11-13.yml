name: Deploy data harvest 2026-11-13

on:
  push:
    paths:
      - '.github/workflows/deploy-data-harvest-2026-11-13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data harvest package
        run: |
          unzip -o mclivestream-data-harvest-2026-11-13-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "model images new: $(ls images/th-15[7-9].jpg images/th-16[0-6].jpg 2>/dev/null | wc -l)"
          echo "kiot images new: $(ls images/kiot/kiot-8[1-9].jpg images/kiot/kiot-9[0-9].jpg images/kiot/kiot-1[01][0-9].jpg images/kiot/kiot-120.jpg 2>/dev/null | wc -l)"
          test "$(grep -c '"id": "th-' js/data.js)" = "128" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "187" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "120" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "29" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "120" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "217" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "218" || (echo "BAD articles parsed count"; exit 1)
          test "$(ls images/th-15[7-9].jpg images/th-16[0-6].jpg 2>/dev/null | wc -l)" = "10" || (echo "BAD model images"; exit 1)
          test "$(ls images/kiot/kiot-8[1-9].jpg images/kiot/kiot-9[0-9].jpg images/kiot/kiot-1[01][0-9].jpg images/kiot/kiot-120.jpg 2>/dev/null | wc -l)" = "39" || (echo "BAD kiot images"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/th-157.jpg images/th-158.jpg images/th-159.jpg images/th-160.jpg images/th-161.jpg images/th-162.jpg images/th-163.jpg images/th-164.jpg images/th-165.jpg images/th-166.jpg images/kiot/kiot-81.jpg images/kiot/kiot-82.jpg images/kiot/kiot-83.jpg images/kiot/kiot-84.jpg images/kiot/kiot-85.jpg images/kiot/kiot-86.jpg images/kiot/kiot-87.jpg images/kiot/kiot-88.jpg images/kiot/kiot-89.jpg images/kiot/kiot-90.jpg images/kiot/kiot-91.jpg images/kiot/kiot-92.jpg images/kiot/kiot-93.jpg images/kiot/kiot-94.jpg images/kiot/kiot-95.jpg images/kiot/kiot-96.jpg images/kiot/kiot-97.jpg images/kiot/kiot-98.jpg images/kiot/kiot-99.jpg images/kiot/kiot-100.jpg images/kiot/kiot-101.jpg images/kiot/kiot-102.jpg images/kiot/kiot-103.jpg images/kiot/kiot-104.jpg images/kiot/kiot-105.jpg images/kiot/kiot-106.jpg images/kiot/kiot-107.jpg images/kiot/kiot-108.jpg images/kiot/kiot-109.jpg images/kiot/kiot-110.jpg images/kiot/kiot-111.jpg images/kiot/kiot-112.jpg images/kiot/kiot-113.jpg images/kiot/kiot-114.jpg images/kiot/kiot-115.jpg images/kiot/kiot-116.jpg images/kiot/kiot-117.jpg images/kiot/kiot-118.jpg images/kiot/kiot-119.jpg images/kiot/kiot-120.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data harvest 2026-11-13: +20 mau th-147..th-166, +35 shop sh-153..sh-187, +40 kiot moi (URL chua co tren live, danh lai kiot-81..kiot-120), 0 muc live mat; live base 218 bai"
            git push
          fi
