name: Deploy v194-dong-tien (4 bai Dong tien 13/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v194-dong-tien.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v194-dong-tien:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v194-dong-tien package
        run: |
          unzip -o mclivestream-v194-dong-tien-deploy.zip
          echo "--- verify v194-dong-tien (4 bai) ---"
          test "$(unzip -l mclivestream-v194-dong-tien-deploy.zip | grep -c ' bai-viet/.*\.html$')" -eq 4 || (echo "SAI: goi v194 phai co dung 4 file bai-viet HTML"; exit 1)
          test "$(unzip -l mclivestream-v194-dong-tien-deploy.zip | grep -c ' images/bai-viet/.*\.jpg$')" -eq 8 || (echo "SAI: goi v194 phai co dung 8 anh"; exit 1)
          if unzip -l mclivestream-v194-dong-tien-deploy.zip | grep -q ' sw.js$'; then echo "SAI: goi v194 KHONG duoc chua sw.js"; exit 1; fi
          for slug in doanh-thu-shop-online-tet-737-nghin-ty-shop-nho-lam-gi fed-hop-thang-12-101-chuyen-gia-dong-thuan-tang-25-diem dong-yen-nhat-ve-159-nhat-ban-dot-97-ty-usd-cuu-tien gia-vang-roi-khoi-4000-usd-sau-tuan-tang-manh-nhat-3-thang; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "--- verify KHONG mat bai cua cac cron khac hom nay (chong ghi de v190/v191) ---"
          for slug in luong-mau-livestream-tin-tuyen-12-11-2026 tuyen-mau-livestream-tet thong-ke-ho-so-moi-12-11-2026 mau-livestream-khong-can-kinh-nghiem-my-30-40-usd-gio livestream-12-12-dinh-doanh-thu-roi-vao-d1-shop-chuan-bi-gi livestream-ban-hang-hieu-qua-1776-ty-ndt-double-11-chot-so livestream-shopee-thi-truong-live-viet-nam-488-ty-usd livestream-tiktok-ban-hang-12-12-voucher-80-phan-tram double-12-2026-phan-tich-5-bai-hoc-tu-11-11-shop-nho mo-hinh-ban-hang-qua-koc-79-trieu-usd-30-ngay-my kinh-doanh-handmade-online-etsy-26-ty-usd-quy-3-2026 mo-hinh-kinh-doanh-doc-la-ao-chong-mo-hoi-700000-usd thi-truong-tet-2026-suc-mua-tang-51-phan-tram thi-truong-thuong-mai-dien-tu-viet-nam-32-ty-usd-2026 thuong-mai-dien-tu-xuyen-bien-gioi-284-nghin-ty-ndt video-commerce-viet-nam-32-ty-usd-2026 ai-livestream-ban-hang-tet-100000-goi-ai-30-phut livestream-ban-hang-bang-ai-77-ty-usd-re-bang-1-10-mc-that livestream-commerce-779-ty-usd-dong-nam-a-2026 quang-cao-tiktok-shop-12-12-gmv-max-dang-ky-den-25-11 xu-huong-ban-hang-online-2027-ai-social-commerce xu-huong-thuong-mai-dien-tu-2026-euromonitor-4-xu-huong xu-huong-mua-sam-online-gen-z-tiktok-53-phan-tram shopee-live-67-phan-tram-chi-tieu-online-viet-nam; do
            grep -q "bai-viet/$slug.html" js/data.js || (echo "MAT BAI KHAC: $slug khong co trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "MAT BAI KHAC: $slug khong co trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" -eq 227 || (echo "SAI: sitemap phai co 227 URL (223 live + 4 bai moi)"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" -eq 204 || (echo "SAI: data.js phai co 204 bai (200 live + 4 bai moi)"; exit 1)
          echo "verify OK: 4 bai + 8 anh + data.js (204 bai) + sitemap (227 URL), 0 bai hom nay bi mat"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v194-dong-tien-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v194-dong-tien: 4 bai Dong tien 13/11/2026 (doanh thu shop online Tet keyword theo mua + Fed hop thang 12 + dong yen Nhat ve 159 + gia vang roi khoi 4000 USD); data.js/sitemap rebase tren live 200 bai, 0 bai hom nay bi mat; sw.js NOT touched"
            git push
          fi
