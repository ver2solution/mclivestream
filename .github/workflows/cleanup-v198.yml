name: Cleanup v198

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Remove v198.zip and deploy workflow
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@users.noreply.github.com"
          git rm -f v198.zip .github/workflows/deploy-v198.yml .github/workflows/cleanup-v198.yml
          git status --short
          git commit -m "chore: remove deploy-v198 workflow"
          git push origin main
