name: Deploy v104

on:
  push:
    paths:
      - '.github/workflows/deploy-v104.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v104:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v104 deploy package
        run: |
          unzip -o mclivestream-v104-deploy.zip
          ls -l index.html js/app.js sw.js hoi-dap.html
          sha256sum index.html js/app.js sw.js hoi-dap.html
          grep -q "v104-shell-1" sw.js && echo "sw.js CACHE OK: v104-shell-1"
          grep -q "var perPage=12;" js/app.js && echo "app.js perPage 12 OK"
          grep -q "mỗi trang tối đa 12 shop" index.html && echo "index FAQ 12 shop OK"
          grep -q "mỗi trang tối đa 12 shop" hoi-dap.html && echo "hoi-dap FAQ 12 shop OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js sw.js hoi-dap.html
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v104: Trang shop 12 the/trang (2 hang du), FAQ 12 shop"
            git push
          fi
