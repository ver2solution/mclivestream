name: Deploy v124-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v124-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v124-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v124-drafts package
        run: |
          unzip -o mclivestream-v124-drafts-deploy.zip
          echo "--- verify v124-drafts (1 bai) ---"
          test -f bai-viet/dich-vu-comment-seeding-livestream.html || (echo "THIEU bai-viet/dich-vu-comment-seeding-livestream.html"; exit 1)
          grep -q "bai-viet/dich-vu-comment-seeding-livestream.html" js/data.js || (echo "THIEU dich-vu-comment-seeding-livestream trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/dich-vu-comment-seeding-livestream.html</loc>" sitemap.xml || (echo "THIEU dich-vu-comment-seeding-livestream trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v124-drafts-deploy.zip
          git add bai-viet/dich-vu-comment-seeding-livestream.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v124-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — dich-vu-comment-seeding-livestream"
            git push
          fi
