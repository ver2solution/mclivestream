name: deploy-v244
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v244:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v244 package
        run: |
          unzip -o v244.zip
          ls -l js/comments.js sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v244 (MB-15)" js/comments.js
          grep -Fq "CACHE = 'v244-shell-1'" sw.js
          node --check js/comments.js
          node --check sw.js
      - name: Commit v244 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/comments.js sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v244 MB-15 form binh luan dien san ten TK dang nhap + sw.js v244-shell-1"
            git push
          fi
