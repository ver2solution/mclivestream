name: Deploy data 2026-11-10 kiot

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-10-kiot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-10-kiot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-10 kiot package
        run: |
          unzip -o mclivestream-data-2026-11-10-kiot-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          ls -l images/kiot/kiot-01.jpg images/kiot/kiot-02.jpg images/kiot/kiot-03.jpg images/kiot/kiot-04.jpg images/kiot/kiot-05.jpg images/kiot/kiot-09.jpg images/kiot/kiot-11.jpg images/kiot/kiot-12.jpg images/kiot/kiot-15.jpg images/kiot/kiot-19.jpg images/kiot/kiot-21.jpg images/kiot/kiot-22.jpg images/kiot/kiot-23.jpg images/kiot/kiot-24.jpg images/kiot/kiot-28.jpg images/kiot/kiot-29.jpg images/kiot/kiot-32.jpg images/kiot/kiot-34.jpg images/kiot/kiot-35.jpg images/kiot/kiot-40.jpg
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/kiot/kiot-01.jpg images/kiot/kiot-02.jpg images/kiot/kiot-03.jpg images/kiot/kiot-04.jpg images/kiot/kiot-05.jpg images/kiot/kiot-09.jpg images/kiot/kiot-11.jpg images/kiot/kiot-12.jpg images/kiot/kiot-15.jpg images/kiot/kiot-19.jpg images/kiot/kiot-21.jpg images/kiot/kiot-22.jpg images/kiot/kiot-23.jpg images/kiot/kiot-24.jpg images/kiot/kiot-28.jpg images/kiot/kiot-29.jpg images/kiot/kiot-32.jpg images/kiot/kiot-34.jpg images/kiot/kiot-35.jpg images/kiot/kiot-40.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-10 kiot: 40 kiot (10 kiot moi kiot-01/02/03/04/05/09/15/22/23/34 + doi ten 10 anh cu theo id moi), 77 mau / 116 shop / 26 lo / 70 xuong"
            git push
          fi
