name: deploy-v245
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v245:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v245 package
        run: |
          unzip -o v245.zip
          ls -l v20.css sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v245 (N13/N14)" v20.css
          grep -Fq "CACHE = 'v245-shell-1'" sw.js
          node --check sw.js
      - name: Commit v245 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add v20.css sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v245 N13/N14 nut sao trong dialog khong che nut dong + sw.js v245-shell-1"
            git push
          fi
