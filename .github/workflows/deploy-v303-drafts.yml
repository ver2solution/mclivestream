name: Deploy v303-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v303-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v303-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v303-drafts package
        run: |
          unzip -o mclivestream-v303-drafts-deploy.zip
          echo "--- verify v303-drafts (1 bai) ---"
          test -f bai-viet/kinh-mat-meo-26-ty-dong-video-10-giay-shopee-viral-black-friday.html || (echo "THIEU bai-viet/kinh-mat-meo-26-ty-dong-video-10-giay-shopee-viral-black-friday.html"; exit 1)
          grep -q "bai-viet/kinh-mat-meo-26-ty-dong-video-10-giay-shopee-viral-black-friday.html" js/data.js || (echo "THIEU kinh-mat-meo-26-ty-dong-video-10-giay-shopee-viral-black-friday trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/kinh-mat-meo-26-ty-dong-video-10-giay-shopee-viral-black-friday.html</loc>" sitemap.xml || (echo "THIEU kinh-mat-meo-26-ty-dong-video-10-giay-shopee-viral-black-friday trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v303-drafts-deploy.zip
          git add bai-viet/kinh-mat-meo-26-ty-dong-video-10-giay-shopee-viral-black-friday.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v303-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — kinh-mat-meo-26-ty-dong-video-10-giay-shopee-viral-black-friday"
            git push
          fi
