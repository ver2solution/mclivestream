name: "Deploy v327 (khung chat dai het khung, tin nhan neo day)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v327.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v327:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v327 package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; bai hoc v307: KHONG guard HEAD-SHA; bai hoc v305: dem bang grep -o | wc -l, KHONG grep -c; so sanh so bang -eq) ---"
          grep -q 'v327-shell-1' sw.js && (echo "v327 DA DEPLOY ROI - dung"; exit 1) || true
          grep -q 'v326-shell-1' sw.js || (echo "BASE SAI: sw.js phai dang o v326-shell-1 (v326 da live)"; exit 1)
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "828bc91f10da5a88eda42686f77ac3e2" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -o '<loc>' sitemap.xml | wc -l)" -eq 392 || (echo "BASE DOI: sitemap khong con 392 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v327-deploy.zip
          echo "--- verify v327 (2 files) ---"
          test "$(unzip -l mclivestream-v327-deploy.zip | grep -cE ' (v20\.css|sw\.js)$')" -eq 2 || (echo "SAI: goi v327 phai co dung 2 file"; exit 1)
          grep -q "v327-shell-1" sw.js || (echo "SAI: sw.js phai co v327-shell-1"; exit 1)
          grep -q "justify-content:flex-end" v20.css || (echo "SAI: v20.css phai co justify-content:flex-end o .chat-list"; exit 1)
          grep -q "chat-list{flex:1;min-height:200px" v20.css || (echo "SAI: v20.css phai co .chat-list flex:1 min-height:200px (bo max-height)"; exit 1)
          grep -q "chat-input{display:flex;gap:10px;padding:12px 0 0;border-top" v20.css || (echo "SAI: v20.css phai co .chat-input KHONG margin-top:auto"; exit 1)
          grep -q "js/chat-bots.js" index.html || (echo "SAI: index.html phai giu script chat-bots.js (v325)"; exit 1)
          grep -q 'id="homeChatBotNote"' index.html || (echo "SAI: index.html phai giu homeChatBotNote (v326)"; exit 1)
          echo "verify OK: 2 files, v327 co mat, list dai het khung + neo day + o nhap o day, v325/v326 con nguyen, data.js/sitemap khong doi"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v327-deploy.zip
          git add v20.css sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v327 (khung chat dai het khung, tin nhan neo day): bo margin-top:auto o nhap + bo max-height:420px o list (list flex:1 lon het khung, tin neo day, o nhap o day); bump SW CACHE v326-shell-1 -> v327-shell-1; data.js/sitemap khong doi (base bd6749a)"
            git push
          fi
