name: Deploy v149

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip deploy package
        run: unzip -o mclivestream-v149-quy-dinh-facebook-deploy.zip
      - name: Commit and push
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@users.noreply.github.com"
          git add -A
          git commit -m "v149: bài quy định Facebook 2026 + data.js + sitemap"
          git push
