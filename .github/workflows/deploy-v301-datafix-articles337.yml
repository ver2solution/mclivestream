name: "Deploy v301-datafix-articles337 (sua lo data.js - articles[337] undefined)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v301-datafix-articles337.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v301-datafix-articles337:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v301-datafix-articles337 package
        run: |
          unzip -o mclivestream-v301-datafix-articles337-deploy.zip
          echo "--- verify v301-datafix-articles337 (1 file: js/data.js) ---"
          test -f js/data.js || (echo "THIEU js/data.js"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
          if grep -F -q '},,' js/data.js; then echo "CON lo },, trong data.js"; exit 1; fi
          grep -F -q 'Đồ trang trí Tết bán chạy: 251,4 tỷ linh vật Ngựa' js/data.js || (echo "THIEU bai articles[337] trong data.js"; exit 1)
          node --input-type=module -e "
          import fs from 'node:fs';
          import vm from 'node:vm';
          const src = fs.readFileSync('js/data.js','utf8');
          const ctx = { window: {}, console };
          vm.createContext(ctx);
          vm.runInContext(src, ctx);
          const D = ctx.window.V20_DATA || ctx.D || ctx.window.D;
          if (!D) { console.log('KHONG TIM THAY DU LIEU'); process.exit(1); }
          const arts = D.articles || [];
          if (arts.length !== 352) { console.log('articles raw len sai:', arts.length); process.exit(1); }
          if (arts.filter(Boolean).length !== 352) { console.log('articles con lo trong'); process.exit(1); }
          if (arts[337] === undefined) { console.log('articles[337] van undefined'); process.exit(1); }
          console.log('articles[337]:', arts[337].title);
          console.log('models:', (D.models||[]).length, 'shops:', (D.shops||[]).length, 'lots:', (D.lots||[]).length, 'factories:', (D.factories||[]).length, 'kiots:', (D.kiots||[]).length);
          "
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v301-datafix-articles337-deploy.zip
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v301-datafix-articles337: sua lo data.js (bo 1 dau phay thua sau muc JD.com) - articles[337] co gia tri tro lai, 352/352 bai co dinh nghia, khong con lo trong"
            git push
          fi
