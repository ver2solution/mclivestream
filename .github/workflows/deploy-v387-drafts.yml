name: Deploy v387-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v387-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v387-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v387-drafts package
        run: |
          unzip -o mclivestream-v387-drafts-deploy.zip
          echo "--- verify v387-drafts (1 bai) ---"
          test -f bai-viet/hoa-thieu-609-ty-dong-5-gio-roi-tut-con-75-ty-7-meo-chon-dung-nen-tang-livestream.html || (echo "THIEU bai-viet/hoa-thieu-609-ty-dong-5-gio-roi-tut-con-75-ty-7-meo-chon-dung-nen-tang-livestream.html"; exit 1)
          grep -q "bai-viet/hoa-thieu-609-ty-dong-5-gio-roi-tut-con-75-ty-7-meo-chon-dung-nen-tang-livestream.html" js/data.js || (echo "THIEU hoa-thieu-609-ty-dong-5-gio-roi-tut-con-75-ty-7-meo-chon-dung-nen-tang-livestream trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/hoa-thieu-609-ty-dong-5-gio-roi-tut-con-75-ty-7-meo-chon-dung-nen-tang-livestream.html</loc>" sitemap.xml || (echo "THIEU hoa-thieu-609-ty-dong-5-gio-roi-tut-con-75-ty-7-meo-chon-dung-nen-tang-livestream trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v387-drafts-deploy.zip
          git add bai-viet/hoa-thieu-609-ty-dong-5-gio-roi-tut-con-75-ty-7-meo-chon-dung-nen-tang-livestream.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v387-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — hoa-thieu-609-ty-dong-5-gio-roi-tut-con-75-ty-7-meo-chon-dung-nen-tang-livestream"
            git push
          fi
