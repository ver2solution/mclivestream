name: Deploy v444-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v444-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v444-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v444-drafts package
        run: |
          unzip -o mclivestream-v444-drafts-deploy.zip
          echo "--- verify v444-drafts (1 bai) ---"
          test -f bai-viet/shein-gan-1-trieu-ty-dong-nam-mo-hinh-thoi-trang-sieu-nhanh-nu-18-35.html || (echo "THIEU bai-viet/shein-gan-1-trieu-ty-dong-nam-mo-hinh-thoi-trang-sieu-nhanh-nu-18-35.html"; exit 1)
          grep -q "bai-viet/shein-gan-1-trieu-ty-dong-nam-mo-hinh-thoi-trang-sieu-nhanh-nu-18-35.html" js/data.js || (echo "THIEU shein-gan-1-trieu-ty-dong-nam-mo-hinh-thoi-trang-sieu-nhanh-nu-18-35 trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/shein-gan-1-trieu-ty-dong-nam-mo-hinh-thoi-trang-sieu-nhanh-nu-18-35.html</loc>" sitemap.xml || (echo "THIEU shein-gan-1-trieu-ty-dong-nam-mo-hinh-thoi-trang-sieu-nhanh-nu-18-35 trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v444-drafts-deploy.zip
          git add bai-viet/shein-gan-1-trieu-ty-dong-nam-mo-hinh-thoi-trang-sieu-nhanh-nu-18-35.html images/bai-viet/shein-gan-1-trieu-ty-dong-nam-mo-hinh-thoi-trang-sieu-nhanh-nu-18-35.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v444-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — shein-gan-1-trieu-ty-dong-nam-mo-hinh-thoi-trang-sieu-nhanh-nu-18-35"
            git push
          fi
