name: Deploy v267 (404)

on:
  push:
    paths:
      - '.github/workflows/deploy-v267-404.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v267-404:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v267-404 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v267-404-deploy.zip
          echo "--- verify v267 (404) ---"
          grep -m1 "v267 (route /bai/" 404.html
          grep -m1 "bai-viet" 404.html
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum 404.html
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v267-404-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v267: them 404.html — chuyen /bai/<slug> sang /bai-viet/<slug>.html + trang 404 co thuong hieu"
            git push
          fi
