name: "Deploy articles-cong-nghe-2026-11-22 (4 bai)"

on:
  push:
    paths:
      - '.github/workflows/deploy-cong-nghe-2211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cong-nghe-2211:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "578" || (echo "BASE DOI: data.js khong con 578 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "605" || (echo "BASE DOI: sitemap khong con 605 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip cong-nghe-2211 package
        run: |
          unzip -o mclivestream-cong-nghe-2211-deploy.zip
          echo "--- verify cong-nghe-2211 (4 bai moi) ---"
            test -f "bai-viet/ai-streamer-tet-giu-ca-dem-khi-mau-nghi.html" || (echo "THIEU bai-viet/ai-streamer-tet-giu-ca-dem-khi-mau-nghi.html"; exit 1)
            test -f "images/bai-viet/ai-streamer-tet-giu-ca-dem-khi-mau-nghi.jpg" || (echo "THIEU images/bai-viet/ai-streamer-tet-giu-ca-dem-khi-mau-nghi.jpg"; exit 1)
            test -f "images/bai-viet/ai-streamer-tet-giu-ca-dem-khi-mau-nghi-og.jpg" || (echo "THIEU images/bai-viet/ai-streamer-tet-giu-ca-dem-khi-mau-nghi-og.jpg"; exit 1)
            grep -q "bai-viet/ai-streamer-tet-giu-ca-dem-khi-mau-nghi.html" js/data.js || (echo "THIEU ai-streamer-tet-giu-ca-dem-khi-mau-nghi trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/ai-streamer-tet-giu-ca-dem-khi-mau-nghi.html</loc>" sitemap.xml || (echo "THIEU ai-streamer-tet-giu-ca-dem-khi-mau-nghi trong sitemap"; exit 1)
            test -f "bai-viet/tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien.html" || (echo "THIEU bai-viet/tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien.html"; exit 1)
            test -f "images/bai-viet/tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien.jpg"; exit 1)
            test -f "images/bai-viet/tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien-og.jpg" || (echo "THIEU images/bai-viet/tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien-og.jpg"; exit 1)
            grep -q "bai-viet/tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien.html" js/data.js || (echo "THIEU tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien.html</loc>" sitemap.xml || (echo "THIEU tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien trong sitemap"; exit 1)
            test -f "bai-viet/gemini-mua-hang-thay-ban-mien-phi-tu-17-11.html" || (echo "THIEU bai-viet/gemini-mua-hang-thay-ban-mien-phi-tu-17-11.html"; exit 1)
            test -f "images/bai-viet/gemini-mua-hang-thay-ban-mien-phi-tu-17-11.jpg" || (echo "THIEU images/bai-viet/gemini-mua-hang-thay-ban-mien-phi-tu-17-11.jpg"; exit 1)
            test -f "images/bai-viet/gemini-mua-hang-thay-ban-mien-phi-tu-17-11-og.jpg" || (echo "THIEU images/bai-viet/gemini-mua-hang-thay-ban-mien-phi-tu-17-11-og.jpg"; exit 1)
            grep -q "bai-viet/gemini-mua-hang-thay-ban-mien-phi-tu-17-11.html" js/data.js || (echo "THIEU gemini-mua-hang-thay-ban-mien-phi-tu-17-11 trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/gemini-mua-hang-thay-ban-mien-phi-tu-17-11.html</loc>" sitemap.xml || (echo "THIEU gemini-mua-hang-thay-ban-mien-phi-tu-17-11 trong sitemap"; exit 1)
            test -f "bai-viet/shopee-ai-livestream-4-cong-cu-shop-viet-dung.html" || (echo "THIEU bai-viet/shopee-ai-livestream-4-cong-cu-shop-viet-dung.html"; exit 1)
            test -f "images/bai-viet/shopee-ai-livestream-4-cong-cu-shop-viet-dung.jpg" || (echo "THIEU images/bai-viet/shopee-ai-livestream-4-cong-cu-shop-viet-dung.jpg"; exit 1)
            test -f "images/bai-viet/shopee-ai-livestream-4-cong-cu-shop-viet-dung-og.jpg" || (echo "THIEU images/bai-viet/shopee-ai-livestream-4-cong-cu-shop-viet-dung-og.jpg"; exit 1)
            grep -q "bai-viet/shopee-ai-livestream-4-cong-cu-shop-viet-dung.html" js/data.js || (echo "THIEU shopee-ai-livestream-4-cong-cu-shop-viet-dung trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/shopee-ai-livestream-4-cong-cu-shop-viet-dung.html</loc>" sitemap.xml || (echo "THIEU shopee-ai-livestream-4-cong-cu-shop-viet-dung trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "609" || (echo "SAI TONG sitemap, phai 609"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "582" || (echo "SAI TONG data.js, phai 582 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Guard node-parse (bai hoc v370)
        run: |
          node -e "global.window={};const fs=require('fs');eval(fs.readFileSync('js/data.js','utf8'));const a=window.V20_DATA.articles;console.log('articles.length =',a.length);console.log('empty =',a.filter(x=>!x).length);if(a.length!==583) { console.log('SAI: articles.length phai 583'); process.exit(1); } if(a.filter(x=>!x).length){ console.log('CO EMPTY ITEM'); process.exit(1); } const want=['ai-streamer-tet-giu-ca-dem-khi-mau-nghi','tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien','gemini-mua-hang-thay-ban-mien-phi-tu-17-11','shopee-ai-livestream-4-cong-cu-shop-viet-dung']; const miss=want.filter(s=>!a.some(x=>x&&x.page==='bai-viet/'+s+'.html')); if(miss.length){ console.log('SLUG NGOAI MANG articles:', miss); process.exit(1); } console.log('node guard OK: 4 slug moi deu TRONG mang articles');"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-cong-nghe-2211-deploy.zip || rm -f mclivestream-cong-nghe-2211-deploy.zip
          git rm -q .github/workflows/deploy-cong-nghe-2211.yml || true
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-cong-nghe-2026-11-22: 4 bai (ai-streamer-tet-giu-ca-dem-khi-mau-nghi tiktok-shop-tinh-doanh-thu-live-14-ngay-sau-phien gemini-mua-hang-thay-ban-mien-phi-tu-17-11 shopee-ai-livestream-4-cong-cu-shop-viet-dung)"
            git push
          fi
