name: Deploy data factories 2026-11-11

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-11-factories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-11-factories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data factories 2026-11-11 package
        run: |
          unzip -o mclivestream-data-2026-11-11-factories-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          ls -l images/xuong/fac-81.jpg images/xuong/fac-82.jpg images/xuong/fac-83.jpg images/xuong/fac-84.jpg images/xuong/fac-85.jpg images/xuong/fac-86.jpg images/xuong/fac-87.jpg images/xuong/fac-89.jpg images/xuong/fac-90.jpg images/xuong/fac-91.jpg images/xuong/fac-92.jpg images/xuong/fac-93.jpg images/xuong/fac-94.jpg images/xuong/fac-95.jpg images/xuong/fac-96.jpg images/xuong/fac-97.jpg images/xuong/fac-98.jpg images/xuong/fac-99.jpg images/xuong/fac-100.jpg images/xuong/fac-103.jpg images/xuong/fac-104.jpg images/xuong/fac-105.jpg images/xuong/fac-106.jpg images/xuong/fac-107.jpg images/xuong/fac-108.jpg images/xuong/fac-109.jpg images/xuong/fac-110.jpg images/xuong/fac-111.jpg images/xuong/fac-112.jpg images/xuong/fac-113.jpg images/xuong/fac-114.jpg images/xuong/fac-115.jpg images/xuong/fac-116.jpg images/xuong/fac-117.jpg images/xuong/fac-118.jpg images/xuong/fac-119.jpg
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/xuong/fac-81.jpg images/xuong/fac-82.jpg images/xuong/fac-83.jpg images/xuong/fac-84.jpg images/xuong/fac-85.jpg images/xuong/fac-86.jpg images/xuong/fac-87.jpg images/xuong/fac-89.jpg images/xuong/fac-90.jpg images/xuong/fac-91.jpg images/xuong/fac-92.jpg images/xuong/fac-93.jpg images/xuong/fac-94.jpg images/xuong/fac-95.jpg images/xuong/fac-96.jpg images/xuong/fac-97.jpg images/xuong/fac-98.jpg images/xuong/fac-99.jpg images/xuong/fac-100.jpg images/xuong/fac-103.jpg images/xuong/fac-104.jpg images/xuong/fac-105.jpg images/xuong/fac-106.jpg images/xuong/fac-107.jpg images/xuong/fac-108.jpg images/xuong/fac-109.jpg images/xuong/fac-110.jpg images/xuong/fac-111.jpg images/xuong/fac-112.jpg images/xuong/fac-113.jpg images/xuong/fac-114.jpg images/xuong/fac-115.jpg images/xuong/fac-116.jpg images/xuong/fac-117.jpg images/xuong/fac-118.jpg images/xuong/fac-119.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "factories 11/11: them fac-81..fac-120 (40 xuong moi, tong 120 xuong, 30 tinh) + 36 anh xuong"
            git push
          fi
