name: Deploy v201 — popup game Chuyển Sinh Thế Giới Mới
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v201 package
        run: unzip -o v201.zip
      - name: Run v201 test (exit code decides)
        run: node tests/test-v201-game-rename.mjs
      - name: Commit and push
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add -A
          git commit -m "v201: popup game đổi tên Chuyển Sinh Thế Giới Mới (244 file HTML)"
          git push
