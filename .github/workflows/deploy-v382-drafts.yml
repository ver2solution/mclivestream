name: Deploy v382-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v382-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v382-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v382-drafts package
        run: |
          unzip -o mclivestream-v382-drafts-deploy.zip
          echo "--- verify v382-drafts (1 bai) ---"
          test -f bai-viet/mixue-117500-ty-dong-nam-ly-tra-sua-10000-dong-de-che-gan-60000-cua-hang.html || (echo "THIEU bai-viet/mixue-117500-ty-dong-nam-ly-tra-sua-10000-dong-de-che-gan-60000-cua-hang.html"; exit 1)
          grep -q "bai-viet/mixue-117500-ty-dong-nam-ly-tra-sua-10000-dong-de-che-gan-60000-cua-hang.html" js/data.js || (echo "THIEU mixue-117500-ty-dong-nam-ly-tra-sua-10000-dong-de-che-gan-60000-cua-hang trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/mixue-117500-ty-dong-nam-ly-tra-sua-10000-dong-de-che-gan-60000-cua-hang.html</loc>" sitemap.xml || (echo "THIEU mixue-117500-ty-dong-nam-ly-tra-sua-10000-dong-de-che-gan-60000-cua-hang trong sitemap"; exit 1)
          grep -q "v382-shell-1" sw.js || (echo "THIEU v382-shell-1 trong sw.js"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v382-drafts-deploy.zip
          git add bai-viet/mixue-117500-ty-dong-nam-ly-tra-sua-10000-dong-de-che-gan-60000-cua-hang.html js/data.js sitemap.xml sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v382-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — mixue-117500-ty-dong-nam-ly-tra-sua-10000-dong-de-che-gan-60000-cua-hang"
            git push
          fi
