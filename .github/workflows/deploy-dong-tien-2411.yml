name: "Deploy dong-tien-2411 (4 bai Dong tien 24/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-dong-tien-2411.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-dong-tien-2411:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'cach-tinh-lai-lo-livestream-tet-phi-san-moi-2026' js/data.js; then echo "dong-tien-2411 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "a0e267a406c2c71e077b999d526452a8" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "667" || (echo "BASE DOI: data.js khong con 667 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "689" || (echo "BASE DOI: sitemap khong con 689 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip dong-tien-2411 package
        run: |
          unzip -o mclivestream-dong-tien-2411-deploy.zip
          echo "--- verify dong-tien-2411 (4 bai) ---"
          for slug in cach-tinh-lai-lo-livestream-tet-phi-san-moi-2026 phu-kien-trang-suc-tet-von-nhap-bao-nhieu-lai-bao-nhieu vang-hoi-3635-usd-sjc-len-135-trieu-dong-luong bitcoin-cham-64600-usd-roi-ve-61500-usd; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "693" || (echo "SAI TONG sitemap, phai 693"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "671" || (echo "SAI TONG data.js, phai 671"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-dong-tien-2411-deploy.zip || rm -f mclivestream-dong-tien-2411-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-dong-tien-2026-11-24: 4 bai moi (SEO V2)"
            git push
          fi
