name: Deploy v187 (sua SEO bai 11-12/11: OG + Nguon + ngay so lieu)

on:
  push:
    paths:
      - '.github/workflows/deploy-v187.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v187:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v187 package
        run: |
          unzip -o mclivestream-v187-2026-11-13-deploy.zip
          echo "--- verify v187 (TRONG ZIP) ---"
          # Goi chi co 33 bai-viet HTML + sw.js, KHONG co js/data.js, js/app.js, v20.css, mclivestream-supabase.js, index.html, danh-sach-*.html
          if unzip -l mclivestream-v187-2026-11-13-deploy.zip | grep -q 'js/data.js\|js/app.js\|v20.css\|mclivestream-supabase.js\|index.html\|danh-sach-\|thanh-ly-\|sw.js.orig'; then echo "SAI: goi v187 KHONG duoc chua data.js/app.js/v20.css/supabase/index.html/trang con"; exit 1; fi
          test "$(unzip -l mclivestream-v187-2026-11-13-deploy.zip | grep -c 'bai-viet/[^/]*\.html')" -eq 33 || (echo "SAI: goi v187 phai co dung 33 bai-viet HTML"; exit 1)
          test "$(unzip -l mclivestream-v187-2026-11-13-deploy.zip | grep -c ' sw.js$')" -eq 1 || (echo "SAI: goi v187 phai co dung 1 sw.js"; exit 1)
          # 8 bai 11/11: og:image:alt + og:locale
          for f in 11-11-dong-nam-a-shopee-lazada-tiktok-shop 11-11-toan-cau-bai-hoc-shop-viet doanh-thu-11-11-trung-quoc-alibaba-jd-douyin doanh-thu-11-11-viet-nam-shopee-lazada-tiktok-shop double-11-2025-1695-nghin-ty-ndt-livestream-chiem-bao-nhieu livestream-chiem-bao-nhieu-doanh-thu-11-11 meo-chot-don-ngay-sale-lon-hoc-dong-vu-huy-30-phut-100000-don quy-dinh-facebook-2026-khoa-tai-khoan-cam-dang-thuat-toan-uu-tien; do
            grep -q 'property="og:image:alt"' "bai-viet/$f.html" || (echo "SAI: $f thieu og:image:alt"; exit 1)
            grep -q 'property="og:locale" content="vi_VN"' "bai-viet/$f.html" || (echo "SAI: $f thieu og:locale"; exit 1)
          done
          # quy-dinh-facebook: muc Nguon (4 link Meta)
          grep -q '<div class="sources"><b>Nguồn:</b>' bai-viet/quy-dinh-facebook-2026-khoa-tai-khoan-cam-dang-thuat-toan-uu-tien.html || (echo "SAI: quy-dinh-facebook thieu muc Nguon"; exit 1)
          grep -q 'transparency.meta.com/enforcement/taking-action/counting-strikes/' bai-viet/quy-dinh-facebook-2026-khoa-tai-khoan-cam-dang-thuat-toan-uu-tien.html || (echo "SAI: quy-dinh-facebook thieu link counting-strikes"; exit 1)
          # Mau doan so lieu da gan ngay (lo 12/11 + 11/11)
          grep -q '(theo tin tuyển ngày 11/11/2026)' bai-viet/mau-livestream-luong-theo-gio-bang-luong-tin-tuyen-11-11.html || (echo "SAI: mau-luong thieu ngay tin tuyen"; exit 1)
          grep -q 'đợt 618 năm 2024' bai-viet/simba-kuaishou-1427-ty-ndt-phien-mo-man-618.html || (echo "SAI: simba thieu nam 618"; exit 1)
          grep -q '(giá ngày 11/11/2026)' bai-viet/gia-vang-hom-nay-11-11-2026-sjc-140-9-trieu.html || (echo "SAI: gia-vang thieu ngay gia"; exit 1)
          grep -q '(số liệu tổng hợp đến 08/11/2026)' bai-viet/boc-me-live-nong-san-kol-4-phien-1724-don-nong-dan-606-don.html || (echo "SAI: nong-san thieu ngay tong hop"; exit 1)
          grep -q '(theo tin tuyển tháng 11/2026)' bai-viet/thue-mau-livestream-gia-bao-nhieu-1-gio-theo-tinh.html || (echo "SAI: thue-mau-gia thieu thang tin tuyen"; exit 1)
          grep -q 'bài gốc Statista ngày 26/06/2026' bai-viet/mua-sam-qua-video-ngan-social-commerce-tang-manh-2026.html || (echo "SAI: video-ngan thieu ngay Statista"; exit 1)
          # sw.js: CACHE v187 (bai doi -> phai bump, SW cache-first)
          grep -q "const CACHE = 'v187-shell-1';" sw.js || (echo "SAI: sw.js thieu CACHE v187-shell-1"; exit 1)
          echo "verify OK: 33 bai-viet HTML (8 OG + 1 Nguon + 47 doan so lieu gan ngay) + sw.js (CACHE v187-shell-1)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v187-2026-11-13-deploy.zip
          git add -A
          git status --short | head -8
          echo "changed files: $(git status --short | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v187: sua SEO bai 11-12/11 — 8 bai them og:image:alt+og:locale, quy-dinh-facebook them muc Nguon, 47 doan so lieu gan ngay (25 lo 12/11 + 22 lo 11/11) + CACHE v187-shell-1"
            git push
          fi
