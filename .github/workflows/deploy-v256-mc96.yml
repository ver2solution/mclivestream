name: Deploy v256 (MC-96)

on:
  push:
    paths:
      - '.github/workflows/deploy-v256-mc96.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v256-mc96:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v256-mc96 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v256-mc96-deploy.zip
          echo "--- verify v256 (MC-96) ---"
          node --check js/app.js || (echo "SYNTAX FAIL js/app.js"; exit 1)
          node --check sw.js || (echo "SYNTAX FAIL sw.js"; exit 1)
          grep -m1 "v256-shell-1" sw.js
          grep -m1 "v256 (MC-96)" js/app.js
          grep -m1 "68 lô xả kho đang hoạt động" gioi-thieu.html
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum sw.js js/app.js gioi-thieu.html
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v256-mc96-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v256: MC-96 thong nhat so lo dang hoat dong (68) + danh sach tinh lo/xuong build dong, sw.js v256-shell-1"
            git push
          fi
