name: Deploy v258 (PC-S2)

on:
  push:
    paths:
      - '.github/workflows/deploy-v258-pcs2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v258-pcs2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v258-pcs2 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v258-pcs2-deploy.zip
          echo "--- verify v258 (PC-S2) ---"
          node --check js/search.js || (echo "SYNTAX FAIL js/search.js"; exit 1)
          node --check sw.js || (echo "SYNTAX FAIL sw.js"; exit 1)
          grep -m1 "v258-shell-1" sw.js
          grep -m1 "v258 (PC-S2)" js/search.js
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum sw.js js/search.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v258-pcs2-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v258: PC-S2 tim mau livestream ra ho so Mau (them nhan loai vao search index), sw.js v258-shell-1"
            git push
          fi
