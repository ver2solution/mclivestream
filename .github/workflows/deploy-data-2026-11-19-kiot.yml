name: Deploy data 2026-11-19 kiot

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-19-kiot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-19-kiot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-19 kiot package
        run: |
          # 19/11: chi 3 kiot moi APPEND (kiot-364..366), khong doi ten anh cu
          # nen khong rm file nao — zip chi chua data.js + 2 anh moi.
          unzip -o mclivestream-data-2026-11-19-kiot-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "a7ca2eba7a8b6737a2002e39e4d83f0646d3e6f8991d16fa93de73716afe331e" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "kiot images: $(ls images/kiot/*.jpg | wc -l)"
          test "$(grep -c '"id": "kiot-' js/data.js)" = "366" || (echo "BAD kiots count"; exit 1)
          # Bai hoc v171: KHONG hardcode tong so file — kiem tra bat bien "0 file thieu":
          # moi img trong data.js phai ton tai tren dia sau khi giai nen.
          missing=0
          for f in $(grep -o 'images/kiot/kiot-[0-9]*\.jpg' js/data.js | sort -u); do
            [ -f "$f" ] || { echo "THIEU ANH: $f"; missing=$((missing+1)); }
          done
          echo "anh thieu: $missing"
          [ "$missing" -eq 0 ]
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/data.js images/kiot/
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-19 kiot: 366 kiot (3 moi 19/11: quan nuong Ut Tich 200tr, quan tra sua Pham Van Chi 60tr, spa Nguyen Dinh Hoan 145tr), 238 mau / 299 shop / 266 lo / 407 xuong / 468 bai"
            git push
          fi
