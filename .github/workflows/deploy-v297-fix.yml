name: Deploy v297-fix (MC-99 form bình luận không lộ email)

on:
  push:
    paths:
      - '.github/workflows/deploy-v297-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v297-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v297-fix package
        run: |
          unzip -o mclivestream-v297-fix-deploy.zip
          echo "--- verify v297-fix (3 file: js/comments.js + sw.js + test) ---"
          test -f js/comments.js || (echo "THIEU js/comments.js"; exit 1)
          test -f sw.js || (echo "THIEU sw.js"; exit 1)
          test -f tests/test-v297-mc99.mjs || (echo "THIEU tests/test-v297-mc99.mjs"; exit 1)
          grep -q "resolveDisplayName" js/comments.js || (echo "THIEU resolveDisplayName"; exit 1)
          grep -q "sanitizeDisplayName" js/comments.js || (echo "THIEU sanitizeDisplayName"; exit 1)
          if grep -q "user.email" js/comments.js; then echo "CON user.email trong comments.js (MC-99 chua het)"; exit 1; fi
          grep -q "v297-shell-1" sw.js || (echo "THIEU CACHE v297-shell-1"; exit 1)
          node tests/test-v297-mc99.mjs
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v297-fix-deploy.zip
          git add js/comments.js sw.js tests/test-v297-mc99.mjs
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v297-fix: MC-99 form binh luan khong lo email (bo fallback user.email, lay ten tu profiles.full_name, chan ten chua '@', CACHE v297-shell-1)"
            git push
          fi
