name: Deploy v256-livestream (4 bai Livestream 15/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v256-livestream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v256-livestream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "262" || (echo "BASE DOI: data.js khong con 262 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "288" || (echo "BASE DOI: sitemap khong con 288 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip v256-livestream package
        run: |
          unzip -o mclivestream-v256-livestream-deploy.zip
          echo "--- verify v256-livestream (4 bai) ---"
          for slug in livestream-ban-hang-12-12-lich-van-hanh-4-giai-doan cach-xu-ly-binh-luan-khi-livestream-ban-hang-5-buoc thiet-bi-livestream-ban-hang-3-muc-gia-50-usd cach-tang-tuong-tac-livestream-7-don-bay-giu-nguoi-xem; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "292" || (echo "SAI TONG sitemap, phai 292"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "266" || (echo "SAI TONG data.js, phai 266"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v256-livestream-deploy.zip || rm -f mclivestream-v256-livestream-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v256-livestream: 4 bai Livestream 15/11/2026 (livestream ban hang 12.12 keyword #5 + cach xu ly binh luan + thiet bi livestream + cach tang tuong tac)"
            git push
          fi
