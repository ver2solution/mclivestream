name: Deploy data 2026-11-10

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-10 package
        run: |
          unzip -o mclivestream-data-2026-11-10-deploy.zip
          ls -l js/data.js images/th-68.jpg images/th-87.jpg
          sha256sum js/data.js
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "th images total: $(ls images/th-*.jpg | wc -l)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-10: 77 mau / 116 shop (+20 mau +20 shop, 20 anh moi th-68..th-87)"
            git push
          fi
