name: Deploy hero fix 21/11 (4 anh bai thi-truong, mobile-check)

on:
  push:
    paths:
      - '.github/workflows/deploy-hero-fix-2111.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-hero-fix-2111:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip hero-fix 21/11 package
        run: |
          unzip -o mclivestream-hero-fix-2026-11-21-deploy.zip
          echo "--- verify hero fix 21/11 (4 anh bai thi-truong) ---"
          test -f js/data.js || (echo "THIEU js/data.js"; exit 1)
          echo "sha256: $(sha256sum js/data.js)"
          echo "sha256: $(sha256sum js/data.js)" | grep -q "8e53eebd2610853d30b2a9ffa89a2a10f11a20e64c6d8d6a0eb4d22b3fcf11fb" || (echo "SHA256 KHONG KHOP"; exit 1)
          node --check js/data.js || (echo "node --check FAIL"; exit 1)
          test "$(grep -c 'bai-viet/hero-' js/data.js)" = "0" || (echo "CON hero-"; exit 1)
          for img in images/bai-viet/pdd-quy-3-2026-temu-chung-lai-doanh-thu-di-ngang.jpg images/bai-viet/tencent-quy-3-2026-wechat-1449-ty-nguoi-quang-cao-tang-19-phan-tram.jpg images/bai-viet/mercado-libre-quy-3-2026-gmv-23-ty-usd-tang-33-phan-tram.jpg images/bai-viet/thi-truong-qua-tet-2026-gio-qua-dan-dau-mua-som-thang-11.jpg; do grep -q "$img" js/data.js || (echo "THIEU $img"; exit 1); done
          echo "shops: $(grep -c '\"id\": \"sh-' js/data.js)"
          test "$(grep -c '\"id\": \"sh-' js/data.js)" = "304" || (echo "SHOP COUNT != 304"; exit 1)
          echo "OK: 0 hero-, du 4 anh jpg, shop 304"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-hero-fix-2026-11-21-deploy.zip
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy hero fix 21/11: 4 anh bai thi-truong (mobile-check) — data.js img hero-*.png -> images/bai-viet/*.jpg"
            git push
          fi
