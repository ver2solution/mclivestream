name: Deploy v154
on:
  push:
    paths:
      - '.github/workflows/deploy-v154.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v154:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v154 package
        run: |
          unzip -o mclivestream-v154-shop-pinned-deploy.zip -d /tmp/v154
          ls -R /tmp/v154
          if [ -f /tmp/v154/js/app.js ]; then cp /tmp/v154/js/app.js js/app.js; else cp /tmp/v154/app.js js/app.js; fi
          if [ -f /tmp/v154/js/data.js ]; then cp /tmp/v154/js/data.js js/data.js; else cp /tmp/v154/data.js js/data.js; fi
          cp /tmp/v154/sw.js sw.js
          echo "--- verify v154 ---"
          grep -o "v154-shell-1" sw.js
          ls -l js/app.js js/data.js sw.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Deploy v154: ghim 2 bai Shop (pinnedShop), bo ghim trang chu bop-reach"
          git push
