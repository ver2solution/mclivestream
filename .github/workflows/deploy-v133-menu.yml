name: Deploy v133-menu

on:
  push:
    paths:
      - '.github/workflows/deploy-v133-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v133-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v133-menu package
        run: |
          unzip -o mclivestream-v133-menu.zip
          echo "--- verify v133-menu payload (2 files) ---"
          grep -q "const CACHE = 'v133-shell-1';" sw.js && echo "sw.js CACHE v133-shell-1 OK"
          grep -q 'href="danh-sach-mau.html" class="">Dành cho Mẫu' index.html && echo "index nav Mau->mau.html OK"
          grep -q 'href="danh-sach-shop.html" class="">Dành cho Shop' index.html && echo "index nav Shop->shop.html OK"
          if grep -q 'Lô xả kho\|Xưởng gia công' index.html; then echo "CHECK: index con link Lo/Xuong (chi duoc phep o nut Xem tat ca, khong trong nav)"; else echo "index khong con link Lo/Xuong"; fi
          NAV=$(grep -o '<nav class="main-nav"[^>]*>.*</nav>' index.html)
          echo "$NAV" | grep -q 'Lô xả kho' && echo "LOI: nav van con Lo xa kho" || echo "nav khong con Lo xa kho OK"
          echo "$NAV" | grep -q 'Xưởng gia công' && echo "LOI: nav van con Xuong gia cong" || echo "nav khong con Xuong gia cong OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v133-menu.zip
          git add -A
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v133: xoa 2 link menu Lo/Xuong tu them o v130, menu ve 7 muc dong bo moi trang + bump CACHE v133"
            git push
          fi
