name: Deploy data 2026-11-26 kiot

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-26-kiot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-26-kiot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-26 kiot package
        run: |
          # 26/11 (nen live moi nhat sha 2d0c7168…, 258 mau / 328 shop / 802 bai / 330 lo / 442 xuong / 384 kiot):
          # chi 3 kiot moi APPEND (kiot-385..387), khong doi ten anh cu
          # nen khong rm file nao — zip chi chua data.js + 3 anh moi.
          unzip -o mclivestream-data-2026-11-26-kiot-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "928447bf751d0c7aa51ff7fa076395bd27e663344c53bc2e3cc0a3fac92ca510" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "articles: $(grep -c '"slug":' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "kiot images: $(ls images/kiot/*.jpg | wc -l)"
          test "$(grep -c '"id": "kiot-' js/data.js)" = "387" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "442" || (echo "BAD factories count"; exit 1)
          # Bai hoc v171: KHONG hardcode tong so file — kiem tra bat bien "0 file thieu":
          # moi img trong data.js phai ton tai tren dia sau khi giai nen.
          missing=0
          for f in $(grep -o 'images/kiot/kiot-[0-9]*\.jpg' js/data.js | sort -u); do
            [ -f "$f" ] || { echo "THIEU ANH: $f"; missing=$((missing+1)); }
          done
          echo "anh thieu: $missing"
          [ "$missing" -eq 0 ]
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/data.js images/kiot/
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-26 kiot: 387 kiot (3 moi 26/11: Sang nhượng quán cafe Tân Sơn Nhì 600 triệu, Sang nhượng quán cafe Vĩnh Lộc 220 triệu, Sang nhượng quán cafe Nguyễn Thị Thành 200 triệu), 258 mau / 328 shop / 330 lo / 442 xuong / 802 bai"
            git push
          fi
