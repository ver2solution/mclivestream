name: Deploy data 2026-11-18 kiot

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-18-kiot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-18-kiot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-18 kiot package
        run: |
          # Chi xoa 13 anh cu doi ten theo id moi (khong rm toan bo — zip chi
          # chua 91 anh can thiet, 244 anh cu giu nguyen ten van dung duoc).
          rm -f images/kiot/kiot-267.jpg
          rm -f images/kiot/kiot-268.jpg
          rm -f images/kiot/kiot-269.jpg
          rm -f images/kiot/kiot-270.jpg
          rm -f images/kiot/kiot-271.jpg
          rm -f images/kiot/kiot-272.jpg
          rm -f images/kiot/kiot-273.jpg
          rm -f images/kiot/kiot-274.jpg
          rm -f images/kiot/kiot-275.jpg
          rm -f images/kiot/kiot-276.jpg
          rm -f images/kiot/kiot-278.jpg
          rm -f images/kiot/kiot-279.jpg
          rm -f images/kiot/kiot-280.jpg
          unzip -o mclivestream-data-2026-11-18-kiot-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "fd10c56f40e5085b394bf5fc5f9a634ba7263f52c5339bac967b9bbba1bdcc49" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "kiot images: $(ls images/kiot/*.jpg | wc -l)"
          test "$(grep -c '"id": "kiot-' js/data.js)" = "360" || (echo "BAD kiots count"; exit 1)
          # Bai hoc v171: KHONG hardcode tong so file — kiem tra bat bien "0 file thieu":
          # moi img trong data.js phai ton tai tren dia sau khi giai nen.
          missing=0
          for f in $(grep -o 'images/kiot/kiot-[0-9]*\.jpg' js/data.js | sort -u); do
            [ -f "$f" ] || { echo "THIEU ANH: $f"; missing=$((missing+1)); }
          done
          echo "anh thieu: $missing"
          [ "$missing" -eq 0 ]
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/data.js images/kiot/
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-18 kiot: 360 kiot (80 moi: 40 cua 17/11 + 40 moi 18/11), 238 mau / 290 shop / 226 lo / 320 xuong / 422 bai"
            git push
          fi
