name: "Deploy hang-hoa-2811 (4 bai Hang hoa 28/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-hang-hoa-2811.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-hang-hoa-2811:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'dac-san-vung-mien-tet-livestream-htx-chuan-bi-hang' js/data.js; then echo "hang-hoa-2811 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "ab6a9226f251bcc41d316742ecee551e" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "869" || (echo "BASE DOI: data.js khong con 869 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "894" || (echo "BASE DOI: sitemap khong con 894 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip hang-hoa-2811 package
        run: |
          unzip -o mclivestream-hang-hoa-2811-deploy.zip
          echo "--- verify hang-hoa-2811 (4 bai) ---"
          for slug in dac-san-vung-mien-tet-livestream-htx-chuan-bi-hang blazer-nu-van-phong-ban-chay-5-kieu-shop-nen-nhap suit-nam-van-phong-ban-chay-amazon-gia-55-usd omusubi-family-mart-nhat-ban-4-vi-181-yen; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "898" || (echo "SAI TONG sitemap, phai 898"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "873" || (echo "SAI TONG data.js, phai 873"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-hang-hoa-2811-deploy.zip || rm -f mclivestream-hang-hoa-2811-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-hang-hoa-2026-11-28: 4 bai (dac-san-vung-mien-tet-livestream-htx-chuan-bi-hang, blazer-nu-van-phong-ban-chay-5-kieu-shop-nen-nhap, suit-nam-van-phong-ban-chay-amazon-gia-55-usd, omusubi-family-mart-nhat-ban-4-vi-181-yen)"
            git push
          fi
