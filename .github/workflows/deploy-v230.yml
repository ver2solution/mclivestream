name: deploy-v230
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v230:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v230 package
        run: |
          unzip -o v230.zip
          ls -l js/app.js sw.js
          sha256sum js/app.js sw.js
      - name: Verify package contents
        run: |
          set -e
          test "$(sha256sum js/app.js | cut -d' ' -f1)" = "f6636ad02078782850277f5f8f310a7d39ca94cfca40e0b89f254ae2247fb6f2"
          test "$(sha256sum sw.js | cut -d' ' -f1)" = "071687d779916f2920d3066db4c35a442c0fadfba4031b12089087cf32088859"
          grep -Fq "v230 (L12)" js/app.js
          grep -Fq "imgFallback" js/app.js
          grep -Fq "fetchpriority" js/app.js
          grep -Fq "v230-shell-1" sw.js
      - name: Commit v230 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v230 L12 anh tin ghim eager + onerror fallback; js/app.js + sw.js CACHE v230-shell-1"
            git push
          fi
