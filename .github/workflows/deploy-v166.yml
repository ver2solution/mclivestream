name: deploy-v166
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit v166
        run: |
          unzip -o mclivestream-v166-deploy.zip
          rm mclivestream-v166-deploy.zip
          git config user.name "Ryan"
          git config user.email "ver2solution@gmail.com"
          git add -A
          git commit -m "v166: C1/N1 session watcher + BUOC 1 phone warn + S3 redirect trang-cua-toi + N8 kiot prov + N9/N10/N11" || echo "nothing to commit"
          git push
