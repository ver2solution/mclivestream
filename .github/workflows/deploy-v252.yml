name: deploy-v252
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v252:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v252 package
        run: |
          unzip -o v252-f-r2-04.zip
          ls -l js/app.js v20.css sw.js logo-c-mark.png favicon.png apple-touch-icon.png logo.png icon-192.png icon-512.png icon-maskable-512.png
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v252 (F-R2-04)" js/app.js
          grep -Fq "logo-badge-img" v20.css
          grep -Fq "CACHE = 'v252-shell-1'" sw.js
          node --check js/app.js
      - name: Commit v252 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/app.js v20.css sw.js logo-c-mark.png favicon.png apple-touch-icon.png logo.png icon-192.png icon-512.png icon-maskable-512.png
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v252 F-R2-04 badge header thanh logo C + dong bo favicon/logo/icon + sw.js v252-shell-1"
            git push
          fi
