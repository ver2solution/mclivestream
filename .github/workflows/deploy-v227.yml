name: deploy-v227
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v227:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v227 package
        run: |
          unzip -o v227.zip
          ls -l danh-sach-mau.html js/admin.js mclivestream-supabase.js sw.js
          sha256sum danh-sach-mau.html js/admin.js mclivestream-supabase.js sw.js
      - name: Verify package contents
        run: |
          set -e
          test "$(sha256sum danh-sach-mau.html | cut -d' ' -f1)" = "0e6b863a34bd34e8fb65fe0f53df8a8784f40844cbb928019a6881538c561e75"
          test "$(sha256sum js/admin.js | cut -d' ' -f1)" = "dc40808d40e43ff04afc8c93311e758d6740da6a7411a5ea97d203fdc1c053ca"
          test "$(sha256sum mclivestream-supabase.js | cut -d' ' -f1)" = "3e42bf5ba3fc357a272182f465e0ab8cc2730011912bbf704f6a9e28f8343f91"
          test "$(sha256sum sw.js | cut -d' ' -f1)" = "3e4548f3aacfe4903e96d76d53d2906b85222b0af926861fdf25a284d8011259"
          grep -Fq "v227 (L10)" danh-sach-mau.html
          grep -Fq "v227 (L10)" js/admin.js
          grep -Fq "quantity" mclivestream-supabase.js
          grep -Fq "v227-shell-1" sw.js
      - name: Commit v227 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add danh-sach-mau.html js/admin.js mclivestream-supabase.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v227 L10 quantity tin tuyen; danh-sach-mau.html + mclivestream-supabase.js + js/admin.js + sw.js CACHE v227-shell-1"
            git push
          fi
