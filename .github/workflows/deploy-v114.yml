name: Deploy v114

on:
  push:
    paths:
      - '.github/workflows/deploy-v114.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v114:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v114 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v114-deploy.zip
          echo "--- verify v114 payload ---"
          grep -m1 "v114-shell-1" sw.js
          grep -m1 "TOTAL_BASE = 611" js/online-counter.js
          grep -m1 "mau: 127, shop: 213, kiot: 43, hoidap: 17, tintuc: 211" js/online-counter.js
          grep -m1 'id="transferBalance"' vi.html
          grep -m1 "rpc('record_presence'" js/online-counter.js
          grep -m1 "rpc('record_daily_activity'" js/reward.js
          echo "html files: $(find . -maxdepth 1 -name '*.html' | wc -l) root + $(ls bai-viet/*.html | wc -l) bai-viet"
          echo "js files (excluding data.js): $(ls js/*.js | grep -vc data.js)"
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum sw.js js/online-counter.js js/reward.js js/app.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v114-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v114: QA fixes (vi.html, P2/P3) + xu M12 (10/+1/+1/+2, tran 5/ngay) + RPC M14, sw.js v114-shell-1"
            git push
          fi
