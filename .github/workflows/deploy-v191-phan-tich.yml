name: Deploy v191-phan-tich (4 bai Phan tich 13/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v191-phan-tich.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v191-phan-tich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v191-phan-tich package
        run: |
          unzip -o mclivestream-v191-phan-tich-deploy.zip
          echo "--- verify v191-phan-tich (4 bai) ---"
          for slug in double-12-2026-phan-tich-5-bai-hoc-tu-11-11-shop-nho mo-hinh-ban-hang-qua-koc-79-trieu-usd-30-ngay-my kinh-doanh-handmade-online-etsy-26-ty-usd-quy-3-2026 mo-hinh-kinh-doanh-doc-la-ao-chong-mo-hoi-700000-usd; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"title":' js/data.js)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v191-phan-tich-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v191-phan-tich: 4 bai Phan tich 13/11/2026 (Double 12 phan tich keyword + KOC My + Etsy handmade + Neat Shark Tank)"
            git push
          fi
