name: Deploy articles-dang-hot-2026-11-20 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-dang-hot-2011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-dang-hot-2011:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "501" || (echo "BASE DOI: data.js khong con 501 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "528" || (echo "BASE DOI: sitemap khong con 528 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          for slug in cach-thanh-ly-hang-ton-kho-live-dau-gia-black-friday-2026 ebay-black-friday-2026-giam-toi-70-phan-tram-hang-refurbished kohls-black-friday-2026-tuan-sale-22-28-thang-11 lowes-black-friday-2026-12-days-of-deals-tu-16-11; do
            grep -q "bai-viet/$slug.html" js/data.js && (echo "DA DEPLOY ROI: $slug da co trong data.js - DUNG LAI"; exit 1) || true
          done
      - name: Unzip dang-hot-2011 package
        run: |
          unzip -o mclivestream-dang-hot-2011-deploy.zip
          echo "--- verify dang-hot-2011 (4 bai) ---"
          for slug in cach-thanh-ly-hang-ton-kho-live-dau-gia-black-friday-2026 ebay-black-friday-2026-giam-toi-70-phan-tram-hang-refurbished kohls-black-friday-2026-tuan-sale-22-28-thang-11 lowes-black-friday-2026-12-days-of-deals-tu-16-11; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "532" || (echo "SAI TONG sitemap, phai 532"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "505" || (echo "SAI TONG data.js, phai 505 bai-viet page"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-dang-hot-2011-deploy.zip || rm -f mclivestream-dang-hot-2011-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-dang-hot-2026-11-20: 4 bai (cach-thanh-ly-hang-ton-kho-live-dau-gia-black-friday-2026, ebay-black-friday-2026-giam-toi-70-phan-tram-hang-refurbished, kohls-black-friday-2026-tuan-sale-22-28-thang-11, lowes-black-friday-2026-12-days-of-deals-tu-16-11)"
            git push
          fi
