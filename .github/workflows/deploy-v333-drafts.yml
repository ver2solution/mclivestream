name: Deploy v333-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v333-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v333-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v333-drafts package
        run: |
          unzip -o mclivestream-v333-drafts-deploy.zip
          echo "--- verify v333-drafts (1 bai) ---"
          test -f bai-viet/black-friday-335400-ty-dong-7-meo-giu-sps-35-tiktok-shop.html || (echo "THIEU bai-viet/black-friday-335400-ty-dong-7-meo-giu-sps-35-tiktok-shop.html"; exit 1)
          grep -q "bai-viet/black-friday-335400-ty-dong-7-meo-giu-sps-35-tiktok-shop.html" js/data.js || (echo "THIEU black-friday-335400-ty-dong-7-meo-giu-sps-35-tiktok-shop trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/black-friday-335400-ty-dong-7-meo-giu-sps-35-tiktok-shop.html</loc>" sitemap.xml || (echo "THIEU black-friday-335400-ty-dong-7-meo-giu-sps-35-tiktok-shop trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v333-drafts-deploy.zip
          git add bai-viet/black-friday-335400-ty-dong-7-meo-giu-sps-35-tiktok-shop.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v333-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — black-friday-335400-ty-dong-7-meo-giu-sps-35-tiktok-shop"
            git push
          fi
