name: Deploy v342-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v342-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v342-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v342-drafts package
        run: |
          unzip -o mclivestream-v342-drafts-deploy.zip
          echo "--- verify v342-drafts (1 bai) ---"
          test -f bai-viet/mat-na-mat-lanbena-715-trieu-dong-1-thang-2700-don-black-friday.html || (echo "THIEU bai-viet/mat-na-mat-lanbena-715-trieu-dong-1-thang-2700-don-black-friday.html"; exit 1)
          grep -q "bai-viet/mat-na-mat-lanbena-715-trieu-dong-1-thang-2700-don-black-friday.html" js/data.js || (echo "THIEU mat-na-mat-lanbena-715-trieu-dong-1-thang-2700-don-black-friday trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/mat-na-mat-lanbena-715-trieu-dong-1-thang-2700-don-black-friday.html</loc>" sitemap.xml || (echo "THIEU mat-na-mat-lanbena-715-trieu-dong-1-thang-2700-don-black-friday trong sitemap"; exit 1)
          grep -q "v342-shell-1" sw.js || (echo "THIEU v342-shell-1 trong sw.js"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v342-drafts-deploy.zip
          git add bai-viet/mat-na-mat-lanbena-715-trieu-dong-1-thang-2700-don-black-friday.html js/data.js sitemap.xml sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v342-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — mat-na-mat-lanbena-715-trieu-dong-1-thang-2700-don-black-friday"
            git push
          fi
