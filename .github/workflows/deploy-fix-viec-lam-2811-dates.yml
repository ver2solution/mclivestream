name: "Fix viec-lam-2811 dates (4 entries 2026-11-27 -> 2026-11-28)"

on:
  push:
    paths:
      - '.github/workflows/deploy-fix-viec-lam-2811-dates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-viec-lam-2811-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "27f7039a86babdf2317fa8a5c9bf2d1d" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "853" || (echo "BASE DOI: data.js khong con 853 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "878" || (echo "BASE DOI: sitemap khong con 878 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip fix package (js/data.js only)
        run: |
          unzip -o mclivestream-viec-lam-2811-fix-dates.zip
          echo "--- verify fix (4 dates) ---"
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "853" || (echo "SAI TONG data.js, phai 853"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "878" || (echo "SAI TONG sitemap, phai 878"; exit 1)
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "c035a0e53f10e9b49dcc1c08d90d44a7" || (echo "SAI MD5 data.js sau fix"; exit 1)
          python3 - <<'EOF'
          import re, sys
          d = open('js/data.js', encoding='utf-8').read()
          for slug in ['viec-lam-thoi-vu-tet-livestream-5-shop-moi-tuyen-nguoi-moi','tuyen-mau-live-ban-thoi-trang-van-phong-nam-nu','host-live-my-tra-toi-100-usd-gio-lam-tu-xa','mars-lego-adidas-tuyen-van-hanh-livestream-douyin']:
              i = d.find(f'"page": "bai-viet/{slug}.html"')
              assert i > 0, f'missing {slug}'
              st = d.rfind('  {', 0, i); en = d.find('  }', i)
              assert '"date": "2026-11-28"' in d[st:en], f'{slug} date NOT fixed'
          for slug27 in ['mau-livestream-thoi-vu-tet-dot-tuyen-cuoi-truoc-12-12','tuyen-mau-live-ban-thoi-trang-tre-em-nguoi-gia','host-live-black-friday-my-tra-30-40-usd-gio','tuyen-mau-livestream-cao-bang']:
              i = d.find(f'"page": "bai-viet/{slug27}.html"')
              st = d.rfind('  {', 0, i); en = d.find('  }', i)
              assert '"date": "2026-11-27"' in d[st:en], f'{slug27} date changed by mistake'
          print('4/4 dates fixed to 2026-11-28; 4/4 27/11 entries untouched')
          EOF
      - name: Commit fixed data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-viec-lam-2811-fix-dates.zip || rm -f mclivestream-viec-lam-2811-fix-dates.zip
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix viec-lam-2811 dates: 4 entries 2026-11-27 -> 2026-11-28 (data.js entry dates; HTML datePublished was already correct)"
            git push
          fi
