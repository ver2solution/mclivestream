name: Deploy v298-jd2026-title (JD.com Double 11: rewrite title for 2026, drop 1.22M figure)

on:
  push:
    paths:
      - '.github/workflows/deploy-v298-jd2026-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v298-jd2026-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v298-jd2026-title package
        run: |
          unzip -o mclivestream-v298-jd2026-fix-deploy.zip
          echo "--- verify v298-jd2026-title (2 file: bai-viet/jd-com-...html + js/data.js) ---"
          test -f bai-viet/jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang.html || (echo "THIEU bai-viet JD.com"; exit 1)
          test -f js/data.js || (echo "THIEU js/data.js"; exit 1)
          grep -F -q "Double 11/2026 — JD.com" bai-viet/jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang.html || (echo "THIEU tieu de moi 2026 trong HTML"; exit 1)
          grep -F -q "Double 11/2026 — JD.com" js/data.js || (echo "THIEU tieu de moi 2026 trong data.js"; exit 1)
          if grep -F -q "1,22 triệu tỷ đồng trong 1 mùa Double 11/2025" bai-viet/jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang.html; then echo "CON tieu de cu 2025 trong HTML"; exit 1; fi
          if grep -F -q "1,22 triệu tỷ đồng trong 1 mùa Double 11/2025" js/data.js; then echo "CON tieu de cu 2025 trong data.js"; exit 1; fi
          test "$(grep -o '2025' bai-viet/jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang.html | wc -l)" = "31" || (echo "SO 2025 trong HTML khac 31 (so lieu lich su phai giu)"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v298-jd2026-fix-deploy.zip
          git add bai-viet/jd-com-122-trieu-ty-dong-double-11-ai-dich-vu-ong-lon-im-lang.html js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v298-jd2026-title: JD.com Double 11 title rewritten for 2026, drop 1.22M figure (title/H1/og/twitter/JSON-LD/lead + data.js title; 31 historical 2025 refs kept)"
            git push
          fi
