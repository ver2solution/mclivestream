name: Deploy v419-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v419-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v419-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v419-drafts package
        run: |
          unzip -o mclivestream-v419-drafts-deploy.zip
          echo "--- verify v419-drafts (2 bai) ---"
          test -f bai-viet/3-giay-dau-quyet-dinh-nguoi-xem-o-lai-hay-thoat-cach-mc-mo-dau-phien-live.html || (echo "THIEU bai-viet/3-giay-dau-quyet-dinh-nguoi-xem-o-lai-hay-thoat-cach-mc-mo-dau-phien-live.html"; exit 1)
          grep -q "bai-viet/3-giay-dau-quyet-dinh-nguoi-xem-o-lai-hay-thoat-cach-mc-mo-dau-phien-live.html" js/data.js || (echo "THIEU 3-giay-dau-quyet-dinh-nguoi-xem-o-lai-hay-thoat-cach-mc-mo-dau-phien-live trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/3-giay-dau-quyet-dinh-nguoi-xem-o-lai-hay-thoat-cach-mc-mo-dau-phien-live.html</loc>" sitemap.xml || (echo "THIEU 3-giay-dau-quyet-dinh-nguoi-xem-o-lai-hay-thoat-cach-mc-mo-dau-phien-live trong sitemap"; exit 1)
          test -f bai-viet/black-friday-27-11-shop-tuyen-mau-live-gap-3-viec-can-chot-truoc-gio-live.html || (echo "THIEU bai-viet/black-friday-27-11-shop-tuyen-mau-live-gap-3-viec-can-chot-truoc-gio-live.html"; exit 1)
          grep -q "bai-viet/black-friday-27-11-shop-tuyen-mau-live-gap-3-viec-can-chot-truoc-gio-live.html" js/data.js || (echo "THIEU black-friday-27-11-shop-tuyen-mau-live-gap-3-viec-can-chot-truoc-gio-live trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/black-friday-27-11-shop-tuyen-mau-live-gap-3-viec-can-chot-truoc-gio-live.html</loc>" sitemap.xml || (echo "THIEU black-friday-27-11-shop-tuyen-mau-live-gap-3-viec-can-chot-truoc-gio-live trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v419-drafts-deploy.zip
          git add bai-viet/3-giay-dau-quyet-dinh-nguoi-xem-o-lai-hay-thoat-cach-mc-mo-dau-phien-live.html bai-viet/black-friday-27-11-shop-tuyen-mau-live-gap-3-viec-can-chot-truoc-gio-live.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v419-drafts: 2 bai viet tu ban thao (Muse Zalo/admin) — 3-giay-dau-quyet-dinh-nguoi-xem-o-lai-hay-thoat-cach-mc-mo-dau-phien-live, black-friday-27-11-shop-tuyen-mau-live-gap-3-viec-can-chot-truoc-gio-live"
            git push
          fi
