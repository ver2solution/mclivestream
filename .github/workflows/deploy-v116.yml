name: Deploy v116 (temp)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip deploy package
        run: |
          unzip -o mclivestream-v116-deploy.zip -d .
          rm mclivestream-v116-deploy.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy v116: rebased prep + golden strip" || echo "nothing to commit"
          git push
