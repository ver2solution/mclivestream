name: deploy-v247
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v247:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v247 package
        run: |
          unzip -o v247.zip
          ls -l danh-sach-mau.html danh-sach-shop.html index.html js/app.js sw.js
      - name: Verify package contents
        run: |
          set -e
          grep -Fq "v247 (15/11/2026)" danh-sach-shop.html
          grep -Fq "v247" js/app.js
          grep -Fq "CACHE = 'v247-shell-1'" sw.js
          test $(grep -c 'id="su-kien-marketing"' danh-sach-shop.html) -eq 1
          test $(grep -c 'id="su-kien-marketing"' danh-sach-mau.html) -eq 0
          node --check js/app.js
          node --check sw.js
      - name: Commit v247 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add danh-sach-mau.html danh-sach-shop.html index.html js/app.js sw.js
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v247 chuyen muc Su kien Marketing sang trang Mau + sw.js v247-shell-1"
            git push
          fi
