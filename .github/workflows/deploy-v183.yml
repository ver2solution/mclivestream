name: Deploy v183 (doi nhan menu theo doi tuong — sua sai v182)

on:
  push:
    paths:
      - '.github/workflows/deploy-v183.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v183:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v183 package
        run: |
          unzip -o mclivestream-v183-nav-labels-deploy.zip
          echo "--- verify v183 ---"
          if unzip -l mclivestream-v183-nav-labels-deploy.zip | grep -q 'js/data.js'; then echo "SAI: goi v183 KHONG duoc chua js/data.js"; exit 1; fi
          test "$(unzip -l mclivestream-v183-nav-labels-deploy.zip | grep -c '\.html$')" -eq 204 || (echo "SAI: goi v183 phai co dung 204 file HTML"; exit 1)
          grep -q 'href="danh-sach-mau.html" class="">Dành cho Shop' index.html || (echo "SAI: index.html thieu nhan 'Danh cho Shop' -> danh-sach-mau.html"; exit 1)
          grep -q 'href="danh-sach-shop.html" class="">Dành cho Mẫu' index.html || (echo "SAI: index.html thieu nhan 'Danh cho Mau' -> danh-sach-shop.html"; exit 1)
          grep -q 'href="../danh-sach-mau.html" class="">Dành cho Shop' bai-viet/tuyen-mau-livestream.html || (echo "SAI: bai-viet mau thieu nhan 'Danh cho Shop'"; exit 1)
          grep -q 'href="../danh-sach-shop.html" class="">Dành cho Mẫu' bai-viet/tuyen-mau-livestream.html || (echo "SAI: bai-viet mau thieu nhan 'Danh cho Mau'"; exit 1)
          if grep -rq 'danh-sach-mau.html"[^>]*>Dành cho Mẫu' --include="*.html" .; then echo "SAI: van con nhan cu 'Danh cho Mau' -> danh-sach-mau.html"; exit 1; fi
          if grep -rq 'danh-sach-shop.html"[^>]*>Dành cho Shop' --include="*.html" .; then echo "SAI: van con nhan cu 'Danh cho Shop' -> danh-sach-shop.html"; exit 1; fi
          echo "verify OK: 204 file HTML — nhan menu theo doi tuong, KHONG co js/data.js"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v183-nav-labels-deploy.zip
          git add -A
          git status --short | head -5
          echo "changed files: $(git status --short | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v183: doi nhan menu theo doi tuong (sua sai v182) — 'Danh cho Shop' -> danh-sach-mau.html, 'Danh cho Mau' -> danh-sach-shop.html"
            git push
          fi
