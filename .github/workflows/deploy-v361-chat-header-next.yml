name: "Deploy v361-chat-header-next (Sua header trang chat + ?next= dang nhap)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v361-chat-header-next.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v361-chat-header-next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v361 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v361-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF "v361-shell-1" sw.js; then echo "v361 DA DEPLOY ROI - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main f63d892) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "202063ecade64cbb8939cb2df3e67e51" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "495" || (echo "BASE DOI: sitemap khong con 495 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v361-deploy.zip
          echo "--- verify v361 (7 file) ---"
          for f in dang-nhap.html cong-dong/chat.html js/chat-page.js js/reward.js sw.js tests/test-chat-page.mjs; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "v361-shell-1" sw.js || (echo "SAI: sw.js phai co CACHE v361-shell-1"; exit 1)
          if grep -qF "v.charAt(0) === '/'" dang-nhap.html; then echo "SAI: safeNext van loai duong dan tuyet doi"; exit 1; fi
          grep -qF "syncHeader" js/chat-page.js || (echo "SAI: chat-page.js phai co syncHeader"; exit 1)
          grep -qF "/js/reward.js" cong-dong/chat.html || (echo "SAI: chat.html phai nap js/reward.js"; exit 1)
          node tests/test-chat-page.mjs
          echo "verify OK: safeNext + header chip + CACHE v361-shell-1"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v361-deploy.zip
          git add dang-nhap.html cong-dong/chat.html js/chat-page.js js/reward.js sw.js tests/test-chat-page.mjs
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v361: Sua 2 loi phat hien o kiem live v360 — safeNext cho phep ?next= tuyet doi (/cong-dong/chat) + chip tai khoan o header trang chat (syncHeader, ten + xu qua reward.js) — sw.js CACHE v361-shell-1"
            git push
          fi
