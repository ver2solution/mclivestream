name: Deploy v268 (F-R2-08)

on:
  push:
    paths:
      - '.github/workflows/deploy-v268-f-r2-08.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v268-f-r2-08:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v268-f-r2-08 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v268-f-r2-08-deploy.zip
          echo "--- verify v268 (F-R2-08) ---"
          node --check js/app.js || (echo "SYNTAX FAIL js/app.js"; exit 1)
          node --check sw.js || (echo "SYNTAX FAIL sw.js"; exit 1)
          grep -m1 "v268-shell-1" sw.js
          grep -m1 "v268 (F-R2-08" js/app.js
          grep -m1 "v268 (F-R2-08" danh-sach-xuong.html
          grep -m1 "__missing__" danh-sach-xuong.html
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum js/app.js danh-sach-xuong.html sw.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v268-f-r2-08-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v268: F-R2-08 option Chua ghi MOQ (__missing__) + nhanh dem MISSING_META cho loc xuong, sw.js v268-shell-1"
            git push
          fi
