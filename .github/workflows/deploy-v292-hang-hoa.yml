name: Deploy v292-hang-hoa (4 bai Hang hoa 16/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v292-hang-hoa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v292-hang-hoa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "336" || (echo "BASE DOI: data.js khong con 336 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "362" || (echo "BASE DOI: sitemap khong con 362 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip v292-hang-hoa package
        run: |
          unzip -o mclivestream-v292-hang-hoa-deploy.zip
          echo "--- verify v292-hang-hoa (4 bai) ---"
          for slug in do-trang-tri-tet-ban-chay-251-ty-linh-vat-ngua nhap-hang-si-o-dau-11-nha-cung-cap-gia-si-2026 cach-quan-ly-hang-ton-kho-5-nguyen-tac-shop-nho tai-nghe-kinoko-no-yama-nam-socola-chay-hang-10-phut; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "366" || (echo "SAI TONG sitemap, phai 366"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "340" || (echo "SAI TONG data.js, phai 340"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v292-hang-hoa-deploy.zip || rm -f mclivestream-v292-hang-hoa-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v292-hang-hoa: 4 bai Hang hoa 16/11/2026 (do trang tri Tet ban chay keyword #4 + nhap hang si o dau STT 72 + cach quan ly hang ton kho STT 75 + tai nghe Kinoko no Yama)"
            git push
          fi
