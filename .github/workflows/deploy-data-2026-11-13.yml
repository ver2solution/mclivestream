name: Deploy data 2026-11-13

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-13:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-13 package
        run: |
          unzip -o mclivestream-data-2026-11-13-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "cbe7f6678db4147b6f8304a01025c3dd9d8f55d648d2da55ec20f8267dd98478"
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          test "$(grep -c '"id": "th-' js/data.js)" = "219"
          test "$(grep -c '"id": "sh-' js/data.js)" = "250"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/th-127.jpg images/th-128.jpg images/th-130.jpg images/th-131.jpg images/th-132.jpg images/th-133.jpg images/th-134.jpg images/th-135.jpg images/th-136.jpg images/th-137.jpg images/th-138.jpg images/th-139.jpg images/th-140.jpg images/th-141.jpg images-shop/shop-chicmax.png
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-13: 219 mau / 250 shop / 218 bai"
            git push
          fi
