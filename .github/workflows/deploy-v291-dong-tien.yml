name: Deploy v291-dong-tien (4 bai Dong tien 16/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v291-dong-tien.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v291-dong-tien:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v291-dong-tien package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong) ---"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "319" || (echo "BASE DOI: data.js khong con 319 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "345" || (echo "BASE DOI: sitemap khong con 345 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v291-dong-tien-deploy.zip
          echo "--- verify v291-dong-tien (4 bai) ---"
          test "$(unzip -l mclivestream-v291-dong-tien-deploy.zip | grep -c ' bai-viet/.*\.html$')" -eq 4 || (echo "SAI: goi v291 phai co dung 4 file bai-viet HTML"; exit 1)
          test "$(unzip -l mclivestream-v291-dong-tien-deploy.zip | grep -c ' images/bai-viet/.*\.jpg$')" -eq 8 || (echo "SAI: goi v291 phai co dung 8 anh"; exit 1)
          if unzip -l mclivestream-v291-dong-tien-deploy.zip | grep -q ' sw.js$'; then echo "SAI: goi v291 KHONG duoc chua sw.js"; exit 1; fi
          for slug in doanh-thu-double-12-shop-nho-don-song-sale-cuoi-nam ban-le-my-thang-10-tang-cham-nhat-gan-1-nam ban-le-trung-quoc-thang-10-cham-nhat-tu-2024 gdp-nhat-ban-quy-3-suy-giam-yen-ket-gan-160; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "--- verify KHONG mat bai cua cac cron khac hom nay (chong ghi de v190/v191) ---"
          for slug in thong-ke-ho-so-moi-15-11-2026 thi-truong-livestream-tuan-qua-16-11-2026 san-viec-lam-livestream-vieclamlivestream-online viec-lam-livestream-part-time phi-san-tiktok-shop-shopee-2026 y-tuong-kinh-doanh-it-von-24-y-tuong-shopify-2026 ban-hang-online-khong-can-von-5-mo-hinh-2026 khoi-nghiep-ban-hang-online-gymshark-646-trieu-bang livestream-trung-quoc-2026-double-11-1776-ty-ndt shopee-12-12-sinh-nhat-sale-cuoi-nam-voucher-freeship-live shopee-quy-3-2026-gmv-39-7-ty-usd-phi-san-15-3 thuong-mai-dien-tu-dong-nam-a-2026-226-ty-usd-viet-nam-32-ty; do
            grep -q "bai-viet/$slug.html" js/data.js || (echo "MAT BAI KHAC: $slug khong co trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "MAT BAI KHAC: $slug khong co trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js articles: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" -eq 349 || (echo "SAI: sitemap phai co 349 URL (345 live + 4 bai moi)"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" -eq 323 || (echo "SAI: data.js phai co 323 bai (319 live + 4 bai moi)"; exit 1)
          echo "verify OK: 4 bai + 8 anh + data.js (323 bai) + sitemap (349 URL), 0 bai hom nay bi mat"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v291-dong-tien-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v291-dong-tien: 4 bai Dong tien 16/11/2026 (doanh thu Double 12 keyword theo mua #4 + ban le My thang 10 + ban le Trung Quoc thang 10 + GDP Nhat Ban quy III); data.js/sitemap rebase tren live 319 bai/345 URL (sau v289 Thi truong), 0 bai hom nay bi mat; sw.js NOT touched"
            git push
          fi
