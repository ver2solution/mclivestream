name: Deploy v355-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v355-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v355-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v355-drafts package
        run: |
          unzip -o mclivestream-v355-drafts-deploy.zip
          echo "--- verify v355-drafts (1 bai) ---"
          test -f bai-viet/double-11-2026-lanh-nhat-lich-su-nguoi-tre-mua-gao-dau-an-giay-ve-sinh.html || (echo "THIEU bai-viet/double-11-2026-lanh-nhat-lich-su-nguoi-tre-mua-gao-dau-an-giay-ve-sinh.html"; exit 1)
          grep -q "bai-viet/double-11-2026-lanh-nhat-lich-su-nguoi-tre-mua-gao-dau-an-giay-ve-sinh.html" js/data.js || (echo "THIEU double-11-2026-lanh-nhat-lich-su-nguoi-tre-mua-gao-dau-an-giay-ve-sinh trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/double-11-2026-lanh-nhat-lich-su-nguoi-tre-mua-gao-dau-an-giay-ve-sinh.html</loc>" sitemap.xml || (echo "THIEU double-11-2026-lanh-nhat-lich-su-nguoi-tre-mua-gao-dau-an-giay-ve-sinh trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v355-drafts-deploy.zip
          git add bai-viet/double-11-2026-lanh-nhat-lich-su-nguoi-tre-mua-gao-dau-an-giay-ve-sinh.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v355-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — double-11-2026-lanh-nhat-lich-su-nguoi-tre-mua-gao-dau-an-giay-ve-sinh"
            git push
          fi
