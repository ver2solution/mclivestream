name: Deploy data 2026-11-09

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-09.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-09:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-09 package
        run: |
          unzip -o mclivestream-data-2026-11-09-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          ls -l images/th-48.jpg images/th-49.jpg images/th-50.jpg images/th-51.jpg images/th-52.jpg images/th-54.jpg images/th-57.jpg images/th-58.jpg images/th-59.jpg images/th-60.jpg images/th-64.jpg images/th-65.jpg images/th-66.jpg images/th-67.jpg images-shop/shop-hoa-sen-home.jpg
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/th-48.jpg images/th-49.jpg images/th-50.jpg images/th-51.jpg images/th-52.jpg images/th-54.jpg images/th-57.jpg images/th-58.jpg images/th-59.jpg images/th-60.jpg images/th-64.jpg images/th-65.jpg images/th-66.jpg images/th-67.jpg images-shop/shop-hoa-sen-home.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-09: 57 mau / 96 shop (20 mau + 20 shop moi, 15 anh moi)"
            git push
          fi
