name: deploy-v224
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v224:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v224 package
        run: |
          unzip -o v224.zip
          ls -l js/admin.js js/auth-ui.js js/xu-chung.js js/app.js sw.js
          sha256sum js/admin.js js/auth-ui.js js/xu-chung.js js/app.js sw.js
      - name: Verify package contents
        run: |
          set -e
          test "$(sha256sum js/admin.js | cut -d' ' -f1)" = "d50fa5844c7c0e1f57e3889cb4215bb83cc4258335888473cd51e0069643e588"
          test "$(sha256sum js/auth-ui.js | cut -d' ' -f1)" = "13aa4296d065139306e838183baa42b22f7c60ec63e454cb4230be7dde4c63e0"
          test "$(sha256sum js/xu-chung.js | cut -d' ' -f1)" = "45fb63d61e2a7be2394048d99a715d820c70e809521bbd19fcecf510d1b142b7"
          test "$(sha256sum js/app.js | cut -d' ' -f1)" = "0b3746f85fbadfdebb62c8fd8485e28708783fc260da2131d17b9a86c56f7d91"
          test "$(sha256sum sw.js | cut -d' ' -f1)" = "5a5087ea9904d3191562827ed334a51f3f754dbdd53f219df209011e162baacb"
          grep -Fq "admFaqBadge" js/admin.js
          grep -Fq "function updateFaqBadge" js/admin.js
          grep -Fq "function refreshOverviewCounts" js/admin.js
          grep -Fq "invalidateSessionCache();" js/auth-ui.js
          grep -Fq "notifySession(null);" js/auth-ui.js
          grep -Fq "A.onSessionChange(function (user)" js/xu-chung.js
          grep -Fq "headerNameUserId" js/app.js
          grep -Fq "v224-shell-1" sw.js
      - name: Commit v224 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/admin.js js/auth-ui.js js/xu-chung.js js/app.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v224 badge Hoi dap/Trao doi (S2-7) + dang xuat sach phien (S2-8) + ten header 1 lan (S3-10); js/admin.js + js/auth-ui.js + js/xu-chung.js + js/app.js + sw.js CACHE v224-shell-1"
            git push
          fi
