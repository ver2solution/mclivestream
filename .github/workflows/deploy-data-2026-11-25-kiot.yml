name: Deploy data 2026-11-25 kiot

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-25-kiot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-25-kiot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-25 kiot package
        run: |
          # 25/11 (nen live moi nhat sha 509cf68f…, 246 mau / 313 shop / 740 bai / 309 lo / 437 xuong / 381 kiot):
          # chi 3 kiot moi APPEND (kiot-382..384), khong doi ten anh cu
          # nen khong rm file nao — zip chi chua data.js + 3 anh moi.
          unzip -o mclivestream-data-2026-11-25-kiot-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "04a8c97346ec3c3220b073c1009edb4ea1488b618d5095bd91f7631d94a18850" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "articles: $(grep -c '"slug":' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "kiot images: $(ls images/kiot/*.jpg | wc -l)"
          test "$(grep -c '"id": "kiot-' js/data.js)" = "384" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "437" || (echo "BAD factories count"; exit 1)
          missing=0
          for f in $(grep -o 'images/kiot/kiot-[0-9]*\.jpg' js/data.js | sort -u); do
            [ -f "$f" ] || { echo "THIEU ANH: $f"; missing=$((missing+1)); }
          done
          echo "anh thieu: $missing"
          [ "$missing" -eq 0 ]
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/data.js images/kiot/
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-25 kiot: 384 kiot (3 moi 25/11: Sang nhượng quán cafe Trần Xuân Soạn 298 triệu, Sang nhượng quán cafe Bình Hưng Hòa 200 triệu, Sang nhượng quán cafe Bà Điểm 100 triệu), 246 mau / 313 shop / 309 lo / 437 xuong / 740 bai"
            git push
          fi
