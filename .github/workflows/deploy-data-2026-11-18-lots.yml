name: Deploy data 2026-11-18 lots

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-18-lots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-18-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-18 lots package
        run: |
          LIVE_SHA="$(curl -s https://vieclamlivestream.online/js/data.js | sha256sum | cut -d' ' -f1)"
          echo "live data.js sha: $LIVE_SHA"
          test "$LIVE_SHA" = "dbe0864fc5697b32becbc9e1d768c3c06372c7d043d21f3ff5f1191df4fbd9c5" || (echo "LIVE data.js changed since package built (another deploy landed?) - aborting to avoid clobber"; exit 1)
          unzip -o mclivestream-data-2026-11-18-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "959831e17e33b78114f3af877ba8583d5a36027e9074464dd975d8913c1548e6" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles (grep page): $(grep -c '"page": "bai-viet/' js/data.js)"
          for f in lot-187 lot-188 lot-189 lot-191 lot-192 lot-193 lot-194 lot-195 lot-196 lot-197 lot-198 lot-199 lot-200 lot-201 lot-202 lot-203 lot-204 lot-205 lot-206 lot-207 lot-208 lot-209 lot-210 lot-211 lot-212 lot-213 lot-214 lot-215 lot-216 lot-217 lot-218 lot-219; do ls -l images/lo/$f.jpg; done
          test "$(grep -c '"id": "th-' js/data.js)" = "238" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "290" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "226" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "320" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "280" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "421" || (echo "BAD articles grep count"; exit 1)
          test "$(node -e "global.window={};eval(require('fs').readFileSync('js/data.js','utf8'));console.log(window.V20_DATA.articles.length)")" = "422" || (echo "BAD articles parsed count"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js images/lo/lot-187.jpg images/lo/lot-188.jpg images/lo/lot-189.jpg images/lo/lot-191.jpg images/lo/lot-192.jpg images/lo/lot-193.jpg images/lo/lot-194.jpg images/lo/lot-195.jpg images/lo/lot-196.jpg images/lo/lot-197.jpg images/lo/lot-198.jpg images/lo/lot-199.jpg images/lo/lot-200.jpg images/lo/lot-201.jpg images/lo/lot-202.jpg images/lo/lot-203.jpg images/lo/lot-204.jpg images/lo/lot-205.jpg images/lo/lot-206.jpg images/lo/lot-207.jpg images/lo/lot-208.jpg images/lo/lot-209.jpg images/lo/lot-210.jpg images/lo/lot-211.jpg images/lo/lot-212.jpg images/lo/lot-213.jpg images/lo/lot-214.jpg images/lo/lot-215.jpg images/lo/lot-216.jpg images/lo/lot-217.jpg images/lo/lot-218.jpg images/lo/lot-219.jpg
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-18 lots: 226 lo (80 lo moi: lot-147..186 cua 17/11 chen lai sau khi deploy 17/11 khong len live + lot-187..226 cua 18/11: nhom 1: 8, nhom 2: 1, nhom 3: 31; 32 anh moi; 40 lo 17/11 da kiem chung ngay/link, 40 lo 18/11 A11 VOZ/OTOFUN + B12 YouTube + C10 Cho Tot/web + D7 dong cua FB/IG; chuan hoa linkText video/tin ve 'Xem bai dang goc'), 238 mau / 290 shop / 320 xuong / 280 kiot / 422 bai viet"
            git push
          fi
