name: Deploy v163
on:
  push:
    paths:
      - '.github/workflows/deploy-v163.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v163 package
        run: |
          ls -l mclivestream-v163-deploy.zip
          unzip -o mclivestream-v163-deploy.zip
          ls -l v20.css sw.js
      - name: Verify v163 files
        run: |
          grep -q "v163-shell-1" sw.js
          grep -q "gopy-fab" v20.css
          echo "v163 files verified"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "v163: move Gopy FAB to bottom-right, bump sw CACHE to v163-shell-1"
          git push
