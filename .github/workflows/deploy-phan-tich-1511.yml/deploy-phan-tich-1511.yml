name: Deploy articles-phan-tich-2026-11-15 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-phan-tich-1511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-phan-tich-1511:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "266" || (echo "BASE DOI: data.js khong con 266 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "292" || (echo "BASE DOI: sitemap khong con 292 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip phan-tich-1511 package
        run: |
          unzip -o mclivestream-phan-tich-1511-deploy.zip
          echo "--- verify phan-tich-1511 (4 bai) ---"
          for slug in luong-mau-livestream-2026-phan-tich y-tuong-ban-hang-online-22-y-tuong-shopify-2026 ban-hang-online-von-it-5-do-la-mo-shop-2026 kinh-doanh-online-cho-nguoi-moi-9-buoc-xero-2026; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "296" || (echo "SAI TONG sitemap, phai 296"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "270" || (echo "SAI TONG data.js, phai 270"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-phan-tich-1511-deploy.zip || rm -f mclivestream-phan-tich-1511-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-phan-tich-2026-11-15: 4 bai (luong-mau-livestream-2026-phan-tich, y-tuong-ban-hang-online-22-y-tuong-shopify-2026, ban-hang-online-von-it-5-do-la-mo-shop-2026, kinh-doanh-online-cho-nguoi-moi-9-buoc-xero-2026)"
            git push
          fi
