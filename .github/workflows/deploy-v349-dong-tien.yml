name: Deploy v349-dong-tien (4 bai Dong tien 19/11/2026)

on:
  push:
    paths:
      - '.github/workflows/deploy-v349-dong-tien.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v349-dong-tien:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "440" || (echo "BASE DOI: data.js khong con 440 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "466" || (echo "BASE DOI: sitemap khong con 466 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip v349-dong-tien package
        run: |
          unzip -o mclivestream-v349-dong-tien-deploy.zip
          echo "--- verify v349-dong-tien (4 bai) ---"
          for slug in bien-ban-fomc-fed-tinh-tang-50-diem-thang-12 nvidia-quy-3-doanh-thu-115-ty-usd-co-phieu-van-giam gia-vang-roi-tiep-3752-usd-thap-nhat-14-thang thu-hoi-von-xa-kho-cuoi-nam-tinh-gia-hoa-von; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg" ; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "470" || (echo "SAI TONG sitemap, phai 470"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "444" || (echo "SAI TONG data.js, phai 444"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v349-dong-tien-deploy.zip || rm -f mclivestream-v349-dong-tien-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v349-dong-tien: 4 bai Dong tien 19/11/2026 (bien ban FOMC + Nvidia quy III + vang roi tiep 3.752 USD + thu hoi von xa kho; SEO V2)"
            git push
          fi
