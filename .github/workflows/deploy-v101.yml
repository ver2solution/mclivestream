name: Deploy v101

on:
  push:
    paths:
      - '.github/workflows/deploy-v101.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v101:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v101 deploy package
        run: |
          unzip -o mclivestream-v101-deploy.zip
          ls -l js/app.js v20.css sw.js
          sha256sum js/app.js v20.css sw.js
          grep -q "v101-shell-1" sw.js && echo "sw.js CACHE OK: v101-shell-1"
          grep -q "repeat(5,1fr)" v20.css && echo "css 5-col grid OK"
          grep -q "card-compact-noimg" v20.css && echo "css noimg OK"
          grep -q "card-compact-noimg" js/app.js && echo "app.js noimg OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js v20.css sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v101: 1 hang PC 5 ho so + noi dung thay logo (ten sp/tinh/thu mua/xa kho), cache v101-shell-1"
            git push
          fi
