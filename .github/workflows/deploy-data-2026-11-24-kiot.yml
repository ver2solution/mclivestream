name: Deploy data 2026-11-24 kiot

on:
  push:
    paths:
      - '.github/workflows/deploy-data-2026-11-24-kiot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-data-2026-11-24-kiot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip data 2026-11-24 kiot package
        run: |
          # 24/11 (nen live moi nhat sha 1503760a…, 246 mau / 313 shop / 685 bai / 305 lo / 432 xuong / 378 kiot):
          # chi 3 kiot moi APPEND (kiot-379..381), khong doi ten anh cu
          # nen khong rm file nao — zip chi chua data.js + 3 anh moi.
          unzip -o mclivestream-data-2026-11-24-kiot-deploy.zip
          ls -l js/data.js
          sha256sum js/data.js
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "82cd0154b41ed0be527b4db2f0611b39eb21a7ce7bf38a8760296e10dbc29961" || (echo "BAD data.js sha256"; exit 1)
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "kiot images: $(ls images/kiot/*.jpg | wc -l)"
          test "$(grep -c '"id": "kiot-' js/data.js)" = "381" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "432" || (echo "BAD factories count"; exit 1)
          # Bai hoc v171: KHONG hardcode tong so file — kiem tra bat bien "0 file thieu":
          # moi img trong data.js phai ton tai tren dia sau khi giai nen.
          missing=0
          for f in $(grep -o 'images/kiot/kiot-[0-9]*\.jpg' js/data.js | sort -u); do
            [ -f "$f" ] || { echo "THIEU ANH: $f"; missing=$((missing+1)); }
          done
          echo "anh thieu: $missing"
          [ "$missing" -eq 0 ]
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/data.js images/kiot/
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-24 kiot: 381 kiot (3 moi 24/11: Sang Nhượng Salon Tóc Nguyễn Văn Quá 100 triệu, Sang Nhượng Salon Tóc Mặt Tiền Phan Đình Phùng 100 triệu, Sang Nhượng Quán Nhậu KDC Vĩnh Lộc 500 triệu), 246 mau / 313 shop / 305 lo / 432 xuong / 685 bai"
            git push
          fi
