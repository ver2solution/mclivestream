name: Deploy ctv-50 (bai CTV 50% hoa hong, muc Viec Lam, 13/11/2026)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-ctv-50:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip ctv-50 package
        run: |
          unzip -o ctv-50.zip
          echo "--- verify ctv-50 (1 bai CTV moi) ---"
          test "$(unzip -l ctv-50.zip | grep -c ' bai-viet/.*\.html$')" -eq 1 || (echo "SAI: goi ctv-50 phai co dung 1 file bai-viet HTML"; exit 1)
          test "$(unzip -l ctv-50.zip | grep -c ' images/bai-viet/.*\.jpg$')" -eq 2 || (echo "SAI: goi ctv-50 phai co dung 2 anh"; exit 1)
          if unzip -l ctv-50.zip | grep -q ' sw.js$'; then echo "SAI: goi ctv-50 KHONG duoc chua sw.js"; exit 1; fi
          test -f "bai-viet/cong-tac-vien-ver2solution-50-hoa-hong.html" || (echo "THIEU bai CTV"; exit 1)
          test -f "images/bai-viet/cong-tac-vien-ver2solution-50-hoa-hong-hero.jpg" || (echo "THIEU anh hero"; exit 1)
          test -f "images/bai-viet/cong-tac-vien-ver2solution-50-hoa-hong-hero-og.jpg" || (echo "THIEU anh og"; exit 1)
          test -f "tests/test-ctv-50-article.mjs" || (echo "THIEU file test"; exit 1)
          grep -q "bai-viet/cong-tac-vien-ver2solution-50-hoa-hong.html" js/data.js || (echo "THIEU bai CTV trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/cong-tac-vien-ver2solution-50-hoa-hong.html</loc>" sitemap.xml || (echo "THIEU bai CTV trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "verify OK: 1 bai + 2 anh + data.js + sitemap (241 URL)"
      - name: Run CTV article test (exit code)
        run: node tests/test-ctv-50-article.mjs
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f ctv-50.zip
          git add bai-viet/cong-tac-vien-ver2solution-50-hoa-hong.html images/bai-viet/cong-tac-vien-ver2solution-50-hoa-hong-hero.jpg images/bai-viet/cong-tac-vien-ver2solution-50-hoa-hong-hero-og.jpg js/data.js sitemap.xml tests/test-ctv-50-article.mjs
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ctv-50: bai CTV 50% hoa hong moi (muc Viec Lam) — mau livestream gioi thieu shop nhan 50% thang dau, cao nhat 7.000.000d/khach; test 30/30; sw.js NOT touched"
            git push
          fi
