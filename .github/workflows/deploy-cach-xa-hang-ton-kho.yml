name: Deploy cach xa hang ton kho

on:
  push:
    paths:
      - '.github/workflows/deploy-cach-xa-hang-ton-kho.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cach-xa-hang-ton-kho:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip cach xa hang package
        run: |
          unzip -o mclivestream-cach-xa-hang-ton-kho-deploy.zip
          echo "--- verify payload ---"
          ls -la bai-viet/cach-xa-hang-ton-kho-dang-lo-xuong-kiot.html
          find . -name 'cach-xa-hang-ton-kho-*.jpg' | sort
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-cach-xa-hang-ton-kho-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy bai Cach xa hang ton kho (1 bai viet + 8 anh)"
            git push
          fi
