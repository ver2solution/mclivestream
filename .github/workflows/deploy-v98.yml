name: Deploy v98

on:
  push:
    paths:
      - '.github/workflows/deploy-v98.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v98:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v98 deploy package
        run: |
          unzip -o mclivestream-v98-deploy.zip
          ls -l danh-sach-shop.html v20.css sw.js
          sha256sum danh-sach-shop.html v20.css sw.js
          grep -q "v98-shell-1" sw.js && echo "sw.js CACHE OK: v98-shell-1"
          grep -q 'class="filter-card cols-6"' danh-sach-shop.html && echo "filter cols-6 OK"
          grep -q "filter-card.cols-6{grid-template-columns:repeat(6,1fr)}" v20.css && echo "css cols-6 OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add danh-sach-shop.html v20.css sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v98: bo loc Shop thu gon 2 hang x 6 o, cache v98-shell-1"
            git push
          fi
