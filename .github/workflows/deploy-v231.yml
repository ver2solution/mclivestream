name: deploy-v231
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v231:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v231 package
        run: |
          unzip -o v231.zip
          ls -l vi.html danh-sach-mau.html sw.js
          sha256sum vi.html danh-sach-mau.html sw.js
      - name: Verify package contents
        run: |
          set -e
          test "$(sha256sum vi.html | cut -d' ' -f1)" = "abba4f70a8f161fdef686572cdd79170d7c0221580a9e744d803882bdd405e22"
          test "$(sha256sum danh-sach-mau.html | cut -d' ' -f1)" = "0478ca6b8b4bb98ef516391f92049e56aed11e619b394abad758f1dff37d2067"
          test "$(sha256sum sw.js | cut -d' ' -f1)" = "75994f5b18b314db09fd93935b2dac5012fe799b54d74cc0a9e7895a61db016c"
          grep -Fq "Đang kiểm tra đăng nhập" vi.html
          grep -Fq "Promise.all" danh-sach-mau.html
          grep -Fq "v231-shell-1" sw.js
      - name: Commit v231 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add vi.html danh-sach-mau.html sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v231 S3-16 text vi trung tinh + loadApproved song song; vi.html + danh-sach-mau.html + sw.js CACHE v231-shell-1"
            git push
          fi
