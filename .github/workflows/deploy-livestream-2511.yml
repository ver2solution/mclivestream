name: "Deploy livestream-2511 (4 bai Livestream 25/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-livestream-2511.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-livestream-2511:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'kich-ban-livestream-tet-khung-60-phut-chuan-tiktok' js/data.js; then echo "livestream-2511 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "61bd532b1efb53f26c9204bb1e9dcf34" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "698" || (echo "BASE DOI: data.js khong con 698 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "720" || (echo "BASE DOI: sitemap khong con 720 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip livestream-2511 package
        run: |
          unzip -o mclivestream-livestream-2511-deploy.zip
          echo "--- verify livestream-2511 (4 bai) ---"
          for slug in kich-ban-livestream-tet-khung-60-phut-chuan-tiktok livestream-ban-quan-ao-nam-tang-46-nu-102-trieu-usd cach-noi-chuyen-khi-livestream-ban-hang-6-cau-chot-don meo-livestream-chot-don-xa-kho-truoc-black-friday; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "724" || (echo "SAI TONG sitemap, phai 724"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "702" || (echo "SAI TONG data.js, phai 702"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-livestream-2511-deploy.zip || rm -f mclivestream-livestream-2511-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-livestream-2026-11-25: 4 bai (kich-ban-livestream-tet-khung-60-phut-chuan-tiktok, livestream-ban-quan-ao-nam-tang-46-nu-102-trieu-usd, cach-noi-chuyen-khi-livestream-ban-hang-6-cau-chot-don, meo-livestream-chot-don-xa-kho-truoc-black-friday)"
            git push
          fi
