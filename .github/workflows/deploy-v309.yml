name: Deploy v309-f-r2-08c (lot price filter 'Chua ghi gia tri')

on:
  push:
    paths:
      - '.github/workflows/deploy-v309.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v309:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v309 package
        run: |
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; bai hoc v307: KHONG guard HEAD-SHA) ---"
          if grep -q "v309 (F-R2-08c" js/app.js; then echo "v309 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "7008a075a6ee42f8d8b081fa68e506d8" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "379" || (echo "BASE DOI: sitemap khong con 379 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v309-deploy.zip
          echo "--- verify v309 (2 files) ---"
          test "$(unzip -l mclivestream-v309-deploy.zip | grep -c ' js/app.js$')" -eq 1 || (echo "SAI: goi v309 phai co dung 1 file js/app.js"; exit 1)
          test "$(unzip -l mclivestream-v309-deploy.zip | grep -c ' danh-sach-lo.html$')" -eq 1 || (echo "SAI: goi v309 phai co dung 1 file danh-sach-lo.html"; exit 1)
          if unzip -l mclivestream-v309-deploy.zip | grep -q ' sw.js$'; then echo "SAI: goi v309 KHONG duoc chua sw.js"; exit 1; fi
          grep -q "v309 (F-R2-08c" js/app.js || (echo "THIEU khoi v309 trong js/app.js"; exit 1)
          grep -q 'value="__missing__">Chưa ghi giá trị' danh-sach-lo.html || (echo "THIEU option Chua ghi gia tri trong danh-sach-lo.html"; exit 1)
          grep -q "MISSING_META" js/app.js || (echo "THIEU xu ly MISSING_META trong js/app.js"; exit 1)
          echo "verify OK: 2 files, option Chua ghi gia tri + xu ly MISSING_META, 9 lo khong gia"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v309-deploy.zip
          git add js/app.js danh-sach-lo.html
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v309: add 'Chua ghi gia tri' lot price filter option (F-R2-08c, test vong 3); loc ra 9 lo thieu priceNum theo mau MISSING_META; data.js/sitemap khong doi (base f59bcc4 + v307 + v308)"
            git push
          fi
