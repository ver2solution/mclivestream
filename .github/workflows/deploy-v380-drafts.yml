name: Deploy v380-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v380-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v380-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v380-drafts package
        run: |
          unzip -o mclivestream-v380-drafts-deploy.zip
          echo "--- verify v380-drafts (1 bai) ---"
          test -f bai-viet/la-chapelle-4550-ty-dong-double-11-2026-ban-da-san-kuaishou-tang-169-phan-tram.html || (echo "THIEU bai-viet/la-chapelle-4550-ty-dong-double-11-2026-ban-da-san-kuaishou-tang-169-phan-tram.html"; exit 1)
          grep -q "bai-viet/la-chapelle-4550-ty-dong-double-11-2026-ban-da-san-kuaishou-tang-169-phan-tram.html" js/data.js || (echo "THIEU la-chapelle-4550-ty-dong-double-11-2026-ban-da-san-kuaishou-tang-169-phan-tram trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/la-chapelle-4550-ty-dong-double-11-2026-ban-da-san-kuaishou-tang-169-phan-tram.html</loc>" sitemap.xml || (echo "THIEU la-chapelle-4550-ty-dong-double-11-2026-ban-da-san-kuaishou-tang-169-phan-tram trong sitemap"; exit 1)
          grep -q "v380-shell-1" sw.js || (echo "THIEU v380-shell-1 trong sw.js"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v380-drafts-deploy.zip
          git add bai-viet/la-chapelle-4550-ty-dong-double-11-2026-ban-da-san-kuaishou-tang-169-phan-tram.html js/data.js sitemap.xml sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v380-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — la-chapelle-4550-ty-dong-double-11-2026-ban-da-san-kuaishou-tang-169-phan-tram"
            git push
          fi
