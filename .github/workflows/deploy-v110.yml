name: Deploy v110

on:
  push:
    paths:
      - '.github/workflows/deploy-v110.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v110:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v110 deploy package
        run: |
          unzip -o mclivestream-v110-deploy.zip
          ls -l sw.js hoi-dap.html js/faq-ask.js
          sha256sum sw.js hoi-dap.html
          grep -q "v110-shell-1" sw.js && echo "sw.js CACHE OK: v110-shell-1"
          grep -q "faqAsk" hoi-dap.html && echo "hoi-dap.html form OK"
          grep -q "faq_questions" js/faq-ask.js && echo "faq-ask.js table OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v110: o dat cau hoi trang Hoi dap (faq_questions)"
            git push
          fi
