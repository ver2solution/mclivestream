# Deploy bo ten gioi thieu + tong hop so lieu 7 trang con 20261126
# (base live 49259fd sau PNG batch 5, PR #132; 7 file HTML goc repo)
# Giai nen ZIP goc repo -> 7 file HTML -> commit len nhanh deploy -> PR merge vao main
# Chi sua HTML hien thi (bo H1 + H2 tren luoi chinh + dong dem); KHONG doi JS/data.js.
# HTML la network-first nen KHONG bump CACHE (sw.js khong doi).
name: Deploy remove subpage titles counts 20261126

on:
  push:
    branches: [deploy/remove-subpage-titles-20261126]
    paths:
      - mclivestream-remove-subpage-titles-20261126.zip
      - .github/workflows/deploy-remove-subpage-titles-20261126.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-remove-titles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: deploy/remove-subpage-titles-20261126
          fetch-depth: 0

      - name: Unzip package + verify
        run: |
          ZIP=mclivestream-remove-subpage-titles-20261126.zip
          test -f "$ZIP" || { echo "Khong tim thay $ZIP"; exit 1; }
          COUNT=$(unzip -l "$ZIP" | awk 'NR>3 && $4 != "" && $4 !~ /\// {n++} END {print n+0}')
          echo "So file trong ZIP: $COUNT"
          test "$COUNT" -eq 7 || { echo "ZIP phai co dung 7 file"; exit 1; }
          unzip -o "$ZIP"
          python3 - << 'PYEOF'
          import sys
          # ban: chuoi chi xuat hien neu phan tu HTML chua bo; co: id o loc + luoi phai con
          checks = {
           'lao-dong-tu-do.html': {'ban': ['<h1', '<p class="filter-count"', 'CountH2', 'id="flTabTitle"', 'id="flCount"'], 'co': ['flList', 'flProv', 'flApplyBtn', 'flResetBtn']},
           'danh-sach-mau.html': {'ban': ['<h1', '<p class="filter-count"', 'CountH2', 'id="uniCount"', 'id="model-list-title"', 'id="logisticsCount"', 'id="logisticsNoiDiaCount"', 'id="agencyAdsCount"'], 'co': ['listGrid', 'filterToggleShop']},
           'danh-sach-shop.html': {'ban': ['<h1', '<p class="filter-count"', 'CountH2', 'id="shopCount"', 'id="shop-list-title"', 'id="classLiveCount"', 'id="classMakeupCount"', 'id="eventMarketingCount"'], 'co': ['publicShopsList', 'shopPager']},
           'danh-sach-lo.html': {'ban': ['<h1', '<p class="filter-count"', 'CountH2', 'id="lotCount"', 'id="lot-title"'], 'co': ['lo-hang-xa-kho']},
           'danh-sach-xuong.html': {'ban': ['<h1', '<p class="filter-count"', 'CountH2', 'id="facCount"', 'id="factory-title"'], 'co': ['xuong-may-gia-cong']},
           'thanh-ly-kiot.html': {'ban': ['<h1', '<p class="filter-count"', 'CountH2', 'id="kiotCount"', 'id="movingCount"', 'id="liveEquipCount"', 'id="rentalsCount"'], 'co': ['kiotProv']},
           'tin-tuc.html': {'ban': ['<h1', '<p class="filter-count"', 'CountH2', 'id="newsCount"', 'id="newsListTitle"'], 'co': ['newsMain', 'newsPager', 'newsCat']},
          }
          bad = []
          for f, rule in checks.items():
              h = open(f, encoding='utf-8').read()
              for s in rule['ban']:
                  if s in h:
                      bad.append(f + ': CON ' + s)
              for s in rule['co']:
                  if s not in h:
                      bad.append(f + ': THIEU ' + s)
          if bad:
              print("VERIFY FAIL:"); [print(' -', b) for b in bad]; sys.exit(1)
          print("Verify OK: 7 file, khong H1/dong dem/CountH2, o loc + luoi con du")
          PYEOF
          EMPTY=$(find . -path ./.git -prune -o -name "*.html" -size 0 -print | head -5)
          if [ -n "$EMPTY" ]; then echo "File HTML rong:"; echo "$EMPTY"; exit 1; fi
          echo "0 file rong — OK"

      - name: Commit remove titles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lao-dong-tu-do.html danh-sach-mau.html danh-sach-shop.html danh-sach-lo.html danh-sach-xuong.html thanh-ly-kiot.html tin-tuc.html
          git diff --cached --quiet && { echo "Khong co thay doi de commit"; exit 1; }
          git commit -m "Bo ten gioi thieu + tong hop so lieu o 7 trang con — chi giu o loc + ket qua"
          git push origin deploy/remove-subpage-titles-20261126
