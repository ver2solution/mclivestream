name: "Deploy livestream-2311 (4 bai Livestream 23/11/2026)"

on:
  push:
    paths:
      - '.github/workflows/deploy-livestream-2311.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-livestream-2311:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          if grep -qF 'livestream-ban-hang-giang-sinh-14-ty-dong-10-gio-meraz' js/data.js; then echo "livestream-2311 DA DEPLOY ROI - dung"; exit 1; fi
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "e4e2aec0b0ff20eb646ecd65f9ab2113" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "616" || (echo "BASE DOI: data.js khong con 616 bai - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "641" || (echo "BASE DOI: sitemap khong con 641 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip livestream-2311 package
        run: |
          unzip -o mclivestream-livestream-2311-deploy.zip
          echo "--- verify livestream-2311 (4 bai) ---"
          for slug in khung-gio-vang-livestream-tet-3-khung-gio-theo-ngay meo-livestream-chot-don-tet-7-meo-ke-chuyen-truoc-giam-gia-sau livestream-ban-gio-qua-tet-3-muc-gia-qua-tang-303-trieu-usd livestream-ban-hang-giang-sinh-14-ty-dong-10-gio-meraz; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "645" || (echo "SAI TONG sitemap, phai 645"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "620" || (echo "SAI TONG data.js, phai 620"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-livestream-2311-deploy.zip || rm -f mclivestream-livestream-2311-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-livestream-2026-11-23: 4 bai (khung-gio-vang-livestream-tet-3-khung-gio-theo-ngay, meo-livestream-chot-don-tet-7-meo-ke-chuyen-truoc-giam-gia-sau, livestream-ban-gio-qua-tet-3-muc-gia-qua-tang-303-trieu-usd, livestream-ban-hang-giang-sinh-14-ty-dong-10-gio-meraz)"
            git push
          fi
