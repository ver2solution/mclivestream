name: Deploy v186 (gop bo loc 5 muc moi len top + xoa intro Kiot + nut CTA shop)

on:
  push:
    paths:
      - '.github/workflows/deploy-v186.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v186:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v186 package
        run: |
          unzip -o mclivestream-v186-2026-11-12-deploy.zip
          echo "--- verify v186 (TRONG ZIP) ---"
          if unzip -l mclivestream-v186-2026-11-12-deploy.zip | grep -q 'js/data.js\|v20.css\|mclivestream-supabase.js\|bai-viet/\|index.html'; then echo "SAI: goi v186 KHONG duoc chua data.js/v20.css/supabase/bai-viet/index.html"; exit 1; fi
          test "$(unzip -l mclivestream-v186-2026-11-12-deploy.zip | grep -c 'danh-sach-mau.html\|danh-sach-shop.html\|thanh-ly-kiot.html\|js/app.js\|sw.js')" -eq 5 || (echo "SAI: goi v186 phai co dung 5 file"; exit 1)
          grep -q 'id="fUniClassSort"' danh-sach-mau.html || (echo "SAI: danh-sach-mau.html thieu fUniClassSort"; exit 1)
          if grep -q 'fClassLiveFilter\|fClassMakeupFilter\|classLiveApplyBtn' danh-sach-mau.html; then echo "SAI: danh-sach-mau.html van con loc rieng lop hoc"; exit 1; fi
          grep -q 'id="classLiveCount"' danh-sach-mau.html || (echo "SAI: danh-sach-mau.html mat dem classLiveCount"; exit 1)
          grep -q 'id="fShopPriceSort"' danh-sach-shop.html || (echo "SAI: danh-sach-shop.html thieu fShopPriceSort"; exit 1)
          if grep -q 'fEventFilter\|fLogisticsFilter\|fRentalsFilter\|fLogisticsOption' danh-sach-shop.html; then echo "SAI: danh-sach-shop.html van con loc rieng 3 muc"; exit 1; fi
          if grep -q 'id="btnTaoHoSoMau"' danh-sach-shop.html; then echo "SAI: danh-sach-shop.html van con nut CTA btnTaoHoSoMau"; exit 1; fi
          grep -q 'id="mauAuthUserBox"' danh-sach-shop.html || (echo "SAI: danh-sach-shop.html mat muc Dang nhap mau"; exit 1)
          grep -q 'id="fShopLogOpt"' danh-sach-shop.html || (echo "SAI: danh-sach-shop.html thieu fShopLogOpt"; exit 1)
          if grep -q '<h1>Chợ thanh lý cửa hàng, Kiot</h1>' thanh-ly-kiot.html; then echo "SAI: thanh-ly-kiot.html van con intro"; exit 1; fi
          grep -q '<h2>Kiot đang thanh lý</h2>' thanh-ly-kiot.html || (echo "SAI: thanh-ly-kiot.html mat h2 Kiot dang thanh ly"; exit 1)
          grep -q 'id="kiotFilters"' thanh-ly-kiot.html || (echo "SAI: thanh-ly-kiot.html mat bo loc kiot"; exit 1)
          grep -q 'fUniClassSort' js/app.js || (echo "SAI: js/app.js thieu fUniClassSort"; exit 1)
          grep -q 'fShopPriceSort' js/app.js || (echo "SAI: js/app.js thieu fShopPriceSort"; exit 1)
          if grep -q 'starPlace\|v2sSignupPopup\|p_place' js/app.js; then echo "SAI: js/app.js lan code sao v185 (chua co SQL)"; exit 1; fi
          if grep -q 'fLogisticsOption\|fClassLiveProv\|fEventFilter' js/app.js; then echo "SAI: js/app.js van tham chieu loc rieng da xoa"; exit 1; fi
          grep -q "const CACHE = 'v186-shell-1';" sw.js || (echo "SAI: sw.js thieu CACHE v186-shell-1"; exit 1)
          echo "verify OK: 5 file — 3 HTML + js/app.js (live v184 + patch v186, khong v185) + sw.js (CACHE v186-shell-1)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v186-2026-11-12-deploy.zip
          git add -A
          git status --short | head -8
          echo "changed files: $(git status --short | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v186: gop bo loc 5 muc moi len top trang con (tinh + sap xep gia/hoc phi + hinh thuc) + xoa intro Kiot + nut Tao ho so mau tren top shop + CACHE v186-shell-1"
            git push
          fi
