name: Deploy v106

on:
  push:
    paths:
      - '.github/workflows/deploy-v106.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v106:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v106 deploy package
        run: |
          unzip -o mclivestream-v106-deploy.zip
          ls -l js/app.js sw.js
          sha256sum js/app.js sw.js
          grep -q "v106-shell-1" sw.js && echo "sw.js CACHE OK: v106-shell-1"
          grep -q "renderTopRows" js/app.js && echo "app.js renderTopRows OK"
          grep -q "KHONG dung getPinnedRow" js/app.js && echo "app.js v106 pinned logic OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v106: hang Tin ghim trang tin tuc lap bang date (ghim + 3 moi nhat)"
            git push
          fi
