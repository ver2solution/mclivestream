name: Deploy articles-viec-lam-2026-11-20 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-viec-lam-2011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-viec-lam-2011:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "af9580aed283a9358a8b3dbd8b067bdb" || (echo "BASE DOI: data.js md5 doi - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "473" || (echo "BASE DOI: data.js khong con 473 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "500" || (echo "BASE DOI: sitemap khong con 500 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip viec-lam-2011 package
        run: |
          unzip -o mclivestream-viec-lam-2011-deploy.zip
          echo "--- verify viec-lam-2011 (4 bai moi) ---"
          for slug in thong-ke-ho-so-moi-19-11-2026 luong-thang-13-mau-livestream ho-so-mau-livestream tuyen-mau-livestream-can-tho; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -q "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -q "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '\"page\": \"bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "504" || (echo "SAI TONG sitemap, phai 504"; exit 1)
          test "$(grep -c '\"page\": \"bai-viet/' js/data.js)" = "477" || (echo "SAI TONG data.js, phai 477 bai-viet page (478 bai tong, 1 bai cu dung truong url)"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-viec-lam-2011-deploy.zip || rm -f mclivestream-viec-lam-2011-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-viec-lam-2026-11-20: 4 bai moi (SEO V2)"
            git push
          fi
