name: Deploy articles-dang-hot-2026-11-26 (4 bai)

on:
  push:
    paths:
      - '.github/workflows/deploy-dang-hot-2611.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-dang-hot-2611:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard base counts (chong ghi de cron khac)
        run: |
          echo "data.js article pages truoc unzip: $(grep -c '"page": "bai-viet/' js/data.js)"
          echo "sitemap urls truoc unzip: $(grep -c '<loc>' sitemap.xml)"
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "788" || (echo "BASE DOI: data.js khong con 788 bai-viet page - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "812" || (echo "BASE DOI: sitemap khong con 812 URL - mot cron khac da deploy, DUNG LAI de rebuild"; exit 1)
      - name: Unzip dang-hot-2611 package
        run: |
          unzip -o mclivestream-dang-hot-2611-deploy.zip
          echo "--- verify dang-hot-2611 (4 bai moi) ---"
          for slug in lich-sale-cuoi-nam-2026-black-friday-27-11-12-12 thuc-pham-chuc-nang-black-friday-2026-iherb-giam-toi-30-phan-tram ca-phe-nam-2026-ryze-300-trieu-usd-vuot-nescafe-amazon black-friday-2026-airpods-pro-3-chi-149-usd-macbook-1049-usd; do
            test -f "bai-viet/$slug.html" || (echo "THIEU bai-viet/$slug.html"; exit 1)
            test -f "images/bai-viet/$slug.jpg" || (echo "THIEU images/bai-viet/$slug.jpg"; exit 1)
            test -f "images/bai-viet/$slug-og.jpg" || (echo "THIEU images/bai-viet/$slug-og.jpg"; exit 1)
            grep -qF "bai-viet/$slug.html" js/data.js || (echo "THIEU $slug trong data.js"; exit 1)
            grep -qF "<loc>https://vieclamlivestream.online/bai-viet/$slug.html</loc>" sitemap.xml || (echo "THIEU $slug trong sitemap"; exit 1)
          done
          echo "--- verify lead 4 bai moi ---"
          grep -qF "Lịch sale cuối năm 2026 bước vào tuần quyết định: từ hôm nay 26/11/2026 chỉ còn 1 ngày nữa là tới Black Friday 27/11/2026" bai-viet/lich-sale-cuoi-nam-2026-black-friday-27-11-12-12.html || (echo "LEAD SAI bai lich-sale"; exit 1)
          grep -qF "Thực phẩm chức năng Black Friday 2026 đang giảm sâu nhất trên iHerb: giảm tới 30% hơn 20.000 sản phẩm từ 18/11 tới 02/12/2026" bai-viet/thuc-pham-chuc-nang-black-friday-2026-iherb-giam-toi-30-phan-tram.html || (echo "LEAD SAI bai tpcn-iherb"; exit 1)
          grep -qF "Cà phê nấm 2026 là món thực phẩm chức năng gây bất ngờ nhất năm: RYZE, thương hiệu cà phê nấm lớn nhất nước Mỹ, đạt doanh thu hơn 300 triệu USD trong năm 2025" bai-viet/ca-phe-nam-2026-ryze-300-trieu-usd-vuot-nescafe-amazon.html || (echo "LEAD SAI bai ca-phe-nam"; exit 1)
          grep -qF "Black Friday 2026 đang giảm sâu nhất ở nhóm công nghệ: AirPods Pro 3 còn 149 USD từ giá gốc 250 USD" bai-viet/black-friday-2026-airpods-pro-3-chi-149-usd-macbook-1049-usd.html || (echo "LEAD SAI bai airpods"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
          echo "data.js article pages: $(grep -c '"page": "bai-viet/' js/data.js)"
          test "$(grep -c '<loc>' sitemap.xml)" = "816" || (echo "SAI TONG sitemap, phai 816"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "792" || (echo "SAI TONG data.js, phai 792 bai-viet page"; exit 1)
          node --check js/data.js || (echo "data.js LOI CU PHAP"; exit 1)
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-dang-hot-2611-deploy.zip || rm -f mclivestream-dang-hot-2611-deploy.zip
          git add bai-viet images js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy articles-dang-hot-2026-11-26: 4 bai (lich-sale-cuoi-nam-2026-black-friday-27-11-12-12 thuc-pham-chuc-nang-black-friday-2026-iherb-giam-toi-30-phan-tram ca-phe-nam-2026-ryze-300-trieu-usd-vuot-nescafe-amazon black-friday-2026-airpods-pro-3-chi-149-usd-macbook-1049-usd)"
            git pull --rebase origin main || (echo "REBASE THAT BAI - co cron khac push chen, DUNG LAI de rebuild"; exit 1)
            git push
          fi
