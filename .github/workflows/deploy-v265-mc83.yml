name: Deploy v265 (MC-83)

on:
  push:
    paths:
      - '.github/workflows/deploy-v265-mc83.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v265-mc83:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v265-mc83 package
        run: |
          echo "data.js sha before unzip (live, must stay untouched):"
          sha256sum js/data.js
          unzip -o mclivestream-v265-mc83-deploy.zip
          echo "--- verify v265 (MC-83) ---"
          node --check mclivestream-supabase.js || (echo "SYNTAX FAIL mclivestream-supabase.js"; exit 1)
          grep -m1 "v265-shell-1" sw.js
          grep -m1 "v265 (MC-83" trang-cua-toi.html
          grep -m1 "updateJobPost" mclivestream-supabase.js
          echo "data.js sha after unzip (must match before):"
          sha256sum js/data.js
          sha256sum mclivestream-supabase.js trang-cua-toi.html sw.js
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v265-mc83-deploy.zip
          git add -A
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v265: MC-83 sua/xoa tin tuyen cua minh (updateJobPost/deleteJobPost + muc Tin tuyen cua toi), sw.js v265-shell-1"
            git push
          fi
