name: Deploy v92 (temp)

on:
  push:
    paths:
      - 'mclivestream-v92-deploy.zip'
      - '.github/workflows/deploy-v92.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip v92 deploy package (excl. non-site files)
        run: |
          ls -la
          test -f mclivestream-v92-deploy.zip
          unzip -l mclivestream-v92-deploy.zip | head -n 60
          unzip -o -q mclivestream-v92-deploy.zip \
            -x 'android/*' \
               'tools/*' \
               '.well-known/*' \
               'docs-diem-thuong-*.md' \
               'docs-email-*.md' \
               'PORTABILITY.md' \
               'README.md' \
               'site.config.json' \
               'supabase-config.example.js' \
               'js/data.js' \
               'mclivestream-v92-deploy.zip'
          rm -rf __MACOSX

      - name: Commit deployed site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "v92: deploy site files (via deploy-v92 workflow)"
            git push
          fi

      - name: Remove temp zip and this workflow
        run: |
          rm -f mclivestream-v92-deploy.zip .github/workflows/deploy-v92.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean up."
          else
            git commit -m "v92: remove temp deploy zip and workflow"
            git push
          fi
