name: deploy-combined-reapply-2026-11-14
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-combined-reapply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip combined reapply package
        run: |
          unzip -o combined-reapply-2026-11-14.zip
          ls -l js/data.js
          sha256sum js/data.js
          echo "models: $(grep -c '"id": "th-' js/data.js)"
          echo "shops: $(grep -c '"id": "sh-' js/data.js)"
          echo "lots: $(grep -c '"id": "lot-' js/data.js)"
          echo "factories: $(grep -c '"id": "fac-' js/data.js)"
          echo "kiots: $(grep -c '"id": "kiot-' js/data.js)"
          echo "articles: $(grep -c '"page": "bai-viet/' js/data.js)"
      - name: Verify package contents
        run: |
          set -e
          test "$(sha256sum js/data.js | cut -d' ' -f1)" = "31c672977369e2155a2126e1519b4216af46fc7b75ca1267636b61ad955785ac"
          test "$(grep -c '"id": "th-' js/data.js)" = "230" || (echo "BAD models count"; exit 1)
          test "$(grep -c '"id": "sh-' js/data.js)" = "270" || (echo "BAD shops count"; exit 1)
          test "$(grep -c '"id": "lot-' js/data.js)" = "71" || (echo "BAD lots count"; exit 1)
          test "$(grep -c '"id": "fac-' js/data.js)" = "240" || (echo "BAD factories count"; exit 1)
          test "$(grep -c '"id": "kiot-' js/data.js)" = "200" || (echo "BAD kiots count"; exit 1)
          test "$(grep -c '"page": "bai-viet/' js/data.js)" = "260" || (echo "BAD articles count"; exit 1)
          test "$(grep -c '&amp;' js/data.js)" = "0" || (echo "BAD: &amp; still present"; exit 1)
          test "$(grep -c '"title": "[^"]*…"' js/data.js)" = "0" || (echo "BAD: truncated title still present"; exit 1)
          grep -Fq '"id": "th-253"' js/data.js
          grep -Fq '"id": "sh-272"' js/data.js
          grep -Fq "Sang nhượng phòng Gym và Võ 280m2 tại CT11 Hồng Hà Ecocity, Hoàng Mai" js/data.js
          grep -Fq "Sang nhượng quán cafe 250m2 góc 2 mặt tiền tại Làng Đại học Thủ Đức" js/data.js
          grep -Fq "Sang nhượng spa dưỡng sinh 475m2 tại 198 Nguyễn Tri Phương, Q.10" js/data.js
      - name: Commit combined reapply file
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add js/data.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy data 2026-11-14 combined reapply: khoi phuc 11 sua title/meta kiot + 11 mau + 20 shop batch A group-work bi deploy lo 4ecba3e ghi de; live base 62c4d018, 230 mau / 270 shop / 71 lo / 240 xuong / 200 kiot / 261 bai"
            git push
          fi
