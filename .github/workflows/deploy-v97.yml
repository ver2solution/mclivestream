name: Deploy v97

on:
  push:
    paths:
      - '.github/workflows/deploy-v97.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v97:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v97 deploy package
        run: |
          unzip -o mclivestream-v97-deploy.zip
          ls -l danh-sach-shop.html
          sha256sum danh-sach-shop.html
          if grep -q "tim-mau-1111" danh-sach-shop.html; then echo "FAIL: hub section still present"; exit 1; fi
          echo "hub section gone OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add danh-sach-shop.html
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v97: xoa muc hub Tim mau 11.11 khoi trang Danh cho Shop"
            git push
          fi
