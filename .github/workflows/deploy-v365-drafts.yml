name: Deploy v365-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v365-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v365-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v365-drafts package
        run: |
          unzip -o mclivestream-v365-drafts-deploy.zip
          echo "--- verify v365-drafts (1 bai) ---"
          test -f bai-viet/content-cuu-song-thuong-hieu-quoc-dan-70-tuoi.html || (echo "THIEU bai-viet/content-cuu-song-thuong-hieu-quoc-dan-70-tuoi.html"; exit 1)
          grep -q "bai-viet/content-cuu-song-thuong-hieu-quoc-dan-70-tuoi.html" js/data.js || (echo "THIEU content-cuu-song-thuong-hieu-quoc-dan-70-tuoi trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/content-cuu-song-thuong-hieu-quoc-dan-70-tuoi.html</loc>" sitemap.xml || (echo "THIEU content-cuu-song-thuong-hieu-quoc-dan-70-tuoi trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v365-drafts-deploy.zip
          git add bai-viet/content-cuu-song-thuong-hieu-quoc-dan-70-tuoi.html images/bai-viet/content-cuu-song-thuong-hieu-quoc-dan-70-tuoi-hero-og.jpg images/bai-viet/content-cuu-song-thuong-hieu-quoc-dan-70-tuoi-hero.jpg js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v365-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — content-cuu-song-thuong-hieu-quoc-dan-70-tuoi"
            git push
          fi
