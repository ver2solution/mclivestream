name: Deploy v365-drafts (article drafts)

on:
  push:
    paths:
      - '.github/workflows/deploy-v365-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v365-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v365-drafts package
        run: |
          unzip -o mclivestream-v365-drafts-deploy.zip
          echo "--- verify v365-drafts (1 bai) ---"
          test -f bai-viet/tan-ba-22400-ty-dong-1-ngay-double-11-2023-tuyen-bo-rut-lui-lan-5.html || (echo "THIEU bai-viet/tan-ba-22400-ty-dong-1-ngay-double-11-2023-tuyen-bo-rut-lui-lan-5.html"; exit 1)
          grep -q "bai-viet/tan-ba-22400-ty-dong-1-ngay-double-11-2023-tuyen-bo-rut-lui-lan-5.html" js/data.js || (echo "THIEU tan-ba-22400-ty-dong-1-ngay-double-11-2023-tuyen-bo-rut-lui-lan-5 trong data.js"; exit 1)
          grep -q "<loc>https://vieclamlivestream.online/bai-viet/tan-ba-22400-ty-dong-1-ngay-double-11-2023-tuyen-bo-rut-lui-lan-5.html</loc>" sitemap.xml || (echo "THIEU tan-ba-22400-ty-dong-1-ngay-double-11-2023-tuyen-bo-rut-lui-lan-5 trong sitemap"; exit 1)
          echo "sitemap urls: $(grep -c '<loc>' sitemap.xml)"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v365-drafts-deploy.zip
          git add bai-viet/tan-ba-22400-ty-dong-1-ngay-double-11-2023-tuyen-bo-rut-lui-lan-5.html js/data.js sitemap.xml
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v365-drafts: 1 bai viet tu ban thao (Muse Zalo/admin) — tan-ba-22400-ty-dong-1-ngay-double-11-2023-tuyen-bo-rut-lui-lan-5"
            git push
          fi
