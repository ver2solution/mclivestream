name: deploy-v285
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-v285:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip v285 package
        run: |
          unzip -o v285-manifest.zip
          ls -l manifest.webmanifest
      - name: Verify package contents
        run: |
          set -e
          grep -Fq '"name":"Vieclamlivestream' manifest.webmanifest
          grep -Fq '"short_name":"Vieclamlivestream"' manifest.webmanifest
          echo "OK: v285 manifest doi ten sang Vieclamlivestream (1 file, khong bump CACHE)"
      - name: Commit v285 files
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add manifest.webmanifest
          echo "So file staged:"
          git status --short | wc -l
          git status --short | head -5
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v285 manifest doi ten Vieclamlivestream (1 file)"
            git push
          fi
