name: Deploy v203
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip package
        run: unzip -o v203.zip -d .
      - name: Verify intro replacement
        run: |
          grep -q "Vieclamlivestream.online là sàn việc làm" index.html
          grep -q "Vieclamlivestream.online là sàn việc làm" gioi-thieu.html
          grep -q "Vieclamlivestream.online là sàn việc làm" dang-ky.html
          grep -q "Vieclamlivestream.online là sàn việc làm" dang-nhap.html
          ! grep -q "hơn 8 năm xây dựng hệ sinh thái" index.html
          ! grep -q "hơn 8 năm xây dựng hệ sinh thái" gioi-thieu.html
          ! grep -q "hơn 8 năm xây dựng hệ sinh thái" dang-ky.html
          ! grep -q "hơn 8 năm xây dựng hệ sinh thái" dang-nhap.html
      - name: Commit deploy
        run: |
          git config user.name "ver2solution"
          git config user.email "ver2solution@gmail.com"
          git add -A
          git commit -m "v203: thay doan gioi thieu cu bang hook cua anh o 4 file" || echo "nothing to commit"
          git push
