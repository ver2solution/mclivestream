name: "Deploy v332 (auto tong ket so luong ho so trang chu)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v332.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v332:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v332 package
        run: |
          echo "--- GUARD DA DEPLOY (bai hoc v233/v234: khong deploy chong) ---"
          grep -q "v332-shell-1" sw.js && (echo "v332 DA DEPLOY ROI (sw.js da co v332-shell-1) - dung"; exit 1) || true
          echo "--- BASE guard (base moi bc06f0d: data.js md5 + sitemap 446 loc) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "9b8946cd3686fc6cbb044c0e7397c3ff" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -o '<loc>' sitemap.xml | wc -l)" = "446" || (echo "BASE DOI: sitemap khong con 446 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v332-deploy.zip
          echo "--- verify v332 (3 files) ---"
          test "$(unzip -l mclivestream-v332-deploy.zip | grep -cE ' (index\.html|js/app\.js|sw\.js)$')" -eq 3 || (echo "SAI: goi v332 phai co dung 3 file (index.html + js/app.js + sw.js)"; exit 1)
          grep -q "v332-shell-1" sw.js || (echo "SAI: sau unzip sw.js phai co v332-shell-1"; exit 1)
          grep -q 'id="trustKiots"' index.html || (echo "SAI: sau unzip index.html phai co id=\"trustKiots\""; exit 1)
          grep -q "getElementById('trustKiots')" js/app.js || (echo "SAI: sau unzip app.js phai co getElementById('trustKiots')"; exit 1)
          grep -q "D.kiots" js/app.js || (echo "SAI: sau unzip app.js phai dien trustKiots tu D.kiots"; exit 1)
          echo "verify OK: 3 file, trustKiots 280 + so du phong moi, data.js/sitemap khong doi"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v332-deploy.zip
          git add index.html js/app.js sw.js
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v332: auto tong ket so luong ho so cac muc o trang chu (them o kiot 280, so du phong moi 238/290/320/142/24/102); CACHE v332-shell-1"
            git push
          fi
