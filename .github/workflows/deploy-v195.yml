name: Deploy v195 (sua badge tab Trao doi — main() khoi dong du Tong quan loi)

on:
  push:
    paths:
      - '.github/workflows/deploy-v195.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v195:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v195 package
        run: |
          test $(unzip -l mclivestream-v195-deploy.zip | grep -c 'js/admin.js\|sw.js$') -eq 2 || (echo "ZIP KHONG DU 2 FILE (js/admin.js + sw.js)"; exit 1)
          if unzip -l mclivestream-v195-deploy.zip | grep -qE '\.html$|app\.js|data\.js'; then echo "ZIP CHUA FILE CAM (html/app.js/data.js)"; exit 1; fi
          mkdir -p v195-staged
          unzip -o -q mclivestream-v195-deploy.zip -d v195-staged
          echo "--- verify v195 trong zip (chi file trong goi) ---"
          test -f v195-staged/js/admin.js || (echo "THIEU js/admin.js"; exit 1)
          test -f v195-staged/sw.js || (echo "THIEU sw.js"; exit 1)
          test $(grep -c 'try { await loadOverview(); state.loaded.overview = true; }' v195-staged/js/admin.js) -eq 1 || (echo "admin.js THIEU try/catch loadOverview"; exit 1)
          test $(grep -c 'startChatLive();' v195-staged/js/admin.js) -eq 1 || (echo "admin.js THIEU startChatLive"; exit 1)
          test $(grep -c 'startBadgeTimer();' v195-staged/js/admin.js) -eq 1 || (echo "admin.js THIEU startBadgeTimer"; exit 1)
          test $(grep -c 'refreshChatBadge()' v195-staged/js/admin.js) -ge 2 || (echo "admin.js THIEU refreshChatBadge"; exit 1)
          test $(grep -c "const CACHE = 'v195-shell-1'" v195-staged/sw.js) -eq 1 || (echo "sw.js CACHE KHONG PHAI v195-shell-1"; exit 1)
          if grep -q "v193-admin-shell-1" v195-staged/sw.js; then echo "sw.js CON CACHE CU v193"; exit 1; fi
          echo "verify trong zip OK: admin.js co try/catch + khoi dong badge, sw.js CACHE v195-shell-1"
          echo "--- overlay 2 file len repo ---"
          cp v195-staged/js/admin.js js/admin.js
          cp v195-staged/sw.js sw.js
          rm -rf v195-staged
          diff -q js/admin.js <(unzip -p mclivestream-v195-deploy.zip js/admin.js) || (echo "admin.js tren repo KHAC zip"; exit 1)
          diff -q sw.js <(unzip -p mclivestream-v195-deploy.zip sw.js) || (echo "sw.js tren repo KHAC zip"; exit 1)
          echo "verify overlay OK: 2 file tren repo khop zip"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f mclivestream-v195-deploy.zip
          git add -A
          git status --short
          test $(git diff --cached --name-only | wc -l) -eq 3 || (echo "SAI SO FILE STAGED (doi 3 = 2 file + 1 zip)"; exit 1)
          git commit -m "Deploy v195: sua badge tab Trao doi — main() boc loadOverview bang try/catch de kenh Realtime + badge luon khoi dong du Tong quan loi (js/admin.js + sw.js CACHE v195-shell-1)"
          git push
