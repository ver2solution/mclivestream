name: Deploy v391-form-p1-fix (form Viet bai P1)

on:
  push:
    paths:
      - '.github/workflows/deploy-v391-form-p1-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v391-form-p1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v391-form-p1-fix package
        run: |
          unzip -o mclivestream-v391-form-p1-fix-deploy.zip
          echo "--- verify v391-form-p1-fix (cap 50000 + admArtMsg2 + setArtMsg) ---"
          test -f js/admin.js || (echo "THIEU js/admin.js"; exit 1)
          test -f quan-tri.html || (echo "THIEU quan-tri.html"; exit 1)
          test -f sw.js || (echo "THIEU sw.js"; exit 1)
          grep -q "50000" js/admin.js || (echo "THIEU cap 50000 trong admin.js"; exit 1)
          grep -q "function setArtMsg" js/admin.js || (echo "THIEU helper setArtMsg trong admin.js"; exit 1)
          grep -q "setArtMsg(" js/admin.js || (echo "THIEU setArtMsg call trong admin.js"; exit 1)
          grep -q "admArtMsg2" quan-tri.html || (echo "THIEU admArtMsg2 trong quan-tri.html"; exit 1)
          grep -q "admArtMsg2" js/admin.js || (echo "THIEU admArtMsg2 trong admin.js"; exit 1)
          grep -q "v391-shell-1" sw.js || (echo "THIEU CACHE v391-shell-1 trong sw.js"; exit 1)
          echo "verify OK"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f mclivestream-v391-form-p1-fix-deploy.zip
          git add js/admin.js quan-tri.html sw.js
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v391: form Viet bai P1 — cap 50000 + admArtMsg2 + setArtMsg"
            git push
          fi
