name: "Deploy v360-chat-cong-dong (Trang chat cong dong day du /cong-dong/chat)"

on:
  push:
    paths:
      - '.github/workflows/deploy-v360-chat-cong-dong.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v360-chat-cong-dong:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v360 package
        run: |
          echo "--- Guard DAU: neu sw.js da co v360-shell-1 thi da deploy roi, DUNG ---"
          if grep -qF "v360-shell-1" sw.js; then echo "v360 DA DEPLOY ROI - dung"; exit 1; fi
          echo "--- BASE guard (bai hoc v233/v234: khong deploy chong; base origin/main 4d8b616) ---"
          test "$(md5sum js/data.js | cut -d' ' -f1)" = "202063ecade64cbb8939cb2df3e67e51" || (echo "BASE DOI: data.js md5 doi - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          test "$(grep -c '<loc>' sitemap.xml)" = "495" || (echo "BASE DOI: sitemap khong con 495 URL - mot deploy khac da len, DUNG LAI de rebuild"; exit 1)
          unzip -o mclivestream-v360-deploy.zip
          echo "--- verify v360 (7 file) ---"
          for f in cong-dong/chat.html js/chat-page.js v20.css 404.html sw.js tests/test-chat-page.mjs; do test -f "$f" || (echo "SAI: thieu file $f"; exit 1); done
          grep -qF "noindex,nofollow" cong-dong/chat.html || (echo "SAI: chat.html phai co noindex,nofollow"; exit 1)
          grep -qF "Tham gia cộng đồng Livestream Việt Nam" cong-dong/chat.html || (echo "SAI: chat.html phai co loi moi dung nguyen van"; exit 1)
          grep -qF "/js/chat-page.js" cong-dong/chat.html || (echo "SAI: chat.html phai nap js/chat-page.js"; exit 1)
          if grep -qF "chat-bots.js" cong-dong/chat.html; then echo "SAI: chat.html khong duoc nap bot"; exit 1; fi
          grep -qF "get_home_chat_messages" js/chat-page.js || (echo "SAI: chat-page.js phai dung RPC chat V4"; exit 1)
          grep -qF "v360-shell-1" sw.js || (echo "SAI: sw.js phai co CACHE v360-shell-1"; exit 1)
          grep -qF 'href="/v20.css"' 404.html || (echo "SAI: 404.html phai dung duong dan tuyet doi /v20.css"; exit 1)
          grep -qF "[hidden]{display:none!important}" v20.css || (echo "SAI: v20.css phai co [hidden]{display:none!important}"; exit 1)
          node tests/test-chat-page.mjs
          echo "verify OK: trang chat + 404 tuyet doi + CACHE v360-shell-1"
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q mclivestream-v360-deploy.zip
          git add cong-dong/chat.html js/chat-page.js v20.css 404.html sw.js tests/test-chat-page.mjs
          git status --short | head -20
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy v360: Trang chat cong dong day du /cong-dong/chat (V4 PR-04, lenh Owner 16:27 19/11) — cong-dong/chat.html + js/chat-page.js (RPC chat V4, chi tin that, phan trang, Realtime) + 404.html duong dan tuyet doi + sw.js CACHE v360-shell-1"
            git push
          fi
